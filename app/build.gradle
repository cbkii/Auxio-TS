import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.android.application"
    id "androidx.baselineprofile"
    id "androidx.navigation.safeargs.kotlin"
    id "kotlin-parcelize"
    id "dagger.hilt.android.plugin"
    id "com.google.devtools.ksp"
    id "io.github.takahirom.roborazzi"
}

android {
    // Auxio implicitly depends on the native modules, explicitly specify it
    // here so the libraries are still stripped.
    ndkVersion ndk_version
    namespace "org.oxycblt.auxio"

    defaultConfig {
        applicationId "com.tw.media"
        versionName "26.6.8"
        // Monotonic TS18 code: major * 1,000,000 + minor * 10,000 + patch * 100 + revision.
        // Keep this above every recorded stock com.tw.music build (currently 118) so an
        // exact-package test never fails for an avoidable version downgrade. Signing and
        // privileged package identity remain separate, mandatory installation gates.
        versionCode 26060800
        def buildCommit = System.getenv("GITHUB_SHA") ?: "local-unrecorded"
        buildConfigField "String", "BUILD_COMMIT", "\"${buildCommit.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "boolean", "TOPWAY_COMPAT_ENABLED", "true"

        minSdk min_sdk
        // randomly flickers between deprecated and required depending on what mood my gradle is in
        // keep it for safety
        compileSdk target_sdk
        targetSdk target_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    def releaseStoreFile = providers.gradleProperty("releaseStoreFile").orNull
    def releaseStorePassword = providers.gradleProperty("releaseStorePassword").orNull
    def releaseKeyAlias = providers.gradleProperty("releaseKeyAlias").orNull
    def releaseKeyPassword = providers.gradleProperty("releaseKeyPassword").orNull
    def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
            .every {
                def value = it?.toString()
                value != null && !value.isBlank()
            }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
            // Keep the physical arm64 TS18 and hosted API-29 x86_64 emulator available while
            // avoiding legacy ABIs that no maintained runtime lane consumes.
            ndk {
                abiFilters "arm64-v8a", "x86_64"
            }
        }

        release {
            minifyEnabled true
            shrinkResources true
            // Published TS18 APKs are arm64. Internal/debug emulator compatibility is retained
            // independently above and in the benchmark build type.
            ndk {
                abiFilters "arm64-v8a"
            }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            dependenciesInfo {
                includeInApk = false
                includeInBundle = false
            }
        }

        benchmark {
            initWith release
            minifyEnabled false
            signingConfig signingConfigs.debug
            debuggable false
            shrinkResources false
            matchingFallbacks = ["release"]
            // Macrobenchmark runs on the hosted/API-29 x86_64 lane while arm64 remains available
            // for device-side benchmark builds.
            ndk {
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    packagingOptions {
        jniLibs {
            excludes += ['**/kotlin/**', '**/okhttp3/**']
        }
        resources {
            excludes += ['DebugProbesKt.bin', 'kotlin-tooling-metadata.json', '**/kotlin/**', '**/okhttp3/**', 'META-INF/*.version']
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    sourceSets {
        // Benchmark is release-like and deliberately reuses release no-op diagnostic APIs.
        benchmark {
            java.srcDirs += ["src/release/java"]
            kotlin.srcDirs += ["src/release/java"]
        }
        // Compile the thin Topway/DoFun wrappers into the one Auxio-TS product. The app keeps
        // com.tw.media identity while exposing the stock-compatible com.tw.music components
        // declared in the main manifest.
        main {
            java.srcDirs += ["src/topwayCompat/java"]
            kotlin.srcDirs += ["src/topwayCompat/java", "src/topwayCompat/kotlin"]
        }
        test {
            java.srcDirs += ["src/topwayCompatTest/java"]
            kotlin.srcDirs += ["src/topwayCompatTest/java"]
        }
    }

    lint {
        // Do not re-run lint on vendored media library submodule dependencies.
        // Media library lint issues are upstream concerns; only app sources are checked here.
        checkDependencies false
        // app/lint.xml suppresses lint only for three vendored backport BottomSheet files.
        // New issues in Auxio-owned source still fail CI.
        lintConfig file("lint.xml")
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
        freeCompilerArgs.add("-jvm-default=enable")
        freeCompilerArgs.add("-Xannotation-default-target=param-property")
    }
}

// ViewPager2 1.1.0 contains the fixes required for RecyclerView 1.3.1-rc01 and newer.
// Use the smallest stable RecyclerView line above that compatibility boundary. Queue-sheet
// behaviour is guarded by app tests and exact-TS18 validation rather than an incompatible pin.
def recyclerViewVersion = "1.3.2"
def viewPager2Version = "1.1.0"

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:$kotlin_coroutines_version"

    // --- SUPPORT ---

    // General
    implementation "androidx.core:core-ktx:$core_version"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.13.0"
    // good news: androidx-fragment 1.8.9's predictive back no longer crashes when you navigate
    // back across nested views too fast
    // bad news: it still doesn't cope well with home's inflation latency and freezes up
    // if you navigate twice very fast and time it right
    // keep it pinned down to pre-predictive back for now...
    // noinspection GradleDependency
    implementation "androidx.fragment:fragment-ktx:1.8.9"

    // Components
    implementation "androidx.recyclerview:recyclerview:$recyclerViewVersion"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation "androidx.viewpager2:viewpager2:$viewPager2Version"

    // Lifecycle
    def lifecycle_version = "2.10.0"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // Navigation
    implementation "androidx.navigation:navigation-ui-ktx:$navigation_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$navigation_version"

    // Media
    implementation "androidx.media:media:1.8.0"

    // Android Auto
    implementation "androidx.car.app:app:1.7.0"

    // Preferences
    implementation "androidx.preference:preference-ktx:1.2.1"

    // Database
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Build and profile installation
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugaring_version"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    baselineProfile project(":startup-benchmark")

    // --- SECOND PARTY ---

    // Musikr
    implementation project(":musikr")

    // --- THIRD PARTY ---

    // Exoplayer (Vendored)
    implementation project(":media-lib-exoplayer")
    implementation project(":media-lib-decoder-ffmpeg")

    // Image loading
    implementation 'io.coil-kt.coil3:coil-core:3.5.0'

    // Material
    // TODO: Exactly figure out the conditions that the 1.7.0 ripple bug occurred so you can just
    //  PR a fix.
    implementation "com.google.android.material:material:1.14.0"

    // Dependency Injection
    implementation "com.google.dagger:dagger:$hilt_version"
    ksp "com.google.dagger:dagger-compiler:$hilt_version"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_version"

    // Kotlin 2.3.10 emits metadata newer than the kotlin-metadata-jvm reader
    // currently resolved on Hilt's processing path. Keep the metadata reader aligned
    // with the Kotlin compiler so Hilt can read Kotlin metadata during JavaCompile.
    annotationProcessor "org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlin_version"
    testAnnotationProcessor "org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlin_version"
    ksp "org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlin_version"
    kspTest "org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlin_version"

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Speed dial
    implementation "com.leinardi.android:speed-dial:3.3.0"

    // Tasker integration
    implementation 'com.joaomgcd:taskerpluginlibrary:0.4.10'

    // Fuzzy search
    implementation 'org.apache.commons:commons-text:1.15.0'

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation "androidx.test:core:1.7.0"
    testImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kspTest "com.google.dagger:hilt-android-compiler:$hilt_version"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.64.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-junit-rule:1.64.0"

    androidTestImplementation "androidx.test:core-ktx:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
}

tasks.register("verifyCriticalDependencyResolution") {
    group = "verification"
    description = "Verify behaviour-sensitive AndroidX runtime dependency versions."
    doLast {
        def expected = [
            "androidx.recyclerview:recyclerview": recyclerViewVersion,
            "androidx.viewpager2:viewpager2": viewPager2Version,
        ]
        def resolved = configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
            .collectEntries { artifact ->
                ["${artifact.moduleVersion.id.group}:${artifact.name}", artifact.moduleVersion.id.version]
            }
        expected.each { coordinate, expectedVersion ->
            def actualVersion = resolved[coordinate]
            if (actualVersion != expectedVersion) {
                throw new GradleException(
                    "Critical dependency drift: ${coordinate} expected ${expectedVersion}, resolved ${actualVersion ?: 'missing'}"
                )
            }
            println "Critical dependency OK: ${coordinate}:${actualVersion}"
        }
    }
}

tasks.named("preReleaseBuild").configure {
    dependsOn tasks.named("verifyCriticalDependencyResolution")
}

baselineProfile {
    mergeIntoMain true
    saveInSrc true
    automaticGenerationDuringBuild false
}


tasks.withType(Test).configureEach { testTask ->
    // Keep regular unit-test CI independent from Roborazzi's runtime android-all downloads.
    // Do not apply this exclusion during explicit Roborazzi runs: record/verify/compare
    // tasks delegate to variant unit-test tasks and must still execute screenshot tests.
    def isRoborazziRun = gradle.startParameter.taskNames.any { taskName ->
        taskName.toLowerCase(Locale.ROOT).contains("roborazzi")
    }
    if (!isRoborazziRun && testTask.name.startsWith("test")) {
        exclude "**/RoborazziSmokeScreenshotTest*"
    }
}

// Roborazzi record/verify/compare tasks are registered for the single Debug build.
