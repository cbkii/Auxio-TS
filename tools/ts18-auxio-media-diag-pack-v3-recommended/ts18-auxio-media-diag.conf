# TS18 Auxio/VLC diagnostics configuration
# Installed path: /data/adb/ts18-auxio-media-diag.conf

# Auto-run from Magisk service.d on every boot. Set 0 to disable boot runs.
RUN_ON_BOOT=1

# If 1, service.d only runs after /storage/emulated/0/Download/TS18_AuxioMediaDiag.RUN exists.
# Useful once you have collected a baseline and do not want this to run every boot.
REQUIRE_TRIGGER_ON_BOOT=0

# Capture length and snapshot cadence.
DURATION_SECONDS=2400
INTERVAL_SECONDS=15
BOOT_WAIT_SECONDS=90
SETTLE_WAIT_SECONDS=10


# Full logcat can be huge and contain private data. Keep disabled unless needed.
LOGCAT_ALL=0

# Copy Auxio shared_preferences XML into output. Can include app preferences; disabled by default.
COPY_AUXIO_PREFS=0

# Bugreport can be huge and slow; disabled by default.
CAPTURE_BUGREPORT=0

# dmesg is usually useful from root.
CAPTURE_DMESG=1

# Crash/dropbox capture is useful for Auxio/SystemUI/RemoteViews failures.
CAPTURE_CRASH_LOGS=1
CAPTURE_DROPBOX=1

# Read-only bounded root probes for DirectFS/root-gate confidence.
CAPTURE_SAFE_ROOT_PROBES=1

# Copy small Auxio crash/diagnostic report files from app-private/external app files.
COPY_AUXIO_APP_REPORTS=1

# sqlite table names only; off by default.
CAPTURE_SQLITE_LIST=0

# Lines retained in quick-tail filtered log file.
MAX_LOG_LINES=25000

BASE_OUT=/storage/emulated/0/Download/TS18_AuxioMediaDiag
TRIGGER_FILE=/storage/emulated/0/Download/TS18_AuxioMediaDiag.RUN
STOP_FILE=/storage/emulated/0/Download/TS18_AuxioMediaDiag.STOP

# v3 deep focus areas requested for Auxio-TS development.
CAPTURE_DEEP_SOURCE_DIAGS=1          # SAF, DocumentsUI, MediaStore, DirectFS/manual paths, persisted grants, source path grep
CAPTURE_AUTOSTART_DIAGS=1            # service.d early snapshot, boot receivers, boot/user unlock/readiness, jobs/alarms
CAPTURE_OVERLAY_EDGE_DIAGS=1         # floating controls, SYSTEM_ALERT_WINDOW, status/nav/gesture/window/layer context
CAPTURE_PLAYBACK_INTERRUPT_DIAGS=1   # audio focus loss/duck, noisy intents, telecom, Bluetooth, radio/NavRadio, media takeover
CAPTURE_MEDIASTORE_ROWS=1            # bounded MediaStore audio/file query rows for source/path debugging

# Add/override source roots to probe. Keep spaces between paths; no destructive operations are performed.
SOURCE_CANDIDATE_PATHS="/storage/emulated/0 /storage/emulated/0/Music /storage/emulated/0/Download /storage/usbdisk0 /storage/usbdisk0/Music /storage/usbdisk0/Download /storage/usbdisk1 /storage/usbdisk1/Music /storage/usbdisk1/Download /mnt/media_rw/usbdisk0 /mnt/media_rw/usbdisk1"
