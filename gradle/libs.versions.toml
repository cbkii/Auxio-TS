# Gradle version catalogue for Auxio-TS.
#
# STATUS: curated dependency *inventory* / partial migration — NOT yet the value
# Gradle consumes at build time. The authoritative versions are still declared in
# the root build.gradle `buildscript.ext` block and the inline `plugins { ... }`
# version strings. This catalogue mirrors them so there is a single place to read
# the dependency surface and so Dependabot can reason about coordinates.
#
# DRIFT GUARD: scripts/check-version-catalog-sync.sh (run by the lint workflow's
# "Workflow/script syntax" job) fails CI if any version duplicated in build.gradle
# disagrees with this file. When you change a duplicated version, update BOTH.
#
# NEXT STEPS (intentionally out of scope for the dependency-resilience PR to avoid
# broad/ risky changes): add a [libraries] section and migrate build scripts to
# type-safe `libs.*` accessors so this catalogue becomes the sole source of truth,
# then remove the Groovy `ext`/inline versions and this drift guard.
[versions]
agp = "9.2.1"
kotlin = "2.3.10"
ksp = "2.3.9"
kotlinCoroutines = "1.11.0"
navigation = "2.9.8"
hilt = "2.59.2"
room = "2.8.4"
androidxCore = "1.17.0"
desugarJdkLibs = "2.1.5"
dokka = "2.2.0"
spotless = "8.7.0"
roborazzi = "1.64.0"
appcompat = "1.7.1"
activity = "1.13.0"
fragment = "1.6.2"
recyclerview = "1.2.1"
constraintlayout = "2.2.1"
viewpager2 = "1.0.0"
lifecycle = "2.10.0"
androidxMedia = "1.7.1"
carApp = "1.7.0"
preference = "1.2.1"
coil = "3.4.0"
material = "1.14.0"
timber = "5.0.1"
speedDial = "3.3.0"
taskerPluginLibrary = "0.4.10"
commonsText = "1.15.0"
junit4 = "4.13.2"
robolectricApp = "4.16"
robolectricMusikr = "4.16.1"
androidxTestCore = "1.6.1"
androidxTestCoreKtx = "1.7.0"
mockk = "1.14.9"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
navigation-safeargs-kotlin = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
