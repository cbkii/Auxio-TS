import java.util.Locale

plugins {
    id "com.android.application"
}

def bridgeVersionName =
        providers.gradleProperty("bridgeVersionName").orElse("1.1.0-dev").get()
def bridgeVersionCode =
        providers.gradleProperty("bridgeVersionCode").orElse("2").get().toInteger()
def releaseStoreFile = providers.gradleProperty("releaseStoreFile").orNull
def releaseStorePassword = providers.gradleProperty("releaseStorePassword").orNull
def releaseKeyAlias = providers.gradleProperty("releaseKeyAlias").orNull
def releaseKeyPassword = providers.gradleProperty("releaseKeyPassword").orNull
def normaliseSigner = { value ->
    value == null ? "" : value.toString().replace(":", "").trim().toUpperCase(Locale.ROOT)
}
def targetExpectedSigner = normaliseSigner(providers.gradleProperty("expectedTargetSigner").orNull)
def hasReleaseSigning = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every {
    def value = it?.toString()
    value != null && !value.isBlank()
}

android {
    namespace "org.oxycblt.auxio.ts18bridge"
    compileSdk target_sdk

    defaultConfig {
        applicationId "org.oxycblt.auxio.ts18bridge"
        minSdk 29
        targetSdk target_sdk
        versionCode bridgeVersionCode
        versionName bridgeVersionName

        buildConfigField "String", "TARGET_PACKAGE", '"com.tw.media"'
        buildConfigField "String", "TARGET_ACTIVITY", '"com.tw.music.MusicActivity"'
        buildConfigField "String", "TARGET_MEDIA_BROWSER_SERVICE", '"com.tw.music.MusicService"'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
            buildConfigField "String", "TARGET_PACKAGE", '"com.tw.media.debug"'
            // Keep the PR #239 debug configuration that passed the paired bridge CI contract.
            // AGP may suppress debug optimisation internally; this setting is not release authority.
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        release {
            // Shrinking is required here: AGP's built-in Kotlin runtime otherwise remains in this
            // Java-only bridge APK. proguard-rules.pro preserves the bridge package namespace so
            // the strict defined-class provenance check remains meaningful after R8 optimisation.
            minifyEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            dependenciesInfo {
                includeInApk = false
                includeInBundle = false
            }
        }
    }

    // Share the primitive Java Binder wire contract with the app. Adjacent Kotlin sources remain
    // app-only and are intentionally not compiled by this Java-only bridge module.
    sourceSets {
        main {
            java.srcDir "${rootDir}/app/src/topwayCompat/java/org/oxycblt/auxio/ts18bridge"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        checkDependencies false
    }
}

dependencies {
    // API 100 is supplied by LSPosed. It must never enter the runtime dependency graph or APK.
    compileOnly(project(":libxposed-api100-stubs")) {
        transitive = false
    }
    testImplementation "junit:junit:4.13.2"
}

gradle.taskGraph.whenReady { graph ->
    def packagingTasks = graph.allTasks.findAll { task ->
        task.project == project &&
                (task.name.toLowerCase(Locale.ROOT).startsWith("assemble") ||
                 task.name.toLowerCase(Locale.ROOT).startsWith("package") ||
                 task.name.toLowerCase(Locale.ROOT).startsWith("bundle"))
    }
    def releasePackagingTasks = packagingTasks.findAll { task ->
        task.name.toLowerCase(Locale.ROOT).contains("release")
    }

    // Release pairing remains a build/release integrity check only. Debug pairing is verified by
    // the CI/release contract checker against the actual target APK, while ordinary local debug
    // packaging stays friction-free. The signer is never compiled into the bridge or used at runtime.
    if (!releasePackagingTasks.isEmpty() && !(targetExpectedSigner ==~ /[0-9A-F]{64}/)) {
        throw new GradleException(
                "LSPosed release packaging requires -PexpectedTargetSigner=<64-hex SHA-256 of the paired target APK signer>.")
    }
    if (!releasePackagingTasks.isEmpty() && !hasReleaseSigning) {
        throw new GradleException(
                "LSPosed release tasks require all releaseStoreFile/releaseStorePassword/" +
                        "releaseKeyAlias/releaseKeyPassword properties.")
    }
}
