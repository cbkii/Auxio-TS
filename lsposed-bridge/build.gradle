import java.util.Locale

plugins {
    id "com.android.application"
}

def bridgeVersionName =
        providers.gradleProperty("bridgeVersionName").orElse("1.1.0-dev").get()
def bridgeVersionCode =
        providers.gradleProperty("bridgeVersionCode").orElse("2").get().toInteger()
def releaseStoreFile = providers.gradleProperty("releaseStoreFile").orNull
def releaseStorePassword = providers.gradleProperty("releaseStorePassword").orNull
def releaseKeyAlias = providers.gradleProperty("releaseKeyAlias").orNull
def releaseKeyPassword = providers.gradleProperty("releaseKeyPassword").orNull
def hasReleaseSigning = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every {
    def value = it?.toString()
    value != null && !value.isBlank()
}

android {
    namespace "org.oxycblt.auxio.ts18bridge"
    compileSdk target_sdk

    defaultConfig {
        applicationId "org.oxycblt.auxio.ts18bridge"
        minSdk 29
        targetSdk target_sdk
        versionCode bridgeVersionCode
        versionName bridgeVersionName

        buildConfigField "String", "TARGET_PACKAGE", '"com.tw.media"'
        buildConfigField "String", "TARGET_ACTIVITY", '"com.tw.music.MusicActivity"'
        buildConfigField "String", "TARGET_MEDIA_BROWSER_SERVICE", '"com.tw.music.MusicService"'
        buildConfigField "long", "KNOWN_TESTED_STOCK_VERSION_CODE", "118L"
        buildConfigField "String", "STOCK_CERT_SHA256", '"AA6F9FB3070512AC962425797CD65AA585CF6202937EE3CEEFB14B5802EABDF3"'
        buildConfigField "String", "KNOWN_TESTED_STOCK_APK_SHA256", '"4F5495E270A7C86BAB232E2B7EE2ECD2D71F3450F6F20ED5F36FEAA4229C1518"'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            dependenciesInfo {
                includeInApk = false
                includeInBundle = false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        checkDependencies false
    }
}

dependencies {
    // API 100 is provided by LSPosed at runtime and must not be packaged in the module APK.
    compileOnly project(":libxposed-api100-stubs")

    testImplementation "junit:junit:4.13.2"
}

gradle.taskGraph.whenReady { graph ->
    def releasePackagingTasks = [
        "assemblerelease",
        "bundlerelease",
        "packagerelease",
        "signreleasebundle",
    ] as Set
    def releaseTasks = graph.allTasks.findAll { task ->
        task.project == project &&
                releasePackagingTasks.contains(task.name.toLowerCase(Locale.ROOT))
    }
    if (!releaseTasks.isEmpty() && !hasReleaseSigning) {
        throw new GradleException(
                "LSPosed release tasks require all releaseStoreFile/releaseStorePassword/" +
                        "releaseKeyAlias/releaseKeyPassword properties.")
    }
}
