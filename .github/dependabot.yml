version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      # TS18-safe automation: patch-only Gradle/library updates.
      #
      # Auxio-TS is not a generic phone app. Broad grouped minor updates can
      # change Kotlin/KSP/Gradle behaviour, AndroidX runtime semantics, view
      # behaviour, MediaSession/controller behaviour, and TS18/DoFun stability.
      # Minor/major updates should be deliberate human-reviewed branches with
      # full CI and, where relevant, physical TS18 validation.
      gradle-ts18-safe-patches:
        update-types:
          - "patch"
    ignore:
      # Block broad automated Gradle ecosystem minor/major PRs. Patch updates
      # remain allowed unless blocked below.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

      # Android Gradle Plugin, Kotlin, KSP and Gradle wrapper changes are
      # coordinated toolchain work, not background dependency hygiene.
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "org.jetbrains.kotlin.plugin.parcelize"
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib"
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib-jdk7"
      - dependency-name: "org.jetbrains.kotlin:kotlin-test-junit"
      - dependency-name: "org.jetbrains.kotlin:kotlin-metadata-jvm"
      - dependency-name: "com.google.devtools.ksp"
      - dependency-name: "gradle-wrapper"

      # These are intentionally pinned for observed/runtime behaviour in the
      # Auxio-TS UI stack. Do not let Dependabot reopen them as routine updates.
      - dependency-name: "androidx.recyclerview:recyclerview"
      - dependency-name: "androidx.viewpager2:viewpager2"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      # Patch-only action updates are acceptable. Major/minor action runtime
      # changes, especially checkout/runtime changes, should be human-reviewed.
      actions-ts18-safe-patches:
        update-types:
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
