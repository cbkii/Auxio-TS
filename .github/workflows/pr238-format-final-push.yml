name: PR 238 format final push

on:
  push:
    branches:
      - fix/mediastore-source-authority-stale-rows
    paths:
      - .github/workflows/pr238-format-final-push.yml

permissions:
  contents: write

concurrency:
  group: pr238-format-final-push
  cancel-in-progress: false

jobs:
  finalise:
    if: github.repository == 'cbkii/Auxio-TS' && github.ref == 'refs/heads/fix/mediastore-source-authority-stale-rows'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/mediastore-source-authority-stale-rows
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare repository dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile jvm-tests

      - name: Apply and verify canonical Kotlin formatting
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh spotlessKotlinApply
          bash ./scripts/ci-gradle.sh spotlessKotlinCheck

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh --continue \
            :app:testTopwayTwMediaDebugUnitTest \
            :musikr:testDebugUnitTest

      - name: Remove this temporary workflow and validate diff
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/pr238-format-final-push.yml
          git diff --check
          test ! -e .github/workflows/pr238-format-final-push.yml

      - name: Commit and push formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'STOP: expected formatter/cleanup diff is empty' >&2; exit 1; }
          git commit -m "style: finalise PR 238 formatting"
          git rev-parse HEAD
          git push origin HEAD:fix/mediastore-source-authority-stale-rows
