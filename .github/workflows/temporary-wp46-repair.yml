name: Temporary WorkPackage 4 and 6 repair

on:
  push:
    branches:
      - feat/generated-playlists-and-grid-layout-12959696348616356066

permissions:
  contents: write

jobs:
  repair-format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/generated-playlists-and-grid-layout-12959696348616356066
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply bounded source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          list_files = [
              'AlbumListFragment.kt',
              'ArtistListFragment.kt',
              'GenreListFragment.kt',
              'PlaylistListFragment.kt',
              'SongListFragment.kt',
          ]
          base = Path('app/src/main/java/org/oxycblt/auxio/home/list')
          old_cleanup = '''        listSettingsListener?.let { listSettings.unregisterListener(it) }
                  listSettingsListener = null'''
          new_cleanup = '''        homeSettingsListener?.let { homeSettings.unregisterListener(it) }
                  homeSettingsListener = null
                  listSettingsListener?.let { listSettings.unregisterListener(it) }
                  listSettingsListener = null'''
          for name in list_files:
              path = base / name
              text = path.read_text()
              if 'homeSettingsListener?.let { homeSettings.unregisterListener(it) }' not in text:
                  if old_cleanup not in text:
                      raise SystemExit(f'cleanup anchor missing in {path}')
                  text = text.replace(old_cleanup, new_cleanup, 1)
              path.write_text(text)

          playlist = base / 'PlaylistListFragment.kt'
          text = playlist.read_text()
          if 'import dagger.hilt.android.AndroidEntryPoint' not in text:
              text = text.replace(
                  'import androidx.recyclerview.widget.GridLayoutManager\n',
                  'import androidx.recyclerview.widget.GridLayoutManager\nimport dagger.hilt.android.AndroidEntryPoint\n',
                  1,
              )
          marker = 'class PlaylistListFragment :'
          if '@AndroidEntryPoint\n' + marker not in text:
              text = text.replace(marker, '@AndroidEntryPoint\n' + marker, 1)
          playlist.write_text(text)

          detail = Path('app/src/main/java/org/oxycblt/auxio/detail/DetailViewModel.kt')
          text = detail.read_text()
          old = '''                    playlist?.let { it as? org.oxycblt.musikr.Playlist }?.origin ==
                                  org.oxycblt.musikr.Playlist.Origin.GENERATED'''
          new = '''                    playlist?.parent?.origin ==
                                  org.oxycblt.musikr.Playlist.Origin.GENERATED'''
          if old not in text:
              raise SystemExit('generated playlist header anchor missing')
          detail.write_text(text.replace(old, new, 1))
          PY
          rm -rf .jules
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --console=plain spotlessApply
          rm -f .github/workflows/temporary-wp46-repair.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden generated playlist and grid lifecycles'
          git push origin HEAD:feat/generated-playlists-and-grid-layout-12959696348616356066
