name: PR200 Head-unit Log Capture Patch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ts18-root-storage-fastpath

permissions:
  contents: write

concurrency:
  group: pr200-headunit-log-capture
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/ts18-root-storage-fastpath
          fetch-depth: 0
          submodules: false

      - name: Add failure-preserving canonical log capture
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('.github/workflows/lint.yml')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'expected one head-unit safety block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-pr200-quality-observability.yml
          ruby -e 'require "yaml"; Psych.safe_load(File.read(".github/workflows/lint.yml"), permitted_classes: [], permitted_symbols: [], aliases: false); puts "lint.yml valid"'
          git diff --check

      - name: Commit CI observability change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: retain head-unit safety failure logs'
          git push origin HEAD:agent/ts18-root-storage-fastpath
