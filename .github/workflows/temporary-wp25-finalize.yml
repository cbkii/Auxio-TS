name: Temporary WP2 and WP5 finalizer

on:
  push:
    branches:
      - fix/playback-banner-and-visualizer-state-11316441362856201323

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[wp25-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/playback-banner-and-visualizer-state-11316441362856201323
          fetch-depth: 0
          persist-credentials: false
      - name: Apply bounded final source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('app/src/main/java/org/oxycblt/auxio/MainFragment.kt')
          text = main.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''    private fun updateBannerVisibility\(state: org\.oxycblt\.auxio\.playback\.BannerState\) \{\n'''
              r'''        val isExpandable =\n'''
              r'''            state is org\.oxycblt\.auxio\.playback\.BannerState\.Rich \|\|\n'''
              r'''                state is org\.oxycblt\.auxio\.playback\.BannerState\.Raw\n'''
              r'''        val binding = requireBinding\(\)'''
          )
          replacement = '''    private fun updateBannerVisibility(state: org.oxycblt.auxio.playback.BannerState) {
                  val binding = requireBinding()'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'MainFragment banner declaration replacements={count}')

          pattern = re.compile(
              r'''        playbackSheetBehavior\.isDraggable = isExpandable\n'''
              r'''        queueSheetBehavior\?\.isDraggable = isExpandable\n\n'''
              r'''        if \(!isExpandable\) \{\n'''
              r'''(?:.|\n)*?'''
              r'''        \}\n\n        updateStartupPanelState\(\)'''
          )
          replacement = '''        playbackSheetBehavior.isDraggable = state.playable
                  queueSheetBehavior?.isDraggable = state.richQueueCommandsAvailable
          
                  if (
                      !state.richQueueCommandsAvailable &&
                          queueSheetBehavior?.state ==
                              com.google.android.material.bottomsheet.BackportBottomSheetBehavior
                                  .STATE_EXPANDED
                  ) {
                      queueSheetBehavior.state =
                          com.google.android.material.bottomsheet.BackportBottomSheetBehavior
                              .STATE_COLLAPSED
                  }
                  if (
                      !state.playable &&
                          playbackSheetBehavior.state ==
                              com.google.android.material.bottomsheet.BackportBottomSheetBehavior
                                  .STATE_EXPANDED
                  ) {
                      playbackSheetBehavior.state =
                          com.google.android.material.bottomsheet.BackportBottomSheetBehavior
                              .STATE_COLLAPSED
                  }
          
                  updateStartupPanelState()'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'MainFragment sheet policy replacements={count}')
          main.write_text(text, encoding='utf-8')

          panel = Path('app/src/main/java/org/oxycblt/auxio/playback/PlaybackPanelFragment.kt')
          text = panel.read_text(encoding='utf-8')
          old = '''                    if (state is VisualizerState.PermissionRequired) {
                                      visualizerPermissionLauncher?.launch(Manifest.permission.RECORD_AUDIO)
                                  }'''
          # Normalize the actual source indentation rather than relying on a formatted diff preview.
          pattern = re.compile(
              r'''                    if \(state is VisualizerState\.PermissionRequired\) \{\n'''
              r'''                        visualizerPermissionLauncher\?\.launch\(Manifest\.permission\.RECORD_AUDIO\)\n'''
              r'''                    \}'''
          )
          replacement = '''                    if (
                                      state is VisualizerState.PermissionRequired &&
                                          visualizerCoordinator.claimPermissionRequest()
                                  ) {
                                      visualizerPermissionLauncher?.launch(Manifest.permission.RECORD_AUDIO)
                                  }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'PlaybackPanel permission replacements={count}')
          text = text.replace('        // releaseVisualizer()\n', '', 1)
          pattern = re.compile(
              r'''    private companion object \{\n'''
              r'''        const val FFT_PREFERENCE_WINDOW_MS = 300L\n'''
              r'''        const val VISUALIZER_WATCHDOG_INTERVAL_MS = 1_500L\n'''
              r'''        const val VISUALIZER_STALE_AFTER_MS = 2_000L\n'''
              r'''        const val MAX_VISUALIZER_RETRIES = 1\n'''
              r'''        const val MIN_WAVEFORM_RANGE = 4\n'''
              r'''    \}\n\n'''
          )
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f'PlaybackPanel obsolete constant replacements={count}')
          panel.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-wp25-finalize.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalizer changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalise banner and visualizer state handling [wp25-finalized]'
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push https://github.com/${GITHUB_REPOSITORY}.git \
            HEAD:fix/playback-banner-and-visualizer-state-11316441362856201323
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
