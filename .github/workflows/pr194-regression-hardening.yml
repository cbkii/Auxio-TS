name: Temporary PR 194 regression hardening

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/pr194-regression-hardening.yml"
      - ".github/pr194_patch.py"
      - ".github/pr194_fix_patch_script.py"

permissions:
  contents: write

concurrency:
  group: pr194-regression-hardening
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: perf/android10-code-health-20260723
          fetch-depth: 0

      - name: Apply regression hardening
        shell: bash
        run: |
          python3 .github/pr194_fix_patch_script.py
          python3 .github/pr194_patch.py

      - name: Validate and push scoped patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- \
            .github/pr194_patch.py \
            .github/pr194_fix_patch_script.py \
            .github/workflows/pr194-regression-hardening.yml
          git add -- \
            app/src/main/java/org/oxycblt/auxio/headunit/root/RootStateHolder.kt \
            app/src/main/java/org/oxycblt/auxio/image/CoverProvider.kt \
            app/src/main/java/org/oxycblt/auxio/playback/ui/visualizer/VisualizerCoordinator.kt \
            app/src/main/java/org/oxycblt/auxio/playback/ui/visualizer/VisualizerRuntimeMetrics.kt \
            musikr/src/main/java/org/oxycblt/musikr/fs/direct/DirectFS.kt \
            musikr/src/androidTest/java/org/oxycblt/musikr/fs/direct/DirectFSInstrumentedTest.kt
          git diff --cached --check
          git commit -m "fix: preserve bounded runtime features under load"
          git push origin HEAD:perf/android10-code-health-20260723
