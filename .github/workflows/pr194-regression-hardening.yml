                  val canonicalRoot = root?.let(::canonicalFileOrNull)
                  if (root == null || canonicalRoot == null || !isAllowedCanonicalRoot(canonicalRoot)) {
                      recordFailure(sourceKey, "Unsafe or missing DirectFS source ${location.uri}")
                      return@forEach
