name: Temporary PR 194 regression hardening

on:
  push:
    branches:
      - perf/android10-code-health-20260723
    paths:
      - ".github/workflows/pr194-regression-hardening.yml"

permissions:
  contents: write

concurrency:
  group: pr194-regression-hardening
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Apply bounded regression hardening
