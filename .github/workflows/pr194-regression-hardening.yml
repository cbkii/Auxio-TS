              List(DIRECTORY_WORKER_COUNT) {
                      async(Dispatchers.IO) {
                          while (isActive) {
                              val task = queue.poll(QUEUE_POLL_INTERVAL_MS, TimeUnit.MILLISECONDS)
                              if (task == null) {
                                  if (pending.get() == 0) return@async
                                  continue
                              }
