                              task.relativePath,
                              task.parent,
                              children,
                          )
                      )
                  }
              }
          }

          private fun enqueueDirectory(
              queue: LinkedBlockingQueue<DirectoryTask>,
              pending: AtomicInteger,
              discoveredDirectories: AtomicInteger,
              task: DirectoryTask,
