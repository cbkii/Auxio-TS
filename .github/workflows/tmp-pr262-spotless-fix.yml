name: Temporary PR 262 Spotless Fix

on:
  push:
    branches:
      - fix/floating-only-headless-startup-ticker-modes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Apply repository Kotlin formatter
        shell: bash
        run: ./gradlew --no-daemon spotlessKotlinApply

      - name: Verify formatter scope and result
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          expected=(
            app/src/main/java/org/oxycblt/auxio/headunit/overlay/FloatingOnlyStartupCoordinator.kt
            app/src/test/java/org/oxycblt/auxio/BootReceiverTest.kt
            app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarFloatingControlsView.kt
            app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarOverlayPrefs.kt
            app/src/topwayCompatTest/java/org/oxycblt/auxio/car/overlay/CarOverlayPrefsTest.kt
          )
          printf 'Formatter changed:\n'
          printf ' - %s\n' "${changed[@]}"
          [[ ${#changed[@]} -eq ${#expected[@]} ]] || {
            echo "::error::Unexpected formatter change count: ${#changed[@]}"
            exit 1
          }
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "${path}" || {
              echo "::error::Expected formatter change missing: ${path}"
              exit 1
            }
          done
          for path in "${changed[@]}"; do
            printf '%s\n' "${expected[@]}" | grep -Fxq "${path}" || {
              echo "::error::Unexpected formatter change: ${path}"
              exit 1
            }
          done
          ./gradlew --no-daemon spotlessKotlinCheck

      - name: Commit exact formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/org/oxycblt/auxio/headunit/overlay/FloatingOnlyStartupCoordinator.kt \
            app/src/test/java/org/oxycblt/auxio/BootReceiverTest.kt \
            app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarFloatingControlsView.kt \
            app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarOverlayPrefs.kt \
            app/src/topwayCompatTest/java/org/oxycblt/auxio/car/overlay/CarOverlayPrefsTest.kt
          git diff --cached --quiet && { echo "::error::No formatter changes to commit."; exit 1; }
          git commit -m "Apply Kotlin formatting"
          git push origin HEAD:fix/floating-only-headless-startup-ticker-modes
