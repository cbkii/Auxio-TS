name: Temporary PR 232 hardening v2

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch-test-and-remove-self:
    if: github.event.pull_request.number == 232 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: copilot/reintroduce-incremental-performance
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply validated Prompt 4 hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/pr232-hardening.py')
          text = path.read_text(encoding='utf-8')
          old = '''plan_boundary = text.index("                val plan = prepared\\n", prepare_start)
          catch_old = "                } catch (e: Exception) {\\n"
          catch_index = text.find(catch_old, prepare_start, plan_boundary)
          '''
          new = '''catch_old = "                } catch (e: Exception) {\\n"
          catch_index = text.find(catch_old, prepare_start)
          '''
          if text.count(old) != 1:
              raise RuntimeError('Temporary patch script catch anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/pr232-hardening.py

      - name: Align Prompt 4 evidence and device-validation documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'STOP: expected one documentation anchor in {path}, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          incremental = 'docs/architecture/INCREMENTAL_LIBRARY_PIPELINE.md'
          replace_once(
              incremental,
              '''**Requires device validation:** real mount-name swaps, FAT timestamp behaviour and ACC sleep/wake
          transitions on `s9863a1h10_Natv`.
          ''',
              '''Physical TS18 mount-name swaps, FAT timestamp behaviour and ACC sleep/wake transitions remain
          unverified. [Evidence confidence: Requires TS18 validation]
          [Porting decision: Requires exact-device runtime validation on `s9863a1h10_Natv`].
          ''',
          )
          replace_once(
              incremental,
              '''**Requires device validation:** cold boot, process death, launcher restart, Bluetooth/media-button
          launch, hardware-key Next/Previous, source removal while playing, real two-volume mount-order
          changes, ACC sleep/wake and active indexing during playback on the exact TS18 build.
          ''',
              '''Cold boot, process death, launcher restart, Bluetooth/media-button launch, hardware-key
          Next/Previous, source removal while playing, real two-volume mount-order changes, ACC sleep/wake
          and active indexing during playback remain unverified on the exact TS18 build.
          [Evidence confidence: Requires TS18 validation]
          [Porting decision: Requires exact-device runtime validation before release claims].
          ''',
          )

          cached = 'docs/architecture/CACHED_PRESENTATION_VS_SOURCE_AUTHORITY.md'
          replace_once(
              cached,
              '''Not performed in this change. All eleven items remain outstanding
          [Evidence confidence: Requires TS18 validation]
          [Porting decision: Requires TS18 runtime validation]:

          1. MediaStore with permission;
          2. SAF persisted tree;
          3. DirectFS internal Music folder;
          4. DirectFS removable USB;
          5. cold boot;
          6. process kill;
          7. ACC sleep/wake;
          8. source unmount/remount;
          9. cancel/retry;
          10. three consecutive warm launches;
          11. playback during deferred enrichment.
          ''',
              '''Not performed in this change. All twenty Prompt 4 items remain outstanding.
          [Evidence confidence: Requires TS18 validation]
          [Porting decision: Requires exact-device runtime validation]:

          1. MediaStore with permission;
          2. persisted SAF tree;
          3. DirectFS `/storage/emulated/0/Music`;
          4. DirectFS removable `/storage/usbdiskN`;
          5. cold boot;
          6. process kill and relaunch;
          7. service recreation;
          8. ACC sleep/wake;
          9. USB removal and remount;
          10. cancel and immediate retry;
          11. mounted-source automatic recovery;
          12. three consecutive warm launches;
          13. playback during deferred enrichment;
          14. generated playlists disabled and enabled;
          15. source removal detection;
          16. no duplicate songs;
          17. no stale `RUNNING` attempt;
          18. no indefinite `DISCOVERING`;
          19. prior-library retention after failure;
          20. production `com.tw.media` behaviour.
          ''',
          )
          replace_once(
              cached,
              '''## Safety boundaries preserved

          One playback service, one queue owner, one MediaSession and one notification authority are
          unchanged. Root is never the playback authority and protected storage is never enumerated as root.
          The `topwayTwMusic` and `topwayTwMedia` variants keep distinct package/component contracts, API 29
          support is preserved, and no APKs, logs, credentials, Room schema changes or temporary workflows are
          present in the final diff.
          ''',
              '''## Safety boundaries preserved

          Repository/static compatibility claim: [Evidence confidence: Observed in current code and CI]
          [Porting decision: Preserve for maintained variants; exact TS18 behaviour requires runtime validation].

          One playback service, one queue owner, one MediaSession and one notification authority are
          unchanged. Root is never the playback authority and protected storage is never enumerated as root.
          The `topwayTwMusic` and `topwayTwMedia` variants keep distinct package/component contracts, API 29
          support is preserved, and no APKs, logs, credentials, Room schema changes or temporary workflows are
          present in the final diff.
          ''',
          )
          PY

      - name: Format and run focused validation
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh spotlessKotlinApply
          bash ./scripts/ci-gradle.sh \
            :app:testTopwayTwMediaDebugUnitTest \
            :musikr:testDebugUnitTest
          git diff --check
          git rm -f .github/pr232-hardening.py
          git rm -f .github/workflows/temporary-pr232-hardening-v2.yml

      - name: Commit focused hardening and remove temporary files
        shell: bash
        env:
          BRANCH: copilot/reintroduce-incremental-performance
        run: |
          git config user.name "cbkii"
          git config user.email "150587541+cbkii@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "::error::Hardening produced no task-owned change."; exit 1; }
          git commit -m "Harden Prompt 4 authority boundaries"
          git push origin "HEAD:${BRANCH}"
