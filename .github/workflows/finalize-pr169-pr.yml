name: Finalize PR 169

on:
  pull_request:
    branches:
      - dev
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: finalize-pr169
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'cbkii/Auxio-TS' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ts18-runtime-regressions-v605'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/ts18-runtime-regressions-v605
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Write local.properties
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo '::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set.'
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Prepare full build dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply reviewable bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/finalize_pr169.py
          python3 .github/scripts/finalize_pr169.py

      - name: Validate patch scope before repository code
        shell: bash
        run: |
          set -euo pipefail
          allowed="$(mktemp)"
          actual="$(mktemp)"
          cat > "${allowed}" <<'EOF'
          app/src/main/java/org/oxycblt/auxio/headunit/root/dofun/Ts18DofunIntegrationResolver.kt
          app/src/main/java/org/oxycblt/auxio/headunit/topway/TopwayEqualizerLauncher.kt
          app/src/main/java/org/oxycblt/auxio/playback/PlaybackPanelFragment.kt
          app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarFloatingControlsService.kt
          app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/TopwayMusicEntryActivity.kt
          app/src/topwayCompatTest/java/org/oxycblt/auxio/car/overlay/TopwayMusicEntryPolicyTest.kt
          app/src/topwayCompatTest/java/org/oxycblt/auxio/headunit/topway/TopwayEqualizerExactDeviceTest.kt
          docs/TS18_V605_RUNTIME_REGRESSION_FIXES.md
          scripts/check-dofun-topway-compat.sh
          EOF
          sort -u -o "${allowed}" "${allowed}"
          git diff --name-only | sort -u > "${actual}"
          diff -u "${allowed}" "${actual}"
          git diff --check

      - name: Apply and verify Spotless formatting
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_TIMEOUT: 20m
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh spotlessApply
          bash ./scripts/ci-gradle.sh spotlessCheck

      - name: Run TS18 static guardrails
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-headunit-compat-safety.sh
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-topway-manifest-components.sh

      - name: Commit final fixes and remove temporary machinery
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo '::error::Bounded patch produced no repository changes.'
            exit 1
          fi
          git rm \
            .github/scripts/finalize_pr169.py \
            .github/workflows/finalize-pr169.yml \
            .github/workflows/finalize-pr169-fast.yml \
            .github/workflows/finalize-pr169-v3.yml \
            .github/workflows/finalize-pr169-pr.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ts18): finalize runtime regression review fixes'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/ts18-runtime-regressions-v605
