name: Temporary PR196 hardening

on:
  push:
    branches:
      - fix/first-launch-source-recovery

permissions:
  contents: write

concurrency:
  group: tmp-pr196-hardening
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
          persist-credentials: false
      - name: Apply hardening fixes
        shell: bash
        run: python3 scripts/tmp-pr196-hardening.py
      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -F 'PlaybackNotificationChannel.markPublicationRequested()' app/src/main/java/org/oxycblt/auxio/AuxioService.kt
          grep -F 'if (!earlyPrestart) playbackFragment.start(intent)' app/src/main/java/org/oxycblt/auxio/AuxioService.kt
          grep -F 'Intent(context, AuxioService::class.java)' app/src/main/java/org/oxycblt/auxio/BootReceiver.kt
          grep -F 'locationMode != LocationMode.SAF && !rawRootCandidate' app/src/main/java/org/oxycblt/auxio/music/locations/LocationsDialog.kt
          grep -F 'Applying root access policy change without reindex' app/src/main/java/org/oxycblt/auxio/music/MusicSettings.kt
      - name: Commit fixes and remove temporary machinery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/org/oxycblt/auxio/AuxioService.kt
          git add app/src/main/java/org/oxycblt/auxio/BootReceiver.kt
          git add app/src/main/java/org/oxycblt/auxio/music/MusicSettings.kt
          git add app/src/main/java/org/oxycblt/auxio/music/locations/LocationsDialog.kt
          git add app/src/test/java/org/oxycblt/auxio/music/MusicSettingsIndexingTriggerTest.kt
          git rm .github/workflows/tmp-pr196-hardening.yml scripts/tmp-pr196-hardening.py
          git diff --cached --check
          git commit -m 'fix: harden first-launch source recovery'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/first-launch-source-recovery
