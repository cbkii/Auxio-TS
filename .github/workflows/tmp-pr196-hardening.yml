name: Temporary PR196 hardening

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: tmp-pr196-hardening
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
      - name: Apply hardening patch
        shell: bash
        run: python3 scripts/tmp-pr196-hardening.py
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/org/oxycblt/auxio/AuxioService.kt
          git add app/src/main/java/org/oxycblt/auxio/home/HomeFragment.kt
          git add app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt
          git add app/src/main/java/org/oxycblt/auxio/music/StartupLibraryPolicy.kt
          git add app/src/main/java/org/oxycblt/auxio/music/locations/LocationsDialog.kt
          git add app/src/main/java/org/oxycblt/auxio/music/service/IndexingHolder.kt
          git add app/src/main/java/org/oxycblt/auxio/music/service/MusicServiceFragment.kt
          git commit -m 'fix: harden startup-origin and source recovery'
          git push origin HEAD:fix/first-launch-source-recovery
