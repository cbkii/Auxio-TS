name: PR 183 build failure capture

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-build-tail.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Capture debug build tail
        shell: bash
        run: |
          set +e
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardDebug > /tmp/pr183-build.log 2>&1
          rc=$?
          {
            printf 'BUILD_EXIT=%s\n' "${rc}"
            grep -n -E '(^e: | error: |FAILED|FAILURE:|What went wrong|Execution failed|Unresolved reference|Type mismatch|Cannot infer|No value passed)' /tmp/pr183-build.log | tail -n 250
            printf '\n===== FINAL 500 LINES =====\n'
            tail -n 500 /tmp/pr183-build.log
          } > .github/pr183-build-diagnostics.log
          rm -f .github/workflows/pr183-build-tail.yml

      - name: Commit diagnostics
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: capture remaining PR 183 build failure'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/cbkii/Auxio-TS.git"
          git pull --rebase origin cx/incremental-library-pipeline
          git push origin HEAD:cx/incremental-library-pipeline
