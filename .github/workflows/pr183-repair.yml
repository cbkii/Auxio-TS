name: PR 183 one-shot verification

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-repair.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Bootstrap dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Run focused build and tests
        shell: bash
        run: |
          set +e
          log=.github/pr183-repair-ci.log
          : >"${log}"
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardDebug >>"${log}" 2>&1
          build_rc=$?
          if ((build_rc == 0)); then
            bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest :musikr:testDebugUnitTest >>"${log}" 2>&1
            test_rc=$?
          else
            test_rc=125
          fi
          printf '\nBUILD_EXIT=%s\nTEST_EXIT=%s\n' "${build_rc}" "${test_rc}" >>"${log}"
          echo "BUILD_EXIT=${build_rc}" >>"${GITHUB_ENV}"
          echo "TEST_EXIT=${test_rc}" >>"${GITHUB_ENV}"

      - name: Publish result and remove workflow on success
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "${BUILD_EXIT}" == 0 && "${TEST_EXIT}" == 0 ]]; then
            rm -f .github/pr183-repair-ci.log .github/workflows/pr183-repair.yml
            message='ci: remove completed PR 183 verification workflow'
          else
            message='ci: record focused PR 183 verification failure'
          fi
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "${message}"
          git push origin HEAD:cx/incremental-library-pipeline
