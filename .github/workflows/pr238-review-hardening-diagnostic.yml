name: PR 238 hardening patch diagnostic

on:
  push:
    branches:
      - fix/mediastore-source-authority-stale-rows
    paths:
      - .github/workflows/pr238-review-hardening-diagnostic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/mediastore-source-authority-stale-rows
          fetch-depth: 0

      - name: Apply patch or persist precise failure
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/pr238-review-hardening.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          script = textwrap.dedent(source[start:end])
          script = script.replace(
              "if count != 1:\n        raise SystemExit(f\"STOP: {path}: expected anchor once, found {count}\")",
              "if count < 1:\n        raise SystemExit(f\"STOP: {path}: required anchor missing\")",
              1,
          )
          Path('/tmp/pr238-review-hardening.py').write_text(script)
          PY

          set +e
          python3 /tmp/pr238-review-hardening.py > /tmp/pr238-hardening.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ((status != 0)); then
            git reset --hard HEAD
            cp /tmp/pr238-hardening.log .github/pr238-hardening-error.txt
            rm -f .github/workflows/pr238-review-hardening-diagnostic.yml
            git add -A
            git commit -m "chore: record PR 238 hardening patch failure"
            git push origin HEAD:fix/mediastore-source-authority-stale-rows
            exit 0
          fi

          rm -f -- \
            .github/workflows/pr238-review-hardening.yml \
            .github/workflows/pr238-review-hardening-runner.yml \
            .github/workflows/pr238-review-hardening-apply.yml \
            .github/workflows/pr238-review-hardening-diagnostic.yml
          git diff --check
          git add -A
          git commit -m "fix: harden MediaStore failure authority and item retention"
          git push origin HEAD:fix/mediastore-source-authority-stale-rows
