name: Dispatch PR 182 finalizer

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/pr182-dispatch-finalizer.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pr182-finalizer.yml --repo cbkii/Auxio-TS --ref cx/create-fast-interaction-startup-pr
