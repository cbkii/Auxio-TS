name: PR 268 final edge guard validation

on:
  push:
    branches:
      - fix/fast-resume-canonical-convergence
    paths:
      - ".github/workflows/pr268-final-edge-guard.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/fast-resume-canonical-convergence
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply and validate final edge guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail

          python3 .github/scripts/pr268-final-edge-guard.py
          rm -f \
            .github/scripts/pr268-final-edge-guard.py \
            .github/workflows/pr268-final-edge-guard.yml

          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo '::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set.'; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

          bash scripts/bootstrap-dependencies.sh --profile full-build
          ./gradlew spotlessApply --no-daemon
          bash scripts/ci-gradle.sh --continue \
            spotlessKotlinCheck \
            :app:testDebugUnitTest \
            :musikr:testDebugUnitTest \
            :app:lintDebug

          bash scripts/ci-scope.sh --self-test
          bash scripts/check-product-contracts.sh
          bash scripts/check-headunit-compat-safety.sh
          bash scripts/check-dofun-topway-compat.sh
          bash scripts/check-startup-performance-contracts.sh
          bash scripts/check-manual-release-workflow.sh
          git diff --check

          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          api = os.environ['GH_API_URL']
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', 'HEAD']).decode().split('\0')
          changed = [path for path in changed if path]

          def request(path, payload):
              req = urllib.request.Request(
                  f'{api}/repos/{repo}{path}',
                  data=json.dumps(payload).encode(),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          entries = []
          for path in changed:
              if not os.path.exists(path):
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              with open(path, 'rb') as fh:
                  content = base64.b64encode(fh.read()).decode()
              blob = request('/git/blobs', {'content': content, 'encoding': 'base64'})
              mode = '100755' if os.access(path, os.X_OK) else '100644'
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})

          tree = request('/git/trees', {'base_tree': base_tree, 'tree': entries})
          print(f"FINAL_TREE_SHA={tree['sha']}")
          with open('/tmp/pr268-final-edge-tree.txt', 'w') as fh:
              fh.write(tree['sha'] + '\n')
          PY

      - name: Upload validated tree SHA
        uses: actions/upload-artifact@v4
        with:
          name: pr268-final-edge-tree
          path: /tmp/pr268-final-edge-tree.txt
          if-no-files-found: error
