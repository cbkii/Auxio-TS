name: Temporary PR173 diagnostics

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/temporary-pr173-diagnostics.yml"
      - "app/**"
      - "musikr/**"

permissions:
  contents: read

concurrency:
  group: temporary-pr173-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.event.pull_request.number == 173
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Capture build, tests and lint
        shell: bash
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/pr173-diagnostics"

          bash ./scripts/ci-gradle.sh --stacktrace --warning-mode all :app:assembleStandardDebug \
            >"${RUNNER_TEMP}/pr173-diagnostics/build.log" 2>&1
          build_status=$?

          bash ./scripts/ci-gradle.sh --stacktrace :app:testStandardDebugUnitTest :musikr:testDebugUnitTest \
            >"${RUNNER_TEMP}/pr173-diagnostics/tests.log" 2>&1
          test_status=$?

          bash ./scripts/ci-gradle.sh --stacktrace :app:lintStandardDebug \
            >"${RUNNER_TEMP}/pr173-diagnostics/lint.log" 2>&1
          lint_status=$?

          printf 'build=%s\ntests=%s\nlint=%s\n' \
            "${build_status}" "${test_status}" "${lint_status}" \
            >"${RUNNER_TEMP}/pr173-diagnostics/status.txt"
          exit 0

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr173-complete-diagnostics
          path: ${{ runner.temp }}/pr173-diagnostics/**
          if-no-files-found: error
          retention-days: 7
