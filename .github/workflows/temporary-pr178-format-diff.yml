name: Temporary PR178 format diff

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/temporary-pr178-format-diff.yml"
      - "musikr/src/main/java/org/oxycblt/musikr/cache/db/CacheDatabase.kt"
      - "musikr/src/main/java/org/oxycblt/musikr/cache/db/LibrarySearch.kt"
      - "musikr/src/test/java/org/oxycblt/musikr/cache/db/LibrarySearchTest.kt"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate exact Spotless patch
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon spotlessApply
          git diff --binary -- \
            musikr/src/main/java/org/oxycblt/musikr/cache/db/CacheDatabase.kt \
            musikr/src/main/java/org/oxycblt/musikr/cache/db/LibrarySearch.kt \
            musikr/src/test/java/org/oxycblt/musikr/cache/db/LibrarySearchTest.kt \
            > "${RUNNER_TEMP}/pr178-format.patch"
          cat "${RUNNER_TEMP}/pr178-format.patch"

      - name: Upload formatter patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr178-format-patch
          path: ${{ runner.temp }}/pr178-format.patch
          if-no-files-found: error
          retention-days: 1
