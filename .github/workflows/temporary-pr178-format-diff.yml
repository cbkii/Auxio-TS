name: Temporary PR178 format finalizer

on:
  push:
    branches:
      - copilot/complete-database-first-library-consumer-conversio
    paths:
      - ".github/workflows/temporary-pr178-format-diff.yml"

permissions:
  contents: write

concurrency:
  group: temporary-pr178-format-finalizer
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply canonical formatting and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("musikr/src/main/java/org/oxycblt/musikr/cache/db/CacheDatabase.kt")
          text = path.read_text()
          old = "     * Indexed, bounded, paged song search."
          new = "     * Database-backed, bounded, paged song search."
          if old not in text:
              raise SystemExit("Expected search KDoc was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          bash ./scripts/ci-gradle.sh spotlessApply
          git rm .github/workflows/temporary-pr178-format-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply canonical PR178 formatting"
          git push origin HEAD:copilot/complete-database-first-library-consumer-conversio
