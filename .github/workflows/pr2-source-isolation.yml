name: PR2 source isolation

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr2-source-isolation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0
      - name: Apply guarded source-isolation changes
        run: python3 scripts/pr2-source-isolation.py
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Prepare dependencies
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Apply repository formatting
        run: bash ./scripts/ci-gradle.sh spotlessApply
      - name: Commit source isolation and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: isolate source failures and retain committed siblings'
          git push origin HEAD:cx/incremental-library-pipeline
      - name: Compile changed modules
        run: |
          bash ./scripts/ci-gradle.sh \
            :musikr:compileDebugKotlin \
            :app:compileStandardDebugKotlin
