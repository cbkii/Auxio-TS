name: PR 183 one-shot polish

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply source fix and formatting
        shell: bash
        run: |
          python3 .github/pr183-polish.py
          bash ./scripts/ci-gradle.sh spotlessApply
          rm -f .github/pr183-polish.py .github/workflows/pr183-polish.yml

      - name: Commit polished branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format incremental pipeline hardening'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/cbkii/Auxio-TS.git"
          git pull --rebase origin cx/incremental-library-pipeline
          git push origin HEAD:cx/incremental-library-pipeline
