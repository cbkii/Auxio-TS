name: LSPosed Bridge

on:
  pull_request:
    branches:
      - dev
      - "cx/**"
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bridge:
    if: >-
      (
        contains(github.event.pull_request.title, 'xposed') ||
        contains(github.event.pull_request.title, 'lsposed') ||
        contains(github.event.pull_request.title, 'hook') ||
        contains(github.event.pull_request.title, 'bridge') ||
        contains(github.event.pull_request.labels.*.name, 'ci:lsposed-bridge') ||
        contains(github.event.pull_request.labels.*.name, 'lsposed-bridge') ||
        startsWith(github.head_ref, 'feat/lsposed-') ||
        startsWith(github.head_ref, 'fix/lsposed-') ||
        contains(github.head_ref, 'lsposed-bridge')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Build and test paired Auxio target
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_LOG: ${{ runner.temp }}/lsposed-target-gradle.log
        run: |
          bash ./scripts/ci-gradle.sh \
            :app:testTopwayTwMediaDebugUnitTest \
            :app:assembleTopwayTwMediaDebug

      - name: Resolve paired debug signer
        id: target
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "${sdk_root}/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n1)"
          [[ -x "${apksigner}" ]] || { echo '::error::apksigner unavailable'; exit 1; }
          mapfile -t apks < <(find app/build/outputs/apk/topwayTwMedia/debug -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort)
          ((${#apks[@]} == 1)) || { echo "::error::Expected one paired debug APK, found ${#apks[@]}"; exit 1; }
          # shellcheck source=/dev/null
          source scripts/lib/apksigner-certificate.sh
          report="$("${apksigner}" verify --verbose --print-certs "${apks[0]}" 2>&1)"
          signer="$(extract_apksigner_certificate_sha256 "${report}")"
          [[ "${signer}" =~ ^[0-9A-F]{64}$ ]] || { echo '::error::Paired debug signer is malformed'; exit 1; }
          echo "apk=${apks[0]}" >>"${GITHUB_OUTPUT}"
          echo "signer=${signer}" >>"${GITHUB_OUTPUT}"
          echo "apksigner=${apksigner}" >>"${GITHUB_OUTPUT}"

      - name: Test, lint and build bridge
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_LOG: ${{ runner.temp }}/lsposed-bridge-gradle.log
          TARGET_SIGNER: ${{ steps.target.outputs.signer }}
        run: |
          bash ./scripts/ci-gradle.sh \
            :lsposed-bridge:testDebugUnitTest \
            :lsposed-bridge:lintDebug \
            :lsposed-bridge:assembleDebug \
            -PexpectedTargetSigner="${TARGET_SIGNER}"

      - name: Validate paired API 100 contracts
        shell: bash
        env:
          APKSIGNER_BIN: ${{ steps.target.outputs.apksigner }}
          TARGET_APK: ${{ steps.target.outputs.apk }}
        run: |
          bash ./scripts/check-lsposed-bridge-contracts.sh \
            --variant debug \
            --apk lsposed-bridge/build/outputs/apk/debug/lsposed-bridge-debug.apk \
            --target-apk "${TARGET_APK}"

      - name: Prepare bridge download
        id: prepare
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/lsposed-bridge-download"
          mkdir -p "${artifact_dir}"
          apk='lsposed-bridge/build/outputs/apk/debug/lsposed-bridge-debug.apk'
          name='Auxio-TS-lsposed-api100-bridge-debug.apk'
          cp "${apk}" "${artifact_dir}/${name}"
          (cd "${artifact_dir}" && sha256sum "${name}" >"${name}.sha256" && sha256sum -c "${name}.sha256")
          echo "artifact_dir=${artifact_dir}" >>"${GITHUB_OUTPUT}"
          echo "sha256=$(sha256sum "${artifact_dir}/${name}" | awk '{print $1}')" >>"${GITHUB_OUTPUT}"

      - name: Upload bridge debug APK
        id: bridge_artifact
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lsposed-api100-bridge-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.prepare.outputs.artifact_dir }}/Auxio-TS-lsposed-api100-bridge-debug.apk
            ${{ steps.prepare.outputs.artifact_dir }}/Auxio-TS-lsposed-api100-bridge-debug.apk.sha256

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lsposed-api100-bridge-failure-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            lsposed-bridge/build/reports/**
            lsposed-bridge/build/test-results/**
            app/build/reports/tests/testTopwayTwMediaDebugUnitTest/**
            app/build/test-results/testTopwayTwMediaDebugUnitTest/**
            ${{ runner.temp }}/lsposed-target-gradle.log
            ${{ runner.temp }}/lsposed-bridge-gradle.log

      - name: Write bridge summary
        if: always()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.bridge_artifact.outputs.artifact-url }}
          BRIDGE_SHA256: ${{ steps.prepare.outputs.sha256 }}
          TARGET_SIGNER: ${{ steps.target.outputs.signer }}
        run: |
          {
            echo '## LSPosed API 100 Track-C bridge'
            echo
            echo '- Required static LSPosed scope: `com.tw.music` only'
            echo '- Paired debug target: `com.tw.media.debug`'
            echo "- Paired target signer: \`${TARGET_SIGNER:-unavailable}\`"
            if [[ -n "${ARTIFACT_URL}" && -n "${BRIDGE_SHA256}" ]]; then
              echo "- [Bridge debug APK](${ARTIFACT_URL}) — SHA-256 \`${BRIDGE_SHA256}\`"
            else
              echo '- Bridge APK unavailable because build/validation/upload did not complete.'
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
