name: Temporary PR167 restore finaliser

on:
  pull_request:
    types: [synchronize]
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: tmp-pr167-restore-finaliser
  cancel-in-progress: false

jobs:
  finalise:
    if: github.event.pull_request.number == 167
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix-startup-routing-11126370068088722538
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current dev and patch restore cancellation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin dev
          git merge --no-edit origin/dev

          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path(
              'app/src/main/java/org/oxycblt/auxio/playback/service/'
              'ExoPlaybackStateHolder.kt'
          )
          text = path.read_text(encoding='utf-8')

          old_start = (
              '            L.d("Restoring playback state from cached/loaded library")\n'
              '            currentRestoreJob?.cancel()\n'
          )
          new_start = (
              '            L.d("Restoring playback state from cached/loaded library")\n'
              '            playbackManager.notifyRestoreOutcome('
              'RestoreOutcome.WAITING_FOR_PLAYER)\n'
              '            currentRestoreJob?.cancel()\n'
          )
          start_count = text.count(old_start)
          if start_count != 1:
              raise SystemExit(
                  f'STOP: expected one cached-restore start block, found {start_count}'
              )
          text = text.replace(old_start, new_start, 1)

          cancel_pattern = re.compile(
              r'(?ms)^    private fun cancelActiveRestore\('
              r'reason: String, notify: Boolean = true\) \{.*?'
              r'^    \}\n\n(?=    override fun playing)'
          )
          replacement = (
              '    private fun cancelActiveRestore('
              'reason: String, notify: Boolean = true) {\n'
              '        val job = currentRestoreJob\n'
              '        val outcome = playbackManager.restoreOutcome\n'
              '        val jobActive = job?.isActive == true\n'
              '        val transientOutcome =\n'
              '            outcome == RestoreOutcome.WAITING_FOR_PLAYER ||\n'
              '                outcome == RestoreOutcome.WAITING_FOR_LIBRARY ||\n'
              '                outcome == RestoreOutcome.RAW_FAST_RESUME_ACTIVE\n'
              '        if (!jobActive && !transientOutcome) return\n\n'
              '        L.i("Cancelling pending playback restore '
              '[reason=$reason outcome=$outcome]")\n'
              '        restoreGeneration += 1\n'
              '        currentRestoreJob = null\n'
              '        pendingLibraryRestoreAfterRawFailure = null\n'
              '        job?.cancel()\n'
              '        if (notify && (jobActive || transientOutcome)) {\n'
              '            playbackManager.notifyRestoreOutcome('
              'RestoreOutcome.CANCELLED)\n'
              '        }\n'
              '    }\n\n'
          )
          text, cancel_count = cancel_pattern.subn(replacement, text, count=1)
          if cancel_count != 1:
              raise SystemExit(
                  f'STOP: expected one restore-cancellation block, found {cancel_count}'
              )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-cleanup: always

      - name: Prepare and validate
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
          bash ./scripts/bootstrap-dependencies.sh --profile full-build
          bash ./scripts/ci-gradle.sh spotlessApply
          git diff --check
          find scripts -type f -name '*.sh' -exec sh -n {} ';'
          bash ./scripts/check-headunit-compat-safety.sh
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/ci-gradle.sh \
            :app:testStandardDebugUnitTest \
            --tests org.oxycblt.auxio.headunit.StartupPanelCoordinatorTest

      - name: Commit source fix
        shell: bash
        run: |
          git add \
            app/src/main/java/org/oxycblt/auxio/MainActivity.kt \
            app/src/main/java/org/oxycblt/auxio/playback/service/ExoPlaybackStateHolder.kt
          if git diff --cached --quiet; then
            echo '::error::No restore integration changes were staged.'
            exit 1
          fi
          git commit -m 'fix: complete explicit-route restore lifecycle'

      - name: Remove temporary workflow from dev and sync PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clean_worktree="${RUNNER_TEMP}/dev-clean"
          git fetch origin dev
          git worktree add --detach "${clean_worktree}" origin/dev
          git -C "${clean_worktree}" config user.name 'github-actions[bot]'
          git -C "${clean_worktree}" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "${clean_worktree}/.github/workflows/tmp-pr167-exo-finaliser.yml"
          git -C "${clean_worktree}" add -A
          git -C "${clean_worktree}" commit -m 'ci: remove temporary PR167 restore finaliser'
          git -C "${clean_worktree}" push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:dev

          git fetch origin dev
          git merge --no-edit origin/dev
          rm -f .github/pr167-exo-trigger
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove PR167 restore-finaliser trigger'
          fi
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:fix-startup-routing-11126370068088722538
