name: Dependency Health

on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-health:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "${sdk_dir}" ]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Ensure native build tools are present
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Bootstrap dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Capture submodule status
        shell: bash
        run: |
          mkdir -p build/reports/dependency-health
          git submodule status --recursive | tee build/reports/dependency-health/submodules.txt

      - name: Gradle dependency reports
        shell: bash
        run: |
          mkdir -p build/reports/dependency-health
          ./gradlew --no-daemon --stacktrace \
            :app:dependencies \
            :musikr:dependencies \
            > build/reports/dependency-health/gradle-dependencies.txt

      - name: Build standard debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleStandardDebug

      - name: Upload dependency health reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-health-reports
          path: build/reports/dependency-health
          if-no-files-found: warn
