name: Temporary final review fixes

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: temporary-final-review-fixes
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.head_ref == 'release-ready-fixes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release-ready branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: release-ready-fixes
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Apply review fixes
        shell: bash
        run: python3 .github/temporary-review-fixes.py

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Apply formatting
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
          bash ./scripts/bootstrap-dependencies.sh --profile full-build
          bash ./scripts/ci-gradle.sh spotlessApply

      - name: Commit final review fixes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f \
            .github/temporary-review-fixes.py \
            .github/workflows/temporary-review-fixes.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce configured-only discovery and path boundaries [final-review-fixes]'
          auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push https://github.com/${GITHUB_REPOSITORY}.git HEAD:release-ready-fixes
