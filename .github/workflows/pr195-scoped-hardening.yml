name: PR195 Scoped Launcher Hardening

# Temporary branch-local completion runner. It is deleted after the verified source commit lands.
on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr195-scoped-launcher-hardening
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.user.login == 'cbkii' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/ts18-dofun-generic-media-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/ts18-dofun-generic-media-compat
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo '::error::Android SDK path unavailable'; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Ensure native tools
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply final scoped hardening
        shell: bash
        run: python3 scripts/pr195_finish_generic_media.py

      - name: Format generated Kotlin
        shell: bash
        run: bash ./scripts/ci-gradle.sh --warning-mode all spotlessKotlinApply

      - name: Run source guards
        shell: bash
        run: |
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-headunit-compat-safety.sh
          git diff --check

      - name: Verify focused unit tests
        shell: bash
        run: bash ./scripts/ci-gradle.sh --warning-mode all :app:testStandardDebugUnitTest

      - name: Build all debug identities
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardDebug
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicDebug
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaDebug

      - name: Commit verified source edits
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app \
            scripts/check-dofun-topway-compat.sh \
            docs/ts18/launcher-integration/DOFUN_GENERIC_MEDIA_COMPAT_IMPLEMENTATION.md \
            docs/ts18/launcher-integration/TS18_LAUNCHER_COMPREHENSIVE_IN_APP_PLAN.md \
            docs/ts18/launcher-integration/VALIDATION_MATRIX.md
          if git diff --cached --quiet; then
            echo '::error::Scoped helper generated no source changes.'
            exit 1
          fi
          git commit -m 'fix(ts18): finalise generic DoFun media routing'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/ts18-dofun-generic-media-compat
