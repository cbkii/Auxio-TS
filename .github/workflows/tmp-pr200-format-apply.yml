name: PR200 Apply Formatting

on:
  push:
    branches:
      - agent/ts18-root-storage-fastpath
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr200-format-apply
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'agent/ts18-root-storage-fastpath')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/ts18-root-storage-fastpath
          fetch-depth: 0
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare formatting dependencies
        run: bash scripts/prepare-ci-environment.sh

      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply

      - name: Verify formatter scope
        run: |
          rm -f .github/workflows/tmp-pr200-format-apply.yml
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(\.github/workflows/tmp-pr200-format-apply\.yml|app/src/(main|test)/.*\.kt|musikr/src/(main|test)/.*\.kt)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatter changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet; then
            echo "Formatter produced no change" >&2
            exit 1
          fi
          git diff --stat

      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply PR200 Kotlin formatting'
          git push origin HEAD:agent/ts18-root-storage-fastpath
