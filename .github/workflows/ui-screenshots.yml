name: UI Screenshots (Roborazzi)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA to render
        required: true
        default: dev
        type: string
      distribution:
        description: Application distribution lane
        required: true
        default: topwayTwMedia
        type: choice
        options: [standard, topwayTwMedia, topwayTwMusic]
      roborazzi_task:
        description: Roborazzi operation
        required: true
        default: record
        type: choice
        options: [record, verify, compare, verify_and_record]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false -Dkotlin.incremental=false
concurrency:
  group: ui-screenshots-${{ inputs.target_ref }}-${{ inputs.distribution }}-${{ inputs.roborazzi_task }}
  cancel-in-progress: true

jobs:
  roborazzi:
    name: Roborazzi UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Write local.properties
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"; [[ -n "$sdk_dir" ]] || exit 1
          printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties
      - name: Ensure native build tools
        run: |
          if ! command -v ninja >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Prepare CI environment
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Select flavor-qualified Roborazzi task
        id: task
        env:
          OPERATION: ${{ inputs.roborazzi_task }}
          DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          case "$OPERATION" in record) prefix=recordRoborazzi;; verify) prefix=verifyRoborazzi;; compare) prefix=compareRoborazzi;; verify_and_record) prefix=verifyAndRecordRoborazzi;; *) exit 1;; esac
          case "$DISTRIBUTION" in standard) flavor=Standard; package=org.oxycblt.auxio;; topwayTwMedia) flavor=TopwayTwMedia; package=com.tw.media;; topwayTwMusic) flavor=TopwayTwMusic; package=com.tw.music;; *) exit 1;; esac
          echo "gradle_task=${prefix}${flavor}Debug" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Run Roborazzi
        id: roborazzi
        run: bash ./scripts/ci-gradle.sh :app:${{ steps.task.outputs.gradle_task }}
      - name: Upload Roborazzi reports
        id: reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auxio-ts-${{ inputs.distribution }}-roborazzi-reports
          path: |
            app/build/reports/roborazzi/**
            app/build/reports/tests/**
            app/build/test-results/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 20
      - name: Upload Roborazzi PNGs
        id: screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auxio-ts-${{ inputs.distribution }}-roborazzi-screenshots
          path: |
            app/build/outputs/roborazzi/**/*.png
            app/src/test/**/roborazzi/**/*.png
          if-no-files-found: warn
          retention-days: 20
      - name: Write screenshot summary
        if: always()
        env:
          RESULT: ${{ steps.roborazzi.outcome }}
          PACKAGE: ${{ steps.task.outputs.package }}
          TASK: ${{ steps.task.outputs.gradle_task }}
        run: |
          {
            echo '## UI Screenshots (Roborazzi)'; echo; echo "- Result: \`$RESULT\`"; echo "- Target ref: \`${{ inputs.target_ref }}\`"
            echo "- Distribution: \`${{ inputs.distribution }}\`"; echo "- Package: \`$PACKAGE\`"; echo "- Gradle task: \`$TASK\`"
          } >> "$GITHUB_STEP_SUMMARY"
