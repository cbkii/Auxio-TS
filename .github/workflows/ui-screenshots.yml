name: UI Screenshots (Roborazzi)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA to render
        required: true
        default: dev
        type: string
      roborazzi_task:
        description: Roborazzi operation
        required: true
        default: record
        type: choice
        options:
          - record
          - verify
          - compare
          - verify_and_record

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false -Dkotlin.incremental=false

concurrency:
  group: ui-screenshots-${{ inputs.target_ref }}-${{ inputs.roborazzi_task }}
  cancel-in-progress: true

jobs:
  roborazzi:
    name: Roborazzi UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Ensure native build tools are present
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Select Roborazzi task
        id: task
        shell: bash
        env:
          OPERATION: ${{ inputs.roborazzi_task }}
        run: |
          case "${OPERATION}" in
            record) prefix='recordRoborazzi' ;;
            verify) prefix='verifyRoborazzi' ;;
            compare) prefix='compareRoborazzi' ;;
            verify_and_record) prefix='verifyAndRecordRoborazzi' ;;
            *) echo "::error::Unknown operation: ${OPERATION}"; exit 1 ;;
          esac
          echo "gradle_task=${prefix}Debug" >> "${GITHUB_OUTPUT}"

      - name: Run Roborazzi
        id: roborazzi
        shell: bash
        run: bash ./scripts/ci-gradle.sh :app:${{ steps.task.outputs.gradle_task }}

      - name: Upload Roborazzi reports
        id: reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auxio-ts-roborazzi-reports
          path: |
            app/build/reports/roborazzi/**
            app/build/reports/tests/**
            app/build/test-results/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 20

      - name: Upload Roborazzi PNGs
        id: screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auxio-ts-roborazzi-screenshots
          path: |
            app/build/outputs/roborazzi/**/*.png
            app/src/test/**/roborazzi/**/*.png
          if-no-files-found: warn
          retention-days: 20

      - name: Write screenshot summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.roborazzi.outcome }}
          REPORTS_URL: ${{ steps.reports.outputs.artifact-url }}
          SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
          GRADLE_TASK: ${{ steps.task.outputs.gradle_task }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          {
            echo "## UI Screenshots (Roborazzi)"
            echo
            echo "- Result: \`${RESULT}\`"
            echo "- Target ref: \`${TARGET_REF}\`"
            echo "- Product: \`com.tw.media\`"
            echo "- Gradle task: \`${GRADLE_TASK}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            [[ -n "${REPORTS_URL}" ]] && echo "- Reports: ${REPORTS_URL}"
            [[ -n "${SCREENSHOTS_URL}" ]] && echo "- PNG bundle: ${SCREENSHOTS_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
