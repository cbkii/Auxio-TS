name: UI Screenshots (Roborazzi)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or commit SHA to render"
        required: true
        default: dev
        type: string
      variant:
        description: "App variant"
        required: true
        default: topway_twmusic
        type: choice
        options:
          - topway_twmusic
          - topway_twmedia
          - standard
      roborazzi_task:
        description: "Roborazzi operation"
        required: true
        default: record
        type: choice
        options:
          - record
          - verify
          - compare
          - verify_and_record

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

concurrency:
  group: ui-screenshots-${{ inputs.target_ref }}-${{ inputs.variant }}-${{ inputs.roborazzi_task }}
  cancel-in-progress: true

jobs:
  roborazzi:
    name: Roborazzi UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Write local.properties
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Select Roborazzi task
        id: task
        shell: bash
        env:
          VARIANT: ${{ inputs.variant }}
          OPERATION: ${{ inputs.roborazzi_task }}
        run: |
          set -euo pipefail
          case "${VARIANT}" in
            standard) suffix="StandardDebug" ;;
            topway_twmusic) suffix="TopwayTwMusicDebug" ;;
            topway_twmedia) suffix="TopwayTwMediaDebug" ;;
            *)
              echo "::error::Unknown variant: ${VARIANT}"
              exit 1
              ;;
          esac

          case "${OPERATION}" in
            record) prefix="recordRoborazzi" ;;
            verify) prefix="verifyRoborazzi" ;;
            compare) prefix="compareRoborazzi" ;;
            verify_and_record) prefix="verifyAndRecordRoborazzi" ;;
            *)
              echo "::error::Unknown operation: ${OPERATION}"
              exit 1
              ;;
          esac

          echo "gradle_task=${prefix}${suffix}" >> "${GITHUB_OUTPUT}"

      - name: Run Roborazzi
        id: roborazzi
        shell: bash
        run: bash ./scripts/ci-gradle.sh :app:${{ steps.task.outputs.gradle_task }}

      - name: Upload Roborazzi reports
        id: reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auxio-ts-${{ inputs.variant }}-roborazzi-reports
          path: |
            app/build/reports/roborazzi/**
            app/build/reports/tests/**
            app/build/test-results/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 20

      - name: Upload Roborazzi PNGs
        id: screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auxio-ts-${{ inputs.variant }}-roborazzi-screenshots
          path: |
            app/build/outputs/roborazzi/**/*.png
            app/src/test/**/roborazzi/**/*.png
          if-no-files-found: warn
          retention-days: 20

      - name: Write screenshot summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.roborazzi.outcome }}
          REPORTS_URL: ${{ steps.reports.outputs.artifact-url }}
          SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
          GRADLE_TASK: ${{ steps.task.outputs.gradle_task }}
          TARGET_REF: ${{ inputs.target_ref }}
          VARIANT: ${{ inputs.variant }}
        run: |
          {
            echo "## UI Screenshots (Roborazzi)"
            echo
            echo "- Result: \`${RESULT}\`"
            echo "- Target ref: \`${TARGET_REF}\`"
            echo "- Variant: \`${VARIANT}\`"
            echo "- Gradle task: \`${GRADLE_TASK}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [[ -n "${REPORTS_URL}" ]]; then
              echo "- Reports: ${REPORTS_URL}"
            fi
            if [[ -n "${SCREENSHOTS_URL}" ]]; then
              echo "- PNG bundle: ${SCREENSHOTS_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
