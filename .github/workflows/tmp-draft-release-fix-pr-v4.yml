name: Temporary draft release PR bridge v4

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/tmp-draft-release-fix-pr-v4.yml

permissions:
  contents: write

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/manual-release-draft-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/manual-release-draft-repair
          fetch-depth: 2
          persist-credentials: false

      - name: Apply and validate final repair
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s python3 scripts/tmp-run-draft-release-fix-v3.py
          timeout 120s ruby -e 'require "yaml"; Psych.safe_load(File.read(ARGV.fetch(0)), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK workflow YAML"' .github/workflows/manual-release.yml
          timeout 120s bash -n scripts/check-manual-release-workflow.sh
          timeout 180s bash scripts/check-manual-release-workflow.sh
          ! grep -Fq '/releases/tags/' .github/workflows/manual-release.yml
          grep -Fq 'TARGET_RELEASE_FILE: ${{ steps.plan.outputs.target_release_file }}' .github/workflows/manual-release.yml
          grep -Fq 'timeout 60s gh api --method POST "repos/${GITHUB_REPOSITORY}/releases"' .github/workflows/manual-release.yml
          grep -Fq 'repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}' .github/workflows/manual-release.yml

      - name: Create validated remote commit object
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          remote="$(timeout 30s git ls-remote origin refs/heads/fix/manual-release-draft-repair | awk '{print $1}')"
          [[ "${parent}" == "${remote}" ]] || {
            echo "::error::Repair branch moved during validation."
            exit 1
          }
          base_tree="$(timeout 30s gh api "repos/${GITHUB_REPOSITORY}/git/commits/${parent}" --jq .tree.sha)"
          workflow_blob="$(timeout 60s gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
            -F content=@.github/workflows/manual-release.yml -f encoding=utf-8 --jq .sha)"
          checker_blob="$(timeout 60s gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
            -F content=@scripts/check-manual-release-workflow.sh -f encoding=utf-8 --jq .sha)"
          checker_mode="$(git ls-files -s scripts/check-manual-release-workflow.sh | awk '{print $1}')"
          [[ "${checker_mode}" =~ ^100(644|755)$ ]] || {
            echo "::error::Unexpected checker mode ${checker_mode}."
            exit 1
          }

          tree_request="${RUNNER_TEMP}/tree-request.json"
          jq -n \
            --arg base_tree "${base_tree}" \
            --arg workflow_blob "${workflow_blob}" \
            --arg checker_blob "${checker_blob}" \
            --arg checker_mode "${checker_mode}" \
            '{
              base_tree: $base_tree,
              tree: [
                {path: ".github/workflows/manual-release.yml", mode: "100644", type: "blob", sha: $workflow_blob},
                {path: "scripts/check-manual-release-workflow.sh", mode: $checker_mode, type: "blob", sha: $checker_blob},
                {path: ".github/workflows/tmp-draft-release-fix.yml", mode: "100644", type: "blob", sha: null},
                {path: ".github/workflows/tmp-draft-release-fix-pr.yml", mode: "100644", type: "blob", sha: null},
                {path: ".github/workflows/tmp-draft-release-fix-pr-v2.yml", mode: "100644", type: "blob", sha: null},
                {path: ".github/workflows/tmp-draft-release-fix-pr-v3.yml", mode: "100644", type: "blob", sha: null},
                {path: ".github/workflows/tmp-draft-release-fix-pr-v4.yml", mode: "100644", type: "blob", sha: null},
                {path: "scripts/tmp-apply-draft-release-fix.py", mode: "100644", type: "blob", sha: null},
                {path: "scripts/tmp-run-draft-release-fix-v3.py", mode: "100644", type: "blob", sha: null}
              ]
            }' > "${tree_request}"
          tree_sha="$(timeout 60s gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" \
            --input "${tree_request}" --jq .sha)"

          commit_request="${RUNNER_TEMP}/commit-request.json"
          jq -n \
            --arg message 'ci: make draft release transactions ID-aware' \
            --arg tree "${tree_sha}" \
            --arg parent "${parent}" \
            '{message: $message, tree: $tree, parents: [$parent]}' > "${commit_request}"
          commit_sha="$(timeout 60s gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" \
            --input "${commit_request}" --jq .sha)"
          [[ "${commit_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub returned invalid commit SHA ${commit_sha}."
            exit 1
          }
          printf '%s\n' "${commit_sha}" > "${RUNNER_TEMP}/validated-commit-sha.txt"
          echo "sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          echo "Validated repair commit object: ${commit_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload validated commit pointer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-draft-release-repair-commit
          path: ${{ runner.temp }}/validated-commit-sha.txt
          if-no-files-found: error
          retention-days: 1
