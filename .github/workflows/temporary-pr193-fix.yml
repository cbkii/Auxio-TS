name: Temporary PR193 final patch

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: temporary-pr193-final-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.head_ref == 'release-ready-fixes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python3 -m py_compile scripts/temporary-pr193-fix.py
          python3 scripts/temporary-pr193-fix.py

      - name: Remove temporary repair files
        shell: bash
        run: |
          git rm --ignore-unmatch \
            .github/workflows/temporary-pr193-fix.yml \
            .github/workflows/temporary-pr193-unit-diagnostic.yml \
            scripts/temporary-pr193-fix.py

      - name: Commit and push final patch
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/src/main/java/org/oxycblt/auxio/headunit/topway/TopwaySourcePolicy.kt \
            app/src/test/java/org/oxycblt/auxio/headunit/topway/TopwaySourcePolicyDiscoveryTest.kt
          git diff --cached --check
          git commit -m "fix: contain configured source traversal"
          git push origin "HEAD:${BRANCH}"
