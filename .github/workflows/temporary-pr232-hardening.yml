name: Temporary PR 232 hardening

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch-test-and-remove-self:
    if: github.event.pull_request.number == 232 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: copilot/reintroduce-incremental-performance
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply focused Prompt 4 hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              write(path, text.replace(old, new, 1))

          scan_model = "musikr/src/main/java/org/oxycblt/musikr/cache/IncrementalScan.kt"
          replace_once(
              scan_model,
              """    val hasWork: Boolean
                  get() = scanSources.isNotEmpty() || removedSourceKeys.isNotEmpty()
          }
          """,
              """    val hasWork: Boolean
                  get() = scanSources.isNotEmpty() || removedSourceKeys.isNotEmpty()

              companion object {
                  /** Single definition of the optional metadata-only lane. */
                  fun isEnrichmentOnly(
                      scanSources: List<SourceSnapshot>,
                      removedSourceKeys: Set<String>,
                      scanReasons: Map<String, SourceScanReason>,
                  ): Boolean =
                      scanSources.isNotEmpty() &&
                          removedSourceKeys.isEmpty() &&
                          scanSources.all {
                              scanReasons[it.sourceKey] == SourceScanReason.METADATA_PROFILE_UPGRADE
                          }
              }
          }
          """,
          )

          store = "musikr/src/main/java/org/oxycblt/musikr/cache/db/IncrementalScanStore.kt"
          replace_once(
              store,
              """import org.oxycblt.musikr.cache.SourceFingerprintReusePolicy
          import org.oxycblt.musikr.cache.incrementalRank
          """,
              """import org.oxycblt.musikr.cache.SourceFingerprintReusePolicy
          import org.oxycblt.musikr.cache.SourceScanReason
          import org.oxycblt.musikr.cache.incrementalRank
          """,
          )
          replace_once(
              store,
              "val scanReasons = linkedMapOf<String, org.oxycblt.musikr.cache.SourceScanReason>()",
              "val scanReasons = linkedMapOf<String, SourceScanReason>()",
          )
          replace_once(
              store,
              """        val currentSourceKeys = distinctSnapshots.mapTo(linkedSetOf()) { it.sourceKey }

                  db.withTransaction {
          """,
              """        val currentSourceKeys = distinctSnapshots.mapTo(linkedSetOf()) { it.sourceKey }
                  val nowMs = System.currentTimeMillis()

                  db.withTransaction {
          """,
          )
          replace_once(store, "nowMs = System.currentTimeMillis(),", "nowMs = nowMs,")
          replace_once(
              store,
              """        val enrichmentOnly =
                      scanSources.isNotEmpty() &&
                          removed.isEmpty() &&
                          scanSources.all {
                              scanReasons[it.sourceKey] ==
                                  org.oxycblt.musikr.cache.SourceScanReason.METADATA_PROFILE_UPGRADE
                          }
          """,
              """        val enrichmentOnly =
                      IncrementalScanPlan.isEnrichmentOnly(
                          scanSources = scanSources,
                          removedSourceKeys = removed,
                          scanReasons = scanReasons,
                      )
          """,
          )

          planner = "app/src/main/java/org/oxycblt/auxio/music/IncrementalIndexPlanner.kt"
          replace_once(
              planner,
              """                removalScopedPlan.copy(
                              enrichmentOnly =
                                  removalScopedPlan.scanSources.isNotEmpty() &&
                                      removalScopedPlan.removedSourceKeys.isEmpty() &&
                                      removalScopedPlan.scanSources.all {
                                          removalScopedPlan.scanReasons[it.sourceKey] ==
                                              org.oxycblt.musikr.cache.SourceScanReason
                                                  .METADATA_PROFILE_UPGRADE
                                      }
                          )
          """,
              """                removalScopedPlan.copy(
                              enrichmentOnly =
                                  IncrementalScanPlan.isEnrichmentOnly(
                                      scanSources = removalScopedPlan.scanSources,
                                      removedSourceKeys = removalScopedPlan.removedSourceKeys,
                                      scanReasons = removalScopedPlan.scanReasons,
                                  )
                          )
          """,
          )
          replace_once(
              planner,
              """                    enrichmentOnly =
                                  selectedSources.isNotEmpty() &&
                                      removalScopedPlan.removedSourceKeys.isEmpty() &&
                                      selectedSources.all {
                                          selectedReasons[it.sourceKey] ==
                                              org.oxycblt.musikr.cache.SourceScanReason
                                                  .METADATA_PROFILE_UPGRADE
                                      },
          """,
              """                    enrichmentOnly =
                                  IncrementalScanPlan.isEnrichmentOnly(
                                      scanSources = selectedSources,
                                      removedSourceKeys = removalScopedPlan.removedSourceKeys,
                                      scanReasons = selectedReasons,
                                  ),
          """,
          )

          repository = "app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt"
          replace_once(
              repository,
              """                            legacyWriteOnly = ::WriteOnlyMutableCache,
                              )
                          } catch (e: CancellationException) {
                              throw e
                          } catch (e: Exception) {
          """,
              """                            legacyWriteOnly = ::WriteOnlyMutableCache,
                              )
                          } catch (e: CancellationException) {
                              throw e
                          } catch (e: SourcePreflightException) {
          """,
          )
          text = read(repository)
          supersession_start = (
              "                val currentConfigurationGeneration = "
              "musicSettings.sourceConfigurationGeneration\n"
          )
          if text.count(supersession_start) != 1:
              raise RuntimeError("MusicRepository: supersession block count changed")
          start = text.index(supersession_start)
          end_marker = "                    return@traceSuspend\n                }\n"
          end = text.index(end_marker, start) + len(end_marker)
          supersession_block = text[start:end]
          text = text[:start] + text[end:]
          insertion = "                val scopedFailures =\n"
          if text.count(insertion) != 1:
              raise RuntimeError("MusicRepository: scoped failure insertion point changed")
          insert_at = text.index(insertion)
          text = text[:insert_at] + supersession_block + text[insert_at:]
          write(repository, text)
          replace_once(
              repository,
              """                val partial =
                      effectiveSourceOutcome is SourceScanOutcome.Partial ||
                          effectiveSourceOutcome is SourceScanOutcome.Truncated ||
                          unresolved.isNotEmpty()
          """,
              """                val partial =
                      effectiveSourceOutcome.isPartialSessionResult(
                          unresolvedSourceKeys = unresolved,
                          enrichmentComplete = result.enrichmentComplete,
                      )
          """,
          )

          outcome = "app/src/main/java/org/oxycblt/auxio/music/SourceScanOutcome.kt"
          text = read(outcome)
          helper = """

          /** Session truthfulness is broader than durable source authority. */
          internal fun SourceScanOutcome.isPartialSessionResult(
              unresolvedSourceKeys: Set<String>,
              enrichmentComplete: Boolean,
          ): Boolean =
              this is SourceScanOutcome.Partial ||
                  this is SourceScanOutcome.Truncated ||
                  unresolvedSourceKeys.isNotEmpty() ||
                  !enrichmentComplete
          """
          if "isPartialSessionResult" in text:
              raise RuntimeError("SourceScanOutcome: partial-session helper already exists")
          write(outcome, text.rstrip() + helper + "\n")

          failure_policy = "musikr/src/main/java/org/oxycblt/musikr/IncrementalResultFailurePolicy.kt"
          replace_once(
              failure_policy,
              """        if (commit.enrichmentOnly && !commit.enrichmentComplete) {
                      for (sourceKey in commit.committedSources) {
                          failures.putIfAbsent(
                              sourceKey,
                              "ENRICHMENT_INCOMPLETE|Optional metadata did not cover membership",
                          )
                      }
                  }
          """,
              "",
          )

          cleanup_policy = "app/src/main/java/org/oxycblt/auxio/music/CoverCleanupPolicy.kt"
          replace_once(
              cleanup_policy,
              """     *   lean publication is deliberately incomplete and is followed by enrichment, so it must not
               *   define the retained cover set.
               */
          """,
              """     *   lean publication is deliberately incomplete and is followed by enrichment, so it must not
               *   define the retained cover set.
               * @param enrichmentOnly Whether the scan only upgraded optional metadata. Enrichment
               *   never owns authoritative source membership or the retained cover set.
               */
          """,
          )
          replace_once(
              cleanup_policy,
              "enrichmentOnly: Boolean = false,",
              "enrichmentOnly: Boolean,",
          )

          failure_test = "musikr/src/test/java/org/oxycblt/musikr/IncrementalResultFailurePolicyTest.kt"
          replace_once(
              failure_test,
              """    @Test
              fun `incomplete enrichment is visible as a partial optional result`() {
                  val commit =
                      commit(
                          committedSources = setOf("source"),
                          enrichmentOnly = true,
                          enrichmentComplete = false,
                      )

                  val failures = IncrementalResultFailurePolicy.effectiveFailures(commit)

                  assertTrue(failures.getValue("source").startsWith("ENRICHMENT_INCOMPLETE|"))
              }
          """,
              """    @Test
              fun `incomplete enrichment remains separate from source failures`() {
                  val commit =
                      commit(
                          committedSources = setOf("source"),
                          enrichmentOnly = true,
                          enrichmentComplete = false,
                      )

                  assertTrue(IncrementalResultFailurePolicy.effectiveFailures(commit).isEmpty())
              }

              @Test
              fun `complete enrichment reports no source failures`() {
                  val commit =
                      commit(
                          committedSources = setOf("source"),
                          enrichmentOnly = true,
                          enrichmentComplete = true,
                      )

                  assertTrue(IncrementalResultFailurePolicy.effectiveFailures(commit).isEmpty())
              }
          """,
          )

          availability_test = "app/src/test/java/org/oxycblt/auxio/music/SourceAvailabilityOutcomePolicyTest.kt"
          text = read(availability_test)
          insert = """

              @Test
              fun `incomplete optional enrichment makes only the session result partial`() {
                  val outcome = SourceScanOutcome.Success(setOf("usb0"))

                  assertTrue(
                      outcome.isPartialSessionResult(
                          unresolvedSourceKeys = emptySet(),
                          enrichmentComplete = false,
                      )
                  )
                  assertTrue(outcome.unresolvedSourceKeys.isEmpty())
              }

              @Test
              fun `complete optional enrichment does not make a successful session partial`() {
                  val outcome = SourceScanOutcome.Success(setOf("usb0"))

                  assertTrue(
                      !outcome.isPartialSessionResult(
                          unresolvedSourceKeys = emptySet(),
                          enrichmentComplete = true,
                      )
                  )
              }
          """
          if "incomplete optional enrichment makes only the session result partial" in text:
              raise RuntimeError("SourceAvailabilityOutcomePolicyTest: tests already exist")
          close = text.rfind("\n}")
          if close < 0:
              raise RuntimeError("SourceAvailabilityOutcomePolicyTest: class close not found")
          write(availability_test, text[:close] + insert + text[close:])

          planner_test = "app/src/test/java/org/oxycblt/auxio/music/IncrementalIndexPlannerTest.kt"
          replace_once(
              planner_test,
              """    @Test
              fun explicitEmptyConfigurationMayProduceARemovalOnlyPlan() = runBlocking {
                  val original = FakeSourceAwareFs()
                  val cache = FakeIncrementalCache()

                  val prepared =
                      IncrementalIndexPlanner.prepare(
                          fs = original,
                          cache = cache,
                          withCache = false,
                          profile = MetadataProfile.LEAN,
                          configurationRevision = 2L,
                          targetSourceKeys = emptySet(),
                          allowEmptySourceSet = true,
                          legacyWriteOnly = { it },
                      )

                  assertEquals(emptySet<String>(), cache.plannedSnapshotKeys)
                  assertTrue(prepared.plan != null)
                  assertEquals(emptySet<String>(), original.selectedSourceKeys)
              }
          """,
              """    @Test
              fun explicitEmptyConfigurationMayProduceARemovalOnlyPlan() = runBlocking {
                  val removed = setOf("direct:removed")
                  val original = FakeSourceAwareFs()
                  val cache = FakeIncrementalCache(removedSourceKeys = removed)

                  val prepared =
                      IncrementalIndexPlanner.prepare(
                          fs = original,
                          cache = cache,
                          withCache = false,
                          profile = MetadataProfile.LEAN,
                          configurationRevision = 2L,
                          targetSourceKeys = emptySet(),
                          allowEmptySourceSet = true,
                          legacyWriteOnly = { it },
                      )
                  val withoutRemovalAuthority =
                      IncrementalIndexPlanner.prepare(
                          fs = original,
                          cache = cache,
                          withCache = false,
                          profile = MetadataProfile.LEAN,
                          configurationRevision = 2L,
                          targetSourceKeys = emptySet(),
                          allowEmptySourceSet = true,
                          applyRemovedSources = false,
                          legacyWriteOnly = { it },
                      )

                  assertEquals(emptySet<String>(), cache.plannedSnapshotKeys)
                  assertEquals(removed, prepared.plan?.removedSourceKeys)
                  assertTrue(prepared.plan?.hasWork == true)
                  assertTrue(withoutRemovalAuthority.plan?.removedSourceKeys.orEmpty().isEmpty())
                  assertEquals(emptySet<String>(), original.selectedSourceKeys)
              }
          """,
          )
          insertion_marker = """    @Test
              fun emptyPreflightFailsWithoutPublishingAnEmptyScan() = runBlocking {
          """
          planning_test = """    @Test
              fun ledgerPlanningFailurePropagatesInsteadOfBecomingPreflightUnavailable() = runBlocking {
                  val source =
                      SourceSnapshot(
                          sourceKey = "direct:a",
                          sourceType = "DIRECT_FS",
                          rootUri = "file:///storage/usbdisk0",
                          rootPath = "/storage/usbdisk0",
                          available = true,
                          fingerprint = "a",
                          fingerprintStrength = SourceFingerprintStrength.AUTHORITATIVE,
                      )
                  val failure = IllegalStateException("Room ledger failure")
                  val original = FakeSourceAwareFs(snapshots = listOf(source))
                  val cache = FakeIncrementalCache(planningFailure = failure)

                  try {
                      IncrementalIndexPlanner.prepare(
                          fs = original,
                          cache = cache,
                          withCache = true,
                          profile = MetadataProfile.LEAN,
                          configurationRevision = 1L,
                          legacyWriteOnly = { it },
                      )
                      fail("Expected ledger planning failure")
                  } catch (actual: IllegalStateException) {
                      assertTrue(actual === failure)
                  }
              }

          """
          text = read(planner_test)
          if text.count(insertion_marker) != 1:
              raise RuntimeError("IncrementalIndexPlannerTest: insertion point changed")
          write(planner_test, text.replace(insertion_marker, planning_test + insertion_marker, 1))
          replace_once(
              planner_test,
              "private class FakeIncrementalCache : MutableCache, IncrementalCache {",
              """private class FakeIncrementalCache(
                  private val removedSourceKeys: Set<String> = emptySet(),
                  private val planningFailure: RuntimeException? = null,
              ) : MutableCache, IncrementalCache {""",
          )
          replace_once(
              planner_test,
              """        ): IncrementalScanPlan {
                      plannedSnapshots = snapshots
          """,
              """        ): IncrementalScanPlan {
                      planningFailure?.let { throw it }
                      plannedSnapshots = snapshots
          """,
          )
          replace_once(
              planner_test,
              """                configurationRevision = configurationRevision,
                          force = force,
                      )
          """,
              """                configurationRevision = configurationRevision,
                          force = force,
                          removedSourceKeys = removedSourceKeys,
                      )
          """,
          )

          store_test = "musikr/src/test/java/org/oxycblt/musikr/cache/db/IncrementalScanStoreTest.kt"
          marker = """    @Test
              fun `removal-only configuration commits deterministically`() = runBlocking {
          """
          new_test = """    @Test
              fun `unavailable configured source blocks committed removal`() = runBlocking {
                  val omitted = snapshot("usb0", "/storage/usbdisk0")
                  val unavailable = snapshot("usb1", "/storage/usbdisk1")
                  val first =
                      store.planScan(
                          listOf(omitted, unavailable),
                          false,
                          MetadataProfile.LEAN,
                          1L,
                      )
                  store.beginScan(first)
                  store.stage(cachedFile("alpha.mp3", 1L, "/storage/usbdisk0"))
                  store.stage(cachedFile("beta.mp3", 1L, "/storage/usbdisk1"))
                  store.commitScan()

                  val replacement =
                      store.planScan(
                          listOf(unavailable.copy(available = false, fingerprint = null)),
                          false,
                          MetadataProfile.LEAN,
                          2L,
                      )
                  assertEquals(setOf(omitted.sourceKey), replacement.removedSourceKeys)
                  assertEquals(setOf(unavailable.sourceKey), replacement.unavailableSourceKeys)
                  store.beginScan(replacement)
                  val commit = store.commitScan()

                  assertTrue(commit.removedSources.isEmpty())
                  assertTrue(db.incrementalDao().sourceLedger(omitted.sourceKey)?.available == true)
                  assertEquals(2, store.compatibilityCachedFiles().toList().size)
              }

          """
          text = read(store_test)
          if text.count(marker) != 1:
              raise RuntimeError("IncrementalScanStoreTest: insertion point changed")
          write(store_test, text.replace(marker, new_test + marker, 1))

          queue_test = "app/src/test/java/org/oxycblt/auxio/music/RepositoryIndexRequestQueueTest.kt"
          replace_once(
              queue_test,
              """        assertFalse(
                      IndexRequestPolicy.isSupersededByNewerConfiguration(
                          enrichment.copy(configurationGeneration = null),
                          10L,
                      )
                  )
          """,
              """        assertFalse(
                      IndexRequestPolicy.isSupersededByNewerConfiguration(
                          enrichment.copy(configurationGeneration = null),
                          10L,
                      )
                  )
                  assertTrue(
                      IndexRequestPolicy.isSupersededByNewerConfiguration(
                          enrichment.copy(reason = IndexReason.USER_REFRESH),
                          10L,
                      )
                  )
                  assertTrue(
                      IndexRequestPolicy.isSupersededByNewerConfiguration(
                          enrichment.copy(reason = IndexReason.SOURCE_OBSERVER),
                          10L,
                      )
                  )
          """,
          )
          PY

      - name: Format and run focused validation
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh spotlessKotlinApply
          bash ./scripts/ci-gradle.sh \
            :app:testTopwayTwMediaDebugUnitTest \
            :musikr:testDebugUnitTest
          git diff --check
          git rm .github/workflows/temporary-pr232-hardening.yml

      - name: Commit focused hardening and remove runner
        shell: bash
        env:
          BRANCH: copilot/reintroduce-incremental-performance
        run: |
          git config user.name "cbkii"
          git config user.email "150587541+cbkii@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "::error::Hardening produced no task-owned change."; exit 1; }
          git commit -m "Harden Prompt 4 authority boundaries"
          git push origin "HEAD:${BRANCH}"
