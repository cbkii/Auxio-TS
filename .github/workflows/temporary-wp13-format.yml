name: Temporary WP1 and WP3 formatter

on:
  push:
    branches:
      - fix/queue-and-source-authority-18405081181736171814

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[wp13-formatted]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/queue-and-source-authority-18405081181736171814
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply repository formatting and remove this workflow
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --console=plain spotlessApply
          rm -f .github/workflows/temporary-wp13-format.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format queue and source authority [wp13-formatted]'
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push https://github.com/${GITHUB_REPOSITORY}.git \
            HEAD:fix/queue-and-source-authority-18405081181736171814
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
