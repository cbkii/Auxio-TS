name: Temporary PR196 export merged tree

on:
  pull_request:
    branches:
      - 'cx/**'

permissions:
  contents: read

concurrency:
  group: tmp-pr196-export-tree
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
          persist-credentials: false

      - name: Merge intended target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/ts18-dofun-generic-media-compat
          git merge --no-edit origin/feat/ts18-dofun-generic-media-compat

      - name: Export merged source tree
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/pr196-merged-tree"
          mkdir -p "${out}"
          tar --exclude=.git -czf "${out}/repo.tar.gz" .
          git status --short > "${out}/git-status.txt"
          git rev-parse HEAD > "${out}/merged-head.txt"
          git rev-parse origin/feat/ts18-dofun-generic-media-compat > "${out}/target-head.txt"

      - name: Upload merged source tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr196-merged-source-tree
          path: ${{ runner.temp }}/pr196-merged-tree/**
          if-no-files-found: error
          retention-days: 2
