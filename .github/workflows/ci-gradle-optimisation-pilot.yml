# Manual evidence-only pilot. Automatic CI remains sequential and configuration-cache neutral
# until a successful run proves the current AGP/Kotlin/KSP/Hilt/Roborazzi task set is compatible.
name: Gradle Optimisation Pilot (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Optimisation experiment
        required: true
        type: choice
        default: both
        options:
          - configuration-cache
          - parallel
          - both

permissions:
  contents: read

concurrency:
  group: gradle-optimisation-pilot-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  configuration-cache:
    name: Configuration cache pilot
    if: inputs.mode == 'configuration-cache' || inputs.mode == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AUXIO_TS_CI_CONFIGURATION_CACHE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare Android and dependency environment
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
          bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Run first configuration-cache pass
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_LOG: ${{ runner.temp }}/configuration-cache-pilot.log
        run: |
          bash ./scripts/ci-gradle.sh --continue \
            spotlessKotlinCheck \
            :app:testDebugUnitTest \
            :musikr:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Run configuration-cache reuse pass
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_LOG: ${{ runner.temp }}/configuration-cache-pilot.log
        run: |
          bash ./scripts/ci-gradle.sh --continue \
            spotlessKotlinCheck \
            :app:testDebugUnitTest \
            :musikr:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Upload configuration-cache evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: configuration-cache-pilot-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/configuration-cache-pilot.log
            .gradle/configuration-cache/**
            build/reports/configuration-cache/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 14

  parallel:
    name: Parallel execution pilot
    if: inputs.mode == 'parallel' || inputs.mode == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AUXIO_TS_CI_GRADLE_PARALLEL: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare Android and dependency environment
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
          bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Run maintained task set with Gradle parallelism
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_LOG: ${{ runner.temp }}/parallel-pilot.log
        run: |
          bash ./scripts/ci-gradle.sh --continue \
            spotlessKotlinCheck \
            :app:testDebugUnitTest \
            :musikr:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Upload parallel-execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parallel-pilot-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/parallel-pilot.log
            app/build/reports/**
            musikr/build/reports/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 14
