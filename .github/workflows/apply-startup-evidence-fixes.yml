name: Apply focused startup evidence repairs

on:
  push:
    branches:
      - cx/startup-profiles-benchmarks
    paths:
      - ".github/workflows/apply-startup-evidence-fixes.yml"

permissions:
  contents: write

concurrency:
  group: apply-startup-evidence-fixes
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/startup-profiles-benchmarks
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified minimal repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          raw = Path("app/src/main/java/org/oxycblt/auxio/headunit/ts18/RawFastResume.kt")
          replace_once(
              raw,
              "import java.io.File\nimport org.oxycblt.auxio.playback.persist.FastResumeSnapshot",
              "import java.io.File\nimport org.oxycblt.auxio.BuildConfig\nimport org.oxycblt.auxio.playback.persist.FastResumeSnapshot",
          )
          text = raw.read_text(encoding="utf-8")
          if text.count("validateDirectPath(path)") != 2:
              raise SystemExit("RawFastResume.kt: expected two validateDirectPath(path) calls")
          text = text.replace("validateDirectPath(path)", "validateDirectPath(context, path)")
          raw.write_text(text, encoding="utf-8", newline="\n")
          replace_once(
              raw,
              "    private fun validateDirectPath(path: String?): Result.Invalid? {\n"
              "        if (path.isNullOrBlank()) return invalid(Reason.BLANK_SOURCE, \"direct path is blank\")\n"
              "        val normalized = path.trim()\n"
              "        if (!isAllowedDirectPath(normalized)) {\n"
              "            return invalid(Reason.UNSAFE_PATH, normalized)\n"
              "        }",
              "    private fun validateDirectPath(context: Context, path: String?): Result.Invalid? {\n"
              "        if (path.isNullOrBlank()) return invalid(Reason.BLANK_SOURCE, \"direct path is blank\")\n"
              "        val normalized = path.trim()\n"
              "        if (\n"
              "            !isAllowedDirectPath(normalized) &&\n"
              "                !isAllowedBenchmarkFixturePath(context, normalized)\n"
              "        ) {\n"
              "            return invalid(Reason.UNSAFE_PATH, normalized)\n"
              "        }",
          )
          replace_once(
              raw,
              "    fun hasAudioExtension(path: String): Boolean {\n"
              "        val ext = path.substringAfterLast('.', missingDelimiterValue = \"\").lowercase()\n"
              "        return ext in audioExtensions\n"
              "    }\n\n"
              "    private fun invalid(reason: Reason, detail: String) = Result.Invalid(reason, detail)",
              "    fun hasAudioExtension(path: String): Boolean {\n"
              "        val ext = path.substringAfterLast('.', missingDelimiterValue = \"\").lowercase()\n"
              "        return ext in audioExtensions\n"
              "    }\n\n"
              "    private fun isAllowedBenchmarkFixturePath(context: Context, path: String): Boolean {\n"
              "        if (BuildConfig.BUILD_TYPE != \"benchmark\") return false\n"
              "        return try {\n"
              "            val candidate = File(path).canonicalFile\n"
              "            (0..1).any { sourceIndex ->\n"
              "                candidate.isInside(\n"
              "                    FastStartDirectFolderBrowser.benchmarkRoot(context, sourceIndex)\n"
              "                        .canonicalFile\n"
              "                )\n"
              "            }\n"
              "        } catch (_: Exception) {\n"
              "            false\n"
              "        }\n"
              "    }\n\n"
              "    private fun File.isInside(root: File): Boolean {\n"
              "        var cursor: File? = this\n"
              "        while (cursor != null) {\n"
              "            if (cursor == root) return true\n"
              "            cursor = cursor.parentFile\n"
              "        }\n"
              "        return false\n"
              "    }\n\n"
              "    private fun invalid(reason: Reason, detail: String) = Result.Invalid(reason, detail)",
          )

          benchmark_manifest = Path("app/src/benchmark/AndroidManifest.xml")
          replace_once(
              benchmark_manifest,
              "    <application>",
              "    <application android:largeHeap=\"true\">",
          )

          journeys = Path("startup-benchmark/src/main/java/org/oxycblt/auxio/startupbenchmark/CriticalJourneys.kt")
          replace_once(journeys, "    private const val UI_TIMEOUT_MS = 10_000L", "    private const val UI_TIMEOUT_MS = 20_000L")
          replace_once(
              journeys,
              "            clickAnyRequired(rootSelectors, \"Fast Start USB $sourceIndex root\")\n"
              "            device.waitForIdle()\n"
              "            clickRequired(By.textStartsWith(\"▶\"), \"playable USB $sourceIndex fixture\")",
              "            clickAnyAtCenterRequired(rootSelectors, \"Fast Start USB $sourceIndex root\")\n"
              "            device.waitForIdle()\n"
              "            clickAtCenterRequired(\n"
              "                By.textStartsWith(\"▶\"),\n"
              "                \"playable USB $sourceIndex fixture\",\n"
              "            )",
          )
          replace_once(
              journeys,
              "            clickRequired(By.textContains(\"Songs\"), \"Songs tab\")",
              "            clickAtCenterRequired(By.textContains(\"Songs\"), \"Songs tab\")",
          )
          replace_once(
              journeys,
              "            clickRequired(By.textContains(\"Albums\"), \"Albums tab\")",
              "            clickAtCenterRequired(By.textContains(\"Albums\"), \"Albums tab\")",
          )
          replace_once(
              journeys,
              "    private fun MacrobenchmarkScope.clickRequired(selector: BySelector, description: String) {\n"
              "        requireObject(selector, description).clickClickableAncestor(description)\n"
              "        device.waitForIdle()\n"
              "    }\n\n"
              "    private fun MacrobenchmarkScope.clickAnyRequired(",
              "    private fun MacrobenchmarkScope.clickRequired(selector: BySelector, description: String) {\n"
              "        requireObject(selector, description).clickClickableAncestor(description)\n"
              "        device.waitForIdle()\n"
              "    }\n\n"
              "    private fun MacrobenchmarkScope.clickAtCenterRequired(\n"
              "        selector: BySelector,\n"
              "        description: String,\n"
              "    ) {\n"
              "        val center = requireObject(selector, description).visibleCenter\n"
              "        check(device.click(center.x, center.y)) { \"Coordinate click failed: $description\" }\n"
              "        device.waitForIdle()\n"
              "    }\n\n"
              "    private fun MacrobenchmarkScope.clickAnyAtCenterRequired(\n"
              "        selectors: List<BySelector>,\n"
              "        description: String,\n"
              "    ) {\n"
              "        for (selector in selectors) {\n"
              "            val candidate = device.wait(Until.findObject(selector), 1_500L) ?: continue\n"
              "            val center = candidate.visibleCenter\n"
              "            if (device.click(center.x, center.y)) {\n"
              "                device.waitForIdle()\n"
              "                return\n"
              "            }\n"
              "        }\n"
              "        error(\"Required UI object not found or coordinate click failed: $description\")\n"
              "    }\n\n"
              "    private fun MacrobenchmarkScope.clickAnyRequired(",
          )

          workflow = Path(".github/workflows/apply-startup-evidence-fixes.yml")
          workflow.unlink()
          PY

      - name: Validate focused changes
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml
          bash -n scripts/check-startup-performance-contracts.sh
          bash scripts/check-startup-performance-contracts.sh
          git diff --check

      - name: Commit and push
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add --all
          git diff --cached --stat
          git commit -m "test: repair managed startup evidence journeys"
          git push origin HEAD:cx/startup-profiles-benchmarks
