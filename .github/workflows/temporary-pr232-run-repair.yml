name: Temporary PR 232 repair runner

on:
  push:
    branches:
      - copilot/reintroduce-incremental-performance

permissions:
  contents: write

jobs:
  run-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: copilot/reintroduce-incremental-performance
          fetch-depth: 2

      - name: Execute reviewed fail-closed patch payload
        shell: bash
        run: |
          awk '
            /^          python3 - <<.PY.$/ { capture = 1; next }
            /^          PY$/ { capture = 0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/temporary-pr232-finalise.yml > /tmp/pr232-repair.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/pr232-repair.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("'''.replace(\"          \", \"\", 1),", "''',")
          path.write_text(text, encoding='utf-8')
          PY
          test -s /tmp/pr232-repair.py
          python3 /tmp/pr232-repair.py
          git diff --check
          git rm .github/workflows/temporary-pr232-finalise.yml
          git rm .github/workflows/temporary-pr232-run-repair.yml

      - name: Commit repaired authority contracts
        shell: bash
        env:
          BRANCH: copilot/reintroduce-incremental-performance
        run: |
          git config user.name "cbkii"
          git config user.email "150587541+cbkii@users.noreply.github.com"
          git add -A
          git commit -m "Harden removal visibility and unavailable-source outcomes"
          git push origin "HEAD:${BRANCH}"
