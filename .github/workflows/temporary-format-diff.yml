name: Temporary formatting repair

on:
  push:
    branches:
      - fix/playback-banner-and-visualizer-state-11316441362856201323

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/playback-banner-and-visualizer-state-11316441362856201323
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply repository formatting and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --console=plain spotlessApply
          rm -f .github/workflows/temporary-format-diff.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply repository formatting'
          git push origin HEAD:fix/playback-banner-and-visualizer-state-11316441362856201323
