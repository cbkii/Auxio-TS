name: Temporary PR196 review fixes

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: tmp-pr196-review-fixes
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
          persist-credentials: false
      - name: Apply review fixes
        shell: bash
        run: python3 scripts/tmp-pr196-review-fixes.py
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Format and run scoped unit tests
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh spotlessKotlinApply
          bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest
      - name: Commit review fixes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/org/oxycblt/auxio/AuxioService.kt
          git add app/src/main/java/org/oxycblt/auxio/BootReceiver.kt
          git add app/src/main/java/org/oxycblt/auxio/headunit/prestart/EarlyPrestartSettings.kt
          git add app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt
          git add app/src/main/java/org/oxycblt/auxio/music/StartupLibraryPolicy.kt
          git add app/src/main/java/org/oxycblt/auxio/music/service/IndexingHolder.kt
          git add app/src/main/java/org/oxycblt/auxio/music/service/MusicServiceFragment.kt
          git add app/src/main/res/values/strings_source_recovery.xml
          git add app/src/test/java/org/oxycblt/auxio/music/StartupScanOriginTest.kt
          git add app/src/test/java/org/oxycblt/auxio/playback/persist/PersistenceCancellationTest.kt
          if git diff --cached --quiet; then
            echo "::error::Expected PR #196 review fixes were not staged."
            exit 1
          fi
          git commit -m 'fix: address source-recovery review findings'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/first-launch-source-recovery
