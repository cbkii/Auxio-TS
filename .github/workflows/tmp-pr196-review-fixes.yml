name: Temporary PR196 review fixes

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: tmp-pr196-review-fixes
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
          persist-credentials: false
      - name: Apply review fixes
        shell: bash
        run: |
          python3 scripts/tmp-pr196-review-fixes.py
          python3 scripts/tmp-pr196-policy-test-fix.py
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Format and run scoped unit tests
        id: verify
        shell: bash
        run: |
          format_status=0
          test_status=0

          bash ./scripts/ci-gradle.sh spotlessKotlinApply || format_status=$?
          if [[ "${format_status}" -eq 0 ]]; then
            bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest > "${RUNNER_TEMP}/pr196-review-tests.log" 2>&1 || test_status=$?
            cat "${RUNNER_TEMP}/pr196-review-tests.log"
          fi

          rm -f tmp-pr196-review-test-error.log
          if [[ "${test_status}" -ne 0 ]]; then
            {
              printf 'PR #196 review-fix unit-test output. Exit status: %s\n\n' "${test_status}"
              tail -n 400 "${RUNNER_TEMP}/pr196-review-tests.log"
            } > tmp-pr196-review-test-error.log
          fi

          printf 'format_status=%s\n' "${format_status}" >> "${GITHUB_OUTPUT}"
          printf 'test_status=%s\n' "${test_status}" >> "${GITHUB_OUTPUT}"
      - name: Commit review fixes or concise diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/org/oxycblt/auxio/AuxioService.kt
          git add app/src/main/java/org/oxycblt/auxio/BootReceiver.kt
          git add app/src/main/java/org/oxycblt/auxio/headunit/prestart/EarlyPrestartSettings.kt
          git add app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt
          git add app/src/main/java/org/oxycblt/auxio/music/StartupLibraryPolicy.kt
          git add app/src/main/java/org/oxycblt/auxio/music/service/IndexingHolder.kt
          git add app/src/main/java/org/oxycblt/auxio/music/service/MusicServiceFragment.kt
          git add app/src/main/java/org/oxycblt/auxio/music/service/StartupScanAuthorityPolicy.kt
          git add app/src/main/res/values/strings_source_recovery.xml
          git add app/src/test/java/org/oxycblt/auxio/music/StartupLibraryPolicyTest.kt
          git add app/src/test/java/org/oxycblt/auxio/music/StartupScanOriginTest.kt
          git add app/src/test/java/org/oxycblt/auxio/playback/persist/PersistenceCancellationTest.kt
          git add -u tmp-pr196-review-test-error.log 2>/dev/null || true
          git add tmp-pr196-review-test-error.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::error::Expected PR #196 review fixes were not staged."
            exit 1
          fi
          git commit -m 'fix: address source-recovery review findings'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/first-launch-source-recovery
      - name: Preserve verification result
        shell: bash
        env:
          FORMAT_STATUS: ${{ steps.verify.outputs.format_status }}
          TEST_STATUS: ${{ steps.verify.outputs.test_status }}
        run: |
          if [[ "${FORMAT_STATUS}" -ne 0 ]]; then
            echo "::error::spotlessKotlinApply failed with status ${FORMAT_STATUS}."
            exit "${FORMAT_STATUS}"
          fi
          if [[ "${TEST_STATUS}" -ne 0 ]]; then
            echo "::error::App unit tests failed with status ${TEST_STATUS}; concise output was committed."
            exit "${TEST_STATUS}"
          fi
