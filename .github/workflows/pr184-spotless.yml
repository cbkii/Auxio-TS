name: PR 184 One-Shot Formatting Repair

on:
  push:
    branches:
      - cx/startup-profiles-benchmarks
    paths:
      - ".github/workflows/pr184-spotless.yml"

permissions:
  contents: write

concurrency:
  group: pr184-one-shot-formatting
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/startup-profiles-benchmarks
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified Spotless patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/benchmark/java/org/oxycblt/auxio/benchmark/BenchmarkFixtureReceiver.kt")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '                pending.resultData = "Seeded $songCount committed rows and primitive queue ($sourceMode)"',
                  '                pending.resultData =\n                    "Seeded $songCount committed rows and primitive queue ($sourceMode)"',
              ),
              (
                  '''    private fun seedPlaybackQueue(
                  context: Context,
                  songCount: Int,
                  playableFiles: Map<Int, File>,
              ) {''',
                  '''    private fun seedPlaybackQueue(context: Context, songCount: Int, playableFiles: Map<Int, File>) {''',
              ),
              (
                  '        require(physicalFiles.isNotEmpty()) { "At least one playable benchmark fixture is required" }',
                  '''        require(physicalFiles.isNotEmpty()) {
                      "At least one playable benchmark fixture is required"
                  }''',
              ),
              (
                  '''            Room.databaseBuilder(
                          context,
                          PersistenceDatabase::class.java,
                          PLAYBACK_DATABASE_NAME,
                      )''',
                  '''            Room.databaseBuilder(context, PersistenceDatabase::class.java, PLAYBACK_DATABASE_NAME)''',
              ),
          ]
          changed = 0
          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
                  changed += 1
              elif count > 1:
                  raise SystemExit(f"Unsafe duplicate formatting target ({count} matches): {old[:80]!r}")
          if changed == 0:
              print("Formatting patch already present or source changed; continuing with verification.")
          else:
              print(f"Applied {changed} verified formatting replacements.")
              path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm -- .github/workflows/pr184-spotless.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/benchmark/java/org/oxycblt/auxio/benchmark/BenchmarkFixtureReceiver.kt
          git diff --cached --check
          git commit -m "style: finalise startup benchmark formatting"
          git push origin HEAD:cx/startup-profiles-benchmarks
