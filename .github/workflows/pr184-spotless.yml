name: PR 184 One-Shot Formatting Repair

on:
  push:
    branches:
      - cx/startup-profiles-benchmarks
    paths:
      - ".github/workflows/pr184-spotless.yml"

permissions:
  contents: write

concurrency:
  group: pr184-one-shot-formatting
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/startup-profiles-benchmarks
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not set" >&2
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: false

      - name: Prepare dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply repository formatter
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply --rerun-tasks

      - name: Commit formatting-only changes
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/benchmark startup-benchmark/src/main
          git diff --cached --check
          git commit -m "style: apply Spotless to startup benchmark sources"
          git push origin HEAD:cx/startup-profiles-benchmarks
