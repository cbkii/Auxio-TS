# Runs bounded profile generation on API 35 or runtime-compatible macrobenchmarks on API 29.
# Managed-emulator results are not exact TS18 physical validation.
name: Startup Benchmarks

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Application distribution lane
        required: true
        type: choice
        default: topwayTwMedia
        options: [standard, topwayTwMedia, topwayTwMusic]
      fixture_song_count:
        description: Deterministic committed-library fixture size
        required: true
        type: choice
        default: "5000"
        options: ["500", "5000", "20000"]
      iterations:
        description: Measurement iterations (15-30)
        required: true
        type: number
        default: 15
      suite:
        description: Instrumented suite
        required: true
        type: choice
        default: macrobenchmark
        options: [macrobenchmark, baseline-profile]

permissions:
  contents: read
concurrency:
  group: startup-benchmarks-${{ github.ref }}-${{ inputs.distribution }}-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"; [[ -n "$sdk_dir" ]] || exit 1
          printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare CI environment
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Validate inputs and structural contracts
        env:
          FIXTURE_SONG_COUNT: ${{ inputs.fixture_song_count }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          case "$FIXTURE_SONG_COUNT" in 500|5000|20000) ;; *) exit 1;; esac
          ((ITERATIONS >= 15 && ITERATIONS <= 30)) || { echo 'Iterations must be 15-30'; exit 1; }
          bash ./scripts/check-startup-performance-contracts.sh
          bash ./scripts/check-product-contracts.sh
      - name: Resolve flavor-aware managed-device task
        id: task
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          case "$DISTRIBUTION" in
            standard) package=org.oxycblt.auxio ;;
            topwayTwMedia) package=com.tw.media ;;
            topwayTwMusic) package=com.tw.music ;;
            *) exit 1 ;;
          esac
          case "$SUITE" in
            baseline-profile) device_token=pixel6Api35; device_label='Pixel 6 API 35 AOSP managed emulator'; test_class=org.oxycblt.auxio.startupbenchmark.BaselineProfileGenerator ;;
            macrobenchmark) device_token=pixel2Api29; device_label='Pixel 2 API 29 AOSP managed emulator'; test_class=org.oxycblt.auxio.startupbenchmark.StartupMacrobenchmark ;;
            *) exit 1 ;;
          esac
          task_name="${device_token}${DISTRIBUTION^}BenchmarkAndroidTest"
          echo "name=$task_name" >> "$GITHUB_OUTPUT"
          echo "class=$test_class" >> "$GITHUB_OUTPUT"
          echo "device=$device_label" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Run bounded managed-device suite
        env:
          TASK_NAME: ${{ steps.task.outputs.name }}
          TEST_CLASS: ${{ steps.task.outputs.class }}
          DEVICE_LABEL: ${{ steps.task.outputs.device }}
          TARGET_PACKAGE: ${{ steps.task.outputs.package }}
          DISTRIBUTION: ${{ inputs.distribution }}
          FIXTURE_SONG_COUNT: ${{ inputs.fixture_song_count }}
          ITERATIONS: ${{ inputs.iterations }}
          SUITE: ${{ inputs.suite }}
        run: |
          args=(":startup-benchmark:${TASK_NAME}" "-Pandroid.testInstrumentationRunnerArguments.class=${TEST_CLASS}" "-Pandroid.testInstrumentationRunnerArguments.auxio.fixtureSongCount=${FIXTURE_SONG_COUNT}" "-Pandroid.testInstrumentationRunnerArguments.auxio.iterations=${ITERATIONS}")
          [[ "$SUITE" != baseline-profile ]] || args+=("-Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile")
          bash ./scripts/ci-gradle.sh "${args[@]}"
          mkdir -p startup-benchmark/build/reports/startup-performance
          {
            echo "commit=$GITHUB_SHA"; echo "distribution=$DISTRIBUTION"; echo "product=$TARGET_PACKAGE"; echo "variant=benchmark"; echo "suite=$SUITE"
            echo "testClass=$TEST_CLASS"; echo "fixtureSongCount=$FIXTURE_SONG_COUNT"; echo 'sourceCount=2'; echo 'fixtureSchema=3'; echo 'fixtureSeed=18022026'
            echo "iterations=$ITERATIONS"; echo 'warmups=AndroidX framework-managed; no separately configured warm-up iterations'; echo 'retries=0'; echo 'exclusions=No hosted-runner samples excluded'
            echo "device=$DEVICE_LABEL"; echo 'compilationModes=None,Partial(BaselineProfile Require)'; echo 'evidence=Observed on managed emulator only'; echo 'exactTs18=Requires device validation'
          } > startup-benchmark/build/benchmark-context.txt
      - name: Validate generated profile output
        if: inputs.suite == 'baseline-profile'
        run: |
          mapfile -t profiles < <(find startup-benchmark/build/outputs -type f \( -name '*baseline-prof.txt' -o -name '*startup-prof.txt' \) | sort)
          ((${#profiles[@]} >= 2)) || { find startup-benchmark/build/outputs -type f -print; exit 1; }
          bash ./scripts/check-startup-performance-contracts.sh "${profiles[@]}"
      - name: Summarise macrobenchmark metrics
        if: inputs.suite == 'macrobenchmark'
        run: |
          python3 scripts/summarize-startup-benchmarks.py --input-root startup-benchmark/build/outputs --context startup-benchmark/build/benchmark-context.txt --output startup-benchmark/build/reports/startup-performance/summary.md --require-results
          cat startup-benchmark/build/reports/startup-performance/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startup-benchmark-${{ inputs.distribution }}-${{ inputs.suite }}-${{ inputs.fixture_song_count }}-${{ github.run_number }}
          path: |
            startup-benchmark/build/outputs/**
            startup-benchmark/build/reports/**
            startup-benchmark/build/benchmark-context.txt
            app/src/main/baseline-prof.txt
            app/src/main/generated/baselineProfiles/startup-prof.txt
          if-no-files-found: error
          retention-days: 14
      - name: Write run context summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PACKAGE: ${{ steps.task.outputs.package }}
          DEVICE: ${{ steps.task.outputs.device }}
        run: |
          {
            echo '## Startup benchmark run'; echo; echo "- Result: \`$JOB_STATUS\`"; echo "- Distribution: \`${{ inputs.distribution }}\`"; echo "- Package: \`$PACKAGE\`"
            echo "- Suite: \`${{ inputs.suite }}\`"; echo "- Fixture songs: \`${{ inputs.fixture_song_count }}\`"; echo "- Iterations: \`${{ inputs.iterations }}\`"; echo "- Environment: $DEVICE"
            echo '- Exact TS18 latency/runtime behaviour: Requires device validation.'
          } >> "$GITHUB_STEP_SUMMARY"
