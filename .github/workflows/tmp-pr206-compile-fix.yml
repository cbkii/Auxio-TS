name: PR206 compile fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/restore-v607-library-loading'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-v607-library-loading
          fetch-depth: 0

      - name: Move generated playlist builder to implementation companion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('musikr/src/main/java/org/oxycblt/musikr/model/LibraryFactory.kt')
          text = path.read_text(encoding='utf-8')
          block = '''        internal fun generatedPlaylists(songs: Collection<Song>): Set<PlaylistImpl> {
            val definitions =
                GeneratedPlaylistCompiler.compile(
                    songs.map { song ->
                        GeneratedPlaylistCompiler.Entry(
                            value = song,
                            stableKey = song.uid.toString(),
                            addedMs = song.addedMs,
                            year = song.album.dates?.min?.year,
                            albumSort = song.album.name.sortKey(),
                            disc = song.disc?.number ?: 0,
                            track = song.track ?: 0,
                            titleSort = song.name.sort ?: song.name.raw,
                        )
                    }
                )
            return definitions.mapTo(mutableSetOf()) { definition ->
                PlaylistImpl(
                    GeneratedPlaylistCore(
                        id = definition.id,
                        displayName = definition.name,
                        songs = definition.values,
                    )
                )
            }
        }

'''
          if text.count(block) != 1:
              raise SystemExit(f'Expected one generated playlist builder, found {text.count(block)}')
          text = text.replace(block, '', 1)
          marker = '    companion object {\n        fun Name.sortKey()'
          replacement = '    companion object {\n' + block + '        fun Name.sortKey()'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one implementation companion marker, found {text.count(marker)}')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/pr206-compile-fix-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musikr/src/main/java/org/oxycblt/musikr/model/LibraryFactory.kt .github/pr206-compile-fix-trigger.txt
          git diff --cached --check
          git commit -m "fix: scope generated playlist builder correctly"
          git push origin HEAD:fix/restore-v607-library-loading
