name: PR 203 Spotless Export

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/pr203-format-export.yml"
      - "app/**"
      - "musikr/**"
      - "build.gradle"
      - "gradle/**"

permissions:
  contents: read

concurrency:
  group: pr203-spotless-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Export exact Kotlin formatting changes
        shell: bash
        run: |
          set -u
          mkdir -p "${RUNNER_TEMP}/spotless-export"
          set +e
          bash ./scripts/ci-gradle.sh spotlessKotlinApply > "${RUNNER_TEMP}/spotless-export/spotless.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/spotless-export/spotless.log"
          printf '%s\n' "${status}" > "${RUNNER_TEMP}/spotless-export/status.txt"
          git diff --binary -- . ':(exclude)local.properties' > "${RUNNER_TEMP}/spotless-export/spotless.patch"
          git diff --name-only -- . ':(exclude)local.properties' > "${RUNNER_TEMP}/spotless-export/files.txt"
          if [[ ! -s "${RUNNER_TEMP}/spotless-export/spotless.patch" ]]; then
            printf 'No Kotlin formatting changes were produced.\n' > "${RUNNER_TEMP}/spotless-export/clean.txt"
          fi

      - name: Upload Spotless export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr203-spotless-export
          path: ${{ runner.temp }}/spotless-export/**
          if-no-files-found: error
          retention-days: 1
