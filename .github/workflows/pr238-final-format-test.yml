name: PR 238 final format and focused tests

# Temporary self-cleaning workflow; remove after successful formatting and focused tests.
on:
  pull_request:
    branches:
      - dev
    types:
      - synchronize
    paths:
      - .github/workflows/pr238-final-format-test.yml

permissions:
  contents: write

concurrency:
  group: pr238-final-format-test
  cancel-in-progress: false

jobs:
  finalise:
    if: github.event.pull_request.head.ref == 'fix/mediastore-source-authority-stale-rows'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/mediastore-source-authority-stale-rows
          fetch-depth: 0

      - name: Prepare repository dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile jvm-tests

      - name: Apply canonical Kotlin formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessKotlinApply

      - name: Run focused source-authority regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh --continue \
            :app:testTopwayTwMediaDebugUnitTest \
            :musikr:testDebugUnitTest

      - name: Remove temporary workflow and validate
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/pr238-final-format-test.yml
          git diff --check
          test ! -e .github/workflows/pr238-final-format-test.yml

      - name: Commit formatter output and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'STOP: expected formatter/cleanup diff is empty' >&2; exit 1; }
          git commit -m "style: finalise MediaStore hardening validation"
          git push origin HEAD:fix/mediastore-source-authority-stale-rows
