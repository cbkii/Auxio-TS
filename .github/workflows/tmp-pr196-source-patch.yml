name: Temporary PR196 source patch

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: tmp-pr196-source-patch
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
      - name: Apply source dialog patch
        shell: bash
        run: python3 scripts/tmp-pr196-source-patch.py
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties for Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Format patched source
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/org/oxycblt/auxio/music/locations/LocationsDialog.kt
          git commit -m 'feat: apply source-dialog permission and root recovery'
          git push origin HEAD:fix/first-launch-source-recovery
