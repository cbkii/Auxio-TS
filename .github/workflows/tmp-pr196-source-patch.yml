name: Temporary PR196 source patch

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: tmp-pr196-source-patch
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
      - name: Apply source dialog patch
        shell: bash
        run: python3 scripts/tmp-pr196-source-patch.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/org/oxycblt/auxio/music/locations/LocationsDialog.kt
          git commit -m 'feat: apply source-dialog permission and root recovery'
          git push origin HEAD:fix/first-launch-source-recovery
