name: PR 184 One-Shot Final Hardening

# Apply, format and commit the audited patch; canonical workflows provide full evidence.
on:
  push:
    branches:
      - cx/startup-profiles-benchmarks
    paths:
      - ".github/workflows/pr184-final-hardening.yml"

permissions:
  contents: write

concurrency:
  group: pr184-one-shot-final-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/startup-profiles-benchmarks
          fetch-depth: 4
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not set" >&2
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: false

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Recover and apply the audited hardening patch
        shell: bash
        run: |
          source_workflow="${RUNNER_TEMP}/pr184-original-hardening.yml"
          patch_script="${RUNNER_TEMP}/pr184-final-hardening.py"
          git show HEAD^^^:.github/workflows/pr184-final-hardening.yml > "${source_workflow}"
          python3 - "${source_workflow}" "${patch_script}" <<'EXTRACT'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          start = next(index for index, line in enumerate(source) if line.strip() == "python3 - <<'PY'")
          end = next(index for index in range(start + 1, len(source)) if source[index].strip() == "PY")
          indent = " " * 10
          payload = [line[len(indent) :] if line.startswith(indent) else line for line in source[start + 1 : end]]
          Path(sys.argv[2]).write_text("\n".join(payload) + "\n", encoding="utf-8")
          EXTRACT
          python3 -m py_compile "${patch_script}"
          python3 "${patch_script}"

      - name: Apply repository formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git rm -- .github/workflows/pr184-final-hardening.yml
          git diff --check
          bash -n scripts/check-startup-performance-contracts.sh
          python3 scripts/summarize-startup-benchmarks.py --self-test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/android.yml \
            .github/workflows/lint.yml \
            app/src/benchmark/java/org/oxycblt/auxio/benchmark/BenchmarkFixtureReceiver.kt \
            app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt \
            app/src/main/java/org/oxycblt/auxio/music/MusicSettings.kt \
            app/src/main/java/org/oxycblt/auxio/music/StartupLibraryPolicy.kt \
            app/src/main/java/org/oxycblt/auxio/util/PerfTimer.kt \
            app/src/test/java/org/oxycblt/auxio/music/MusicSettingsIndexingTriggerTest.kt \
            app/src/test/java/org/oxycblt/auxio/music/StartupLibraryPolicyTest.kt \
            docs/architecture/STARTUP_PROFILES_BENCHMARKS.md \
            docs/architecture/database-first-library.md \
            scripts/check-startup-performance-contracts.sh
          git diff --cached --check
          git commit -m "fix: finalise deferred startup hydration and validation"
          git push origin HEAD:cx/startup-profiles-benchmarks
