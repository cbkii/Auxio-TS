name: PR 184 One-Shot Final Hardening

on:
  push:
    branches:
      - cx/startup-profiles-benchmarks
    paths:
      - ".github/workflows/pr184-final-hardening.yml"

permissions:
  contents: write

concurrency:
  group: pr184-one-shot-final-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/startup-profiles-benchmarks
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not set" >&2
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: false

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply focused final hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(text: str, old: str, new: str, path: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}: {old[:100]!r}")
              return text.replace(old, new, 1)

          # Defer complete-graph cache hydration without misclassifying a prior usable cache.
          path = "app/src/main/java/org/oxycblt/auxio/music/StartupLibraryPolicy.kt"
          text = read(path)
          text = replace_once(
              text,
              """        priorState: LibraryState,
                  lastScanFailed: () -> Boolean,
                  isTopwayCompat: Boolean,""",
              """        priorState: LibraryState,
                  deferCachedLoad: Boolean = false,
                  lastScanFailed: () -> Boolean,
                  isTopwayCompat: Boolean,""",
              path,
          )
          text = replace_once(
              text,
              """        var decision =
                      if (
                          StartupLibraryPolicy.shouldAttemptCachedLoad(""",
              """        var decision =
                      if (deferCachedLoad && !hasInMemoryLibrary) {
                          when (priorState) {
                              LibraryState.USABLE,
                              LibraryState.EMPTY ->
                                  StartupLibraryPolicy.Decision(
                                      libraryState = priorState,
                                      requestScan = false,
                                      reason = "cached-library-hydration-deferred",
                                  )
                              LibraryState.NEVER,
                              LibraryState.RECOVERY ->
                                  StartupLibraryPolicy.onNoCachedRevision(priorState, lastScanFailed())
                          }
                      } else if (
                          StartupLibraryPolicy.shouldAttemptCachedLoad(""",
              path,
          )
          write(path, text)

          path = "app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt"
          text = read(path)
          text = replace_once(
              text,
              """                    priorState = musicSettings.libraryState,
                          lastScanFailed = { musicSettings.lastScanFailed },""",
              """                    priorState = musicSettings.libraryState,
                          deferCachedLoad = true,
                          lastScanFailed = { musicSettings.lastScanFailed },""",
              path,
          )
          text = replace_once(text, "        startCompatibilityHydration()", "        startCompatibilityHydration(worker)", path)
          start = text.index("    private fun startCompatibilityHydration() {")
          end = text.index("    private suspend fun loadCachedLibrary(): MutableLibrary {", start)
          replacement = '''    private fun startCompatibilityHydration(worker: IndexingWorker) {
              compatibilityHydrationJob?.cancel()
              val startingDeviceGeneration = deviceLibraryGeneration.get()
              val startingRevision = musicSettings.revision
              val priorState = musicSettings.libraryState
              val sourceConfigured =
                  StartupLibraryPolicy.isMusicSourceConfigured(
                      musicSettings.locationMode,
                      musicSettings.configuredSourceCount,
                  )
              compatibilityHydrationJob =
                  compatibilityHydrationScope.launch {
                      try {
                          val cached = loadCachedLibrary()
                          val songCount = cached.songs.size
                          val decision =
                              StartupLibraryPolicy.onCachedLoadSucceeded(
                                  priorState,
                                  songCount,
                                  musicSettings.lastScanFailed,
                              )
                          withContext(Dispatchers.Main) {
                              val publishLibrary =
                                  songCount > 0 || decision.libraryState == LibraryState.EMPTY
                              val accepted =
                                  synchronized(this@MusicRepositoryImpl) {
                                      val superseded =
                                          deviceLibraryGeneration.get() != startingDeviceGeneration ||
                                              musicSettings.revision != startingRevision
                                      if (superseded) {
                                          false
                                      } else {
                                          if (publishLibrary) library = cached
                                          true
                                      }
                                  }
                              if (!accepted) {
                                  L.d("Skipping compatibility hydration superseded by a newer scan")
                                  return@withContext
                              }
                              musicSettings.libraryState = decision.libraryState
                              if (publishLibrary) {
                                  dispatchLibraryChange(device = true, user = true)
                              }
                              emitStartupLibraryStatus(
                                  StartupLibraryPolicy.startupReadinessAfterDecision(
                                      decision,
                                      sourceConfigured,
                                      songCount,
                                  )
                              )
                              if (songCount > 0) {
                                  emitStartupReadinessState(StartupReadinessState.FullLibraryReady)
                              }
                              requestCompatibilityRecoveryIfNeeded(
                                  worker,
                                  priorState,
                                  decision,
                                  sourceConfigured,
                              )
                          }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          L.w(e, "Compatibility cached-library hydration failed")
                          val decision =
                              StartupLibraryPolicy.onCachedLoadFailed(
                                  priorState,
                                  musicSettings.lastScanFailed,
                              )
                          withContext(Dispatchers.Main) {
                              val superseded =
                                  synchronized(this@MusicRepositoryImpl) {
                                      deviceLibraryGeneration.get() != startingDeviceGeneration ||
                                          musicSettings.revision != startingRevision
                                  }
                              if (superseded) {
                                  L.d("Skipping compatibility recovery superseded by a newer scan")
                                  return@withContext
                              }
                              musicSettings.libraryState = decision.libraryState
                              emitStartupLibraryStatus(
                                  StartupLibraryPolicy.startupReadinessAfterDecision(
                                      decision,
                                      sourceConfigured,
                                      cachedSongCount = null,
                                  )
                              )
                              requestCompatibilityRecoveryIfNeeded(
                                  worker,
                                  priorState,
                                  decision,
                                  sourceConfigured,
                              )
                          }
                      }
                  }
          }

          private fun requestCompatibilityRecoveryIfNeeded(
              worker: IndexingWorker,
              priorState: LibraryState,
              decision: StartupLibraryPolicy.Decision,
              sourceConfigured: Boolean,
          ) {
              if (
                  priorState == LibraryState.USABLE &&
                      decision.requestScan &&
                      sourceConfigured &&
                      !BuildConfig.TOPWAY_COMPAT_FLAVOR
              ) {
                  worker.requestIndex(MusicScanRequestMode.REFRESH_WITH_CACHE)
              }
          }

'''
          text = text[:start] + replacement + text[end:]
          write(path, text)

          # Restore persisted user opt-in for bounded performance capture after process restart.
          path = "app/src/main/java/org/oxycblt/auxio/util/PerfTimer.kt"
          text = read(path)
          text = replace_once(text, "import android.os.SystemClock\n", "import android.os.SystemClock\nimport androidx.annotation.VisibleForTesting\n", path)
          text = replace_once(
              text,
              """    fun isEnabled(): Boolean = BuildConfig.DEBUG || isBenchmarkBuild() || explicitlyEnabled.get()

              private fun isBenchmarkBuild(): Boolean""",
              """    fun isEnabled(): Boolean = BuildConfig.DEBUG || isBenchmarkBuild() || explicitlyEnabled.get()

              @VisibleForTesting
              internal fun isExplicitlyConfigured(): Boolean = explicitlyEnabled.get()

              private fun isBenchmarkBuild(): Boolean""",
              path,
          )
          write(path, text)

          path = "app/src/main/java/org/oxycblt/auxio/music/MusicSettings.kt"
          text = read(path)
          text = replace_once(
              text,
              """class MusicSettingsImpl @Inject constructor(@ApplicationContext private val context: Context) :
              Settings.Impl<MusicSettings.Listener>(context), MusicSettings {

              override var revision""",
              """class MusicSettingsImpl @Inject constructor(@ApplicationContext private val context: Context) :
              Settings.Impl<MusicSettings.Listener>(context), MusicSettings {

              init {
                  PerfTimer.configure(performanceCaptureEnabled)
              }

              override var revision""",
              path,
          )
          write(path, text)

          path = "app/src/test/java/org/oxycblt/auxio/music/MusicSettingsIndexingTriggerTest.kt"
          text = read(path)
          text = replace_once(text, "import org.junit.Assert.assertEquals\n", "import org.junit.After\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\n", path)
          text = replace_once(text, "import org.oxycblt.auxio.R\n", "import org.oxycblt.auxio.R\nimport org.oxycblt.auxio.util.PerfTimer\n", path)
          text = replace_once(
              text,
              """    fun setUp() {
                  context = ApplicationProvider.getApplicationContext()
                  settings = MusicSettingsImpl(context)""",
              """    fun setUp() {
                  context = ApplicationProvider.getApplicationContext()
                  PreferenceManager.getDefaultSharedPreferences(context).edit().clear().commit()
                  PerfTimer.configure(false)
                  settings = MusicSettingsImpl(context)""",
              path,
          )
          text = replace_once(
              text,
              """    private fun dispatch(key: String) {""",
              """    @After
              fun tearDown() {
                  settings.unregisterListener(listener)
                  PreferenceManager.getDefaultSharedPreferences(context).edit().clear().commit()
                  PerfTimer.configure(false)
              }

              private fun dispatch(key: String) {""",
              path,
          )
          text = replace_once(
              text,
              """    @Test
              fun `scan-affecting settings still request a reindex`() {""",
              """    @Test
              fun `performance capture preference is restored when settings are recreated`() {
                  val preferences = PreferenceManager.getDefaultSharedPreferences(context)
                  val key = context.getString(R.string.set_key_performance_capture)
                  preferences.edit().putBoolean(key, true).commit()
                  PerfTimer.configure(false)
                  assertFalse(PerfTimer.isExplicitlyConfigured())

                  MusicSettingsImpl(context)

                  assertTrue(PerfTimer.isExplicitlyConfigured())

                  preferences.edit().putBoolean(key, false).commit()
                  PerfTimer.configure(true)
                  MusicSettingsImpl(context)
                  assertFalse(PerfTimer.isExplicitlyConfigured())
              }

              @Test
              fun `scan-affecting settings still request a reindex`() {""",
              path,
          )
          write(path, text)

          # Seed deterministic startup settings as well as Room fixture rows.
          path = "app/src/benchmark/java/org/oxycblt/auxio/benchmark/BenchmarkFixtureReceiver.kt"
          text = read(path)
          text = replace_once(text, "import androidx.room.withTransaction\n", "import androidx.preference.PreferenceManager\nimport androidx.room.withTransaction\n", path)
          text = replace_once(text, "import org.oxycblt.auxio.headunit.ts18.FastStartDirectFolderBrowser\n", "import org.oxycblt.auxio.IntegerTable\nimport org.oxycblt.auxio.R\nimport org.oxycblt.auxio.headunit.ts18.FastStartDirectFolderBrowser\nimport org.oxycblt.auxio.music.LibraryState\n", path)
          text = replace_once(
              text,
              """        seedPlaybackQueue(context, songCount, playableFiles)
              context
                  .getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)""",
              """        seedPlaybackQueue(context, songCount, playableFiles)
              seedBenchmarkStartupPreferences(context)
              context
                  .getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)""",
              path,
          )
          text = replace_once(
              text,
              """    private fun clearFixtureTables(database: SQLiteDatabase) {""",
              """    private fun seedBenchmarkStartupPreferences(context: Context) {
                  check(
                      PreferenceManager.getDefaultSharedPreferences(context)
                          .edit()
                          .putString(
                              context.getString(R.string.set_key_library_revision),
                              FIXTURE_LIBRARY_REVISION,
                          )
                          .putString(
                              context.getString(R.string.set_key_library_state),
                              LibraryState.USABLE.name,
                          )
                          .putBoolean(
                              context.getString(R.string.set_key_library_last_scan_failed),
                              false,
                          )
                          .putInt(
                              context.getString(R.string.set_key_locations_mode),
                              IntegerTable.LOCATION_MODE_DIRECT_FS,
                          )
                          .putString(
                              context.getString(R.string.set_key_music_locations),
                              "file:///storage/usbdisk0;file:///storage/usbdisk1",
                          )
                          .commit()
                  ) {
                      "Unable to persist deterministic benchmark startup settings"
                  }
              }

              private fun clearFixtureTables(database: SQLiteDatabase) {""",
              path,
          )
          text = replace_once(
              text,
              """        private const val FIXTURE_GENERATION = 1L
              private const val FIXTURE_EPOCH_MS""",
              """        private const val FIXTURE_GENERATION = 1L
              private const val FIXTURE_LIBRARY_REVISION =
                  "00000000-0000-0000-0000-000000000002"
              private const val FIXTURE_EPOCH_MS""",
              path,
          )
          write(path, text)

          # Extend runner orchestration tests for the deferred compatibility lane.
          path = "app/src/test/java/org/oxycblt/auxio/music/StartupLibraryPolicyTest.kt"
          text = read(path)
          text = replace_once(
              text,
              """    private class StartupHarness(""",
              """    @Test
              fun `deferred prior usable cache preserves state without synchronous graph load`() =
                  runBlocking {
                      val harness =
                          StartupHarness(
                              priorState = LibraryState.USABLE,
                              deferCachedLoad = true,
                          )

                      val decision = harness.run(cachedSongCount = 42)

                      assertEquals(LibraryState.USABLE, decision.libraryState)
                      assertEquals("cached-library-hydration-deferred", decision.reason)
                      assertEquals(0, harness.cachedLoadAttempts)
                      assertEquals(emptyList<Boolean>(), harness.scanRequests)
                      assertEquals(StartupLibraryStatus.Usable, harness.startupState)
                  }

              @Test
              fun `deferred prior empty cache remains intentionally empty without graph load`() =
                  runBlocking {
                      val harness =
                          StartupHarness(
                              priorState = LibraryState.EMPTY,
                              deferCachedLoad = true,
                          )

                      val decision = harness.run()

                      assertEquals(LibraryState.EMPTY, decision.libraryState)
                      assertEquals(0, harness.cachedLoadAttempts)
                      assertEquals(emptyList<Boolean>(), harness.scanRequests)
                      assertEquals(StartupLibraryStatus.Empty, harness.startupState)
                  }

              @Test
              fun `deferred first launch still requests its initial standard scan`() = runBlocking {
                  val harness =
                      StartupHarness(
                          priorState = LibraryState.NEVER,
                          revisionKnown = false,
                          deferCachedLoad = true,
                      )

                  val decision = harness.run()

                  assertEquals(LibraryState.NEVER, decision.libraryState)
                  assertEquals(0, harness.cachedLoadAttempts)
                  assertEquals(listOf(MusicScanRequestMode.REFRESH_WITH_CACHE), harness.scanRequests)
              }

              private class StartupHarness(""",
              path,
          )
          text = replace_once(
              text,
              """        private val priorState: LibraryState,
                  private val revisionKnown: Boolean = true,""",
              """        private val priorState: LibraryState,
                  private val revisionKnown: Boolean = true,
                  private val deferCachedLoad: Boolean = false,""",
              path,
          )
          text = replace_once(
              text,
              """                priorState = priorState,
                      lastScanFailed = { lastScanFailed },""",
              """                priorState = priorState,
                      deferCachedLoad = deferCachedLoad,
                      lastScanFailed = { lastScanFailed },""",
              path,
          )
          write(path, text)

          # Make canonical workflows cover stacked cx PRs and pin mutable action tags.
          for path in (".github/workflows/android.yml", ".github/workflows/lint.yml"):
              text = read(path)
              text = text.replace("uses: actions/setup-java@v5", "uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95")
              text = text.replace("uses: gradle/actions/setup-gradle@v5", "uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c")
              push_anchor = '      - "musikr/**"\n'
              if '      - "startup-benchmark/**"\n' not in text:
                  text = replace_once(text, push_anchor, push_anchor + '      - "startup-benchmark/**"\n', path)
              # Add to the pull-request path block as well if only one occurrence was added.
              if text.count('      - "startup-benchmark/**"\n') == 1:
                  second = text.find(push_anchor, text.find(push_anchor) + len(push_anchor))
                  if second < 0:
                      raise SystemExit(f"{path}: second pull-request path anchor not found")
                  text = text[: second + len(push_anchor)] + '      - "startup-benchmark/**"\n' + text[second + len(push_anchor) :]
              branch_anchor = "  pull_request:\n    branches:\n      - dev\n"
              if '      - "cx/**"\n' not in text:
                  text = replace_once(text, branch_anchor, branch_anchor + '      - "cx/**"\n', path)
              write(path, text)

          # Refresh architecture status wording.
          path = "docs/architecture/STARTUP_PROFILES_BENCHMARKS.md"
          text = read(path)
          text = replace_once(
              text,
              """1. launcher start to Fast Start;
              2. process-death relaunch through the same immediate startup lane.""",
              """1. launcher start through deterministic saved-session primitive queue restore to first audio;
              2. process-death relaunch through the same bounded immediate startup lane.""",
              path,
          )
          text = replace_once(
              text,
              "- benchmark/profile instrumentation compilation;",
              "- benchmark/profile instrumentation compilation for all three maintained flavours;",
              path,
          )
          write(path, text)

          path = "docs/architecture/database-first-library.md"
          text = read(path)
          text = replace_once(
              text,
              """Cold boot, process death, launcher restart, Bluetooth/media-button launch, real FAT timestamp behaviour, USB removal/reinsertion, two-volume mount-order changes and ACC sleep/wake remain exact-device tests on `s9863a1h10_Natv`.""",
              """Cold boot, saved-session first audio, process death, launcher restart, Bluetooth/media-button launch, real FAT timestamp behaviour, USB removal/reinsertion, two-volume mount-order changes, DoFun metadata/key routing, bounded CPU/memory/I/O/thermal behaviour and ACC sleep/wake remain exact-device tests on `s9863a1h10_Natv`.""",
              path,
          )
          text = replace_once(
              text,
              """3. **Startup profiles and benchmarks — stacked next PR:** named Baseline/Startup profiles, benchmark fixtures, regression gates and exact-device TS18 validation evidence.""",
              """3. **Startup profiles and benchmarks — PR #184:** named Baseline/Startup profiles, deterministic benchmark fixtures, structural/profile artefact gates and a bounded exact-device TS18 validation plan.""",
              path,
          )
          write(path, text)

          # Lock the new contracts into the static gate.
          path = "scripts/check-startup-performance-contracts.sh"
          text = read(path)
          text = replace_once(
              text,
              """require_contains "$fixture_receiver" 'seedPlaybackQueue(context, songCount, playableFiles)'""",
              """require_contains "$fixture_receiver" 'seedPlaybackQueue(context, songCount, playableFiles)'
          require_contains "$fixture_receiver" 'seedBenchmarkStartupPreferences(context)'
          require_contains "$fixture_receiver" 'FIXTURE_LIBRARY_REVISION'""",
              path,
          )
          text = replace_once(
              text,
              """require_contains "$perf_timer" 'BuildConfig.BUILD_TYPE == "benchmark"'""",
              """require_contains "$perf_timer" 'BuildConfig.BUILD_TYPE == "benchmark"'
          require_contains app/src/main/java/org/oxycblt/auxio/music/StartupLibraryPolicy.kt 'cached-library-hydration-deferred'
          require_contains app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt 'deferCachedLoad = true'
          require_contains app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt 'startCompatibilityHydration(worker)'
          require_contains app/src/main/java/org/oxycblt/auxio/music/MusicSettings.kt 'PerfTimer.configure(performanceCaptureEnabled)'
          require_contains .github/workflows/android.yml '      - "cx/**"'
          require_contains .github/workflows/lint.yml '      - "cx/**"'
          require_contains .github/workflows/android.yml '      - "startup-benchmark/**"'
          require_contains .github/workflows/lint.yml '      - "startup-benchmark/**"'""",
              path,
          )
          write(path, text)
          PY

      - name: Apply repository formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply

      - name: Validate focused hardening
        shell: bash
        run: |
          bash ./scripts/check-startup-performance-contracts.sh
          bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest :musikr:testDebugUnitTest
          bash ./scripts/ci-gradle.sh :app:lintStandardDebug
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml
          status=0
          while IFS= read -r -d '' script; do
            bash -n "${script}" || status=1
          done < <(find scripts -type f -name '*.sh' -print0)
          exit "${status}"

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm -- .github/workflows/pr184-final-hardening.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/android.yml \
            .github/workflows/lint.yml \
            app/src/benchmark/java/org/oxycblt/auxio/benchmark/BenchmarkFixtureReceiver.kt \
            app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt \
            app/src/main/java/org/oxycblt/auxio/music/MusicSettings.kt \
            app/src/main/java/org/oxycblt/auxio/music/StartupLibraryPolicy.kt \
            app/src/main/java/org/oxycblt/auxio/util/PerfTimer.kt \
            app/src/test/java/org/oxycblt/auxio/music/MusicSettingsIndexingTriggerTest.kt \
            app/src/test/java/org/oxycblt/auxio/music/StartupLibraryPolicyTest.kt \
            docs/architecture/STARTUP_PROFILES_BENCHMARKS.md \
            docs/architecture/database-first-library.md \
            scripts/check-startup-performance-contracts.sh
          git diff --cached --check
          git commit -m "fix: finalise deferred startup hydration and validation"
          git push origin HEAD:cx/startup-profiles-benchmarks
