name: Temporary PR167 direct finaliser

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/tmp-pr167-direct-finaliser.yml

permissions:
  contents: write

concurrency:
  group: tmp-pr167-direct-finaliser
  cancel-in-progress: false

jobs:
  finalise:
    if: github.event.head_commit.message != 'chore: remove temporary PR167 direct finaliser'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout PR branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix-startup-routing-11126370068088722538
          fetch-depth: 0
          persist-credentials: false

      - name: Merge latest dev
        shell: bash
        run: |
          git fetch origin dev
          git merge --no-edit origin/dev

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-cleanup: always

      - name: Apply final integration patch
        shell: bash
        run: |
          python3 <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"STOP: {path}: expected one literal match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")


          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"STOP: {path}: expected one regex match, found {count}")
              p.write_text(updated, encoding="utf-8")


          coordinator_path = Path(
              "app/src/main/java/org/oxycblt/auxio/headunit/StartupPanelCoordinator.kt"
          )
          coordinator_path.write_text(
              """/*
           * Copyright (c) 2026 Auxio Project
           * StartupPanelCoordinator.kt is part of Auxio.
           *
           * This program is free software: you can redistribute it and/or modify
           * it under the terms of the GNU General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           *
           * This program is distributed in the hope that it will be useful,
           * but WITHOUT ANY WARRANTY; without even the implied warranty of
           * MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the
           * GNU General Public License for more details.
           *
           * You should have received a copy of the GNU General Public License
           * along with this program. If not, see <https://www.gnu.org/licenses/>.
           */

          package org.oxycblt.auxio.headunit

          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import dagger.hilt.android.lifecycle.HiltViewModel
          import java.util.UUID
          import javax.inject.Inject
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.combine
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.flow.update
          import org.oxycblt.auxio.music.StartupReadinessState
          import org.oxycblt.auxio.playback.OpenPanel
          import org.oxycblt.auxio.playback.PlaybackSettings
          import org.oxycblt.auxio.playback.state.RestoreOutcome
          import org.oxycblt.musikr.Song
          import timber.log.Timber as L

          /**
           * Owns startup-only panel routing independently from autoplay and playback ownership.
           *
           * A route remains pending through transient library, restore, and sheet states. Terminal
           * policy outcomes cancel it, while the UI consumes it only after reaching the requested
           * final panel state.
           */
          @HiltViewModel
          class StartupPanelCoordinator
          @Inject
          constructor(private val playbackSettings: PlaybackSettings) : ViewModel() {
              data class RouteRequest(
                  val token: UUID,
                  val destination: OpenPanel,
                  val priority: Priority,
                  val description: String,
              )

              enum class Priority {
                  GENERIC_STARTUP,
                  EXPLICIT_INTENT,
              }

              sealed interface RouteEvaluation {
                  data object Idle : RouteEvaluation

                  data class Wait(val request: RouteRequest, val reason: String) : RouteEvaluation

                  data class Cancel(val request: RouteRequest, val reason: String) : RouteEvaluation

                  data class Render(val request: RouteRequest) : RouteEvaluation
              }

              private data class CoordinatorState(
                  val hasSong: Boolean,
                  val outcome: RestoreOutcome,
                  val readiness: StartupReadinessState,
              )

              private val activeRequest = MutableStateFlow<RouteRequest?>(null)
              private val coordinatorState =
                  MutableStateFlow(
                      CoordinatorState(
                          hasSong = false,
                          outcome = RestoreOutcome.NOT_REQUESTED,
                          readiness = StartupReadinessState.CheckingCachedLibrary,
                      )
                  )

              val routeEvaluation: StateFlow<RouteEvaluation> =
                  combine(activeRequest, coordinatorState) { request, state ->
                          evaluate(request, state.hasSong, state.outcome, state.readiness)
                      }
                      .stateIn(viewModelScope, SharingStarted.Eagerly, RouteEvaluation.Idle)

              fun updateState(
                  song: Song?,
                  outcome: RestoreOutcome,
                  readiness: StartupReadinessState,
              ) {
                  coordinatorState.value = CoordinatorState(song != null, outcome, readiness)
              }

              /** Explicit launcher/deep-link navigation supersedes a generic startup request. */
              fun requestExplicitRoute(destination: OpenPanel, description: String) {
                  val request =
                      RouteRequest(
                          UUID.randomUUID(),
                          destination,
                          Priority.EXPLICIT_INTENT,
                          description,
                      )
                  L.d("Requesting explicit route: $request")
                  activeRequest.value = request
              }

              /** Request the user-configured generic cold-launch destination. */
              fun requestGenericStartupRoute() {
                  if (!playbackSettings.launchToPanel) {
                      L.d("Generic startup route skipped: launchToPanel disabled")
                      return
                  }
                  activeRequest.update { current ->
                      if (current?.priority == Priority.EXPLICIT_INTENT) {
                          L.d("Generic startup route suppressed by explicit route: $current")
                          current
                      } else {
                          RouteRequest(
                                  UUID.randomUUID(),
                                  genericDestination(),
                                  Priority.GENERIC_STARTUP,
                                  "Generic App Launch",
                              )
                              .also { L.d("Requesting generic startup route: $it") }
                      }
                  }
              }

              /** Consume only the still-matching route after its final panel state is rendered. */
              fun consumeRoute(token: UUID) {
                  activeRequest.update { current ->
                      if (current?.token == token) {
                          L.d("Route consumed: ${current.description}")
                          null
                      } else {
                          current
                      }
                  }
              }

              /** Cancel only the still-matching request after a terminal policy result. */
              fun cancelRoute(token: UUID, reason: String) {
                  activeRequest.update { current ->
                      if (current?.token == token) {
                          L.d("Route cancelled [reason=$reason]: ${current.description}")
                          null
                      } else {
                          current
                      }
                  }
              }

              /** Cancel startup routing after deliberate user navigation. */
              fun cancelRouting(reason: String = "manual-navigation") {
                  activeRequest.update { current ->
                      if (current != null) {
                          L.d("Active route cancelled [reason=$reason]: ${current.description}")
                      }
                      null
                  }
              }

              companion object {
                  internal fun genericDestination(): OpenPanel = OpenPanel.PLAYBACK

                  internal fun evaluate(
                      request: RouteRequest?,
                      hasSong: Boolean,
                      outcome: RestoreOutcome,
                      readiness: StartupReadinessState,
                  ): RouteEvaluation {
                      request ?: return RouteEvaluation.Idle

                      if (
                          readiness == StartupReadinessState.NeedsMusicSource ||
                              readiness == StartupReadinessState.EmptyLibrary ||
                              readiness == StartupReadinessState.CachedLibraryUnavailable
                      ) {
                          return RouteEvaluation.Cancel(request, "library-terminal-$readiness")
                      }

                      if (request.priority == Priority.EXPLICIT_INTENT) {
                          if (hasSong) return RouteEvaluation.Render(request)
                          return when (outcome) {
                              RestoreOutcome.NO_SAVED_SESSION,
                              RestoreOutcome.FAILED,
                              RestoreOutcome.CANCELLED ->
                                  RouteEvaluation.Cancel(request, "explicit-terminal-$outcome")
                              else -> RouteEvaluation.Wait(request, "explicit-awaiting-song")
                          }
                      }

                      if (readiness == StartupReadinessState.CheckingCachedLibrary) {
                          return RouteEvaluation.Wait(request, "library-checking")
                      }

                      return when (outcome) {
                          RestoreOutcome.NOT_REQUESTED,
                          RestoreOutcome.WAITING_FOR_PLAYER,
                          RestoreOutcome.WAITING_FOR_LIBRARY ->
                              RouteEvaluation.Wait(request, "restore-transient-$outcome")
                          RestoreOutcome.NO_SAVED_SESSION,
                          RestoreOutcome.FAILED,
                          RestoreOutcome.CANCELLED ->
                              RouteEvaluation.Cancel(request, "restore-terminal-$outcome")
                          RestoreOutcome.RAW_FAST_RESUME_ACTIVE,
                          RestoreOutcome.RESTORED_EXISTING_SESSION,
                          RestoreOutcome.FALLBACK_QUEUE_CREATED ->
                              if (hasSong) {
                                  RouteEvaluation.Render(request)
                              } else {
                                  RouteEvaluation.Wait(request, "awaiting-normal-song")
                              }
                      }
                  }
              }
          }
          """.strip()
              + "\n",
              encoding="utf-8",
          )

          main_activity = "app/src/main/java/org/oxycblt/auxio/MainActivity.kt"
          replace_once(
              main_activity,
              """            HeadUnitEntryPoints.EntryDestination.QUEUE ->
                          startupPanelCoordinator.requestExplicitRoute(
                              org.oxycblt.auxio.playback.OpenPanel.QUEUE,
                              "Explicit Queue Intent",
                          )""",
              """            HeadUnitEntryPoints.EntryDestination.QUEUE ->
                          startupPanelCoordinator.requestExplicitRoute(
                              org.oxycblt.auxio.playback.OpenPanel.PLAYBACK_QUEUE,
                              "Explicit Queue Intent",
                          )""",
          )

          main_fragment = "app/src/main/java/org/oxycblt/auxio/MainFragment.kt"
          replace_once(
              main_fragment,
              "import android.view.LayoutInflater\n",
              "import android.view.LayoutInflater\nimport android.view.View\n",
          )
          replace_once(
              main_fragment,
              """    private var sheetRising: Boolean? = null
              private var lastStretchRatio = -1f
              @Inject lateinit var uiSettings: UISettings""",
              """    private var sheetRising: Boolean? = null
              private var lastStretchRatio = -1f
              private val panelRouteSheetCallback =
                  object : BackportBottomSheetBehavior.BottomSheetCallback() {
                      override fun onStateChanged(bottomSheet: View, newState: Int) {
                          if (newState == BackportBottomSheetBehavior.STATE_DRAGGING) {
                              startupPanelCoordinator.cancelRouting("user-sheet-drag")
                              return
                          }
                          if (newState != BackportBottomSheetBehavior.STATE_SETTLING) {
                              handleStartupRoute(startupPanelCoordinator.routeEvaluation.value)
                          }
                      }

                      override fun onSlide(bottomSheet: View, slideOffset: Float) = Unit
                  }
              @Inject lateinit var uiSettings: UISettings""",
          )
          replace_once(
              main_fragment,
              """        val queueSheetBehavior =
                  binding.queueSheet.coordinatorLayoutBehavior as QueueBottomSheetBehavior?
              queueSheetBehavior?.uiSettings = uiSettings

              elevationNormal =""",
              """        val queueSheetBehavior =
                  binding.queueSheet.coordinatorLayoutBehavior as QueueBottomSheetBehavior?
              queueSheetBehavior?.uiSettings = uiSettings
              playbackSheetBehavior.addBottomSheetCallback(panelRouteSheetCallback)
              queueSheetBehavior?.addBottomSheetCallback(panelRouteSheetCallback)

              elevationNormal =""",
          )
          replace_once(
              main_fragment,
              """            SheetBackPressedCallback(
                          playbackSheetBehavior = playbackSheetBehavior,
                          queueSheetBehavior = queueSheetBehavior,
                      )""",
              """            SheetBackPressedCallback(
                          playbackSheetBehavior = playbackSheetBehavior,
                          queueSheetBehavior = queueSheetBehavior,
                          onManualPanelNavigation = {
                              startupPanelCoordinator.cancelRouting("user-panel-back")
                          },
                      )""",
          )
          replace_once(
              main_fragment,
              "collectImmediately(startupPanelCoordinator.routeDecision, ::handleStartupRoute)",
              "collectImmediately(startupPanelCoordinator.routeEvaluation, ::handleStartupRoute)",
          )
          replace_once(
              main_fragment,
              """    override fun onDestroyBinding(binding: FragmentMainBinding) {
                  super.onDestroyBinding(binding)
                  speedDialBackCallback = null""",
              """    override fun onDestroyBinding(binding: FragmentMainBinding) {
                  val playbackSheetBehavior =
                      binding.playbackSheet.coordinatorLayoutBehavior as PlaybackBottomSheetBehavior
                  val queueSheetBehavior =
                      binding.queueSheet.coordinatorLayoutBehavior as QueueBottomSheetBehavior?
                  playbackSheetBehavior.removeBottomSheetCallback(panelRouteSheetCallback)
                  queueSheetBehavior?.removeBottomSheetCallback(panelRouteSheetCallback)
                  super.onDestroyBinding(binding)
                  speedDialBackCallback = null""",
          )
          replace_once(
              main_fragment,
              "startupPanelCoordinator.cancelRouting()\n        findNavController()",
              "startupPanelCoordinator.cancelRouting(\"explicit-outer-navigation\")\n        findNavController()",
          )
          replace_regex(
              main_fragment,
              r"""    private fun handleStartupRoute\(
                  request: org\.oxycblt\.auxio\.headunit\.StartupPanelCoordinator\.RouteRequest\?
              \) \{.*?
              \}

              private fun handlePanel""",
              """    private fun handleStartupRoute(
                  evaluation: org.oxycblt.auxio.headunit.StartupPanelCoordinator.RouteEvaluation
              ) {
                  when (evaluation) {
                      org.oxycblt.auxio.headunit.StartupPanelCoordinator.RouteEvaluation.Idle,
                      is org.oxycblt.auxio.headunit.StartupPanelCoordinator.RouteEvaluation.Wait -> Unit
                      is org.oxycblt.auxio.headunit.StartupPanelCoordinator.RouteEvaluation.Cancel ->
                          startupPanelCoordinator.cancelRoute(
                              evaluation.request.token,
                              evaluation.reason,
                          )
                      is org.oxycblt.auxio.headunit.StartupPanelCoordinator.RouteEvaluation.Render -> {
                          val request = evaluation.request
                          val rendered =
                              when (request.destination) {
                                  OpenPanel.MAIN -> tryClosePlaybackPanel(cancelPendingRoute = false)
                                  OpenPanel.PLAYBACK ->
                                      tryOpenPlaybackPanel(cancelPendingRoute = false)
                                  OpenPanel.PLAYBACK_QUEUE,
                                  OpenPanel.QUEUE ->
                                      tryOpenPlaybackQueuePanel(cancelPendingRoute = false)
                              }
                          if (rendered) {
                              L.d(
                                  "Consumed rendered startup route: " +
                                      "${request.description} -> ${request.destination}"
                              )
                              startupPanelCoordinator.consumeRoute(request.token)
                          }
                      }
                  }
              }

              private fun handlePanel""",
          )
          replace_once(
              main_fragment,
              """            OpenPanel.PLAYBACK_QUEUE -> {
                          tryOpenPlaybackPanel()
                          val root = requireBinding().root
                          root.post {
                              if (isAdded && view != null) {
                                  tryOpenQueuePanel()
                              }
                          }
                      }""",
              """            OpenPanel.PLAYBACK_QUEUE -> {
                          tryOpenPlaybackQueuePanel()
                          val root = requireBinding().root
                          root.post {
                              if (isAdded && view != null) {
                                  tryOpenPlaybackQueuePanel()
                              }
                          }
                      }""",
          )
          replace_regex(
              main_fragment,
              r"""    private fun tryOpenPlaybackPanel\(\) \{.*?
              \}

              private fun tryClosePlaybackPanel\(\) \{.*?
              \}

              private fun tryOpenQueuePanel\(\) \{.*?
              \}

              private fun tryShowSheets""",
              """    private fun tryOpenPlaybackPanel(cancelPendingRoute: Boolean = true): Boolean {
                  if (cancelPendingRoute) {
                      startupPanelCoordinator.cancelRouting("manual-playback-open")
                  }
                  val binding = requireBinding()
                  val playbackSheetBehavior =
                      binding.playbackSheet.coordinatorLayoutBehavior as PlaybackBottomSheetBehavior
                  val queueSheetBehavior =
                      binding.queueSheet.coordinatorLayoutBehavior as QueueBottomSheetBehavior?

                  if (playbackSheetBehavior.state != BackportBottomSheetBehavior.STATE_EXPANDED) {
                      if (
                          playbackSheetBehavior.targetState ==
                              BackportBottomSheetBehavior.STATE_COLLAPSED
                      ) {
                          L.d("Expanding playback sheet")
                          playbackSheetBehavior.state = BackportBottomSheetBehavior.STATE_EXPANDED
                      }
                      return false
                  }
                  if (queueSheetBehavior == null) return true
                  if (queueSheetBehavior.state == BackportBottomSheetBehavior.STATE_COLLAPSED) {
                      return true
                  }
                  if (queueSheetBehavior.state == BackportBottomSheetBehavior.STATE_EXPANDED) {
                      queueSheetBehavior.state = BackportBottomSheetBehavior.STATE_COLLAPSED
                  }
                  return false
              }

              private fun tryOpenPlaybackQueuePanel(
                  cancelPendingRoute: Boolean = true
              ): Boolean {
                  if (cancelPendingRoute) {
                      startupPanelCoordinator.cancelRouting("manual-playback-queue-open")
                  }
                  val binding = requireBinding()
                  val playbackSheetBehavior =
                      binding.playbackSheet.coordinatorLayoutBehavior as PlaybackBottomSheetBehavior
                  val queueSheetBehavior =
                      binding.queueSheet.coordinatorLayoutBehavior as QueueBottomSheetBehavior?

                  if (playbackSheetBehavior.state != BackportBottomSheetBehavior.STATE_EXPANDED) {
                      if (
                          playbackSheetBehavior.targetState ==
                              BackportBottomSheetBehavior.STATE_COLLAPSED
                      ) {
                          L.d("Expanding playback sheet before queue destination")
                          playbackSheetBehavior.state = BackportBottomSheetBehavior.STATE_EXPANDED
                      }
                      return false
                  }
                  if (queueSheetBehavior == null) return true
                  if (queueSheetBehavior.state == BackportBottomSheetBehavior.STATE_EXPANDED) {
                      return true
                  }
                  if (queueSheetBehavior.state == BackportBottomSheetBehavior.STATE_COLLAPSED) {
                      queueSheetBehavior.state = BackportBottomSheetBehavior.STATE_EXPANDED
                  }
                  return false
              }

              private fun tryClosePlaybackPanel(cancelPendingRoute: Boolean = true): Boolean {
                  if (cancelPendingRoute) {
                      startupPanelCoordinator.cancelRouting("manual-playback-close")
                  }
                  val binding = requireBinding()
                  val playbackSheetBehavior =
                      binding.playbackSheet.coordinatorLayoutBehavior as PlaybackBottomSheetBehavior
                  val queueSheetBehavior =
                      binding.queueSheet.coordinatorLayoutBehavior as QueueBottomSheetBehavior?
                  val playbackClosed =
                      playbackSheetBehavior.state == BackportBottomSheetBehavior.STATE_COLLAPSED ||
                          playbackSheetBehavior.state == BackportBottomSheetBehavior.STATE_HIDDEN
                  val queueClosed =
                      queueSheetBehavior == null ||
                          queueSheetBehavior.state == BackportBottomSheetBehavior.STATE_COLLAPSED
                  if (playbackClosed && queueClosed) return true
                  if (queueSheetBehavior?.state == BackportBottomSheetBehavior.STATE_EXPANDED) {
                      queueSheetBehavior.state = BackportBottomSheetBehavior.STATE_COLLAPSED
                  }
                  if (playbackSheetBehavior.state == BackportBottomSheetBehavior.STATE_EXPANDED) {
                      playbackSheetBehavior.state = BackportBottomSheetBehavior.STATE_COLLAPSED
                  }
                  return false
              }

              private fun tryOpenQueuePanel(cancelPendingRoute: Boolean = true): Boolean {
                  if (cancelPendingRoute) {
                      startupPanelCoordinator.cancelRouting("manual-queue-open")
                  }
                  val binding = requireBinding()
                  val playbackSheetBehavior =
                      binding.playbackSheet.coordinatorLayoutBehavior as PlaybackBottomSheetBehavior
                  val queueSheetBehavior =
                      binding.queueSheet.coordinatorLayoutBehavior as QueueBottomSheetBehavior?
                          ?: return playbackSheetBehavior.state ==
                              BackportBottomSheetBehavior.STATE_EXPANDED
                  if (queueSheetBehavior.state == BackportBottomSheetBehavior.STATE_EXPANDED) {
                      return true
                  }
                  if (
                      playbackSheetBehavior.state == BackportBottomSheetBehavior.STATE_EXPANDED &&
                          queueSheetBehavior.state == BackportBottomSheetBehavior.STATE_COLLAPSED
                  ) {
                      queueSheetBehavior.state = BackportBottomSheetBehavior.STATE_EXPANDED
                  }
                  return false
              }

              private fun tryShowSheets""",
          )
          replace_once(
              main_fragment,
              """    private class SheetBackPressedCallback(
                  private val playbackSheetBehavior: PlaybackBottomSheetBehavior<*>,
                  private val queueSheetBehavior: QueueBottomSheetBehavior<*>?,
              ) : OnBackPressedCallback(false) {""",
              """    private class SheetBackPressedCallback(
                  private val playbackSheetBehavior: PlaybackBottomSheetBehavior<*>,
                  private val queueSheetBehavior: QueueBottomSheetBehavior<*>?,
                  private val onManualPanelNavigation: () -> Unit,
              ) : OnBackPressedCallback(false) {""",
          )
          replace_once(
              main_fragment,
              """        override fun handleOnBackStarted(backEvent: BackEventCompat) {
                  if (queueSheetShown()) {""",
              """        override fun handleOnBackStarted(backEvent: BackEventCompat) {
                  onManualPanelNavigation()
                  if (queueSheetShown()) {""",
          )
          replace_once(
              main_fragment,
              """        override fun handleOnBackPressed() {
                  if (queueSheetShown()) {""",
              """        override fun handleOnBackPressed() {
                  onManualPanelNavigation()
                  if (queueSheetShown()) {""",
          )

          exo = (
              "app/src/main/java/org/oxycblt/auxio/playback/service/"
              "ExoPlaybackStateHolder.kt"
          )
          replace_once(
              exo,
              "import kotlinx.coroutines.CoroutineScope\n",
              "import kotlinx.coroutines.CancellationException\nimport kotlinx.coroutines.CoroutineScope\n",
          )
          replace_once(
              exo,
              """    private val restoreScope = CoroutineScope(Dispatchers.IO + saveJob)
              private var currentSaveJob: Job? = null
              private var openAudioEffectSession = false""",
              """    private val restoreScope = CoroutineScope(Dispatchers.IO + saveJob)
              private var currentSaveJob: Job? = null
              private var currentRestoreJob: Job? = null
              private var restoreGeneration = 0L
              private var openAudioEffectSession = false""",
          )
          replace_once(
              exo,
              """    fun release() {
                  saveJob.cancel()""",
              """    fun release() {
                  cancelActiveRestore("holder-release", notify = false)
                  saveJob.cancel()""",
          )
          replace_regex(
              exo,
              r"""            L\.d\("Restoring playback state from cached/loaded library"\)
                  restoreScope\.launch \{
                      val state = persistenceRepository\.readState\(\)
                      withContext\(Dispatchers\.Main\) \{
                          if \(state != null\) \{.*?
                      \}
                  \}
                  return true""",
              """            L.d("Restoring playback state from cached/loaded library")
                  currentRestoreJob?.cancel()
                  val generation = ++restoreGeneration
                  currentRestoreJob =
                      restoreScope.launch {
                          try {
                              val state = persistenceRepository.readState()
                              withContext(Dispatchers.Main) {
                                  if (generation != restoreGeneration) return@withContext
                                  if (state != null) {
                                      playbackManager.applySavedState(state, false)
                                      if (shouldPlayImmediately(action.play)) {
                                          playbackManager.playing(true)
                                      }
                                      completeRestore(
                                          generation,
                                          RestoreOutcome.RESTORED_EXISTING_SESSION,
                                      )
                                  } else if (action.fallback != null) {
                                      completeRestore(
                                          generation,
                                          RestoreOutcome.FALLBACK_QUEUE_CREATED,
                                      )
                                      playbackManager.playDeferred(action.fallback)
                                  } else {
                                      completeRestore(
                                          generation,
                                          RestoreOutcome.NO_SAVED_SESSION,
                                      )
                                  }
                              }
                          } catch (e: CancellationException) {
                              throw e
                          } catch (e: Exception) {
                              L.w(e, "Unable to restore persisted playback state")
                              withContext(Dispatchers.Main) {
                                  completeRestore(generation, RestoreOutcome.FAILED)
                              }
                          } finally {
                              if (generation == restoreGeneration) {
                                  currentRestoreJob = null
                              }
                          }
                      }
                  return true""",
          )
          replace_once(
              exo,
              """    override fun playing(playing: Boolean) {""",
              """    private fun completeRestore(generation: Long, outcome: RestoreOutcome) {
                  if (generation != restoreGeneration) return
                  currentRestoreJob = null
                  playbackManager.notifyRestoreOutcome(outcome)
              }

              private fun cancelActiveRestore(reason: String, notify: Boolean = true) {
                  val job = currentRestoreJob
                  val outcome = playbackManager.restoreOutcome
                  val transient =
                      outcome == RestoreOutcome.WAITING_FOR_PLAYER ||
                          outcome == RestoreOutcome.WAITING_FOR_LIBRARY ||
                          outcome == RestoreOutcome.RAW_FAST_RESUME_ACTIVE
                  if (job?.isActive != true && !transient) return

                  L.i("Cancelling pending playback restore [reason=$reason outcome=$outcome]")
                  restoreGeneration += 1
                  currentRestoreJob = null
                  pendingLibraryRestoreAfterRawFailure = null
                  job?.cancel()
                  if (notify && transient) {
                      playbackManager.notifyRestoreOutcome(RestoreOutcome.CANCELLED)
                  }
              }

              override fun playing(playing: Boolean) {""",
          )
          for signature, reason in (
              ("override fun newPlayback(command: PlaybackCommand, play: Boolean) {", "new-playback"),
              ("override fun shuffled(shuffled: Boolean) {", "queue-reordered"),
              ("override fun next() {", "next"),
              ("override fun prev() {", "previous"),
              ("override fun goto(index: Int) {", "queue-index"),
              ("override fun playNext(songs: List<Song>, ack: StateAck.PlayNext) {", "play-next"),
              ("override fun addToQueue(songs: List<Song>, ack: StateAck.AddToQueue) {", "add-to-queue"),
              ("override fun move(from: Int, to: Int, ack: StateAck.Move) {", "move-queue-item"),
              ("override fun remove(at: Int, ack: StateAck.Remove) {", "remove-queue-item"),
              ("override fun reset(ack: StateAck.NewPlayback) {", "reset"),
          ):
              replace_once(
                  exo,
                  f"    {signature}\n",
                  f'    {signature}\n        cancelActiveRestore("{reason}")\n',
              )
          replace_once(
              exo,
              """                rawFastResumeItem = null
                          pendingLibraryRestoreAfterRawFailure = null
                          playbackManager.play(command)""",
              """                rawFastResumeItem = null
                          pendingLibraryRestoreAfterRawFailure = null
                          playbackManager.notifyRestoreOutcome(
                              RestoreOutcome.RESTORED_EXISTING_SESSION
                          )
                          playbackManager.play(command)""",
          )

          tests = Path(
              "app/src/test/java/org/oxycblt/auxio/headunit/StartupPanelCoordinatorTest.kt"
          )
          tests.parent.mkdir(parents=True, exist_ok=True)
          tests.write_text(
              """/*
           * Copyright (c) 2026 Auxio Project
           * StartupPanelCoordinatorTest.kt is part of Auxio.
           *
           * This program is free software: you can redistribute it and/or modify
           * it under the terms of the GNU General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           */

          package org.oxycblt.auxio.headunit

          import java.util.UUID
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.oxycblt.auxio.music.StartupReadinessState
          import org.oxycblt.auxio.playback.OpenPanel
          import org.oxycblt.auxio.playback.state.RestoreOutcome

          class StartupPanelCoordinatorTest {
              @Test
              fun `generic launch targets now playing`() {
                  assertEquals(OpenPanel.PLAYBACK, StartupPanelCoordinator.genericDestination())
              }

              @Test
              fun `generic route waits for transient restore`() {
                  assertTrue(
                      evaluate(false, RestoreOutcome.WAITING_FOR_LIBRARY)
                          is StartupPanelCoordinator.RouteEvaluation.Wait
                  )
              }

              @Test
              fun `terminal library states cancel the route`() {
                  listOf(
                          StartupReadinessState.NeedsMusicSource,
                          StartupReadinessState.EmptyLibrary,
                          StartupReadinessState.CachedLibraryUnavailable,
                      )
                      .forEach { readiness ->
                          assertTrue(
                              evaluate(
                                  false,
                                  RestoreOutcome.WAITING_FOR_LIBRARY,
                                  readiness,
                              ) is StartupPanelCoordinator.RouteEvaluation.Cancel
                          )
                      }
              }

              @Test
              fun `no saved session stays terminal even after a manual song appears`() {
                  assertTrue(
                      evaluate(true, RestoreOutcome.NO_SAVED_SESSION)
                          is StartupPanelCoordinator.RouteEvaluation.Cancel
                  )
              }

              @Test
              fun `raw resume waits for normal song reconciliation`() {
                  assertTrue(
                      evaluate(false, RestoreOutcome.RAW_FAST_RESUME_ACTIVE)
                          is StartupPanelCoordinator.RouteEvaluation.Wait
                  )
                  assertTrue(
                      evaluate(true, RestoreOutcome.RAW_FAST_RESUME_ACTIVE)
                          is StartupPanelCoordinator.RouteEvaluation.Render
                  )
              }

              @Test
              fun `failed and cancelled restores terminate generic routing`() {
                  listOf(RestoreOutcome.FAILED, RestoreOutcome.CANCELLED).forEach { outcome ->
                      assertTrue(
                          evaluate(false, outcome)
                              is StartupPanelCoordinator.RouteEvaluation.Cancel
                      )
                  }
              }

              @Test
              fun `explicit queue renders only after a normal song exists`() {
                  val request =
                      StartupPanelCoordinator.RouteRequest(
                          UUID.randomUUID(),
                          OpenPanel.PLAYBACK_QUEUE,
                          StartupPanelCoordinator.Priority.EXPLICIT_INTENT,
                          "test explicit queue",
                      )
                  assertTrue(
                      StartupPanelCoordinator.evaluate(
                          request,
                          false,
                          RestoreOutcome.NOT_REQUESTED,
                          StartupReadinessState.Ready,
                      ) is StartupPanelCoordinator.RouteEvaluation.Wait
                  )
                  assertTrue(
                      StartupPanelCoordinator.evaluate(
                          request,
                          true,
                          RestoreOutcome.NOT_REQUESTED,
                          StartupReadinessState.Ready,
                      ) is StartupPanelCoordinator.RouteEvaluation.Render
                  )
              }

              private fun evaluate(
                  hasSong: Boolean,
                  outcome: RestoreOutcome,
                  readiness: StartupReadinessState = StartupReadinessState.Ready,
              ) =
                  StartupPanelCoordinator.evaluate(
                      StartupPanelCoordinator.RouteRequest(
                          UUID.randomUUID(),
                          OpenPanel.PLAYBACK,
                          StartupPanelCoordinator.Priority.GENERIC_STARTUP,
                          "test generic",
                      ),
                      hasSong,
                      outcome,
                      readiness,
                  )
          }
          """.strip()
              + "\n",
              encoding="utf-8",
          )

          docs = Path("docs/LAUNCH_TO_CURRENTLY_PLAYING.md")
          docs.write_text(
              """# Launch to Currently Playing

          ## Behaviour contract

          `Launch to Now Playing` controls navigation only; it does not imply autoplay.

          - Generic cold launches target **Now Playing**, never Queue.
          - Explicit Queue launcher/deep-link requests target playback plus Queue.
          - Explicit destinations supersede generic startup routing.
          - Requests wait through transient library, restore, raw-resume, and sheet states.
          - Source-required, empty/recovery, no-session, failed, and cancelled states terminate the
            matching request rather than leaving a stale future route.
          - A route is consumed only after the requested final sheet state is reached.
          - Manual sheet drag/back/panel changes and Settings/About navigation cancel pending routes.
          - Manual playback or queue mutations cancel an in-flight persisted-state restore before it
            can overwrite the user's newer choice.

          ## Exact-device validation

          **Requires TS18 validation** on `s9863a1h10_Natv`:

          1. Cold launch with saved playing and paused sessions.
          2. No saved session, empty library, recovery, and source-required states.
          3. Raw fast resume followed by normal `Song` reconciliation.
          4. Explicit Now Playing and Queue launch during cold and warm app states.
          5. Manual close, drag, back, Settings, and Queue mutation during restore/sheet settling.
          6. DoFun launcher restart, process death, reboot, and real ACC sleep/wake.

          Collect route/restore logs and final sheet state. CI does not prove physical TS18 timing.
          """.strip()
              + "\n",
              encoding="utf-8",
          )
          readme = Path("docs/README.md")
          text = readme.read_text(encoding="utf-8")
          link = (
              "- [`LAUNCH_TO_CURRENTLY_PLAYING.md`](LAUNCH_TO_CURRENTLY_PLAYING.md) — "
              "durable startup-panel routing contract and TS18 validation matrix.\n"
          )
          if link not in text:
              marker = (
                  "- [`TS18_RUNTIME_VALIDATION.md`](TS18_RUNTIME_VALIDATION.md) — "
                  "on-device TS18 validation checklist and evidence expectations.\n"
              )
              if marker not in text:
                  raise SystemExit("STOP: docs README insertion marker not found")
              readme.write_text(text.replace(marker, marker + link, 1), encoding="utf-8")
          PY

      - name: Prepare Android build environment
