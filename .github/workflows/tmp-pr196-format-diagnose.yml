name: Temporary PR196 format diagnose

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: tmp-pr196-format-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties for Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Apply or capture formatting failure
        shell: bash
        run: |
          set +e
          bash ./scripts/ci-gradle.sh spotlessApply > /tmp/pr196-format.log 2>&1
          status=$?
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${status}" -eq 0 ]; then
            rm -f tmp-pr196-format-error.log
            if git diff --quiet; then
              echo 'No formatting changes required.'
              exit 0
            fi
            git add -u
            git commit -m 'style: apply PR 196 formatting'
          else
            tail -n 240 /tmp/pr196-format.log > tmp-pr196-format-error.log
            git add tmp-pr196-format-error.log
            git commit -m 'ci: capture PR 196 formatter failure'
          fi
          git push origin HEAD:fix/first-launch-source-recovery
