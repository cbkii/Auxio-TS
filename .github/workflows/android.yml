name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "musikr/**"
      - "startup-benchmark/**"
      - "media"
      - "media/**"
      - "build.gradle"
      - "settings.gradle"
      - ".gitmodules"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "NOTICE"
      - "eclipse-cdt.xml"
      - "scripts/**"
      - "ci/dependencies/**"
      - ".github/dependabot.yml"
  pull_request:
    branches:
      - dev
      - "cx/**"
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "musikr/**"
      - "startup-benchmark/**"
      - "media"
      - "media/**"
      - "build.gradle"
      - "settings.gradle"
      - ".gitmodules"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "NOTICE"
      - "eclipse-cdt.xml"
      - "scripts/**"
      - "ci/dependencies/**"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Build debug APKs
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardDebug
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicDebug
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaDebug

      - name: Build release APKs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardRelease
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicRelease
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaRelease

      - name: Validate TS18 APK reference contracts
        shell: bash
        run: bash ./scripts/check-ts18-apk-reference-contracts.sh

      - name: Validate DoFun/Topway compatibility sources
        shell: bash
        run: bash ./scripts/check-dofun-topway-compat.sh

      - name: Upload failure reports
        id: failure_reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-build-reports
          path: |
            app/build/reports/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APKs
        id: debug_apks
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auxio-ts-debug-apks
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/outputs/apk/topwayTwMusic/debug/*.apk
            app/build/outputs/apk/topwayTwMedia/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Write build summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          REPORTS_URL: ${{ steps.failure_reports.outputs.artifact-url }}
          DEBUG_APKS_URL: ${{ steps.debug_apks.outputs.artifact-url }}
        run: |
          {
            echo "## Android Build"
            echo
            echo "- Result: \`${JOB_STATUS}\`"
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [[ -n "${REPORTS_URL}" ]]; then
              echo "- Failure reports: ${REPORTS_URL}"
            fi
            if [[ -n "${DEBUG_APKS_URL}" ]]; then
              echo "- Debug APKs: ${DEBUG_APKS_URL}"
            elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "- Debug APK upload: skipped for pull requests; dispatch this workflow manually on the branch when installable debug artifacts are needed."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
