name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'musikr/**'
      - 'media'
      - 'media/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.gitmodules'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'NOTICE'
      - 'eclipse-cdt.xml'
      - 'scripts/**'
      - 'ci/dependencies/**'
      - '.github/dependabot.yml'
      - 'AGENTS.md'
      - 'README.md'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'musikr/**'
      - 'media'
      - 'media/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.gitmodules'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'NOTICE'
      - 'eclipse-cdt.xml'
      - 'scripts/**'
      - 'ci/dependencies/**'
      - '.github/dependabot.yml'
      - 'AGENTS.md'
      - 'README.md'
permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        # fetch-depth: 0 (full history) is required here.
        # The nested ffmpeg submodule resolves primarily through the GitHub
        # mirror, but full history ensures all unadvertised objects and
        # submodule gitlink commits remain reachable during verification.
        fetch-depth: 0
        submodules: false
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"
    - name: Write local.properties for Android SDK
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "${sdk_dir}" ]; then
          echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
          exit 1
        fi
        printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        # PRs must not write to the shared Gradle cache; pushes to dev may write.
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - name: Ensure native build tools are present
      run: |
        if ! command -v ninja >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ninja-build
        fi
    - name: Prepare CI environment
      shell: bash
      run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
    - name: Build debug APKs with Gradle
      run: bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardDebug :app:assembleTopwayTwMusicDebug :app:assembleTopwayTwMediaDebug
    - name: Build release APKs with Gradle
      if: github.event_name != 'pull_request'
      run: bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardRelease :app:assembleTopwayTwMusicRelease :app:assembleTopwayTwMediaRelease
    - name: Validate TS18 APK reference contracts
      run: bash ./scripts/check-ts18-apk-reference-contracts.sh
    - name: Validate DoFun/Topway compatibility sources
      run: bash ./scripts/check-dofun-topway-compat.sh
    - name: Upload build reports
      id: build_reports_artifact
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: android-build-reports
        path: |
          app/build/reports/**
          build/reports/problems/**
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload build diagnostics (always)
      id: build_diagnostics_artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: android-build-diagnostics
        path: |
          build/reports/problems/**
        if-no-files-found: ignore
        retention-days: 3
    - name: Upload debug APK artifact
      id: debug_apks_artifact
      if: success()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: auxio-ts-debug-apks
        path: |
          ./app/build/outputs/apk/standard/debug/*.apk
          ./app/build/outputs/apk/topwayTwMusic/debug/*.apk
          ./app/build/outputs/apk/topwayTwMedia/debug/*.apk
        if-no-files-found: error
        retention-days: 7
    - name: Write Android build summary
      if: ${{ always() }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_TOKEN: ${{ github.token }}
        JOB_STATUS: ${{ job.status }}
        BUILD_REPORTS_ARTIFACT_URL: ${{ steps.build_reports_artifact.outputs.artifact-url }}
        BUILD_DIAGNOSTICS_ARTIFACT_URL: ${{ steps.build_diagnostics_artifact.outputs.artifact-url }}
        DEBUG_APKS_ARTIFACT_URL: ${{ steps.debug_apks_artifact.outputs.artifact-url }}
      run: |
        set -u
        set -o pipefail

        repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
        run_url="${repo_url}/actions/runs/${GITHUB_RUN_ID}"

        case "${JOB_STATUS}" in
          success)
            result_message="✅ Android Build completed successfully."
            ;;
          failure)
            result_message="❌ Android Build failed. Inspect the findings, downloadable diagnostics, and linked run logs below."
            ;;
          cancelled)
            result_message="⚠️ Android Build was cancelled before completion."
            ;;
          *)
            result_message="⚠️ Android Build finished with status: ${JOB_STATUS}."
            ;;
        esac

        write_artifact_links() {
          local artifacts_json
          local name
          local artifact_id
          local expires_at
          local emitted_count=0

          declare -A emitted_names=()

          emit_known_artifact() {
            local artifact_name="$1"
            local artifact_url="$2"

            if [[ -n "${artifact_url}" ]]; then
              echo "- [${artifact_name}](${artifact_url})"
              emitted_names["${artifact_name}"]=1
              emitted_count=$((emitted_count + 1))
            fi
          }

          # Preferred source: URLs returned directly by upload-artifact.
          emit_known_artifact \
            "android-build-reports" \
            "${BUILD_REPORTS_ARTIFACT_URL:-}"

          emit_known_artifact \
            "android-build-diagnostics" \
            "${BUILD_DIAGNOSTICS_ARTIFACT_URL:-}"

          emit_known_artifact \
            "auxio-ts-debug-apks" \
            "${DEBUG_APKS_ARTIFACT_URL:-}"

          # Fallback and future-proofing: enumerate every other non-expired
          # artifact associated with this workflow run.
          if artifacts_json="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              2>/dev/null
          )"; then
            while IFS=$'\t' read -r name artifact_id expires_at; do
              [[ -z "${name}" || -z "${artifact_id}" ]] && continue

              if [[ -n "${emitted_names[$name]+present}" ]]; then
                continue
              fi

              echo "- [${name}](${run_url}/artifacts/${artifact_id}) — expires ${expires_at}"
              emitted_names["${name}"]=1
              emitted_count=$((emitted_count + 1))
            done < <(
              jq -r '
                .artifacts
                | map(select((.expired // false) | not))
                | unique_by(.id)
                | sort_by(.name)[]
                | [
                    .name,
                    (.id | tostring),
                    (.expires_at // "unknown")
                  ]
                | @tsv
              ' <<< "${artifacts_json}" 2>/dev/null
            )
          fi

          if (( emitted_count == 0 )); then
            echo "- No downloadable artifacts were produced."
            echo "- [Open this workflow run to inspect logs](${run_url})"
          fi
        }

        write_unique_findings() {
          local jobs_json
          local check_runs_json
          local findings_file
          local annotations_file
          local final_file

          jobs_json="$(mktemp)"
          check_runs_json="$(mktemp)"
          findings_file="$(mktemp)"
          annotations_file="$(mktemp)"
          final_file="$(mktemp)"

          if gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > "${jobs_json}" 2>/dev/null; then

            # Job-level failures, timeouts and cancellations.
            jq -r '
              .jobs[]?
              | select(
                  (.conclusion // "")
                  | IN(
                      "failure",
                      "cancelled",
                      "timed_out",
                      "action_required"
                    )
                )
              | "- **Job " + (.conclusion // "unknown")
                  + "** — " + (.name // "unnamed job")
            ' "${jobs_json}" >> "${findings_file}" 2>/dev/null || true

            # Step-level failures and cancellations.
            jq -r '
              .jobs[]? as $job
              | $job.steps[]?
              | select(
                  (.conclusion // "")
                  | IN("failure", "cancelled")
                )
              | "- **Step " + (.conclusion // "unknown")
                  + "** — " + ($job.name // "unnamed job")
                  + " / " + (.name // "unnamed step")
            ' "${jobs_json}" >> "${findings_file}" 2>/dev/null || true
          fi

          # Capture warning/failure annotations generated by actions, Gradle,
          # Android lint, or workflow commands for this exact Actions run.
          if gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            > "${check_runs_json}" 2>/dev/null; then

            jq -r --arg run_id "${GITHUB_RUN_ID}" '
              .check_runs[]?
              | select(
                  (.details_url // "")
                  | contains("/actions/runs/" + $run_id + "/")
                )
              | .id
            ' "${check_runs_json}" 2>/dev/null |
              while IFS= read -r check_run_id; do
                [[ -z "${check_run_id}" ]] && continue

                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}/annotations" \
                  --paginate 2>/dev/null |
                  jq -r '
                    .[]?
                    | select(
                        (.annotation_level // "")
                        | IN("warning", "failure")
                      )
                    | "- **" + (.annotation_level // "notice")
                        + "** — "
                        + (
                            (.path // "workflow")
                            + (
                                if .start_line
                                then ":" + (.start_line | tostring)
                                else ""
                                end
                              )
                          )
                        + " — "
                        + (.message // .title // "")
                  ' >> "${annotations_file}" 2>/dev/null || true
              done
          fi

          cat "${findings_file}" "${annotations_file}" |
            sed -E 's/[[:space:]]+$//' |
            awk 'NF && !seen[$0]++' > "${final_file}"

          if [[ -s "${final_file}" ]]; then
            cat "${final_file}"
          elif [[ "${JOB_STATUS}" == "success" ]]; then
            echo "- No warning, failure, cancellation, or timeout findings were exposed through the Actions jobs or check-annotations APIs."
          else
            echo "- No detailed findings were available through the Actions APIs at summary time."
            echo "- [Open the complete workflow logs](${run_url})"
          fi

          rm -f \
            "${jobs_json}" \
            "${check_runs_json}" \
            "${findings_file}" \
            "${annotations_file}" \
            "${final_file}"
        }

        {
          echo "# Auxio-TS Android Build"
          echo
          echo "${result_message}"
          echo
          echo "## Build details"
          echo
          echo "- Event: \`${GITHUB_EVENT_NAME}\`"
          echo "- Ref: \`${GITHUB_REF}\`"
          echo "- Commit: [\`${GITHUB_SHA}\`](${repo_url}/commit/${GITHUB_SHA})"
          echo "- Workflow run: [${GITHUB_RUN_ID}](${run_url})"
          echo
          echo "## Build scope"
          echo
          echo "- Standard debug APK"
          echo "- Topway/DoFun \`com.tw.music\` debug APK"
          echo "- Topway/DoFun \`com.tw.media\` debug APK"

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "- Standard and Topway release APK builds"
          else
            echo "- Release APK builds skipped for pull-request validation"
          fi

          echo
          echo "## Downloadable artifacts"
          echo
          write_artifact_links

          echo
          echo "## Unique warnings/errors/failures"
          echo
          write_unique_findings

          echo
          echo "## Logs"
          echo
          echo "- [Open the complete Android Build run](${run_url})"
        } >> "$GITHUB_STEP_SUMMARY"
