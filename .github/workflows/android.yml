name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches:
      - dev
      - "cx/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Three-variant build and binary contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk_dir" ]] || { echo '::error::Android SDK unavailable'; exit 1; }
          printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Ensure native tools
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Prepare CI environment
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Validate source contracts before build
        run: |
          bash ./scripts/ci-scope.sh --self-test
          bash ./scripts/check-product-contracts.sh
          bash ./scripts/check-topway-manifest-components.sh
          bash ./scripts/check-headunit-compat-safety.sh
          bash ./scripts/check-dofun-topway-compat.sh
      - name: Build all maintained debug variants
        env:
          AUXIO_TS_CI_GRADLE_LOG: ${{ runner.temp }}/android-build-debug.log
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all \
            :app:assembleStandardDebug \
            :app:assembleTopwayTwMediaDebug \
            :app:assembleTopwayTwMusicDebug
      - name: Validate debug package/component isolation
        run: bash ./scripts/check-built-topway-apks.sh
      - name: Compile all release variants
        env:
          AUXIO_TS_CI_GRADLE_LOG: ${{ runner.temp }}/android-build-release.log
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all \
            :app:assembleStandardRelease \
            :app:assembleTopwayTwMediaRelease \
            :app:assembleTopwayTwMusicRelease
      - name: Validate native ABI and startup contracts on release outputs
        shell: bash
        run: |
          for variant in standard topwayTwMedia topwayTwMusic; do
            dir="app/build/outputs/apk/${variant}/release"
            mapfile -t apks < <(find "$dir" -maxdepth 1 -type f -name '*.apk' | sort)
            ((${#apks[@]} >= 1)) || { echo "::error::No ${variant} release APK produced"; exit 1; }
            apk=${apks[0]}
            bash ./scripts/check-native-abi-contracts.sh "$apk"
            bash ./scripts/check-release-diagnostics-boundary.sh "$apk"
          done
          media_apk=$(find app/build/outputs/apk/topwayTwMedia/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          bash ./scripts/check-startup-performance-contracts.sh "$media_apk"
      - name: Upload build failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-build-failure-reports
          path: |
            app/build/reports/**
            app/build/outputs/**
            build/reports/problems/**
            ${{ runner.temp }}/android-build-*.log
          if-no-files-found: ignore
          retention-days: 7

  api29-runtime-smoke:
    name: Android 10 API 29 runtime smoke - all variants
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AVD_NAME: auxio-api29
      ANDROID_API: "29"
      SYSTEM_IMAGE: system-images;android-29;google_apis;x86_64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Android state
        shell: bash
        run: |
          echo "ANDROID_USER_HOME=${RUNNER_TEMP}/android-user-home" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=${RUNNER_TEMP}/android-avd-home" >> "$GITHUB_ENV"
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk_dir" ]] || exit 1
          printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Install API 29 emulator image
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_bin="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          avdmanager_bin="${sdk_root}/cmdline-tools/latest/bin/avdmanager"
          [[ -x "$sdkmanager_bin" ]] || sdkmanager_bin=$(command -v sdkmanager)
          [[ -x "$avdmanager_bin" ]] || avdmanager_bin=$(command -v avdmanager)
          set +e; yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1; rc=${PIPESTATUS[1]}; set -e; [[ $rc -eq 0 ]] || exit "$rc"
          "$sdkmanager_bin" --install platform-tools emulator "platforms;android-${ANDROID_API}" "$SYSTEM_IMAGE"
          echo "AVDMANAGER_BIN=$avdmanager_bin" >> "$GITHUB_ENV"
          echo "EMULATOR_BIN=${sdk_root}/emulator/emulator" >> "$GITHUB_ENV"
          echo "${sdk_root}/platform-tools" >> "$GITHUB_PATH"
      - name: Create and boot API 29 emulator
        shell: bash
        run: |
          [[ ! -e /dev/kvm ]] || sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"; touch "$ANDROID_USER_HOME/repositories.cfg"
          printf 'no\n' | "$AVDMANAGER_BIN" create avd --force -n "$AVD_NAME" -k "$SYSTEM_IMAGE"
          nohup "$EMULATOR_BIN" -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim -no-snapshot-save -memory 2048 -partition-size 2048 -gpu swiftshader_indirect -camera-back none -camera-front none >"$RUNNER_TEMP/api29-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api29-emulator.pid"
          for _ in $(seq 1 120); do adb get-state 2>/dev/null | grep -Fxq device && break; sleep 2; done
          adb get-state | grep -Fxq device || { tail -n 200 "$RUNNER_TEMP/api29-emulator.log"; exit 1; }
          for _ in $(seq 1 180); do [[ $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]] && break; sleep 2; done
          [[ $(adb shell getprop ro.build.version.sdk | tr -d '\r') == 29 ]] || exit 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Prepare CI environment
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Run API 29 compatibility and migrations for every distribution lane
        env:
          AUXIO_TS_CI_GRADLE_LOG: ${{ runner.temp }}/api29-gradle.log
        run: |
          bash ./scripts/ci-gradle.sh \
            :app:connectedStandardDebugAndroidTest \
            :app:connectedTopwayTwMediaDebugAndroidTest \
            :app:connectedTopwayTwMusicDebugAndroidTest \
            :musikr:connectedDebugAndroidTest
      - name: Upload API 29 failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-api29-failure-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            musikr/build/reports/androidTests/**
            musikr/build/outputs/androidTest-results/**
            ${{ runner.temp }}/api29-emulator.log
            ${{ runner.temp }}/api29-gradle.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop emulator
        if: always()
        run: |
          adb emu kill >/dev/null 2>&1 || true
          [[ ! -f "$RUNNER_TEMP/api29-emulator.pid" ]] || kill "$(cat "$RUNNER_TEMP/api29-emulator.pid")" >/dev/null 2>&1 || true

  required-summary:
    name: Required Android build gates
    if: always()
    needs: [build, api29-runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require build and API 29
        env:
          BUILD: ${{ needs.build.result }}
          API29: ${{ needs.api29-runtime-smoke.result }}
        run: |
          [[ "$BUILD" == success ]] || { echo "::error::Build contracts: $BUILD"; exit 1; }
          [[ "$API29" == success ]] || { echo "::error::API 29 runtime smoke: $API29"; exit 1; }
