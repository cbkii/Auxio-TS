name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "musikr/**"
      - "startup-benchmark/**"
      - "media"
      - "media/**"
      - "build.gradle"
      - "settings.gradle"
      - ".gitmodules"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "NOTICE"
      - "eclipse-cdt.xml"
      - "scripts/**"
      - "ci/dependencies/**"
      - ".github/dependabot.yml"
  pull_request:
    branches:
      - dev
      - "cx/**"
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "musikr/**"
      - "startup-benchmark/**"
      - "media"
      - "media/**"
      - "build.gradle"
      - "settings.gradle"
      - ".gitmodules"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "NOTICE"
      - "eclipse-cdt.xml"
      - "scripts/**"
      - "ci/dependencies/**"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api29-runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AVD_NAME: auxio-api29
      ANDROID_API: "29"
      SYSTEM_IMAGE: system-images;android-29;google_apis;x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure isolated Android state
        shell: bash
        run: |
          printf 'ANDROID_USER_HOME=%s\n' "${RUNNER_TEMP}/android-user-home" >> "${GITHUB_ENV}"
          printf 'ANDROID_AVD_HOME=%s\n' "${RUNNER_TEMP}/android-avd-home" >> "${GITHUB_ENV}"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Ensure native and emulator tools are present
        shell: bash
        run: |
          missing=()
          command -v ninja >/dev/null 2>&1 || missing+=(ninja-build)
          command -v unzip >/dev/null 2>&1 || missing+=(unzip)
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_bin="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          avdmanager_bin="${sdk_root}/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "${sdkmanager_bin}" ]]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi
          if [[ ! -x "${avdmanager_bin}" ]]; then
            avdmanager_bin="$(command -v avdmanager || true)"
          fi
          if [[ -z "${sdkmanager_bin}" || ! -x "${sdkmanager_bin}" ]]; then
            echo "::error::sdkmanager was not found in the hosted Android SDK."
            exit 1
          fi
          if [[ -z "${avdmanager_bin}" || ! -x "${avdmanager_bin}" ]]; then
            echo "::error::avdmanager was not found in the hosted Android SDK."
            exit 1
          fi

          set +e
          yes | "${sdkmanager_bin}" --licenses >/dev/null 2>&1
          license_status=${PIPESTATUS[1]}
          set -e
          if [[ "${license_status}" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed with status ${license_status}."
            exit "${license_status}"
          fi
          "${sdkmanager_bin}" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-${ANDROID_API}" \
            "${SYSTEM_IMAGE}"

          emulator_bin="${sdk_root}/emulator/emulator"
          if [[ ! -x "${emulator_bin}" ]]; then
            emulator_bin="$(command -v emulator || true)"
          fi
          if [[ -z "${emulator_bin}" || ! -x "${emulator_bin}" ]]; then
            echo "::error::Android emulator binary was not found after SDK installation."
            exit 1
          fi
          printf 'SDKMANAGER_BIN=%s\n' "${sdkmanager_bin}" >> "${GITHUB_ENV}"
          printf 'AVDMANAGER_BIN=%s\n' "${avdmanager_bin}" >> "${GITHUB_ENV}"
          printf 'EMULATOR_BIN=%s\n' "${emulator_bin}" >> "${GITHUB_ENV}"

      - name: Create API 29 emulator
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          mkdir -p "${ANDROID_USER_HOME}" "${ANDROID_AVD_HOME}"
          touch "${ANDROID_USER_HOME}/repositories.cfg"
          avd_log="${RUNNER_TEMP}/avdmanager-create.log"
          set +e
          printf 'no\n' | "${AVDMANAGER_BIN}" create avd \
            --force \
            -n "${AVD_NAME}" \
            -k "${SYSTEM_IMAGE}" 2>&1 | tee "${avd_log}"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          avd_status="${pipeline_status[1]}"
          if [[ "${avd_status}" -ne 0 ]]; then
            echo "::error::avdmanager failed with status ${avd_status}."
            "${AVDMANAGER_BIN}" list avd 2>&1 | tee -a "${avd_log}" || true
            "${AVDMANAGER_BIN}" list target 2>&1 | tee -a "${avd_log}" || true
            exit "${avd_status}"
          fi
          avd_names="$("${EMULATOR_BIN}" -list-avds 2>&1 | tee -a "${avd_log}")"
          if ! grep -Fxq "${AVD_NAME}" <<<"${avd_names}"; then
            echo "::error::avdmanager reported success but ${AVD_NAME} is not runnable."
            "${AVDMANAGER_BIN}" list avd 2>&1 | tee -a "${avd_log}" || true
            find "${ANDROID_USER_HOME}" "${ANDROID_AVD_HOME}" -maxdepth 4 -print \
              2>&1 | tee -a "${avd_log}" || true
            exit 1
          fi

      - name: Start emulator and wait for Android 10
        shell: bash
        run: |
          emulator_log="${RUNNER_TEMP}/api29-emulator.log"
          nohup "${EMULATOR_BIN}" \
            -avd "${AVD_NAME}" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-save \
            -memory 2048 \
            -partition-size 2048 \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            >"${emulator_log}" 2>&1 &
          emulator_pid=$!
          printf '%s\n' "${emulator_pid}" > "${RUNNER_TEMP}/api29-emulator.pid"

          adb start-server
          device_ready=0
          for attempt in $(seq 1 120); do
            if adb get-state 2>/dev/null | grep -Fxq device; then
              device_ready=1
              break
            fi
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              echo "::error::API 29 emulator exited before becoming available to adb."
              tail -n 200 "${emulator_log}" || true
              exit 1
            fi
            sleep 2
          done
          if [[ "${device_ready}" -ne 1 ]]; then
            echo "::error::API 29 emulator did not become available to adb."
            tail -n 200 "${emulator_log}" || true
            exit 1
          fi

          booted=0
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              echo "::error::API 29 emulator exited before Android completed booting."
              tail -n 200 "${emulator_log}" || true
              exit 1
            fi
            sleep 2
          done
          if [[ "${booted}" -ne 1 ]]; then
            echo "::error::API 29 emulator did not finish booting."
            tail -n 200 "${emulator_log}" || true
            exit 1
          fi
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk | grep -Fx "29"

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Run API 29 compatibility and Room migration tests
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh \
            :app:connectedStandardDebugAndroidTest \
            :musikr:connectedDebugAndroidTest

      - name: Upload API 29 failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-api29-failure-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            musikr/build/reports/androidTests/**
            musikr/build/outputs/androidTest-results/**
            ${{ runner.temp }}/avdmanager-create.log
            ${{ runner.temp }}/api29-emulator.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [[ -f "${RUNNER_TEMP}/api29-emulator.pid" ]]; then
            pid="$(cat "${RUNNER_TEMP}/api29-emulator.pid")"
            kill "${pid}" >/dev/null 2>&1 || true
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Build debug APKs
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardDebug
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicDebug
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaDebug

      - name: Build release APKs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardRelease
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicRelease
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaRelease

      - name: Validate TS18 APK reference contracts
        shell: bash
        run: bash ./scripts/check-ts18-apk-reference-contracts.sh

      - name: Validate DoFun/Topway compatibility sources
        shell: bash
        run: bash ./scripts/check-dofun-topway-compat.sh

      - name: Upload failure reports
        id: failure_reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-build-reports
          path: |
            app/build/reports/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APKs
        id: debug_apks
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auxio-ts-debug-apks
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/outputs/apk/topwayTwMusic/debug/*.apk
            app/build/outputs/apk/topwayTwMedia/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Write build summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          REPORTS_URL: ${{ steps.failure_reports.outputs.artifact-url }}
          DEBUG_APKS_URL: ${{ steps.debug_apks.outputs.artifact-url }}
        run: |
          {
            echo "## Android Build"
            echo
            echo "- Result: \`${JOB_STATUS}\`"
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [[ -n "${REPORTS_URL}" ]]; then
              echo "- Failure reports: ${REPORTS_URL}"
            fi
            if [[ -n "${DEBUG_APKS_URL}" ]]; then
              echo "- Debug APKs: ${DEBUG_APKS_URL}"
            elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "- Debug APK upload: skipped for pull requests; dispatch this workflow manually on the branch when installable debug artifacts are needed."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
