name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'musikr/**'
      - 'media'
      - 'media/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.gitmodules'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'NOTICE'
      - 'eclipse-cdt.xml'
      - 'scripts/**'
      - 'ci/dependencies/**'
      - '.github/dependabot.yml'
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'musikr/**'
      - 'media'
      - 'media/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.gitmodules'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'NOTICE'
      - 'eclipse-cdt.xml'
      - 'scripts/**'
      - 'ci/dependencies/**'
      - '.github/dependabot.yml'
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        # fetch-depth: 0 (full history) is required here.
        # The nested ffmpeg submodule resolves primarily through the GitHub
        # mirror, but full history ensures all unadvertised objects and
        # submodule gitlink commits remain reachable during verification.
        fetch-depth: 0
        submodules: false
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"
    - name: Write local.properties for Android SDK
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "${sdk_dir}" ]; then
          echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
          exit 1
        fi
        printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        # PRs must not write to the shared Gradle cache; pushes to dev may write.
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - name: Ensure native build tools are present
      run: |
        if ! command -v ninja >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ninja-build
        fi
    - name: Prepare CI environment
      shell: bash
      run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
    - name: Build standard debug APK with Gradle
      run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleStandardDebug
    - name: Build Topway/DoFun debug APK with Gradle
      run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleTopwayTwMusicDebug :app:assembleTopwayTwMediaDebug
    - name: Build release APKs with Gradle
      run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleStandardRelease :app:assembleTopwayTwMusicRelease :app:assembleTopwayTwMediaRelease
    - name: Validate TS18 APK reference contracts
      run: bash ./scripts/check-ts18-apk-reference-contracts.sh
    - name: Validate DoFun/Topway compatibility sources
      run: bash ./scripts/check-dofun-topway-compat.sh
    - name: Upload build reports
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: android-build-reports
        path: |
          app/build/reports/**
          build/reports/problems/**
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload build diagnostics (always)
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: android-build-diagnostics
        path: |
          build/reports/problems/**
        if-no-files-found: ignore
        retention-days: 3
    - name: Upload debug APK artifact
      if: success()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: auxio-ts-debug-apks
        path: |
          ./app/build/outputs/apk/standard/debug/*.apk
          ./app/build/outputs/apk/topwayTwMusic/debug/*.apk
          ./app/build/outputs/apk/topwayTwMedia/debug/*.apk
        if-no-files-found: error
        retention-days: 7
