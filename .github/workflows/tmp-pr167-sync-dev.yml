name: Temporary PR167 dev sync

on:
  pull_request:
    types: [synchronize]
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: tmp-pr167-sync-dev
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.number == 167
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix-startup-routing-11126370068088722538
          fetch-depth: 0
          persist-credentials: false

      - name: Remove this workflow from dev, then merge latest dev into PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin dev

          clean_worktree="${RUNNER_TEMP}/dev-clean"
          git worktree add --detach "${clean_worktree}" origin/dev
          git -C "${clean_worktree}" config user.name 'github-actions[bot]'
          git -C "${clean_worktree}" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "${clean_worktree}/.github/workflows/tmp-pr167-sync-dev.yml"
          git -C "${clean_worktree}" add -A
          git -C "${clean_worktree}" commit -m 'ci: remove temporary PR167 dev sync'
          git -C "${clean_worktree}" push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:dev

          git fetch origin dev
          git merge --no-edit origin/dev
          rm -f .github/pr167-sync-trigger .github/pr167-finaliser-error.txt
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove PR167 sync artifacts'
          fi
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:fix-startup-routing-11126370068088722538
