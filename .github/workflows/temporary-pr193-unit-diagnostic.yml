name: Temporary PR193 unit diagnostic

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: temporary-pr193-unit-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ github.head_ref == 'release-ready-fixes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Ensure native build tools are present
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile jvm-tests

      - name: Run unit tests and capture diagnostic
        id: unit
        shell: bash
        run: |
          log_file="${RUNNER_TEMP}/pr193-unit.log"
          set +e
          bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest :musikr:testDebugUnitTest >"${log_file}" 2>&1
          rc=$?
          set -e

          {
            printf 'exit_status=%s\n\n' "${rc}"
            printf '%s\n' '=== compiler/test failure matches ==='
            grep -nEi '(^|[[:space:]])(e:|error:|FAILED|FAILURE:|Exception|does not implement|expected:|but was:|AssertionError)' "${log_file}" | tail -n 240 || true
            printf '\n%s\n' '=== final 320 log lines ==='
            tail -n 320 "${log_file}"
          } > "${RUNNER_TEMP}/pr193-unit-diagnostic.txt"

          cat "${RUNNER_TEMP}/pr193-unit-diagnostic.txt"
          printf 'exit_status=%s\n' "${rc}" >> "${GITHUB_OUTPUT}"

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr193-unit-diagnostic
          path: ${{ runner.temp }}/pr193-unit-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve failure status
        if: always()
        shell: bash
        run: |
          rc='${{ steps.unit.outputs.exit_status }}'
          if [[ -z "${rc}" || "${rc}" != "0" ]]; then
            exit "${rc:-1}"
          fi
