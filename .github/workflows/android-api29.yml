name: Android 10 Compatibility

on:
  pull_request:
    branches: [dev]
    paths:
      - "app/**"
      - "musikr/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "scripts/bootstrap-dependencies.sh"
      - ".github/workflows/android-api29.yml"
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "musikr/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "scripts/bootstrap-dependencies.sh"
      - ".github/workflows/android-api29.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-api29-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api29-runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AVD_NAME: auxio-api29
      ANDROID_API: "29"
      SYSTEM_IMAGE: system-images;android-29;google_apis;x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Ensure native and emulator tools are present
        shell: bash
        run: |
          missing=()
          command -v ninja >/dev/null 2>&1 || missing+=(ninja-build)
          command -v unzip >/dev/null 2>&1 || missing+=(unzip)
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_bin="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          avdmanager_bin="${sdk_root}/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "${sdkmanager_bin}" ]]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi
          if [[ ! -x "${avdmanager_bin}" ]]; then
            avdmanager_bin="$(command -v avdmanager || true)"
          fi
          if [[ -z "${sdkmanager_bin}" || ! -x "${sdkmanager_bin}" ]]; then
            echo "::error::sdkmanager was not found in the hosted Android SDK."
            exit 1
          fi
          if [[ -z "${avdmanager_bin}" || ! -x "${avdmanager_bin}" ]]; then
            echo "::error::avdmanager was not found in the hosted Android SDK."
            exit 1
          fi
          printf 'SDKMANAGER_BIN=%s\n' "${sdkmanager_bin}" >> "${GITHUB_ENV}"
          printf 'AVDMANAGER_BIN=%s\n' "${avdmanager_bin}" >> "${GITHUB_ENV}"

          set +e
          yes | "${sdkmanager_bin}" --licenses >/dev/null 2>&1
          license_status=${PIPESTATUS[1]}
          set -e
          if [[ "${license_status}" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed with status ${license_status}."
            exit "${license_status}"
          fi
          "${sdkmanager_bin}" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-${ANDROID_API}" \
            "${SYSTEM_IMAGE}"

      - name: Create API 29 emulator
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          mkdir -p "${HOME}/.android"
          touch "${HOME}/.android/repositories.cfg"
          set +e
          printf 'no\n' | "${AVDMANAGER_BIN}" create avd \
            --force \
            -n "${AVD_NAME}" \
            -k "${SYSTEM_IMAGE}"
          avd_status=${PIPESTATUS[1]}
          set -e
          if [[ "${avd_status}" -ne 0 ]]; then
            echo "::error::avdmanager failed with status ${avd_status}."
            "${AVDMANAGER_BIN}" list avd || true
            "${AVDMANAGER_BIN}" list target || true
            exit "${avd_status}"
          fi
          avd_dir="${HOME}/.android/avd/${AVD_NAME}.avd"
          if [[ ! -d "${avd_dir}" ]]; then
            echo "::error::avdmanager reported success but ${avd_dir} was not created."
            exit 1
          fi
          cat >> "${avd_dir}/config.ini" <<'EOF'
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          disk.dataPartition.size=2048M
          EOF

      - name: Start emulator and wait for Android 10
        shell: bash
        run: |
          emulator_log="${RUNNER_TEMP}/api29-emulator.log"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          emulator_bin="${sdk_root}/emulator/emulator"
          if [[ ! -x "${emulator_bin}" ]]; then
            emulator_bin="$(command -v emulator || true)"
          fi
          if [[ -z "${emulator_bin}" || ! -x "${emulator_bin}" ]]; then
            echo "::error::Android emulator binary was not found."
            exit 1
          fi
          nohup "${emulator_bin}" \
            -avd "${AVD_NAME}" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            >"${emulator_log}" 2>&1 &
          echo $! > "${RUNNER_TEMP}/api29-emulator.pid"

          adb wait-for-device
          booted=0
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [[ "${booted}" -ne 1 ]]; then
            echo "::error::API 29 emulator did not finish booting."
            tail -n 200 "${emulator_log}" || true
            exit 1
          fi
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk | grep -Fx "29"

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Run API 29 compatibility and Room migration tests
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh \
            :app:connectedStandardDebugAndroidTest \
            :musikr:connectedDebugAndroidTest

      - name: Upload API 29 failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-api29-failure-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            musikr/build/reports/androidTests/**
            musikr/build/outputs/androidTest-results/**
            ${{ runner.temp }}/api29-emulator.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [[ -f "${RUNNER_TEMP}/api29-emulator.pid" ]]; then
            pid="$(cat "${RUNNER_TEMP}/api29-emulator.pid")"
            kill "${pid}" >/dev/null 2>&1 || true
          fi
