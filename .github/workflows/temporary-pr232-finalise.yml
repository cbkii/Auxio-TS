name: Temporary PR 232 authority finaliser

on:
  push:
    branches:
      - copilot/reintroduce-incremental-performance

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: copilot/reintroduce-incremental-performance
          fetch-depth: 2

      - name: Apply fail-closed source authority repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"STOP: expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          def write_new(path: str, content: str) -> None:
              target = Path(path)
              if target.exists():
                  raise SystemExit(f"STOP: refusing to replace existing file {path}")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          store = "musikr/src/main/java/org/oxycblt/musikr/cache/db/IncrementalScanStore.kt"
          replace_once(
              store,
              """                if (\n                    ledger.sourceKey !in currentSourceKeys && ledger.lastCommittedGeneration != null\n                ) {\n""",
              """                if (\n                    ledger.available &&\n                        ledger.sourceKey !in currentSourceKeys &&\n                        ledger.lastCommittedGeneration != null\n                ) {\n""",
          )
          replace_once(
              store,
              """                            .copy(\n                                // A transient unmount must not hide the last committed generation.\n                                available = snapshot.available || previous.available\n                            )\n""",
              """                            .copy(\n                                // Planning may observe physical availability, but only a successful\n                                // source-generation commit may change committed visibility. This\n                                // keeps an active source readable through a transient unmount and\n                                // keeps a user-removed source hidden until a re-add succeeds.\n                                available =\n                                    if (previous.lastCommittedGeneration != null) {\n                                        previous.available\n                                    } else {\n                                        snapshot.available\n                                    }\n                            )\n""",
          )

          musikr = "musikr/src/main/java/org/oxycblt/musikr/Musikr.kt"
          replace_once(
              musikr,
              "                failedSources = commit?.failedSources.orEmpty(),\n",
              "                failedSources = IncrementalResultFailurePolicy.effectiveFailures(commit),\n",
          )

          test = "musikr/src/test/java/org/oxycblt/musikr/cache/db/IncrementalScanStoreTest.kt"
          replace_once(
              test,
              """    @Test\n    fun `removal-only configuration commits deterministically`() = runBlocking {\n        val source = snapshot(\"v1\")\n        val first = store.planScan(listOf(source), false, MetadataProfile.LEAN, 1L)\n        store.beginScan(first)\n        store.stage(cachedFile(\"alpha.mp3\", 1L))\n        store.commitScan()\n\n        val removal = store.planScan(emptyList(), true, MetadataProfile.LEAN, 2L)\n        assertTrue(removal.hasWork)\n        assertEquals(setOf(source.sourceKey), removal.removedSourceKeys)\n        store.beginScan(removal)\n        val commit = store.commitScan()\n\n        assertEquals(setOf(source.sourceKey), commit.removedSources)\n        assertEquals(0, db.incrementalLibraryDao().songCount())\n        assertEquals(1, db.readDao().selectAllSongs().size)\n    }\n""",
              """    @Test\n    fun `removal-only configuration commits deterministically`() = runBlocking {\n        val source = snapshot(\"v1\")\n        val first = store.planScan(listOf(source), false, MetadataProfile.LEAN, 1L)\n        store.beginScan(first)\n        store.stage(cachedFile(\"alpha.mp3\", 1L))\n        store.commitScan()\n\n        val removal = store.planScan(emptyList(), true, MetadataProfile.LEAN, 2L)\n        assertTrue(removal.hasWork)\n        assertEquals(setOf(source.sourceKey), removal.removedSourceKeys)\n        store.beginScan(removal)\n        val commit = store.commitScan()\n\n        assertEquals(setOf(source.sourceKey), commit.removedSources)\n        assertEquals(0, db.incrementalLibraryDao().songCount())\n        assertEquals(1, db.readDao().selectAllSongs().size)\n\n        val repeated = store.planScan(emptyList(), true, MetadataProfile.LEAN, 2L)\n        assertFalse(repeated.hasWork)\n        assertTrue(repeated.removedSourceKeys.isEmpty())\n    }\n""",
          )
          replace_once(
              test,
              """    @Test\n    fun `temporary unmount preserves the committed generation as unresolved`() = runBlocking {\n""",
              """    @Test\n    fun `failed re-add keeps a committed removal hidden until success`() = runBlocking {\n        val source = snapshot(\"v1\")\n        val initial = store.planScan(listOf(source), false, MetadataProfile.LEAN, 1L)\n        store.beginScan(initial)\n        store.stage(cachedFile(\"alpha.mp3\", 1L))\n        store.commitScan()\n\n        val removal = store.planScan(emptyList(), true, MetadataProfile.LEAN, 2L)\n        store.beginScan(removal)\n        store.commitScan()\n        assertFalse(db.incrementalDao().sourceLedger(source.sourceKey)?.available ?: true)\n        assertTrue(store.compatibilityCachedFiles().toList().isEmpty())\n\n        val readded = source.copy(fingerprint = \"v2\")\n        val failedPlan = store.planScan(listOf(readded), false, MetadataProfile.LEAN, 3L)\n        assertFalse(db.incrementalDao().sourceLedger(source.sourceKey)?.available ?: true)\n        assertTrue(store.compatibilityCachedFiles().toList().isEmpty())\n        store.beginScan(failedPlan)\n        store.markSourceFailed(source.sourceKey, \"re-add failed\")\n        store.commitScan()\n\n        assertFalse(db.incrementalDao().sourceLedger(source.sourceKey)?.available ?: true)\n        assertTrue(store.compatibilityCachedFiles().toList().isEmpty())\n\n        val successfulPlan =\n            store.planScan(listOf(readded), false, MetadataProfile.LEAN, 3L)\n        store.beginScan(successfulPlan)\n        store.stage(cachedFile(\"alpha.mp3\", 2L))\n        store.commitScan()\n\n        assertTrue(db.incrementalDao().sourceLedger(source.sourceKey)?.available == true)\n        assertEquals(1, store.compatibilityCachedFiles().toList().size)\n    }\n\n    @Test\n    fun `temporary unmount preserves the committed generation as unresolved`() = runBlocking {\n""",
          )

          write_new(
              "musikr/src/main/java/org/oxycblt/musikr/IncrementalResultFailurePolicy.kt",
              '''/*
           * Copyright (c) 2026 Auxio Project
           * IncrementalResultFailurePolicy.kt is part of Auxio.
           *
           * This program is free software: you can redistribute it and/or modify
           * it under the terms of the GNU General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           *
           * This program is distributed in the hope that it will be useful,
           * but WITHOUT ANY WARRANTY; without even the implied warranty of
           * MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
           * GNU General Public License for more details.
           *
           * You should have received a copy of the GNU General Public License
           * along with this program.  If not, see <https://www.gnu.org/licenses/>.
           */

          package org.oxycblt.musikr

          import org.oxycblt.musikr.cache.IncrementalScanCommit

          /** Converts non-publication scan evidence into truthful repository-visible failures. */
          internal object IncrementalResultFailurePolicy {
              fun effectiveFailures(commit: IncrementalScanCommit?): Map<String, String> {
                  if (commit == null) return emptyMap()
                  val failures = LinkedHashMap(commit.failedSources)
                  for (sourceKey in commit.unavailableSources) {
                      failures.putIfAbsent(
                          sourceKey,
                          "TEMPORARILY_UNAVAILABLE|Source preflight did not observe this source",
                      )
                  }
                  if (commit.enrichmentOnly && !commit.enrichmentComplete) {
                      for (sourceKey in commit.committedSources) {
                          failures.putIfAbsent(
                              sourceKey,
                              "ENRICHMENT_INCOMPLETE|Optional metadata did not cover membership",
                          )
                      }
                  }
                  return failures
              }
          }
          '''.replace("          ", "", 1),
          )

          write_new(
              "musikr/src/test/java/org/oxycblt/musikr/IncrementalResultFailurePolicyTest.kt",
              '''/*
           * Copyright (c) 2026 Auxio Project
           * IncrementalResultFailurePolicyTest.kt is part of Auxio.
           *
           * This program is free software: you can redistribute it and/or modify
           * it under the terms of the GNU General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           *
           * This program is distributed in the hope that it will be useful,
           * but WITHOUT ANY WARRANTY; without even the implied warranty of
           * MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
           * GNU General Public License for more details.
           *
           * You should have received a copy of the GNU General Public License
           * along with this program.  If not, see <https://www.gnu.org/licenses/>.
           */

          package org.oxycblt.musikr

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.oxycblt.musikr.cache.IncrementalScanCommit
          import org.oxycblt.musikr.library.MetadataProfile

          class IncrementalResultFailurePolicyTest {
              @Test
              fun `unobserved sources become temporary failures without replacing real failures`() {
                  val commit =
                      commit(
                          failedSources = mapOf("failed" to "TRUNCATED|limit"),
                          unavailableSources = setOf("failed", "absent"),
                      )

                  val failures = IncrementalResultFailurePolicy.effectiveFailures(commit)

                  assertEquals("TRUNCATED|limit", failures["failed"])
                  assertTrue(failures.getValue("absent").startsWith("TEMPORARILY_UNAVAILABLE|"))
              }

              @Test
              fun `incomplete enrichment is visible as a partial optional result`() {
                  val commit =
                      commit(
                          committedSources = setOf("source"),
                          enrichmentOnly = true,
                          enrichmentComplete = false,
                      )

                  val failures = IncrementalResultFailurePolicy.effectiveFailures(commit)

                  assertTrue(failures.getValue("source").startsWith("ENRICHMENT_INCOMPLETE|"))
              }

              private fun commit(
                  committedSources: Set<String> = emptySet(),
                  unavailableSources: Set<String> = emptySet(),
                  failedSources: Map<String, String> = emptyMap(),
                  enrichmentOnly: Boolean = false,
                  enrichmentComplete: Boolean = true,
              ) =
                  IncrementalScanCommit(
                      scanId = "scan",
                      committedSources = committedSources,
                      reusedSources = emptySet(),
                      unavailableSources = unavailableSources,
                      failedSources = failedSources,
                      changedRows = 0,
                      removedRows = 0,
                      metadataProfile = MetadataProfile.FULL,
                      enrichmentOnly = enrichmentOnly,
                      enrichmentComplete = enrichmentComplete,
                  )
          }
          '''.replace("          ", "", 1),
          )

          write_new(
              "app/src/test/java/org/oxycblt/auxio/music/SourceAvailabilityOutcomePolicyTest.kt",
              '''/*
           * Copyright (c) 2026 Auxio Project
           * SourceAvailabilityOutcomePolicyTest.kt is part of Auxio.
           *
           * This program is free software: you can redistribute it and/or modify
           * it under the terms of the GNU General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           *
           * This program is distributed in the hope that it will be useful,
           * but WITHOUT ANY WARRANTY; without even the implied warranty of
           * MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
           * GNU General Public License for more details.
           *
           * You should have received a copy of the GNU General Public License
           * along with this program.  If not, see <https://www.gnu.org/licenses/>.
           */

          package org.oxycblt.auxio.music

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class SourceAvailabilityOutcomePolicyTest {
              @Test
              fun `retained rows do not turn an unobserved source into full success`() {
                  val outcome =
                      SourceScanOutcome.classify(
                          configuredSourceKeys = setOf("usb0"),
                          failedSources =
                              mapOf("usb0" to "TEMPORARILY_UNAVAILABLE|preflight unavailable"),
                          songCount = 1,
                      )

                  assertEquals(
                      SourceScanOutcome.Partial(emptySet(), setOf("usb0")),
                      outcome,
                  )
              }

              @Test
              fun `healthy sibling remains committed while unavailable source is unresolved`() {
                  val outcome =
                      SourceScanOutcome.classify(
                          configuredSourceKeys = setOf("usb0", "usb1"),
                          failedSources =
                              mapOf("usb0" to "TEMPORARILY_UNAVAILABLE|preflight unavailable"),
                          songCount = 1,
                      )

                  assertEquals(
                      SourceScanOutcome.Partial(setOf("usb1"), setOf("usb0")),
                      outcome,
                  )
              }

              @Test
              fun `all unavailable without readable rows remains retryable`() {
                  val outcome =
                      SourceScanOutcome.classify(
                          configuredSourceKeys = setOf("usb0"),
                          failedSources =
                              mapOf("usb0" to "TEMPORARILY_UNAVAILABLE|preflight unavailable"),
                          songCount = 0,
                      )

                  assertTrue(outcome is SourceScanOutcome.TemporarilyUnavailable)
                  assertEquals(setOf("usb0"), outcome.unresolvedSourceKeys)
              }
          }
          '''.replace("          ", "", 1),
          )
          PY

          git diff --check
          git rm .github/workflows/temporary-pr232-finalise.yml

      - name: Commit repaired authority contracts
        shell: bash
        env:
          BRANCH: copilot/reintroduce-incremental-performance
        run: |
          git config user.name "cbkii"
          git config user.email "150587541+cbkii@users.noreply.github.com"
          git add app musikr .github/workflows/temporary-pr232-finalise.yml
          git commit -m "Harden removal visibility and unavailable-source outcomes"
          git push origin "HEAD:${BRANCH}"
