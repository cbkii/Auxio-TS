name: Temporary PR196 formatter

on:
  push:
    branches:
      - fix/first-launch-source-recovery
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: tmp-pr196-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          submodules: false
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties for Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Apply repository formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply
      - name: Collect formatted changed sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formatted
          git diff --name-only -z | while IFS= read -r -d '' path; do
            mkdir -p "formatted/$(dirname "${path}")"
            cp "${path}" "formatted/${path}"
          done
          git diff --check
          git diff --stat
      - name: Upload formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr196-formatted-sources
          path: formatted/**
          if-no-files-found: error
          retention-days: 1
