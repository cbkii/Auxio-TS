name: Temporary PR196 formatting finalizer

on:
  pull_request:
    branches:
      - feat/ts18-dofun-generic-media-compat

permissions:
  contents: write

concurrency:
  group: tmp-pr196-format-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-and-clean:
    if: >-
      github.repository == 'cbkii/Auxio-TS' &&
      github.event.pull_request.number == 196 &&
      github.event.pull_request.head.ref == 'fix/first-launch-source-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final narrow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C fix/first-launch-source-recovery

          python3 <<'PY'
          from pathlib import Path

          direct = Path('musikr/src/main/java/org/oxycblt/musikr/fs/direct/DirectFS.kt')
          text = direct.read_text(encoding='utf-8')
          start = text.find('    private fun parseRootEntry(')
          end = text.find('    private fun getMimeType(', start)
          if start >= 0 and end > start:
              text = text[:start] + text[end:]
          start = text.find('        fun shellQuote(')
          end = text.find('        fun isSymbolicLinkCompat(', start)
          if start >= 0 and end > start:
              text = text[:start] + text[end:]
          direct.write_text(text, encoding='utf-8', newline='\n')

          test = Path('musikr/src/test/java/org/oxycblt/musikr/fs/direct/DirectFsRootPolicyTest.kt')
          text = test.read_text(encoding='utf-8')
          text = text.replace('import org.junit.Assert.assertEquals\n', '')
          text = text.replace('import org.oxycblt.musikr.fs.direct.DirectFS.Companion.shellQuote\n', '')
          for name in ('testShellQuoteEscapesSingleQuotes', 'testShellQuoteContainsShellMetacharacters'):
              marker = f'    @Test\n    fun {name}()'
              start = text.find(marker)
              if start >= 0:
                  next_test = text.find('    @Test\n', start + len(marker))
                  class_end = text.rfind('\n}')
                  end = next_test if next_test >= 0 else class_end
                  text = text[:start] + text[end:]
          test.write_text(text, encoding='utf-8', newline='\n')

          layout = Path('app/src/main/res/layout/fragment_home_list.xml')
          text = layout.read_text(encoding='utf-8')
          text = text.replace(
              '                android:padding="@dimen/spacing_medium"\n >',
              '                android:padding="@dimen/spacing_medium">',
          )
          layout.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - name: Write local.properties
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply project Kotlin formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessKotlinApply

      - name: Validate and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/tmp-pr196-format-final.yml
          if find . -path './.git' -prune -o -type f -name '*tmp-pr196*' -print | grep -q .; then
            echo '::error::Temporary PR196 files remain.'
            find . -path './.git' -prune -o -type f -name '*tmp-pr196*' -print
            exit 1
          fi
          git status --short
          git diff --stat

      - name: Commit formatted final tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'style: finalise PR196 formatting and cleanup'
          git push origin HEAD:fix/first-launch-source-recovery
