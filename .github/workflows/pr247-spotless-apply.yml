name: PR 247 Spotless Apply

on:
  push:
    branches:
      - agent/now-playing-fast-resume-ui

permissions:
  contents: write

concurrency:
  group: pr247-spotless-apply
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'cbkii/Auxio-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/now-playing-fast-resume-ui
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Ensure native build tools are present
        shell: bash
        run: |
          if command -v ninja >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply and verify Kotlin formatting
        shell: bash
        run: |
          status=0
          bash ./scripts/ci-gradle.sh spotlessKotlinApply || status=$?
          if ((status != 0)); then
            echo "::error::spotlessKotlinApply failed with status ${status}."
            exit "${status}"
          fi

          bash ./scripts/ci-gradle.sh spotlessKotlinCheck || status=$?
          if ((status != 0)); then
            echo "::error::spotlessKotlinCheck failed with status ${status}."
            exit "${status}"
          fi

          git diff --check || exit $?

          unexpected=0
          while IFS= read -r path; do
            case "${path}" in
              app/src/main/java/org/oxycblt/auxio/playback/PlaybackPanelFragment.kt|\
              app/src/main/java/org/oxycblt/auxio/playback/PlaybackViewModel.kt|\
              app/src/main/java/org/oxycblt/auxio/playback/queue/QueueViewModel.kt|\
              app/src/main/java/org/oxycblt/auxio/playback/ui/swiper/CoverPagerAdapter.kt|\
              app/src/main/java/org/oxycblt/auxio/playback/ui/swiper/PlaybackPagerItem.kt|\
              app/src/test/java/org/oxycblt/auxio/playback/PlaybackViewModelFastResumeTest.kt|\
              app/src/test/java/org/oxycblt/auxio/playback/queue/QueueViewModelFastResumeTest.kt|\
              app/src/test/java/org/oxycblt/auxio/playback/ui/swiper/PlaybackPagerProjectionTest.kt)
                ;;
              *)
                echo "::error::Unexpected formatter mutation: ${path}"
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only)
          ((unexpected == 0)) || exit 1

      - name: Commit exact formatted sources and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/org/oxycblt/auxio/playback/PlaybackPanelFragment.kt \
            app/src/main/java/org/oxycblt/auxio/playback/PlaybackViewModel.kt \
            app/src/main/java/org/oxycblt/auxio/playback/queue/QueueViewModel.kt \
            app/src/main/java/org/oxycblt/auxio/playback/ui/swiper/CoverPagerAdapter.kt \
            app/src/main/java/org/oxycblt/auxio/playback/ui/swiper/PlaybackPagerItem.kt \
            app/src/test/java/org/oxycblt/auxio/playback/PlaybackViewModelFastResumeTest.kt \
            app/src/test/java/org/oxycblt/auxio/playback/queue/QueueViewModelFastResumeTest.kt \
            app/src/test/java/org/oxycblt/auxio/playback/ui/swiper/PlaybackPagerProjectionTest.kt
          git rm .github/workflows/pr247-spotless-apply.yml
          git diff --cached --check || exit $?
          git commit -m "style: apply exact PR 247 Kotlin formatting" || exit $?
          git push origin HEAD:agent/now-playing-fast-resume-ui
