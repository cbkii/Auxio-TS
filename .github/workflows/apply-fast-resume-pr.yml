name: Bootstrap Fast Resume finalisation on PR

on:
  pull_request:
    branches:
      - dev
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply scoped source patch from bootstrap recipe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          recipe = Path('.github/workflows/apply-fast-resume-finalisation.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(recipe) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(recipe)) if recipe[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in recipe[start:end])
          namespace = {'__name__': '__main__'}
          exec(compile(script, 'fast-resume-finalisation-bootstrap', 'exec'), namespace)
          Path('.github/workflows/apply-fast-resume-pr.yml').unlink(missing_ok=True)
          PY

      - name: Commit finalised implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalise Fast Resume promotion and visualizer recovery"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
