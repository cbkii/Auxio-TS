name: Bootstrap Fast Resume finalisation on PR

on:
  pull_request:
    branches:
      - dev
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply scoped source patch
        shell: bash
        run: |
          python3 scripts/apply-fast-resume-finalisation.py
          rm -f scripts/apply-fast-resume-finalisation.py
          rm -f .github/workflows/apply-fast-resume-finalisation.yml
          rm -f .github/workflows/apply-fast-resume-pr.yml

      - name: Commit finalised implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalise Fast Resume promotion and visualizer recovery"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
