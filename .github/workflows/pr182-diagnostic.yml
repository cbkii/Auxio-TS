name: PR 182 diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - cx/create-fast-interaction-startup-pr
    paths:
      - ".github/workflows/pr182-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not set" | tee pr182-diagnostic.log
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Capture compile, unit-test and lint output
        id: diagnostic
        shell: bash
        run: |
          set +e
          bash ./scripts/ci-gradle.sh \
            :musikr:compileDebugKotlin \
            :app:compileStandardDebugKotlin \
            :app:testStandardDebugUnitTest \
            :musikr:testDebugUnitTest \
            :app:lintStandardDebug \
            --stacktrace 2>&1 | tee pr182-diagnostic.log
          rc=${PIPESTATUS[0]}
          printf '\nGRADLE_EXIT_CODE=%s\n' "${rc}" | tee -a pr182-diagnostic.log
          exit "${rc}"

      - name: Upload complete diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr182-diagnostic-log
          path: pr182-diagnostic.log
          if-no-files-found: error
          retention-days: 3
