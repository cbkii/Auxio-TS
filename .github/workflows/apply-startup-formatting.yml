name: Apply startup formatting repair

on:
  push:
    branches:
      - cx/startup-profiles-benchmarks
    paths:
      - ".github/workflows/apply-startup-formatting.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/startup-profiles-benchmarks
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact formatter output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_once(
              'app/src/main/java/org/oxycblt/auxio/headunit/ts18/RawFastResume.kt',
              '!isAllowedDirectPath(normalized) &&\n                !isAllowedBenchmarkFixturePath(context, normalized)',
              '!isAllowedDirectPath(normalized) && !isAllowedBenchmarkFixturePath(context, normalized)',
          )
          replace_once(
              'app/src/main/java/org/oxycblt/auxio/headunit/ts18/RawFastResume.kt',
              'FastStartDirectFolderBrowser.benchmarkRoot(context, sourceIndex)\n                        .canonicalFile',
              'FastStartDirectFolderBrowser.benchmarkRoot(context, sourceIndex).canonicalFile',
          )
          replace_once(
              'startup-benchmark/src/main/java/org/oxycblt/auxio/startupbenchmark/CriticalJourneys.kt',
              'clickAtCenterRequired(\n                By.textStartsWith("▶"),\n                "playable USB $sourceIndex fixture",\n            )',
              'clickAtCenterRequired(By.textStartsWith("▶"), "playable USB $sourceIndex fixture")',
          )
          Path('.github/workflows/apply-startup-formatting.yml').unlink()
          PY
          git diff --check
      - name: Commit and push
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add --all
          git commit -m "style: apply startup benchmark formatting"
          git push origin HEAD:cx/startup-profiles-benchmarks
