name: Format PR branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to format
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: format-pr-branch-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  spotless-apply:
    name: Run Spotless apply when needed
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Refuse protected/default branch names
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.branch }}" in
          dev|main|master)
            echo "::error::Refusing to auto-format protected/default branch: ${{ inputs.branch }}"
            exit 1
            ;;
        esac

    - name: Check for Codex-owned PR branch
      id: codex_guard
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_BRANCH: ${{ inputs.branch }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        echo "Checking whether '${INPUT_BRANCH}' is a Codex-owned PR branch before any checkout, formatter, commit, or push step."

        pr_json="$(
          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${INPUT_BRANCH}" \
            --state open \
            --json number,url,title,body,headRefName,headRefOid,author
        )"

        if [[ "$(jq 'length' <<<"${pr_json}")" -eq 0 ]]; then
          echo "gh pr list returned no matching open PRs; falling back to REST API branch filtering."
          pr_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq "[.[] | select(.head.repo.full_name == \"${GITHUB_REPOSITORY}\" and .head.ref == \"${INPUT_BRANCH}\") | {number, url: .html_url, title, body, headRefName: .head.ref, headRefOid: .head.sha, author: .user.login}]"
          )"
        fi

        pr_count="$(jq 'length' <<<"${pr_json}")"
        if [[ "${pr_count}" -gt 1 ]]; then
          echo "::warning::Found ${pr_count} open PRs for branch '${INPUT_BRANCH}'. Using the first match for Codex protection."
        fi

        pr_number="$(jq -r '.[0].number // empty' <<<"${pr_json}")"
        pr_url="$(jq -r '.[0].url // empty' <<<"${pr_json}")"
        pr_title="$(jq -r '.[0].title // empty' <<<"${pr_json}")"
        pr_body="$(jq -r '.[0].body // empty' <<<"${pr_json}")"
        pr_head_sha="$(jq -r '.[0].headRefOid // empty' <<<"${pr_json}")"
        head_ref="$(jq -r '.[0].headRefName // empty' <<<"${pr_json}")"

        codex_owned=false
        reason=""
        if [[ "${INPUT_BRANCH}" == cx/* ]]; then
          codex_owned=true
          reason="branch name starts with cx/"
        elif [[ -n "${pr_number}" ]]; then
          combined="${pr_title}
        ${pr_body}"
          if grep -Eiq 'Codex Task|chatgpt\.com/codex|created by Codex|Codex-owned|Codex PR|generated by Codex|opened by Codex' <<<"${combined}"; then
            codex_owned=true
            reason="matching open PR title/body indicates Codex ownership"
          fi
        fi

        {
          echo "codex_owned=${codex_owned}"
          echo "pr_number=${pr_number}"
          echo "pr_url=${pr_url}"
          echo "head_sha=${pr_head_sha}"
        } >> "${GITHUB_OUTPUT}"

        if [[ "${codex_owned}" != "true" ]]; then
          echo "Codex protection checked: branch '${INPUT_BRANCH}' is not classified as Codex-owned."
          exit 0
        fi

        echo "::warning::Codex-owned PR branch detected (${reason}). This workflow will not run spotlessApply, commit, or push."

        marker='<!-- auxio-ts-codex-safe-formatting-manual -->'
        body="$(mktemp)"
        cat > "${body}" <<EOF
        ${marker}
        ### Manual formatting required — Codex branch protected

        This PR appears to be Codex-owned.

        Detected branch: \`${INPUT_BRANCH}\`
        Detected PR: #${pr_number} ${pr_url}
        Current head: \`${pr_head_sha}\`

        I did **not** run \`spotlessApply\`, commit, or push because moving a Codex PR branch outside Codex prevents Codex from updating the PR later.

        Reason: ${reason}.

        Formatter workflow run: ${RUN_URL}

        Run formatting manually when you are ready to accept a non-Codex update:

        \`\`\`bash
        gh pr checkout ${pr_number}
        bash ./scripts/bootstrap-dependencies.sh --profile full-build
        bash ./scripts/ci-gradle.sh spotlessCheck
        bash ./scripts/ci-gradle.sh spotlessApply
        git diff --check
        git status --short
        git add -A
        git commit -m "Apply Spotless formatting"
        git push
        \`\`\`

        Or ask Codex to apply the formatting in a fresh PR.

        ⚠️ Running the old autoformatter workflow on this branch would move the PR head outside Codex and can prevent Codex from updating the PR later.
        EOF

        if [[ -z "${pr_number}" ]]; then
          echo "Codex branch-name protection applied without a matching open PR; no PR comment was posted."
          exit 0
        fi

        comment_body="$(cat "${body}")"
        existing_id="$(
          gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | tail -n 1
        )"

        if [[ -n "${existing_id}" ]]; then
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" --raw-field "body=${comment_body}"
        else
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" --raw-field "body=${comment_body}"
        fi

    - name: Checkout branch
      if: steps.codex_guard.outputs.codex_owned != 'true'
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ inputs.branch }}
        fetch-depth: 0
        submodules: false
        token: ${{ github.token }}

    - name: Prepare CI environment
      if: steps.codex_guard.outputs.codex_owned != 'true'
      shell: bash
      run: bash ./scripts/prepare-ci-environment.sh

    - name: Set up JDK 21
      if: steps.codex_guard.outputs.codex_owned != 'true'
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Write local.properties for Android SDK
      if: steps.codex_guard.outputs.codex_owned != 'true'
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "${sdk_dir}" ]; then
          echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
          exit 1
        fi
        printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

    - name: Set up Gradle
      if: steps.codex_guard.outputs.codex_owned != 'true'
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: true

    - name: Ensure native build tools are present
      if: steps.codex_guard.outputs.codex_owned != 'true'
      shell: bash
      run: |
        if ! command -v ninja >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ninja-build
        fi

    - name: Check/apply formatting safely
      if: steps.codex_guard.outputs.codex_owned != 'true'
      id: spotless_auto
      shell: bash
      env:
        AUXIO_TS_CI_GRADLE_TIMEOUT: 20m
      run: bash ./scripts/spotless-pr-branch-autofix.sh

    - name: Ensure submodules stayed clean
      if: steps.codex_guard.outputs.codex_owned != 'true' && steps.spotless_auto.outputs.changed == 'true'
      shell: bash
      run: bash ./scripts/check-submodules.sh --profile full-build

    - name: Commit and push formatting changes
      if: steps.codex_guard.outputs.codex_owned != 'true' && steps.spotless_auto.outputs.changed == 'true'
      shell: bash
      run: |
        set -euo pipefail

        if git diff --quiet; then
          echo "No formatting changes to commit."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -A
        git commit -m "Apply Spotless formatting"
        git push origin "HEAD:${{ inputs.branch }}"
