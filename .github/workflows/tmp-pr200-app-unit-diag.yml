name: PR200 App Unit Diagnostic

on:
  push:
    branches:
      - cx/pr200-unit-diag
  pull_request:
    branches:
      - agent/ts18-root-storage-fastpath
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  app-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out diagnostic head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}" || exit 2
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare JVM-test dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile jvm-tests

      - name: Run app unit tests with bounded diagnostic output
        id: app_test
        shell: bash
        run: |
          set +e
          bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest 2>&1 | tee /tmp/pr200-app-unit.log
          status=${PIPESTATUS[0]}
          tail -n 400 /tmp/pr200-app-unit.log > /tmp/pr200-app-unit-tail.log
          exit "${status}"

      - name: Upload concise app-unit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr200-app-unit-diagnostics
          path: |
            /tmp/pr200-app-unit-tail.log
            app/build/reports/tests/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 1
