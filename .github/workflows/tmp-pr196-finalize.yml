name: Temporary PR196 finalise

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: tmp-pr196-finalise
  cancel-in-progress: false

jobs:
  finalise:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Format and run app unit tests
        id: verify
        shell: bash
        run: |
          format_status=0
          test_status=0

          bash ./scripts/ci-gradle.sh spotlessApply || format_status=$?
          if [[ "${format_status}" -eq 0 ]]; then
            bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest > /tmp/pr196-test.log 2>&1 || test_status=$?
            cat /tmp/pr196-test.log
          fi

          rm -f tmp-pr196-test-error.log
          if [[ "${test_status}" -ne 0 ]]; then
            {
              printf 'Temporary PR #196 app unit-test output. Exit status: %s\n\n' "${test_status}"
              tail -n 300 /tmp/pr196-test.log
            } > tmp-pr196-test-error.log
          fi

          printf 'format_status=%s\n' "${format_status}" >> "${GITHUB_OUTPUT}"
          printf 'test_status=%s\n' "${test_status}" >> "${GITHUB_OUTPUT}"
      - name: Commit deterministic formatting or diagnostic
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u app
          git add tmp-pr196-test-error.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'style: finalise source-recovery formatting and diagnostics'
            git push origin HEAD:fix/first-launch-source-recovery
          fi
      - name: Preserve verification result
        shell: bash
        env:
          FORMAT_STATUS: ${{ steps.verify.outputs.format_status }}
          TEST_STATUS: ${{ steps.verify.outputs.test_status }}
        run: |
          if [[ "${FORMAT_STATUS}" -ne 0 ]]; then
            echo "::error::spotlessApply failed with status ${FORMAT_STATUS}."
            exit "${FORMAT_STATUS}"
          fi
          if [[ "${TEST_STATUS}" -ne 0 ]]; then
            echo "::error::App unit tests failed with status ${TEST_STATUS}; concise output was committed for diagnosis."
            exit "${TEST_STATUS}"
          fi
