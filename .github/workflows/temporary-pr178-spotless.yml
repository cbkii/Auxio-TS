name: Temporary PR178 Spotless finalizer

on:
  push:
    branches:
      - copilot/complete-database-first-library-consumer-conversio
    paths:
      - ".github/workflows/temporary-pr178-spotless.yml"

permissions:
  contents: write

concurrency:
  group: temporary-pr178-spotless
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Apply canonical formatting and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon spotlessApply
          git rm .github/workflows/temporary-pr178-spotless.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply canonical formatting"
          git push origin HEAD:copilot/complete-database-first-library-consumer-conversio
