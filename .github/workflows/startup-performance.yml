# Full release/profile validation is intentionally manual.
name: Startup Release Validation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Validate workflow/script syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml
          status=0
          while IFS= read -r -d '' f; do bash -n "$f" || status=1; done < <(find scripts -type f -name '*.sh' -print0)
          while IFS= read -r -d '' f; do python3 -m py_compile "$f" || status=1; done < <(find scripts -type f -name '*.py' -print0)
          exit "$status"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"; [[ -n "$sdk_dir" ]] || exit 1
          printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: false
      - name: Ensure native/profile tools
        shell: bash
        run: |
          missing=(); command -v ninja >/dev/null 2>&1 || missing+=(ninja-build); command -v unzip >/dev/null 2>&1 || missing+=(unzip); command -v jq >/dev/null 2>&1 || missing+=(jq)
          if ((${#missing[@]})); then sudo apt-get update && sudo apt-get install -y "${missing[@]}"; fi
      - name: Prepare CI environment
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Validate static startup, product and safety contracts
        run: |
          bash ./scripts/check-startup-performance-contracts.sh
          bash ./scripts/check-product-contracts.sh
          bash ./scripts/check-headunit-compat-safety.sh
      - name: Run all distribution quality tasks
        run: |
          bash ./scripts/ci-gradle.sh --continue \
            spotlessKotlinCheck \
            :app:testStandardDebugUnitTest \
            :app:testTopwayTwMediaDebugUnitTest \
            :app:testTopwayTwMusicDebugUnitTest \
            :musikr:testDebugUnitTest \
            :app:lintStandardDebug \
            :app:lintTopwayTwMediaDebug \
            :app:lintTopwayTwMusicDebug
      - name: Compile flavor-aware benchmark instrumentation
        run: |
          bash ./scripts/ci-gradle.sh \
            :startup-benchmark:assembleStandardBenchmark \
            :startup-benchmark:assembleTopwayTwMediaBenchmark \
            :startup-benchmark:assembleTopwayTwMusicBenchmark
      - name: Build all debug/release application variants
        run: |
          bash ./scripts/ci-gradle.sh \
            :app:assembleStandardDebug :app:assembleTopwayTwMediaDebug :app:assembleTopwayTwMusicDebug \
            :app:assembleStandardRelease :app:assembleTopwayTwMediaRelease :app:assembleTopwayTwMusicRelease
      - name: Validate compiled Baseline Profile artefacts
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -type f -path '*/release/*.apk' | sort)
          ((${#apks[@]} == 3)) || { echo "::error::Expected three release APKs, found ${#apks[@]}"; printf '%s\n' "${apks[@]}"; exit 1; }
          for apk in "${apks[@]}"; do
            unzip -Z1 "$apk" | grep -Eq '^assets/dexopt/baseline\.(prof|profm)$' || { echo "::error::Compiled Baseline Profile missing: $apk"; exit 1; }
          done
          bash ./scripts/check-startup-performance-contracts.sh "${apks[@]}"
      - name: Validate TS18 and Topway output contracts
        run: |
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-built-topway-apks.sh
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startup-release-validation-failure-reports
          path: |
            app/build/reports/**
            musikr/build/reports/**
            startup-benchmark/build/reports/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Write validation summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Startup Release Validation'
            echo
            echo "- Result: \`${JOB_STATUS}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Variants: `standard`, `topwayTwMedia`, internal `topwayTwMusic`.'
            echo '- Includes formatting, tests, lint, benchmark compilation, release APK/profile and head-unit contracts.'
            echo '- Hosted/managed-device evidence is not physical TS18 validation.'
          } >> "$GITHUB_STEP_SUMMARY"
