name: Startup Performance Validation

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - cx/startup-profiles-benchmarks
    paths:
      - ".github/workflows/startup-performance.yml"
      - "app/**"
      - "musikr/**"
      - "startup-benchmark/**"
      - "scripts/check-startup-performance-contracts.sh"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "NOTICE"
      - "media"
      - "media/**"
      - ".gitmodules"
      - "ci/dependencies/**"
  pull_request:
    branches:
      - dev
      - cx/incremental-library-pipeline
    paths:
      - ".github/workflows/startup-performance.yml"
      - "app/**"
      - "musikr/**"
      - "startup-benchmark/**"
      - "scripts/check-startup-performance-contracts.sh"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "NOTICE"
      - "media"
      - "media/**"
      - ".gitmodules"
      - "ci/dependencies/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure native and profile inspection tools are present
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v ninja >/dev/null 2>&1 || missing+=(ninja-build)
          command -v unzip >/dev/null 2>&1 || missing+=(unzip)
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Validate static startup contracts
        shell: bash
        run: bash ./scripts/check-startup-performance-contracts.sh

      - name: Check formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessCheck

      - name: Run unit tests
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest
          bash ./scripts/ci-gradle.sh :musikr:testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: bash ./scripts/ci-gradle.sh :app:lintStandardDebug

      - name: Compile benchmark and profile instrumentation
        shell: bash
        run: bash ./scripts/ci-gradle.sh :startup-benchmark:assembleStandardRelease

      - name: Build maintained debug variants
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh :app:assembleStandardDebug
          bash ./scripts/ci-gradle.sh :app:assembleTopwayTwMusicDebug
          bash ./scripts/ci-gradle.sh :app:assembleTopwayTwMediaDebug

      - name: Build maintained release variants
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh :app:assembleStandardRelease
          bash ./scripts/ci-gradle.sh :app:assembleTopwayTwMusicRelease
          bash ./scripts/ci-gradle.sh :app:assembleTopwayTwMediaRelease

      - name: Validate compiled profile artefacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -path '*/release/*.apk' | sort)
          if ((${#apks[@]} != 3)); then
            printf 'Expected three release APKs, found %s\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]:-}" >&2
            exit 1
          fi
          bash ./scripts/check-startup-performance-contracts.sh "${apks[@]}"

      - name: Validate TS18 APK reference contracts
        shell: bash
        run: bash ./scripts/check-ts18-apk-reference-contracts.sh

      - name: Validate DoFun and Topway compatibility sources
        shell: bash
        run: bash ./scripts/check-dofun-topway-compat.sh

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startup-performance-failure-reports
          path: |
            app/build/reports/**
            musikr/build/reports/**
            startup-benchmark/build/reports/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Write validation summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Startup Performance Validation"
            echo
            echo "- Result: \`${JOB_STATUS}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Static architecture contracts, formatting, unit tests, lint, benchmark/profile compilation, all maintained debug/release variants, compiled profile artefacts, TS18 APK contracts and DoFun/Topway source contracts were included."
            echo "- No emulator or exact-device latency claim is produced by this workflow."
          } >> "${GITHUB_STEP_SUMMARY}"
