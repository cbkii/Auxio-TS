        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/org/oxycblt/auxio/MainActivity.kt \
            app/src/main/java/org/oxycblt/auxio/MainFragment.kt \
            app/src/main/java/org/oxycblt/auxio/headunit/StartupPanelCoordinator.kt \
            app/src/main/java/org/oxycblt/auxio/playback/service/ExoPlaybackStateHolder.kt \
            app/src/test/java/org/oxycblt/auxio/headunit/StartupPanelCoordinatorTest.kt \
            docs/LAUNCH_TO_CURRENTLY_PLAYING.md \
