           * (at your option) any later version.
           */

          package org.oxycblt.auxio.headunit

          import java.util.UUID
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.oxycblt.auxio.music.StartupReadinessState
          import org.oxycblt.auxio.playback.OpenPanel
          import org.oxycblt.auxio.playback.state.RestoreOutcome

          class StartupPanelCoordinatorTest {
              @Test
              fun `generic launch always targets now playing`() {
                  assertEquals(OpenPanel.PLAYBACK, StartupPanelCoordinator.genericDestination())
              }

              @Test
              fun `generic request waits for transient restore`() {
                  assertTrue(
                      evaluate(
                          genericRequest(),
                          hasSong = false,
                          outcome = RestoreOutcome.WAITING_FOR_LIBRARY,
                      ) is StartupPanelCoordinator.RouteEvaluation.Wait
                  )
              }

              @Test
              fun `terminal library states cancel rather than becoming stale`() {
                  listOf(
                          StartupReadinessState.NeedsMusicSource,
                          StartupReadinessState.EmptyLibrary,
                          StartupReadinessState.CachedLibraryUnavailable,
                      )
                      .forEach { readiness ->
                          assertTrue(
                              evaluate(
                                  genericRequest(),
                                  hasSong = false,
                                  outcome = RestoreOutcome.WAITING_FOR_LIBRARY,
                                  readiness = readiness,
                              ) is StartupPanelCoordinator.RouteEvaluation.Cancel
                          )
                      }
              }

              @Test
              fun `no saved session cannot be fulfilled by a later manual song`() {
                  assertTrue(
                      evaluate(
                          genericRequest(),
                          hasSong = true,
                          outcome = RestoreOutcome.NO_SAVED_SESSION,
                      ) is StartupPanelCoordinator.RouteEvaluation.Cancel
                  )
              }

              @Test
              fun `raw resume waits for normal song reconciliation`() {
                  assertTrue(
                      evaluate(
                          genericRequest(),
                          hasSong = false,
                          outcome = RestoreOutcome.RAW_FAST_RESUME_ACTIVE,
                      ) is StartupPanelCoordinator.RouteEvaluation.Wait
                  )
                  assertTrue(
                      evaluate(
                          genericRequest(),
                          hasSong = true,
                          outcome = RestoreOutcome.RAW_FAST_RESUME_ACTIVE,
                      ) is StartupPanelCoordinator.RouteEvaluation.Render
                  )
              }

              @Test
              fun `explicit queue renders an existing song without restore`() {
                  val request =
                      StartupPanelCoordinator.RouteRequest(
                          UUID.randomUUID(),
                          OpenPanel.PLAYBACK_QUEUE,
                          StartupPanelCoordinator.Priority.EXPLICIT_INTENT,
                          "test explicit queue",
                      )
                  val result =
                      evaluate(
                          request,
                          hasSong = true,
                          outcome = RestoreOutcome.NOT_REQUESTED,
                      )
                  assertTrue(result is StartupPanelCoordinator.RouteEvaluation.Render)
                  assertEquals(
                      OpenPanel.PLAYBACK_QUEUE,
                      (result as StartupPanelCoordinator.RouteEvaluation.Render)
                          .request
                          .destination,
                  )
              }

              @Test
              fun `failed and cancelled restores terminate generic routing`() {
                  listOf(RestoreOutcome.FAILED, RestoreOutcome.CANCELLED).forEach { outcome ->
                      assertTrue(
                          evaluate(genericRequest(), hasSong = false, outcome = outcome)
                              is StartupPanelCoordinator.RouteEvaluation.Cancel
                      )
                  }
              }

              private fun genericRequest() =
                  StartupPanelCoordinator.RouteRequest(
                      UUID.randomUUID(),
                      OpenPanel.PLAYBACK,
                      StartupPanelCoordinator.Priority.GENERIC_STARTUP,
                      "test generic",
                  )

              private fun evaluate(
                  request: StartupPanelCoordinator.RouteRequest,
                  hasSong: Boolean,
                  outcome: RestoreOutcome,
                  readiness: StartupReadinessState = StartupReadinessState.Ready,
              ) =
                  StartupPanelCoordinator.evaluate(
                      request,
                      hasSong,
                      outcome,
                      readiness,
                  )
          }
          """.strip()
              + "\n",
              encoding="utf-8",
          )

          docs = Path("docs/LAUNCH_TO_CURRENTLY_PLAYING.md")
          docs.write_text(
              """# Launch to Currently Playing

          ## Contract

          `Launch to Now Playing` controls navigation only. It does not imply autoplay.

          - Generic cold launches target **Now Playing**, never Queue.
          - Explicit Queue launcher/deep-link requests target the playback-plus-queue state.
          - Explicit destinations supersede generic startup routing.
          - Requests wait through transient library/player restoration and raw fast resume.
          - Requests are cancelled on source-required, empty/recovery, no-session, failed, or
            cancelled terminal states.
          - A request is consumed only after the bottom sheets reach the requested final state.
          - Manual panel changes, predictive back, Settings, and About cancel pending routing.

          ## Exact-device validation

          **Requires TS18 validation** on `s9863a1h10_Natv`:

          1. Cold launch with saved playing and paused sessions.
          2. Cold launch with no saved session, empty library, and source-required state.
          3. Raw fast resume followed by normal `Song` reconciliation.
          4. Explicit Now Playing and Queue launches during cold and warm app states.
          5. Manual close/back/navigation while restoration or sheet settling is pending.
          6. DoFun launcher restart, process death, reboot, and real ACC sleep/wake.

          Capture route/restore logs and final sheet state. Do not claim physical success from CI.
          """.strip()
              + "\n",
              encoding="utf-8",
          )

          docs_index = "docs/README.md"
          replace_once(
              docs_index,
              """- [`TS18_RUNTIME_VALIDATION.md`](TS18_RUNTIME_VALIDATION.md) — on-device TS18 validation checklist and evidence expectations.
          """,
              """- [`TS18_RUNTIME_VALIDATION.md`](TS18_RUNTIME_VALIDATION.md) — on-device TS18 validation checklist and evidence expectations.
          - [`LAUNCH_TO_CURRENTLY_PLAYING.md`](LAUNCH_TO_CURRENTLY_PLAYING.md) — durable startup panel-routing contract and exact-device validation matrix.
          """,
          )
