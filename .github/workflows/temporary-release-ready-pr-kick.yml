name: Temporary release-ready PR kick

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: temporary-release-ready-pr-kick
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.head_ref == 'release-ready-fixes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release-ready branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: release-ready-fixes
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Extract and apply reviewed patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          patch_script="${RUNNER_TEMP}/release-ready-patch.py"
          patch_log="${RUNNER_TEMP}/release-ready-patch.log"
          python3 - "${patch_script}" <<'PY'
          from pathlib import Path
          import sys

          source = Path('.github/workflows/temporary-release-ready-patch.yml').read_text(
              encoding='utf-8'
          ).splitlines()
          captured = []
          active = False
          in_triple = False
          for raw in source:
              if not active:
                  if raw.strip() == "python3 <<'PY'":
                      active = True
                  continue
              if not in_triple and raw.strip() == 'PY':
                  break
              line = raw if in_triple else raw[10:] if raw.startswith('          ') else raw
              captured.append(line)
              if line.count('"""') % 2 == 1 or line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          Path(sys.argv[1]).write_text('\n'.join(captured) + '\n', encoding='utf-8')
          PY
          patch_rc=0
          {
            test -s "${patch_script}"
            python3 -m py_compile "${patch_script}"
            python3 "${patch_script}"
          } >"${patch_log}" 2>&1 || patch_rc=$?
          if ((patch_rc != 0)); then
            cp "${patch_log}" .github/release-ready-patch-error.txt
            git add .github/release-ready-patch-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ci: record release-ready patch failure [release-ready-patch-error]'
            auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              push https://github.com/${GITHUB_REPOSITORY}.git HEAD:release-ready-fixes
            cat "${patch_log}"
            exit "${patch_rc}"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Prepare and apply formatting
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
          bash ./scripts/bootstrap-dependencies.sh --profile full-build
          bash ./scripts/ci-gradle.sh spotlessApply

      - name: Commit and push final patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f \
            .github/release-ready-patch-error.txt \
            .github/release-ready-patch-trigger.txt \
            .github/workflows/temporary-release-ready-patch.yml \
            .github/workflows/temporary-release-ready-pr-kick.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete release readiness hardening [release-ready-patch-complete]'
          auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push https://github.com/${GITHUB_REPOSITORY}.git HEAD:release-ready-fixes
