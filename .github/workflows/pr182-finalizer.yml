name: Finalise PR 182

on:
  workflow_dispatch:
  push:
    branches:
      - cx/create-fast-interaction-startup-pr
    paths:
      - ".github/workflows/pr182-finalizer.yml"

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/create-fast-interaction-startup-pr
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: false

      - name: Prepare dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply final PR 182 implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"STOP: expected exactly one match in {path}, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          # Room projection must return every non-null SongListRow field.
          replace_once(
              "musikr/src/main/java/org/oxycblt/musikr/cache/db/CacheDatabase.kt",
              'SELECT id, stableUid, uri, title, primaryArtistName, albumName, durationMs, embeddedArtworkRef, externalArtworkRef FROM LibrarySongData WHERE available = 1 AND',
              'SELECT id, stableUid, uri, displayPath, title, primaryArtistName, albumName, durationMs, embeddedArtworkRef, externalArtworkRef, available FROM LibrarySongData WHERE available = 1 AND',
          )

          # Reserve a distinct adapter view type for primitive startup search rows.
          replace_once(
              "app/src/main/java/org/oxycblt/auxio/IntegerTable.kt",
              '    /** PlaylistSongViewHolder */\n    const val VIEW_TYPE_PLAYLIST_SONG = 0xA00E\n',
              '    /** PlaylistSongViewHolder */\n    const val VIEW_TYPE_PLAYLIST_SONG = 0xA00E\n    /** StartupSongViewHolder */\n    const val VIEW_TYPE_STARTUP_SONG = 0xA00F\n',
