name: Temporary PR196 apply hardening

on:
  pull_request:
    branches:
      - 'cx/pr196-verify'

permissions:
  contents: read

concurrency:
  group: tmp-pr196-apply-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
          persist-credentials: false
      - name: Apply service hardening
        shell: bash
        run: python3 scripts/tmp-pr196-service-hardening.py
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo '::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set.'
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Format and capture scoped verification
        id: verify
        shell: bash
        run: |
          format_status=0
          test_status=0
          diff_status=0
          mkdir -p "${RUNNER_TEMP}/pr196-verified/app/src/main/java/org/oxycblt/auxio"

          bash ./scripts/ci-gradle.sh spotlessKotlinApply spotlessXmlApply \
            > "${RUNNER_TEMP}/pr196-format.log" 2>&1 || format_status=$?
          cat "${RUNNER_TEMP}/pr196-format.log"

          if [[ "${format_status}" -eq 0 ]]; then
            bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest \
              > "${RUNNER_TEMP}/pr196-tests.log" 2>&1 || test_status=$?
            cat "${RUNNER_TEMP}/pr196-tests.log"
          fi

          git diff --check > "${RUNNER_TEMP}/pr196-diff-check.log" 2>&1 || diff_status=$?
          cat "${RUNNER_TEMP}/pr196-diff-check.log"

          cp app/src/main/java/org/oxycblt/auxio/AuxioService.kt \
            "${RUNNER_TEMP}/pr196-verified/app/src/main/java/org/oxycblt/auxio/AuxioService.kt"
          cp app/src/main/java/org/oxycblt/auxio/BootReceiver.kt \
            "${RUNNER_TEMP}/pr196-verified/app/src/main/java/org/oxycblt/auxio/BootReceiver.kt"
          cp "${RUNNER_TEMP}/pr196-format.log" "${RUNNER_TEMP}/pr196-verified/"
          cp "${RUNNER_TEMP}/pr196-tests.log" "${RUNNER_TEMP}/pr196-verified/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/pr196-diff-check.log" "${RUNNER_TEMP}/pr196-verified/"
          git diff -- app/src/main/java/org/oxycblt/auxio/AuxioService.kt \
            app/src/main/java/org/oxycblt/auxio/BootReceiver.kt \
            > "${RUNNER_TEMP}/pr196-verified/pr196-service.patch"

          printf 'format_status=%s\n' "${format_status}" >> "${GITHUB_OUTPUT}"
          printf 'test_status=%s\n' "${test_status}" >> "${GITHUB_OUTPUT}"
          printf 'diff_status=%s\n' "${diff_status}" >> "${GITHUB_OUTPUT}"
      - name: Upload patched sources and full logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr196-verified-service-patch
          path: ${{ runner.temp }}/pr196-verified/**
          if-no-files-found: error
          retention-days: 3
      - name: Preserve verification result
        if: always()
        shell: bash
        env:
          FORMAT_STATUS: ${{ steps.verify.outputs.format_status }}
          TEST_STATUS: ${{ steps.verify.outputs.test_status }}
          DIFF_STATUS: ${{ steps.verify.outputs.diff_status }}
        run: |
          if [[ "${FORMAT_STATUS:-1}" -ne 0 ]]; then
            echo "::error::Formatting failed with status ${FORMAT_STATUS:-1}."
            exit "${FORMAT_STATUS:-1}"
          fi
          if [[ "${TEST_STATUS:-1}" -ne 0 ]]; then
            echo "::error::Unit tests failed with status ${TEST_STATUS:-1}."
            exit "${TEST_STATUS:-1}"
          fi
          if [[ "${DIFF_STATUS:-1}" -ne 0 ]]; then
            echo "::error::git diff --check failed with status ${DIFF_STATUS:-1}."
            exit "${DIFF_STATUS:-1}"
          fi
