name: Temporary PR196 apply hardening

on:
  pull_request:
    branches:
      - 'cx/pr196-verify'

permissions:
  contents: read

concurrency:
  group: tmp-pr196-apply-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
          persist-credentials: false
      - name: Apply service hardening
        shell: bash
        run: python3 scripts/tmp-pr196-service-hardening.py
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo '::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set.'
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Format and run scoped unit tests
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh spotlessKotlinApply spotlessXmlApply
          bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest
          git diff --check
          git diff -- app/src/main/java/org/oxycblt/auxio/AuxioService.kt \
            app/src/main/java/org/oxycblt/auxio/BootReceiver.kt \
            > "${RUNNER_TEMP}/pr196-service.patch"
      - name: Upload verified service patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr196-verified-service-patch
          path: |
            app/src/main/java/org/oxycblt/auxio/AuxioService.kt
            app/src/main/java/org/oxycblt/auxio/BootReceiver.kt
            ${{ runner.temp }}/pr196-service.patch
          if-no-files-found: error
          retention-days: 3
