name: Temporary PR196 final verification

on:
  pull_request:
    branches:
      - 'cx/**'

permissions:
  contents: read

concurrency:
  group: tmp-pr196-final-verification
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout final stacked branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo '::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set.'
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Ensure native build tools are present
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Check formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessCheck
      - name: Run standard unit tests
        shell: bash
        run: bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest
      - name: Run Android lint
        shell: bash
        run: bash ./scripts/ci-gradle.sh :app:lintStandardDebug
      - name: Run head-unit safety checks
        shell: bash
        run: |
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          git diff --check

  variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout final stacked branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo '::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set.'
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Ensure native build tools are present
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Build all debug variants
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardDebug
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaDebug
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicDebug
      - name: Build all release variants
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardRelease
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaRelease
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicRelease
      - name: Validate variant contracts
        shell: bash
        run: |
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-dofun-topway-compat.sh

  api29-runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      AVD_NAME: auxio-pr196-api29
      ANDROID_API: '29'
      SYSTEM_IMAGE: system-images;android-29;google_apis;x86_64
    steps:
      - name: Checkout final stacked branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure isolated Android state
        shell: bash
        run: |
          printf 'ANDROID_USER_HOME=%s\n' "${RUNNER_TEMP}/android-user-home" >> "${GITHUB_ENV}"
          printf 'ANDROID_AVD_HOME=%s\n' "${RUNNER_TEMP}/android-avd-home" >> "${GITHUB_ENV}"
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo '::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set.'
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Install emulator tools and API 29 image
        shell: bash
        run: |
          missing=()
          command -v ninja >/dev/null 2>&1 || missing+=(ninja-build)
          command -v unzip >/dev/null 2>&1 || missing+=(unzip)
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_bin="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          avdmanager_bin="${sdk_root}/cmdline-tools/latest/bin/avdmanager"
          [[ -x "${sdkmanager_bin}" ]] || sdkmanager_bin="$(command -v sdkmanager || true)"
          [[ -x "${avdmanager_bin}" ]] || avdmanager_bin="$(command -v avdmanager || true)"
          if [[ -z "${sdkmanager_bin}" || ! -x "${sdkmanager_bin}" ]]; then
            echo '::error::sdkmanager was not found.'
            exit 1
          fi
          if [[ -z "${avdmanager_bin}" || ! -x "${avdmanager_bin}" ]]; then
            echo '::error::avdmanager was not found.'
            exit 1
          fi

          license_status=0
          yes | "${sdkmanager_bin}" --licenses >/dev/null 2>&1 || license_status=${PIPESTATUS[1]}
          if [[ "${license_status}" -ne 0 ]]; then
            echo "::error::SDK licence acceptance failed with status ${license_status}."
            exit "${license_status}"
          fi
          "${sdkmanager_bin}" --install \
            platform-tools emulator "platforms;android-${ANDROID_API}" "${SYSTEM_IMAGE}"

          emulator_bin="${sdk_root}/emulator/emulator"
          [[ -x "${emulator_bin}" ]] || emulator_bin="$(command -v emulator || true)"
          if [[ -z "${emulator_bin}" || ! -x "${emulator_bin}" ]]; then
            echo '::error::emulator binary was not found.'
            exit 1
          fi
          printf '%s\n' "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          printf 'AVDMANAGER_BIN=%s\n' "${avdmanager_bin}" >> "${GITHUB_ENV}"
          printf 'EMULATOR_BIN=%s\n' "${emulator_bin}" >> "${GITHUB_ENV}"
      - name: Create and start Android 10 emulator
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          mkdir -p "${ANDROID_USER_HOME}" "${ANDROID_AVD_HOME}"
          touch "${ANDROID_USER_HOME}/repositories.cfg"
          printf 'no\n' | "${AVDMANAGER_BIN}" create avd --force -n "${AVD_NAME}" -k "${SYSTEM_IMAGE}"

          emulator_log="${RUNNER_TEMP}/api29-emulator.log"
          nohup "${EMULATOR_BIN}" \
            -avd "${AVD_NAME}" -no-window -no-audio -no-boot-anim -no-snapshot-save \
            -memory 2048 -partition-size 2048 -gpu swiftshader_indirect \
            -camera-back none -camera-front none >"${emulator_log}" 2>&1 &
          printf '%s\n' "$!" > "${RUNNER_TEMP}/api29-emulator.pid"

          adb start-server
          device_ready=0
          for attempt in $(seq 1 120); do
            if adb get-state 2>/dev/null | grep -Fxq device; then
              device_ready=1
              break
            fi
            sleep 2
          done
          if [[ "${device_ready}" -ne 1 ]]; then
            tail -n 200 "${emulator_log}" || true
            echo '::error::API 29 emulator did not become available.'
            exit 1
          fi

          booted=0
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == '1' ]]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [[ "${booted}" -ne 1 ]]; then
            tail -n 200 "${emulator_log}" || true
            echo '::error::API 29 emulator did not finish booting.'
            exit 1
          fi
          sdk_value="$(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r')"
          if [[ "${sdk_value}" != "${ANDROID_API}" ]]; then
            echo "::error::Expected API ${ANDROID_API}, got ${sdk_value:-<empty>}."
            exit 1
          fi
      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Run API 29 compatibility and Room migration tests
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh \
            :app:connectedStandardDebugAndroidTest \
            :musikr:connectedDebugAndroidTest
      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [[ -f "${RUNNER_TEMP}/api29-emulator.pid" ]]; then
            pid="$(cat "${RUNNER_TEMP}/api29-emulator.pid")"
            kill "${pid}" >/dev/null 2>&1 || true
          fi
