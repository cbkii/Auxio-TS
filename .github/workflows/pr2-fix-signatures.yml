name: PR2 signature fix

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr2-fix-signatures.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0
      - run: python3 scripts/pr2-fix-signatures.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: disambiguate incremental index entry points'
          git push origin HEAD:cx/incremental-library-pipeline
