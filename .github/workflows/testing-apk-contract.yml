name: Testing APK Contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/testing-apk-*.yml"
      - "scripts/ci/build-auxio-testing-input.sh"
      - "scripts/ci/reconcile_testing_release.py"
      - "scripts/ci/test_testing_*.py"
      - "app/build.gradle"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/testing-apk-*.yml"
      - "scripts/ci/build-auxio-testing-input.sh"
      - "scripts/ci/reconcile_testing_release.py"
      - "scripts/ci/test_testing_*.py"
      - "app/build.gradle"

permissions:
  contents: read

jobs:
  contract:
    name: TESTING snapshot contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate scripts and metadata state machine
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/build-auxio-testing-input.sh
          python3 -m py_compile scripts/ci/reconcile_testing_release.py
          python3 -m unittest discover -s scripts/ci -p 'test_testing_*.py' -v

  build-input:
    name: Build isolated fixed-version TESTING handoff
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact requested source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install native build and SDK tools
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/manual-release/09-install-android-and-native-build-tools.sh
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
      - name: Build TESTING handoff with ephemeral CI key
        shell: bash
        env:
          TESTING_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTING_SOURCE_KIND: contract
          TESTING_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          TESTING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          TESTING_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          TESTING_BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/ci/build-auxio-testing-input.sh . "$RUNNER_TEMP/testing-input"
          test -s "$RUNNER_TEMP/testing-input/auxio-release.apk"
          test -s "$RUNNER_TEMP/testing-input/auxio-debug.apk"
          grep -Fxq 'testing_package=com.tw.media' "$RUNNER_TEMP/testing-input/BUILD_INFO.txt"
          grep -Fxq 'testing_version_code=2100000000' "$RUNNER_TEMP/testing-input/BUILD_INFO.txt"
