name: Temporary PR196 formatting export

on:
  push:
    branches:
      - fix/pr196-formatting

permissions:
  contents: read

concurrency:
  group: tmp-pr196-format-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare CI dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply repository formatting
        id: format
        shell: bash
        run: |
          set +e
          bash ./scripts/ci-gradle.sh spotlessApply
          status=$?
          printf 'status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Export exact formatted delta
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > "${RUNNER_TEMP}/pr196-format.patch"
          git diff --name-only --diff-filter=ACMRT > "${RUNNER_TEMP}/pr196-format-files.txt"
          if [[ -s "${RUNNER_TEMP}/pr196-format-files.txt" ]]; then
            tar -czf "${RUNNER_TEMP}/pr196-formatted-files.tar.gz" -T "${RUNNER_TEMP}/pr196-format-files.txt"
          else
            tar -czf "${RUNNER_TEMP}/pr196-formatted-files.tar.gz" --files-from /dev/null
          fi
          printf 'spotlessApply status: %s\n' '${{ steps.format.outputs.status }}' > "${RUNNER_TEMP}/pr196-format-status.txt"
          cat "${RUNNER_TEMP}/pr196-format-files.txt"

      - name: Upload formatted delta
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr196-formatted-delta
          path: |
            ${{ runner.temp }}/pr196-format.patch
            ${{ runner.temp }}/pr196-format-files.txt
            ${{ runner.temp }}/pr196-formatted-files.tar.gz
            ${{ runner.temp }}/pr196-format-status.txt
          if-no-files-found: error
          retention-days: 2

      - name: Verify formatter completed and changed files
        shell: bash
        run: |
          test '${{ steps.format.outputs.status }}' = '0'
          test -s "${RUNNER_TEMP}/pr196-format.patch"
