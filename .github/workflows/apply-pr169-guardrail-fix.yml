name: Apply PR 169 guardrail alignment

on:
  push:
    branches:
      - fix/ts18-runtime-regressions-v605
    paths:
      - '.github/workflows/apply-pr169-guardrail-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align guardrails with the intentional Topway entry router
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          dofun = 'scripts/check-dofun-topway-compat.sh'
          replace_once(
              dofun,
              '''      require_manifest_dump_contains "$manifest_dump" 'android:targetActivity="org.oxycblt.auxio.MainActivity"' "${label} APK alias targets MainActivity" "${label} APK alias target mismatch"''',
              '''      require_manifest_dump_contains "$manifest_dump" 'android:targetActivity="org.oxycblt.auxio.car.overlay.TopwayMusicEntryActivity"' "${label} APK alias targets the Topway entry router" "${label} APK alias target mismatch"''',
          )
          replace_once(
              dofun,
              '''  require_file_contains "$flavour_manifest" "org.oxycblt.auxio.MainActivity" "Topway alias target"''',
              '''  require_file_contains "$flavour_manifest" "org.oxycblt.auxio.car.overlay.TopwayMusicEntryActivity" "Topway alias router target"
          require_file_contains "$flavour_manifest" "org.oxycblt.auxio.MainActivity" "Topway full-player activity"''',
          )

          components = 'scripts/check-topway-manifest-components.sh'
          replace_once(
              components,
              '''    "org.oxycblt.auxio.MainActivity",
              "org.oxycblt.auxio.car.overlay.CarFloatingControlsService",''',
              '''    "org.oxycblt.auxio.MainActivity",
              "org.oxycblt.auxio.car.overlay.TopwayMusicEntryActivity",
              "org.oxycblt.auxio.car.overlay.CarFloatingControlsService",''',
          )
          replace_once(
              components,
              '''REQUIRED_TOPWAY_ALIAS = "com.tw.music.MusicActivity"
          ''',
              '''REQUIRED_TOPWAY_ALIAS = "com.tw.music.MusicActivity"
          EXPECTED_TOPWAY_ALIAS_TARGET = "org.oxycblt.auxio.car.overlay.TopwayMusicEntryActivity"
          ''',
          )
          replace_once(
              components,
              '''    if aliases.get(REQUIRED_TOPWAY_ALIAS) == "org.oxycblt.auxio.MainActivity":
                  ok("topwayCompat source manifest keeps com.tw.music.MusicActivity as an alias to MainActivity")''',
              '''    if aliases.get(REQUIRED_TOPWAY_ALIAS) == EXPECTED_TOPWAY_ALIAS_TARGET:
                  ok("topwayCompat source manifest routes com.tw.music.MusicActivity through TopwayMusicEntryActivity")''',
          )
          replace_once(
              components,
              '''        if aliases.get(REQUIRED_TOPWAY_ALIAS) == "org.oxycblt.auxio.MainActivity":
                      ok(f"{variant} merged manifest aliases {REQUIRED_TOPWAY_ALIAS} to MainActivity")''',
              '''        if aliases.get(REQUIRED_TOPWAY_ALIAS) == EXPECTED_TOPWAY_ALIAS_TARGET:
                      ok(f"{variant} merged manifest aliases {REQUIRED_TOPWAY_ALIAS} to TopwayMusicEntryActivity")''',
          )
          PY
          rm -rf ci-debug
          rm -f .github/workflows/capture-headunit-safety-output.yml
          rm -f .github/workflows/apply-pr169-guardrail-fix.yml
          git diff --check
          bash scripts/check-ts18-apk-reference-contracts.sh
          bash scripts/check-headunit-compat-safety.sh
          bash scripts/check-dofun-topway-compat.sh
          bash scripts/check-native-keep-rules.sh
      - name: Commit guardrail updates and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(ts18): align entry-router manifest guardrails'
          git push origin HEAD:fix/ts18-runtime-regressions-v605
