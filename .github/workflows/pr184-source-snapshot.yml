name: PR 184 Finalise Active Branch

on:
  push:
    branches:
      - cx/startup-profiles-benchmarks
    paths:
      - .github/workflows/pr184-source-snapshot.yml
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/pr184-source-snapshot.yml

permissions:
  contents: write

concurrency:
  group: pr184-finalise-active-branch
  cancel-in-progress: true

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/startup-profiles-benchmarks
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Apply and inspect final tree
        shell: bash
        run: |
          log_file="${GITHUB_WORKSPACE}/pr184-finalise.log"
          set +e
          {
            set -euo pipefail
            original_patch="${RUNNER_TEMP}/pr184-final.patch"
            filtered_patch="${RUNNER_TEMP}/pr184-final-filtered.patch"

            cat .github/pr184-patch/part-* > "${original_patch}"
            printf '%s  %s\n' \
              d03aa4494eb99a104eefd8176c36d3d6ab00d202e88248a226a6c18b2b765ec7 \
              "${original_patch}" | sha256sum --check -

            awk '
              /^diff --git a\// {
                path = $0
                sub(/^diff --git a\//, "", path)
                sub(/ b\/.*/, "", path)
                skip = \
                  path == ".github/workflows/android.yml" || \
                  path == ".github/workflows/lint.yml" || \
                  path == ".github/workflows/pr184-source-snapshot.yml" || \
                  path == "app/src/main/java/org/oxycblt/auxio/util/PerfTimer.kt" || \
                  path == "app/src/test/java/org/oxycblt/auxio/music/DeferredStartupHydrationTest.kt" || \
                  path == "app/src/test/java/org/oxycblt/auxio/music/PerformanceCapturePreferenceRestoreTest.kt"
              }
              !skip { print }
            ' "${original_patch}" > "${filtered_patch}"

            for excluded in \
              .github/workflows/android.yml \
              .github/workflows/lint.yml \
              .github/workflows/pr184-source-snapshot.yml \
              app/src/main/java/org/oxycblt/auxio/util/PerfTimer.kt \
              app/src/test/java/org/oxycblt/auxio/music/DeferredStartupHydrationTest.kt \
              app/src/test/java/org/oxycblt/auxio/music/PerformanceCapturePreferenceRestoreTest.kt; do
              if grep -Fq -- "diff --git a/${excluded} b/${excluded}" "${filtered_patch}"; then
                echo "::error::Excluded patch section remained: ${excluded}"
                exit 1
              fi
            done

            git apply --check --whitespace=error-all "${filtered_patch}"
            git apply --index --whitespace=error-all "${filtered_patch}"

            rm -f -- \
              .github/pr184-hardening-error.txt \
              .github/pr184-finalise-error.txt \
              .github/workflows/pr184-apply-corrected.yml \
              .github/workflows/pr184-apply-final.yml \
              .github/workflows/pr184-hardening-v4.yml \
              .github/workflows/pr184-source-snapshot.yml
            rm -rf -- .github/pr184-patch
            git add --all
            git diff --cached --check

            ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml

            status=0
            while IFS= read -r -d '' script; do
              bash -n "${script}" || status=1
            done < <(find scripts -type f -name '*.sh' -print0)
            while IFS= read -r -d '' script; do
              python3 -m py_compile "${script}" || status=1
            done < <(find scripts -type f -name '*.py' -print0)
            ((status == 0))

            bash ./scripts/check-manual-release-workflow.sh
            bash ./scripts/check-startup-performance-contracts.sh
            bash ./scripts/check-headunit-compat-safety.sh
            bash ./scripts/check-ts18-apk-reference-contracts.sh
            bash ./scripts/check-dofun-topway-compat.sh
            git diff --cached --check
          } >"${log_file}" 2>&1
          status=$?
          set -e
          cat "${log_file}"
          exit "${status}"

      - name: Commit and publish final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- pr184-finalise.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix: finalise startup profiles and release validation"
          git push origin HEAD:cx/startup-profiles-benchmarks
          echo "Published final commit $(git rev-parse HEAD)."

      - name: Upload finalisation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr184-finalisation-log-${{ github.run_number }}
          path: pr184-finalise.log
          if-no-files-found: warn
          retention-days: 2
