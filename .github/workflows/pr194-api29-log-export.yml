name: Temporary PR 194 API29 log export

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/pr194-api29-log-export.yml"

permissions:
  contents: read

concurrency:
  group: pr194-api29-log-export
  cancel-in-progress: true

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: perf/android10-code-health-20260723
          fetch-depth: 1
          persist-credentials: false

      - name: Patch API 29 log capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          expression = '$' + '{{ runner.temp }}'

          step = '      - name: Run API 29 compatibility and Room migration tests'
          indexes = [i for i, line in enumerate(lines) if line == step]
          if len(indexes) != 1:
              raise SystemExit(f'STOP: expected one API29 Gradle step, found {len(indexes)}')
          index = indexes[0]
          if lines[index + 1] != '        shell: bash' or lines[index + 2] != '        run: |':
              raise SystemExit('STOP: API29 Gradle step structure changed')
          lines[index + 2:index + 2] = [
              '        env:',
              f'          AUXIO_TS_CI_GRADLE_LOG: {expression}/api29-gradle.log',
          ]

          artifact = f'            {expression}/api29-emulator.log'
          indexes = [i for i, line in enumerate(lines) if line == artifact]
          if len(indexes) != 1:
              raise SystemExit(f'STOP: expected one API29 emulator log path, found {len(indexes)}')
          lines.insert(indexes[0] + 1, f'            {expression}/api29-gradle.log')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Upload patched workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr194-api29-android-workflow
          path: .github/workflows/android.yml
          if-no-files-found: error
          retention-days: 1
