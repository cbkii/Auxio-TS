name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Release tag, e.g. v1.2.3. Leave blank to auto-increment. Existing tags append selected assets.
        required: false
        type: string
      draft:
        description: Create release as draft
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark release as prerelease
        required: true
        default: false
        type: boolean
      include_topway_twmedia_apk:
        description: Build/upload the primary Topway/DoFun com.tw.media release APK
        required: true
        default: true
        type: boolean
      include_topway_twmusic_magisk:
        description: Build topwayTwMusic and upload only its Magisk module ZIP
        required: true
        default: false
        type: boolean
      replace_existing_assets:
        description: Replace selected assets if they already exist on an existing release
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: manual-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          persist-credentials: false

      - name: Verify branch release context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != branch || "${GITHUB_REF_NAME}" != dev ]]; then
            echo "::error::Manual releases must run from the current protected dev branch."
            exit 1
          fi
          git fetch --tags origin dev
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/dev)" ]] || {
            echo "::error::Release checkout is stale. Re-run from the latest dev."
            exit 1
          }

      - name: Select maintained release assets
        id: selection
        shell: bash
        env:
          INCLUDE_TWMEDIA: ${{ inputs.include_topway_twmedia_apk }}
          INCLUDE_TWMUSIC: ${{ inputs.include_topway_twmusic_magisk }}
        run: |
          set -euo pipefail
          selected=()
          [[ "${INCLUDE_TWMEDIA}" == true ]] && selected+=(topway_twmedia)
          [[ "${INCLUDE_TWMUSIC}" == true ]] && selected+=(topway_twmusic_magisk)
          if ((${#selected[@]} == 0)); then
            echo "::error::At least one maintained release asset must be selected."
            exit 1
          fi
          {
            printf 'selected_variants<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${selected[@]}")"
            printf 'selected_summary=%s\n' "$(IFS=', '; echo "${selected[*]}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-cleanup: always

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android and native build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install platform-tools 'build-tools;36.0.0' 'platforms;android-36' 'ndk;28.2.13676358'
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Compute version and expected assets
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.version_tag }}
          SELECTED_VARIANTS: ${{ steps.selection.outputs.selected_variants }}
        run: |
          set -euo pipefail
          input_tag="$(printf '%s' "${INPUT_TAG}" | xargs)"
          current_name="$(sed -n -E 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' app/build.gradle | head -n1)"
          current_code="$(sed -n -E 's/^[[:space:]]*versionCode ([0-9]+).*/\1/p' app/build.gradle | head -n1)"
          [[ -n "${current_name}" && -n "${current_code}" ]] || { echo "::error::Cannot read app version metadata."; exit 1; }
          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [[ -n "${input_tag}" ]]; then
            [[ "${input_tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version tag: ${input_tag}"; exit 1; }
            [[ "${input_tag}" == v* ]] && release_tag="${input_tag}" || release_tag="v${input_tag}"
          else
            base="${previous_tag#v}"
            [[ -n "${base}" ]] || base="${current_name}"
            IFS=. read -r major minor patch <<< "${base}"
            release_tag="v${major}.${minor}.$((patch + 1))"
          fi
          tag_exists=false
          release_exists=false
          git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null && tag_exists=true
          gh release view "${release_tag}" >/dev/null 2>&1 && release_exists=true
          if [[ -z "${input_tag}" && ( "${tag_exists}" == true || "${release_exists}" == true ) ]]; then
            echo "::error::Auto-computed tag ${release_tag} already exists."
            exit 1
          fi
          [[ "${tag_exists}" == "${release_exists}" ]] || { echo "::error::Release/tag state is inconsistent for ${release_tag}."; exit 1; }
          if [[ "${release_exists}" == true ]]; then
            tag_sha="$(git rev-list -n1 "${release_tag}")"
            release_name="${release_tag#v}"
            release_code="$(git show "${release_tag}:app/build.gradle" | sed -n -E 's/^[[:space:]]*versionCode ([0-9]+).*/\1/p' | head -n1)"
          else
            tag_sha=''
            release_name="${release_tag#v}"
            release_code="$((current_code + 1))"
          fi
          asset_names=()
          while IFS= read -r variant; do
            case "${variant}" in
              topway_twmedia) base_name="Auxio-TS-${release_tag}-topway-twmedia-release.apk" ;;
              topway_twmusic_magisk) base_name="Auxio-TS-${release_tag}-topway-twmusic-magisk.zip" ;;
              '') continue ;;
              *) echo "::error::Unknown selected variant: ${variant}"; exit 1 ;;
            esac
            asset_names+=("${base_name}" "${base_name}.sha256" "${base_name}.metadata.txt")
          done <<< "${SELECTED_VARIANTS}"
          {
            echo "release_tag=${release_tag}"
            echo "release_version_name=${release_name}"
            echo "release_version_code=${release_code}"
            echo "previous_tag=${previous_tag}"
            echo "existing_release=${release_exists}"
            echo "tag_commit_sha=${tag_sha}"
            printf 'asset_names<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${asset_names[@]}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Check selected asset collisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          ASSET_NAMES: ${{ steps.version.outputs.asset_names }}
          REPLACE: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || exit 0
          existing="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            [[ -n "${asset}" ]] || continue
            if grep -Fxq -- "${asset}" <<< "${existing}" && [[ "${REPLACE}" != true ]]; then
              echo "::error::Selected asset already exists: ${asset}. Enable replacement to rebuild it."
              exit 1
            fi
          done <<< "${ASSET_NAMES}"

      - name: Preserve Magisk packager
        id: tooling
        shell: bash
        run: |
          packager="${RUNNER_TEMP}/package-topway-twmusic-magisk-module.sh"
          cp scripts/package-topway-twmusic-magisk-module.sh "${packager}"
          chmod +x "${packager}"
          echo "packager=${packager}" >> "${GITHUB_OUTPUT}"

      - name: Checkout existing release tag
        if: steps.version.outputs.existing_release == 'true'
        shell: bash
        env:
          TAG_SHA: ${{ steps.version.outputs.tag_commit_sha }}
        run: git checkout --detach "${TAG_SHA}"

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile release

      - name: Decode release keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing signing secret ${name}."; exit 1; }
          done
          echo "::add-mask::${KEYSTORE_PASSWORD}"
          echo "::add-mask::${KEY_ALIAS}"
          echo "::add-mask::${KEY_PASSWORD}"
          path="${RUNNER_TEMP}/release.keystore"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${path}"
          chmod 600 "${path}"
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Update and commit Android version metadata
        id: version_commit
        if: steps.version.outputs.existing_release != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION_NAME: ${{ steps.version.outputs.release_version_name }}
          VERSION_CODE: ${{ steps.version.outputs.release_version_code }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^([[:space:]]*)versionName \".*\"/s//\1versionName \"${VERSION_NAME}\"/" app/build.gradle
          sed -i -E "0,/^([[:space:]]*)versionCode [0-9]+/s//\1versionCode ${VERSION_CODE}/" app/build.gradle
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle
          git commit -m "chore(release): prepare ${RELEASE_TAG}"
          echo "release_commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build, verify and stage selected release assets
        id: assets
        shell: bash
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ steps.signing.outputs.path }}
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION_NAME: ${{ steps.version.outputs.release_version_name }}
          VERSION_CODE: ${{ steps.version.outputs.release_version_code }}
          SELECTED_VARIANTS: ${{ steps.selection.outputs.selected_variants }}
          PACKAGER: ${{ steps.tooling.outputs.packager }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools="$(find "${sdk_root}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          apksigner="${tools}/apksigner"
          aapt="${tools}/aapt"
          artifact_dir="${RUNNER_TEMP}/selected-release-assets"
          mkdir -p "${artifact_dir}"
          tasks=()
          grep -Fxq topway_twmedia <<< "${SELECTED_VARIANTS}" && tasks+=(:app:assembleTopwayTwMediaRelease)
          grep -Fxq topway_twmusic_magisk <<< "${SELECTED_VARIANTS}" && tasks+=(:app:assembleTopwayTwMusicRelease)
          bash ./scripts/ci-gradle.sh "${tasks[@]}"

          find_apk() {
            local dir=$1
            mapfile -t found < <(find "${dir}" -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort)
            ((${#found[@]} == 1)) || { echo "::error::Expected one signed APK in ${dir}, found ${#found[@]}."; exit 1; }
            printf '%s\n' "${found[0]}"
          }
          write_sidecars() {
            local asset=$1 name=$2 apk=$3 kind=$4
            local digest metadata badging
            digest="$(sha256sum "${asset}" | awk '{print $1}')"
            printf '%s  %s\n' "${digest}" "${name}" > "${artifact_dir}/${name}.sha256"
            metadata="${artifact_dir}/${name}.metadata.txt"
            badging="$("${aapt}" dump badging "${apk}")"
            {
              echo "asset=${name}"
              echo "asset_kind=${kind}"
              echo "asset_sha256=${digest}"
              echo "source_commit=$(git rev-parse HEAD)"
              echo "release_tag=${RELEASE_TAG}"
              sed -n -E "s/^package: name='([^']+)'.*versionCode='([^']+)'.*versionName='([^']+)'.*/application_id=\1\nversion_code=\2\nversion_name=\3/p" <<< "${badging}"
              echo "abis=$(unzip -Z1 "${apk}" | sed -n -E 's#^lib/([^/]+)/.*#\1#p' | sort -u | paste -sd, -)"
              echo
              echo '[apksigner certificates]'
              "${apksigner}" verify --verbose --print-certs "${apk}"
            } > "${metadata}"
          }

          asset_paths=()
          asset_names=()
          while IFS= read -r variant; do
            [[ -n "${variant}" ]] || continue
            case "${variant}" in
              topway_twmedia)
                apk_path="$(find_apk app/build/outputs/apk/topwayTwMedia/release)"
                asset_name="Auxio-TS-${RELEASE_TAG}-topway-twmedia-release.apk"
                asset_path="${artifact_dir}/${asset_name}"
                cp "${apk_path}" "${asset_path}"
                asset_kind=signed-apk
                ;;
              topway_twmusic_magisk)
                apk_path="$(find_apk app/build/outputs/apk/topwayTwMusic/release)"
                asset_name="Auxio-TS-${RELEASE_TAG}-topway-twmusic-magisk.zip"
                asset_path="${artifact_dir}/${asset_name}"
                bash "${PACKAGER}" --apk "${apk_path}" --output "${asset_path}" --version "${VERSION_NAME}" --version-code "${VERSION_CODE}"
                unzip -t "${asset_path}"
                asset_kind=magisk-systemless-overlay
                ;;
            esac
            "${apksigner}" verify --verbose "${apk_path}"
            bash ./scripts/check-startup-performance-contracts.sh "${apk_path}"
            write_sidecars "${asset_path}" "${asset_name}" "${apk_path}" "${asset_kind}"
            asset_paths+=("${asset_path}" "${artifact_dir}/${asset_name}.sha256" "${artifact_dir}/${asset_name}.metadata.txt")
            asset_names+=("${asset_name}" "${asset_name}.sha256" "${asset_name}.metadata.txt")
          done <<< "${SELECTED_VARIANTS}"
          {
            printf 'asset_paths<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${asset_paths[@]}")"
            printf 'asset_names<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${asset_names[@]}")"
            echo "artifact_dir=${artifact_dir}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate maintained release contracts
        shell: bash
        env:
          SELECTED_VARIANTS: ${{ steps.selection.outputs.selected_variants }}
        run: |
          bash ./scripts/check-ci-variant-contracts.sh
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-dofun-topway-compat.sh

      - name: Upload selected release workflow artifacts
        id: release_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Auxio-TS-${{ steps.version.outputs.release_tag }}-selected-release-assets
          path: ${{ steps.assets.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Push version commit and tag
        id: publish_ref
        if: steps.version.outputs.existing_release != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.version_commit.outputs.release_commit_sha }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch origin dev
          [[ "$(git rev-parse "${RELEASE_SHA}^")" == "$(git rev-parse origin/dev)" ]] || { echo "::error::Remote dev moved while building."; exit 1; }
          git push origin "${RELEASE_SHA}:refs/heads/dev"
          git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"
          echo 'tag_pushed=true' >> "${GITHUB_OUTPUT}"

      - name: Create or update release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          EXISTING_RELEASE: ${{ steps.version.outputs.existing_release }}
          REPLACE: ${{ inputs.replace_existing_assets }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          ASSET_PATHS: ${{ steps.assets.outputs.asset_paths }}
          ASSET_NAMES: ${{ steps.assets.outputs.asset_names }}
        run: |
          set -euo pipefail
          mapfile -t paths <<< "${ASSET_PATHS}"
          mapfile -t names <<< "${ASSET_NAMES}"
          upload=()
          for i in "${!paths[@]}"; do upload+=("${paths[$i]}#${names[$i]}"); done
          if [[ "${EXISTING_RELEASE}" == true ]]; then
            if [[ "${REPLACE}" == true ]]; then
              existing="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
              for name in "${names[@]}"; do
                grep -Fxq -- "${name}" <<< "${existing}" && gh release delete-asset "${RELEASE_TAG}" "${name}" --yes
              done
            fi
            gh release upload "${RELEASE_TAG}" "${upload[@]}"
          else
            notes="${RUNNER_TEMP}/release-notes.md"
            {
              echo "## What's changed"
              echo
              [[ -n "${PREVIOUS_TAG}" ]] && git log --reverse --pretty='- %s' "${PREVIOUS_TAG}..${RELEASE_TAG}" || echo '- Initial maintained Topway release.'
              echo
              echo '## Assets'
              echo '- topwayTwMedia is the primary signed APK.'
              echo '- topwayTwMusic is published only as a systemless Magisk module.'
              echo '- Exact TS18 runtime behaviour requires device validation.'
            } > "${notes}"
            args=()
            [[ "${DRAFT}" == true ]] && args+=(--draft)
            [[ "${PRERELEASE}" == true ]] && args+=(--prerelease)
            gh release create "${RELEASE_TAG}" "${upload[@]}" --title "${RELEASE_TAG}" --notes-file "${notes}" --verify-tag "${args[@]}"
          fi
          echo "release_url=$(gh release view "${RELEASE_TAG}" --json url --jq .url)" >> "${GITHUB_OUTPUT}"

      - name: Verify selected release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          ASSET_NAMES: ${{ steps.assets.outputs.asset_names }}
        run: |
          set -euo pipefail
          actual="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          while IFS= read -r name; do
            [[ -n "${name}" ]] || continue
            grep -Fxq -- "${name}" <<< "${actual}" || { echo "::error::Release is missing ${name}."; exit 1; }
          done <<< "${ASSET_NAMES}"
          forbidden="Auxio-TS-${RELEASE_TAG}-topway-twmusic-release.apk"
          if grep -Fxq -- "${forbidden}" <<< "${actual}"; then
            echo "::error::Raw topwayTwMusic APK asset is forbidden: ${forbidden}"
            exit 1
          fi

      - name: Write release summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          SELECTED: ${{ steps.selection.outputs.selected_summary }}
        run: |
          {
            echo '# Manual release summary'
            echo
            echo "- Result: \`${RESULT}\`"
            echo "- Tag: ${RELEASE_TAG:-not computed}"
            echo "- Maintained assets: ${SELECTED:-not selected}"
            [[ -n "${RELEASE_URL:-}" ]] && echo "- Release: ${RELEASE_URL}"
            echo '- topwayTwMedia remains the primary APK.'
            echo '- topwayTwMusic remains a Magisk-only exact-package lane.'
          } >> "${GITHUB_STEP_SUMMARY}"
