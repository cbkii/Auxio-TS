name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag, e.g. v1.2.3. Leave blank to auto-increment. Existing tags append selected missing assets."
        required: false
        type: string
      draft:
        description: "Create release as draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean
      include_standard_apk:
        description: "Build/upload the standard org.oxycblt.auxio release APK"
        required: true
        default: false
        type: boolean
      include_topway_twmedia_apk:
        description: "Build/upload the Topway/DoFun com.tw.media release APK"
        required: true
        default: true
        type: boolean
      include_topway_twmusic_magisk:
        description: "Build topwayTwMusic and upload only its Magisk module ZIP"
        required: true
        default: false
        type: boolean
      replace_existing_assets:
        description: "Replace selected assets if they already exist on an existing release"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: manual-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Verify branch release context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::Manual releases must run from a branch so the workflow can commit version metadata before tagging."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "dev" ]]; then
            echo "::error::Manual releases must run from the protected/default dev branch, not '${GITHUB_REF_NAME}'."
            exit 1
          fi
          git fetch --tags origin "${GITHUB_REF_NAME}"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${LOCAL_HEAD}" != "${REMOTE_HEAD}" ]]; then
            echo "::error::Release checkout is stale. Re-run the workflow from the latest ${GITHUB_REF_NAME}."
            echo "::error::Local HEAD:  ${LOCAL_HEAD}"
            echo "::error::Remote head: ${REMOTE_HEAD}"
            exit 1
          fi

      - name: Select release assets
        id: selection
        shell: bash
        env:
          INCLUDE_STANDARD_APK: ${{ inputs.include_standard_apk }}
          INCLUDE_TOPWAY_TWMEDIA_APK: ${{ inputs.include_topway_twmedia_apk }}
          INCLUDE_TOPWAY_TWMUSIC_MAGISK: ${{ inputs.include_topway_twmusic_magisk }}
        run: |
          set -euo pipefail
          selected=()
          [[ "${INCLUDE_STANDARD_APK}" == "true" ]] && selected+=(standard)
          [[ "${INCLUDE_TOPWAY_TWMEDIA_APK}" == "true" ]] && selected+=(topway_twmedia)
          [[ "${INCLUDE_TOPWAY_TWMUSIC_MAGISK}" == "true" ]] && selected+=(topway_twmusic_magisk)
          if (( ${#selected[@]} == 0 )); then
            echo "::error::At least one release asset must be selected."
            exit 1
          fi
          {
            printf 'selected_variants<<EOF\n'
            printf '%s\n' "${selected[@]}"
            printf 'EOF\n'
            printf 'selected_summary=%s\n' "$(IFS=', '; echo "${selected[*]}")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "ndk;28.2.13676358"

      - name: Verify Android SDK tooling
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          which sdkmanager || true
          sdkmanager --list_installed || true
          if ! command -v apksigner >/dev/null 2>&1; then
            BUILD_TOOLS_APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner 2>/dev/null | sort -V | tail -n1 || true)"
            if [[ -z "${BUILD_TOOLS_APKSIGNER}" ]]; then
              echo "::error::apksigner is unavailable after Android SDK setup."
              exit 1
            fi
            echo "apksigner located at ${BUILD_TOOLS_APKSIGNER}"
          fi

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Compute release version and selected asset names
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          SELECTED_VARIANTS: ${{ steps.selection.outputs.selected_variants }}
        run: |
          set -euo pipefail
          git fetch --tags origin "${GITHUB_REF_NAME}"
          INPUT_TAG="$(printf '%s' "${INPUT_VERSION_TAG}" | xargs)"
          CURRENT_VERSION_NAME="$(sed -n -E 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' app/build.gradle | head -n1)"
          CURRENT_VERSION_CODE="$(sed -n -E 's/^[[:space:]]*versionCode ([0-9]+).*/\1/p' app/build.gradle | head -n1)"
          if [[ -z "${CURRENT_VERSION_NAME}" || -z "${CURRENT_VERSION_CODE}" ]]; then
            echo "::error::Unable to find current versionName/versionCode in app/build.gradle."
            exit 1
          fi
          PREVIOUS_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [[ -n "${INPUT_TAG}" ]]; then
            if [[ ! "${INPUT_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version_tag '${INPUT_TAG}'. Expected format MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH."
              exit 1
            fi
            [[ "${INPUT_TAG}" == v* ]] && RELEASE_TAG="${INPUT_TAG}" || RELEASE_TAG="v${INPUT_TAG}"
          else
            if [[ -n "${PREVIOUS_TAG}" ]]; then
              BASE_VERSION="${PREVIOUS_TAG#v}"
            elif [[ "${CURRENT_VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              BASE_VERSION="${CURRENT_VERSION_NAME}"
            else
              BASE_VERSION="0.1.0"
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VERSION}"
            RELEASE_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          TAG_EXISTS=false
          RELEASE_EXISTS=false
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi
          if [[ -z "${INPUT_TAG}" && ( "${TAG_EXISTS}" == "true" || "${RELEASE_EXISTS}" == "true" ) ]]; then
            echo "::error::Auto-computed tag '${RELEASE_TAG}' already exists. Provide a newer version_tag or delete the stale release/tag."
            exit 1
          fi
          if [[ "${TAG_EXISTS}" == "true" && "${RELEASE_EXISTS}" != "true" ]]; then
            echo "::error::Tag '${RELEASE_TAG}' exists without a GitHub release. Refusing to attach assets ambiguously."
            exit 1
          fi
          EXISTING_RELEASE="${RELEASE_EXISTS}"
          TAG_COMMIT_SHA=""
          if [[ "${EXISTING_RELEASE}" == "true" && "${TAG_EXISTS}" != "true" ]]; then
            echo "::error::Release '${RELEASE_TAG}' exists but the matching git tag is missing."
            exit 1
          fi
          if [[ "${EXISTING_RELEASE}" == "true" ]]; then
            TAG_COMMIT_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            RELEASE_VERSION_NAME="${RELEASE_TAG#v}"
            RELEASE_VERSION_CODE="$(git show "${RELEASE_TAG}:app/build.gradle" | sed -n -E 's/^[[:space:]]*versionCode ([0-9]+).*/\1/p' | head -n1)"
            if [[ -z "${RELEASE_VERSION_CODE}" ]]; then
              echo "::error::Unable to find versionCode in ${RELEASE_TAG}:app/build.gradle."
              exit 1
            fi
          else
            RELEASE_VERSION_NAME="${RELEASE_TAG#v}"
            RELEASE_VERSION_CODE="$((CURRENT_VERSION_CODE + 1))"
          fi
          declare -A names=(
            [standard]="Auxio-TS-${RELEASE_TAG}-standard-release.apk"
            [topway_twmedia]="Auxio-TS-${RELEASE_TAG}-topway-twmedia-release.apk"
            [topway_twmusic_magisk]="Auxio-TS-${RELEASE_TAG}-topway-twmusic-magisk.zip"
          )
          asset_names=()
          while IFS= read -r variant; do
            [[ -z "${variant}" ]] && continue
            asset_names+=("${names[$variant]}")
          done <<< "${SELECTED_VARIANTS}"
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_version_name=${RELEASE_VERSION_NAME}"
            echo "release_version_code=${RELEASE_VERSION_CODE}"
            echo "previous_tag=${PREVIOUS_TAG}"
            echo "existing_release=${EXISTING_RELEASE}"
            echo "tag_commit_sha=${TAG_COMMIT_SHA}"
            printf 'asset_names<<EOF\n'
            printf '%s\n' "${asset_names[@]}"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Check selected asset collisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          ASSET_NAMES: ${{ steps.version.outputs.asset_names }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            exit 0
          fi
          existing="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            [[ -z "${asset}" ]] && continue
            if grep -Fx -- "${asset}" <<< "${existing}" >/dev/null; then
              if [[ "${REPLACE_EXISTING_ASSETS}" == "true" ]]; then
                echo "Selected asset will be replaced after rebuilt assets are staged: ${asset}"
              else
                echo "::error::Selected asset already exists on ${RELEASE_TAG}: ${asset}. Re-run with replace_existing_assets=true to replace it."
                exit 1
              fi
            fi
          done <<< "${ASSET_NAMES}"

      - name: Preserve release packaging helper
        id: release_tooling
        shell: bash
        run: |
          set -euo pipefail
          packager_script="${RUNNER_TEMP}/package-topway-twmusic-magisk-module.sh"
          cp scripts/package-topway-twmusic-magisk-module.sh "${packager_script}"
          chmod +x "${packager_script}"
          echo "packager_script=${packager_script}" >> "$GITHUB_OUTPUT"

      - name: Checkout existing release tag for append
        if: ${{ steps.version.outputs.existing_release == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          TAG_COMMIT_SHA: ${{ steps.version.outputs.tag_commit_sha }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.release_version_name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.release_version_code }}
        run: |
          set -euo pipefail
          git checkout --detach "${TAG_COMMIT_SHA}"
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [[ "${CHECKOUT_SHA}" != "${TAG_COMMIT_SHA}" ]]; then
            echo "::error::Existing release append must build from ${RELEASE_TAG} (${TAG_COMMIT_SHA}), not ${CHECKOUT_SHA}."
            exit 1
          fi
          CHECKOUT_VERSION_NAME="$(sed -n -E 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' app/build.gradle | head -n1)"
          CHECKOUT_VERSION_CODE="$(sed -n -E 's/^[[:space:]]*versionCode ([0-9]+).*/\1/p' app/build.gradle | head -n1)"
          if [[ "${CHECKOUT_VERSION_NAME}" != "${RELEASE_VERSION_NAME}" || "${CHECKOUT_VERSION_CODE}" != "${RELEASE_VERSION_CODE}" ]]; then
            echo "::error::Checked-out tag version metadata does not match ${RELEASE_TAG}."
            echo "::error::Expected ${RELEASE_VERSION_NAME}/${RELEASE_VERSION_CODE}; got ${CHECKOUT_VERSION_NAME}/${CHECKOUT_VERSION_CODE}."
            exit 1
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile release

      - name: Validate signing secrets and decode keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${KEYSTORE_BASE64}" ]] && missing+=("KEYSTORE_BASE64")
          [[ -z "${KEYSTORE_PASSWORD}" ]] && missing+=("KEYSTORE_PASSWORD")
          [[ -z "${KEY_ALIAS}" ]] && missing+=("KEY_ALIAS")
          [[ -z "${KEY_PASSWORD}" ]] && missing+=("KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required release signing secrets: ${missing[*]}"
            exit 1
          fi
          echo "::add-mask::${KEYSTORE_PASSWORD}"
          echo "::add-mask::${KEY_ALIAS}"
          echo "::add-mask::${KEY_PASSWORD}"
          KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "keystore_path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Update Android version metadata locally
        if: ${{ steps.version.outputs.existing_release != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "0,/^([[:space:]]*)versionName \".*\"/s//\1versionName \"${{ steps.version.outputs.release_version_name }}\"/" app/build.gradle
          sed -i -E "0,/^([[:space:]]*)versionCode [0-9]+/s//\1versionCode ${{ steps.version.outputs.release_version_code }}/" app/build.gradle

      - name: Commit version metadata locally
        if: ${{ steps.version.outputs.existing_release != 'true' }}
        id: version_commit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- app/build.gradle; then
            echo "::error::Version metadata did not change; refusing to continue."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore(release): prepare ${RELEASE_TAG}"
          echo "release_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build, verify, and stage selected release assets
        id: assets
        shell: bash
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ steps.signing.outputs.keystore_path }}
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.release_version_name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.release_version_code }}
          SELECTED_VARIANTS: ${{ steps.selection.outputs.selected_variants }}
          PACKAGER_SCRIPT: ${{ steps.release_tooling.outputs.packager_script }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}"/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          if [[ ! -x "${APKSIGNER}" ]]; then
            echo "::error::apksigner was not found under ANDROID_HOME build-tools."
            exit 1
          fi
          find_one_apk() {
            local variant="$1"
            local apk_dir="$2"
            mapfile -t apks < <(find "${apk_dir}" -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort)
            if (( ${#apks[@]} == 0 )); then
              echo "::error::Could not find a signed ${variant} release APK in ${apk_dir}."
              exit 1
            fi
            if (( ${#apks[@]} > 1 )); then
              printf '::error::Found multiple plausible signed %s release APKs; refusing to choose automatically:\n' "${variant}"
              printf '%s\n' "${apks[@]}"
              exit 1
            fi
            printf '%s\n' "${apks[0]}"
          }
          artifact_dir="${RUNNER_TEMP}/selected-release-assets"
          rm -rf -- "${artifact_dir}"
          mkdir -p -- "${artifact_dir}"
          asset_paths=()
          asset_names=()
          while IFS= read -r variant; do
            [[ -z "${variant}" ]] && continue
            case "${variant}" in
              standard)
                bash ./scripts/ci-gradle.sh :app:assembleStandardRelease
                ./gradlew --stop || true
                apk_path="$(find_one_apk standard app/build/outputs/apk/standard/release)"
                "${APKSIGNER}" verify --verbose "${apk_path}"
                asset_name="Auxio-TS-${RELEASE_TAG}-standard-release.apk"
                asset_path="${RUNNER_TEMP}/${asset_name}"
                cp "${apk_path}" "${asset_path}"
                ;;
              topway_twmedia)
                bash ./scripts/ci-gradle.sh :app:assembleTopwayTwMediaRelease
                ./gradlew --stop || true
                apk_path="$(find_one_apk topway_twmedia app/build/outputs/apk/topwayTwMedia/release)"
                "${APKSIGNER}" verify --verbose "${apk_path}"
                asset_name="Auxio-TS-${RELEASE_TAG}-topway-twmedia-release.apk"
                asset_path="${RUNNER_TEMP}/${asset_name}"
                cp "${apk_path}" "${asset_path}"
                ;;
              topway_twmusic_magisk)
                bash ./scripts/ci-gradle.sh :app:assembleTopwayTwMusicRelease
                ./gradlew --stop || true
                apk_path="$(find_one_apk topway_twmusic app/build/outputs/apk/topwayTwMusic/release)"
                "${APKSIGNER}" verify --verbose "${apk_path}"
                asset_name="Auxio-TS-${RELEASE_TAG}-topway-twmusic-magisk.zip"
                asset_path="${RUNNER_TEMP}/${asset_name}"
                bash "${PACKAGER_SCRIPT}" \
                  --apk "${apk_path}" \
                  --output "${asset_path}" \
                  --version "${RELEASE_VERSION_NAME}" \
                  --version-code "${RELEASE_VERSION_CODE}"
                unzip -l "${asset_path}"
                ;;
              *)
                echo "::error::Unknown selected variant '${variant}'."
                exit 1
                ;;
            esac
            artifact_path="${artifact_dir}/${asset_name}"
            cp "${asset_path}" "${artifact_path}"
            asset_paths+=("${asset_path}")
            asset_names+=("${asset_name}")
          done <<< "${SELECTED_VARIANTS}"
          {
            printf 'asset_paths<<EOF\n'
            printf '%s\n' "${asset_paths[@]}"
            printf 'EOF\n'
            printf 'asset_names<<EOF\n'
            printf '%s\n' "${asset_names[@]}"
            printf 'EOF\n'
            printf 'artifact_dir=%s\n' "${artifact_dir}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate TS18 APK reference contracts
        shell: bash
        run: bash ./scripts/check-ts18-apk-reference-contracts.sh

      - name: Validate release APK compatibility contracts
        shell: bash
        env:
          SELECTED_VARIANTS: ${{ steps.selection.outputs.selected_variants }}
        run: bash ./scripts/check-dofun-topway-compat.sh

      - name: Upload selected release workflow artifacts
        id: release_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Auxio-TS-${{ steps.version.outputs.release_tag }}-selected-release-assets
          path: ${{ steps.assets.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Push release version commit and tag
        id: publish_ref
        if: ${{ steps.version.outputs.existing_release != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT_SHA: ${{ steps.version_commit.outputs.release_commit_sha }}
        run: |
          set -euo pipefail
          git fetch --tags origin "${GITHUB_REF_NAME}"
          REMOTE_HEAD="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          RELEASE_PARENT_SHA="$(git rev-parse "${RELEASE_COMMIT_SHA}^")"
          if [[ "${RELEASE_PARENT_SHA}" != "${REMOTE_HEAD}" ]]; then
            echo "::error::Remote ${GITHUB_REF_NAME} moved while building the selected release assets."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Remote tag '${RELEASE_TAG}' already exists. Refusing to overwrite it."
            exit 1
          fi
          git push origin "${RELEASE_COMMIT_SHA}:refs/heads/${GITHUB_REF_NAME}"
          git tag "${RELEASE_TAG}" "${RELEASE_COMMIT_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"
          echo "tag_pushed=true" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        if: ${{ steps.version.outputs.existing_release != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT_SHA: ${{ steps.version_commit.outputs.release_commit_sha }}
          ASSET_NAMES: ${{ steps.assets.outputs.asset_names }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          gh_api_args=(-f tag_name="${RELEASE_TAG}")
          [[ -n "${PREVIOUS_TAG}" ]] && gh_api_args+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          GENERATED_BODY=""
          if GENERATED_BODY="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${gh_api_args[@]}" --jq '.body // empty' 2>/dev/null)" && [[ -n "${GENERATED_BODY}" ]]; then
            echo "GitHub generated release notes successfully."
          else
            echo "::warning::GitHub generated release notes API returned empty or failed; using git log fallback."
          fi
          {
            echo "## What's changed"
            echo
            if [[ -n "${GENERATED_BODY}" ]]; then
              printf '%s\n' "${GENERATED_BODY}" | grep -viE "^## What's [Cc]hanged" || true
            elif [[ -n "${PREVIOUS_TAG}" ]]; then
              git log --reverse --pretty=format:"- [%s](https://github.com/${GITHUB_REPOSITORY}/commit/%H) by %an" "${PREVIOUS_TAG}..${RELEASE_TAG}"
            else
              git log --reverse --max-count=100 --pretty=format:"- [%s](https://github.com/${GITHUB_REPOSITORY}/commit/%H) by %an" "${RELEASE_TAG}"
            fi
            echo
            echo "## Selected release assets"
            echo
            while IFS= read -r asset; do
              [[ -z "${asset}" ]] && continue
              case "${asset}" in
                *standard-release.apk) printf -- "- \`%s\` keeps the normal Auxio-TS package identity (\`org.oxycblt.auxio\`).\n" "${asset}" ;;
                *topway-twmedia-release.apk) printf -- "- \`%s\` targets DoFun/Topway alternate entry (\`com.tw.media\`) while exposing \`com.tw.music.MusicActivity\`; TS18 validation is still required.\n" "${asset}" ;;
                *topway-twmusic-magisk.zip) printf -- "- \`%s\` is a Magisk module that systemlessly overlays the signed \`com.tw.music\` APK at \`/system/priv-app/com.tw.music_a41e/com.tw.music_a41e.apk\`; no raw topwayTwMusic APK asset is published.\n" "${asset}" ;;
              esac
            done <<< "${ASSET_NAMES}"
          } > "${NOTES_FILE}"
          if ! grep -qE '^- ' "${NOTES_FILE}"; then
            printf -- "- [Release commit](https://github.com/%s/commit/%s) by @github-actions[bot]\n" "${GITHUB_REPOSITORY}" "${RELEASE_COMMIT_SHA}" >> "${NOTES_FILE}"
          fi
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release with selected assets
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          ASSET_PATHS: ${{ steps.assets.outputs.asset_paths }}
          ASSET_NAMES: ${{ steps.assets.outputs.asset_names }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          EXISTING_RELEASE: ${{ steps.version.outputs.existing_release }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          mapfile -t asset_paths <<< "${ASSET_PATHS}"
          mapfile -t asset_names <<< "${ASSET_NAMES}"
          release_assets=()
          for i in "${!asset_paths[@]}"; do
            release_assets+=("${asset_paths[$i]}#${asset_names[$i]}")
          done
          if [[ "${EXISTING_RELEASE}" == "true" ]]; then
            if [[ "${REPLACE_EXISTING_ASSETS}" == "true" ]]; then
              existing_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
              for asset in "${asset_names[@]}"; do
                [[ -z "${asset}" ]] && continue
                if grep -Fx -- "${asset}" <<< "${existing_assets}" >/dev/null; then
                  gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes
                fi
              done
            fi
            gh release upload "${RELEASE_TAG}" "${release_assets[@]}"
          else
            release_args=()
            [[ "${IS_DRAFT}" == "true" ]] && release_args+=(--draft)
            [[ "${IS_PRERELEASE}" == "true" ]] && release_args+=(--prerelease)
            gh release create "${RELEASE_TAG}" "${release_assets[@]}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${RELEASE_NOTES_FILE}" \
              --verify-tag \
              "${release_args[@]}"
          fi
          echo "release_url=$(gh release view "${RELEASE_TAG}" --json url --jq '.url')" >> "$GITHUB_OUTPUT"

      - name: Cleanup release tag after failed release creation
        if: ${{ failure() && steps.publish_ref.outputs.tag_pushed == 'true' && steps.release.outcome != 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT_SHA: ${{ steps.version_commit.outputs.release_commit_sha }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} exists; keeping remote tag."
            exit 0
          fi
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}' || true)"
          if [[ -z "${remote_tag_sha}" ]]; then
            echo "Remote tag ${RELEASE_TAG} is already absent."
            exit 0
          fi
          if [[ "${remote_tag_sha}" != "${RELEASE_COMMIT_SHA}" ]]; then
            echo "::warning::Remote tag ${RELEASE_TAG} does not point at this workflow's release commit; refusing cleanup."
            exit 0
          fi
          git push origin ":refs/tags/${RELEASE_TAG}" || true

      - name: Verify selected GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          ASSET_NAMES: ${{ steps.assets.outputs.asset_names }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --json tagName,isDraft,isPrerelease,url,assets
          actual_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            [[ -z "${asset}" ]] && continue
            if grep -Fx -- "${asset}" <<< "${actual_assets}" >/dev/null; then
              echo "Verified selected release asset: ${asset}"
            else
              echo "::error::Release ${RELEASE_TAG} is missing selected asset: ${asset}"
              exit 1
            fi
          done <<< "${ASSET_NAMES}"
          if grep -Fx -- "Auxio-TS-${RELEASE_TAG}-topway-twmusic-release.apk" <<< "${actual_assets}" >/dev/null; then
            echo "::error::Raw topwayTwMusic APK asset is forbidden: Auxio-TS-${RELEASE_TAG}-topway-twmusic-release.apk"
            exit 1
          fi

      - name: Write release summary
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          SELECTED_SUMMARY: ${{ steps.selection.outputs.selected_summary }}
          ASSET_NAMES: ${{ steps.assets.outputs.asset_names }}
          RELEASE_ARTIFACT_URL: ${{ steps.release_artifact.outputs.artifact-url }}
          RELEASE_ARTIFACT_NAME: Auxio-TS-${{ steps.version.outputs.release_tag }}-selected-release-assets
          EXISTING_RELEASE: ${{ steps.version.outputs.existing_release }}
        run: |
          set -euo pipefail
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          run_url="${repo_url}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "# Manual release summary"
            echo
            case "${JOB_STATUS}" in
              success) echo "✅ Release workflow completed successfully." ;;
              failure) echo "❌ Release workflow failed. Inspect the failed step logs." ;;
              cancelled) echo "⚠️ Release workflow was cancelled before completion." ;;
              *) echo "⚠️ Release workflow finished with status: ${JOB_STATUS}." ;;
            esac
            echo
            echo "- Run: ${run_url}"
            echo "- Release tag: ${RELEASE_TAG:-<not computed>}"
            echo "- Existing release append mode: ${EXISTING_RELEASE:-false}"
            echo "- Selected variants: ${SELECTED_SUMMARY:-<not selected>}"
            if [[ -n "${RELEASE_URL:-}" ]]; then
              echo "- Release: ${RELEASE_URL}"
            fi
            if [[ -n "${RELEASE_ARTIFACT_URL:-}" ]]; then
              echo "- Workflow artifact: [${RELEASE_ARTIFACT_NAME}](${RELEASE_ARTIFACT_URL})"
            fi
            echo
            echo "## Selected assets"
            if [[ -n "${ASSET_NAMES:-}" ]]; then
              while IFS= read -r asset; do
                [[ -n "${asset}" ]] && echo "- ${asset}"
              done <<< "${ASSET_NAMES}"
            else
              echo "- No assets reached staging."
            fi
            echo
            echo "## OOM mitigations"
            echo "- Only selected variants are built."
            echo "- Each selected variant uses one sequential Gradle invocation with --no-daemon and default parallelism disabled."
            echo "- Gradle is stopped after each selected variant before APK copying or Magisk packaging."
            echo "- Outputs are staged under RUNNER_TEMP and unselected assets are not uploaded."
            echo "- topwayTwMusic is published only as a Magisk module ZIP, never as a raw APK release asset."
          } >> "$GITHUB_STEP_SUMMARY"
