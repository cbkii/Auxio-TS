name: Manual Release

# Publication contracts are implemented by bounded scripts/manual-release steps:
# assembleRelease -> app-release.apk
# :lsposed-bridge:assembleRelease -> lsposed-api100-bridge.apk
# The forbidden retired raw asset name topway-twmusic-release.apk is checked before publication.

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Optional version. Blank resumes unfinished current-dev work or creates the next patch; an existing tag explicitly repairs it.
        required: false
        type: string
      draft:
        description: Keep a newly created release as a draft after all assets verify
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark a newly published release as a prerelease
        required: true
        default: false
        type: boolean
      include_app_apk:
        description: Include the maintained Auxio-TS com.tw.media APK (recommended)
        required: true
        default: true
        type: boolean
      include_lsposed_bridge_apk:
        description: Opt in to the optional legacy com.tw.music LSPosed Track-C bridge
        required: true
        default: false
        type: boolean
      publish_debug_apks:
        description: Also publish diagnostic debug APKs on the GitHub Release (normally leave off)
        required: true
        default: false
        type: boolean
      replace_existing_assets:
        description: When repairing a draft release, replace complete existing APK/checksum/metadata sets
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          persist-credentials: false

      - name: Verify branch release context
        id: source
        shell: bash
        run: bash scripts/manual-release/01-verify-branch-release-context.sh

      - name: Select maintained release assets
        id: selection
        shell: bash
        env:
          INCLUDE_APP: ${{ inputs.include_app_apk }}
          INCLUDE_LSPOSED_BRIDGE: ${{ inputs.include_lsposed_bridge_apk }}
          PUBLISH_DEBUG_APKS: ${{ inputs.publish_debug_apks }}
        run: bash scripts/manual-release/03-select-maintained-release-assets.sh

      - name: Preserve release orchestration tools
        id: tooling
        shell: bash
        run: bash scripts/manual-release/04-preserve-release-orchestration-tools.sh

      - name: Resolve version and repository release state
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: auto
          INPUT_TAG: ${{ inputs.version_tag }}
          TOOL: ${{ steps.tooling.outputs.tools_dir }}/release-orchestrator.py
        run: bash scripts/manual-release/05-resolve-version-and-repository-release-state.sh

      - name: Plan efficient asset work
        id: asset_plan
        shell: bash
        env:
          TOOL: ${{ steps.tooling.outputs.tools_dir }}/release-orchestrator.py
          RELEASE_MODE: ${{ steps.plan.outputs.effective_mode }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          SELECTED_FILE: ${{ steps.selection.outputs.selected_file }}
          DEBUG_DESTINATION: ${{ steps.selection.outputs.debug_destination }}
          EXISTING_ASSETS_FILE: ${{ steps.plan.outputs.existing_assets_file }}
          TARGET_RELEASE_FILE: ${{ steps.plan.outputs.target_release_file }}
          REPLACE: ${{ inputs.replace_existing_assets }}
        run: bash scripts/manual-release/06-plan-efficient-asset-work.sh

      - name: Checkout immutable repair tag
        if: steps.plan.outputs.effective_mode == 'repair_existing_release'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
        run: bash scripts/manual-release/07-checkout-immutable-repair-tag.sh

      - name: Prepare release source metadata
        id: metadata
        shell: bash
        env:
          TOOL: ${{ steps.tooling.outputs.tools_dir }}/release-orchestrator.py
          RELEASE_MODE: ${{ steps.plan.outputs.effective_mode }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          VERSION_NAME: ${{ steps.plan.outputs.release_version_name }}
          VERSION_CODE: ${{ steps.plan.outputs.release_version_code }}
          METADATA_CHANGE_REQUIRED: ${{ steps.plan.outputs.metadata_change_required }}
        run: bash scripts/manual-release/08-prepare-release-source-metadata.sh

      - name: Set up JDK 21
        if: steps.asset_plan.outputs.build_count != '0'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.asset_plan.outputs.build_count != '0'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-cleanup: always

      - name: Set up Android SDK
        if: steps.asset_plan.outputs.build_count != '0'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android and native build tools
        if: steps.asset_plan.outputs.build_count != '0'
        shell: bash
        run: bash scripts/manual-release/09-install-android-and-native-build-tools.sh

      - name: Prepare CI environment
        if: steps.asset_plan.outputs.build_count != '0'
        shell: bash
        run: bash scripts/manual-release/10-prepare-ci-environment.sh

      - name: Decode release keystore
        id: signing
        if: steps.asset_plan.outputs.needs_signing == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/manual-release/11-decode-release-keystore.sh

      - name: Build once, inspect once and stage selected assets
        id: assets
        shell: bash
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ steps.signing.outputs.path }}
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_bridgeVersionName: ${{ steps.metadata.outputs.version_name }}
          ORG_GRADLE_PROJECT_bridgeVersionCode: ${{ steps.metadata.outputs.version_code }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          RELEASE_SHA: ${{ steps.metadata.outputs.release_sha }}
          BUILD_VARIANTS_FILE: ${{ steps.asset_plan.outputs.build_variants_file }}
          BUILD_APK_NAMES_FILE: ${{ steps.asset_plan.outputs.build_apk_names_file }}
          UPLOAD_NAMES_FILE: ${{ steps.asset_plan.outputs.upload_names_file }}
          DEBUG_DESTINATION: ${{ steps.selection.outputs.debug_destination }}
          TOOLS_DIR: ${{ steps.tooling.outputs.tools_dir }}
          ASSET_PLAN_FILE: ${{ steps.asset_plan.outputs.plan_file }}
          RELEASE_PLAN_FILE: ${{ steps.plan.outputs.plan_file }}
          NEEDS_SIGNING: ${{ steps.asset_plan.outputs.needs_signing }}
        run: bash scripts/manual-release/12-build-once-inspect-once-and-stage-selected-assets.sh

      - name: Validate new-release source contracts
        if: steps.plan.outputs.effective_mode == 'create_new_release'
        shell: bash
        run: bash scripts/manual-release/13-validate-new-release-source-contracts.sh

      - name: Upload release recovery workflow artifact
        id: release_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Auxio-TS-${{ steps.plan.outputs.release_tag }}-release-recovery
          path: ${{ steps.assets.outputs.release_artifact_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload selected debug workflow artifacts
        id: debug_artifact
        if: steps.selection.outputs.debug_destination == 'workflow_artifacts'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Auxio-TS-${{ steps.plan.outputs.release_tag }}-debug-companions
          path: ${{ steps.assets.outputs.debug_artifact_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Push immutable release tag
        id: publish_tag
        if: steps.plan.outputs.effective_mode == 'create_new_release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.metadata.outputs.release_sha }}
        run: bash scripts/manual-release/14-push-immutable-release-tag.sh

      - name: Ensure draft release transaction exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.metadata.outputs.release_sha }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
          RELEASE_EXISTS: ${{ steps.plan.outputs.release_exists }}
          DEBUG_DESTINATION: ${{ steps.selection.outputs.debug_destination }}
          TARGET_RELEASE_FILE: ${{ steps.plan.outputs.target_release_file }}
        run: bash scripts/manual-release/15-ensure-draft-release-transaction-exists.sh

      - name: Upload or replace planned release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          UPLOAD_TSV: ${{ steps.assets.outputs.upload_tsv }}
          REPLACE_NAMES_FILE: ${{ steps.asset_plan.outputs.replace_names_file }}
          REPLACE: ${{ inputs.replace_existing_assets }}
        run: bash scripts/manual-release/16-upload-or-replace-planned-release-assets.sh

      - name: Verify remote release asset manifest
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_MODE: ${{ steps.plan.outputs.effective_mode }}
          VERIFY_NAMES_FILE: ${{ steps.asset_plan.outputs.verify_names_file }}
          DEBUG_DESTINATION: ${{ steps.selection.outputs.debug_destination }}
        run: bash scripts/manual-release/17-verify-remote-release-asset-manifest.sh

      - name: Apply requested status after verified create transaction
        id: finalise
        if: steps.plan.outputs.apply_requested_status == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: bash scripts/manual-release/18-apply-requested-status-after-verified-create-transaction.sh

      - name: Synchronise released source metadata to dev
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.metadata.outputs.release_sha }}
        run: bash scripts/manual-release/19-synchronise-released-source-metadata-to-dev.sh

      - name: Write release summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          REQUESTED_MODE: automatic_create_or_resume
          EFFECTIVE_MODE: ${{ steps.plan.outputs.effective_mode }}
          RESOLUTION_REASON: ${{ steps.plan.outputs.resolution_reason }}
          UNRESOLVED_TAG_ONLY: ${{ steps.plan.outputs.unresolved_tag_only_versions }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_SHA: ${{ steps.metadata.outputs.release_sha }}
          SELECTED_TAG_SHA: ${{ steps.plan.outputs.selected_tag_sha }}
          SELECTED_TAG_RELATION: ${{ steps.plan.outputs.selected_tag_relation }}
          SELECTED: ${{ steps.selection.outputs.selected_summary }}
          DEBUG_DESTINATION: ${{ steps.selection.outputs.debug_destination }}
          VERIFY_NAMES_FILE: ${{ steps.asset_plan.outputs.verify_names_file }}
          RELEASE_ARTIFACT_URL: ${{ steps.release_artifact.outputs.artifact-url }}
          DEBUG_ARTIFACT_URL: ${{ steps.debug_artifact.outputs.artifact-url }}
          RELEASE_CREATED: ${{ steps.release.outputs.created }}
          INITIAL_DRAFT: ${{ steps.release.outputs.initial_draft }}
          INITIAL_PRERELEASE: ${{ steps.release.outputs.initial_prerelease }}
          FINAL_DRAFT: ${{ steps.finalise.outputs.draft }}
          FINAL_PRERELEASE: ${{ steps.finalise.outputs.prerelease }}
          ASSETS_VERIFIED: ${{ steps.verify.outputs.verified }}
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
        run: bash scripts/manual-release/20-write-release-summary.sh
