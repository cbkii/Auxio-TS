name: Temporary unit diagnostic

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: temporary-unit-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ github.head_ref == 'release-ready-fixes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout release-ready branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: release-ready-fixes
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Run and capture app unit tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
          bash ./scripts/bootstrap-dependencies.sh --profile jvm-tests

          log_file="${RUNNER_TEMP}/unit-test.log"
          test_rc=0
          bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest :musikr:testDebugUnitTest \
            >"${log_file}" 2>&1 || test_rc=$?

          if ((test_rc == 0)); then
            rm -f \
              .github/unit-test-diagnostic.txt \
              .github/workflows/temporary-unit-diagnostic.yml
            git add -A
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ci: remove completed unit diagnostic [unit-diagnostic-complete]'
          else
            {
              printf 'Exit status: %s\n\n' "${test_rc}"
              tail -n 800 "${log_file}"
            } > .github/unit-test-diagnostic.txt
            git add .github/unit-test-diagnostic.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ci: record unit-test diagnostic [unit-diagnostic-failed]'
          fi

          auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push https://github.com/${GITHUB_REPOSITORY}.git HEAD:release-ready-fixes

          if ((test_rc != 0)); then
            cat .github/unit-test-diagnostic.txt
            exit "${test_rc}"
          fi
