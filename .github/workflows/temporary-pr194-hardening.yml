name: Temporary PR 194 hardening

on:
  push:
    branches:
      - perf/android10-code-health-20260723
    paths:
      - ".github/workflows/temporary-pr194-hardening.yml"
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/temporary-pr194-hardening.yml"

permissions:
  contents: write

concurrency:
  group: temporary-pr194-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: perf/android10-code-health-20260723
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Ensure native build tools are present
        shell: bash
        run: |
          missing=()
          command -v ninja >/dev/null 2>&1 || missing+=(ninja-build)
          command -v python3 >/dev/null 2>&1 || missing+=(python3)
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Apply exact hardening patches
        shell: bash
        run: python3 scripts/temporary_pr194_hardening.py

      - name: Prepare current dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply repository formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply

      - name: Verify scoped tests and formatting
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh \
            :app:testStandardDebugUnitTest \
            :musikr:testDebugUnitTest \
            spotlessCheck
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml
          git diff --check

      - name: Keep only PR-scoped formatting changes
        shell: bash
        run: |
          base_sha="$(git merge-base origin/dev HEAD)"
          allowed_file="${RUNNER_TEMP}/pr194-allowed-files.txt"
          git diff --name-only "${base_sha}...HEAD" > "${allowed_file}"
          printf '%s\n' ".github/workflows/lint.yml" >> "${allowed_file}"

          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            if ! grep -Fxq "${path}" "${allowed_file}"; then
              echo "Restoring out-of-scope Spotless change: ${path}"
              git restore -- "${path}"
            fi
          done < <(git diff --name-only)

          git rm -- \
            scripts/temporary_pr194_hardening.py \
            .github/workflows/temporary-pr194-hardening.yml
          git diff --check

      - name: Commit and push hardening result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          printf '%s\n' "Final staged files:"
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo "::error::Hardening workflow produced no commit."
            exit 1
          fi
          git commit -m "fix: complete PR 194 pre-merge hardening"
          git push origin HEAD:perf/android10-code-health-20260723
