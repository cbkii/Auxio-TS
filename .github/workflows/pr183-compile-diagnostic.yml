name: PR183 compile diagnostic

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-compile-diagnostic.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Prepare dependencies
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Compile changed modules
        id: compile
        shell: bash
        run: |
          set +e
          bash ./scripts/ci-gradle.sh \
            :musikr:compileDebugKotlin \
            :app:compileStandardDebugKotlin \
            > pr183-compile.log 2>&1
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Post bounded diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.compile.outputs.status }}
        shell: bash
        run: |
          {
            echo "### PR 2 compile diagnostic"
            echo
            echo "Exit status: \`${STATUS}\`"
            echo
            echo '```text'
            tail -n 240 pr183-compile.log
            echo '```'
          } > pr183-comment.md
          gh pr comment 183 --repo cbkii/Auxio-TS --body-file pr183-comment.md
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr183-compile-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove PR 183 compile diagnostic'
          git push origin HEAD:cx/incremental-library-pipeline
      - name: Fail when compilation failed
        env:
          STATUS: ${{ steps.compile.outputs.status }}
        run: test "${STATUS}" = 0
