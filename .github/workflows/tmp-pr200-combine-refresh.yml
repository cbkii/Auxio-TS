name: PR200 Combine Manifest Refresh

on:
  push:
    branches:
      - agent/ts18-root-storage-fastpath
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr200-combine-refresh
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'agent/ts18-root-storage-fastpath')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ts18-root-storage-fastpath
          fetch-depth: 0
          submodules: false

      - name: Reuse the helper manifest returned by the same root process
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/org/oxycblt/auxio/headunit/root/storage/PreparedVolumeIndexStore.kt')
          text = path.read_text(encoding='utf-8')
          old = '''        lastRefreshElapsedMs = now
          rootStateHolder.refreshPreparedVolumeManifestSync()
          val text = rootStateHolder.readPreparedVolumeManifestSync() ?: return records
          '''
          new = '''        lastRefreshElapsedMs = now
          val text = rootStateHolder.refreshPreparedVolumeManifestSync() ?: return records
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one refresh sequence, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-pr200-combine-refresh.yml

      - name: Validate and commit
        run: |
          git diff --check
          bash scripts/check-ts18-root-storage-fastpath.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(ts18): reuse combined helper manifest refresh'
          git push origin HEAD:agent/ts18-root-storage-fastpath
