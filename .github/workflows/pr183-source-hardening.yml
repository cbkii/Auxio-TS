name: PR 183 source hardening

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-source-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0
          persist-credentials: false

      - name: Apply audited playback and architecture guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          exo = Path("app/src/main/java/org/oxycblt/auxio/playback/service/ExoPlaybackStateHolder.kt")
          replace_once(
              exo,
              '''            val audioRenderer = RenderersFactory { handler, _, audioListener, _, _ ->
                  arrayOf<BaseRenderer>(
                      FfmpegAudioRenderer(handler, audioListener, replayGainProcessor),
                      MediaCodecAudioRenderer(
                          context,
                          MediaCodecSelector.DEFAULT,
                          handler,
                          audioListener,
                          DefaultAudioSink.Builder(context)
                              .setAudioProcessors(arrayOf(replayGainProcessor))
                              .build(),
                      ),
                  )
              }
''',
              '''            val audioRenderer = RenderersFactory { handler, _, audioListener, _, _ ->
                  // Prefer Android's platform decoder for normal formats. FFmpeg remains a fallback
                  // compatibility renderer instead of loading first for every supported track.
                  val platformRenderer =
                      MediaCodecAudioRenderer(
                          context,
                          MediaCodecSelector.DEFAULT,
                          handler,
                          audioListener,
                          DefaultAudioSink.Builder(context)
                              // Keep one processor available for runtime ReplayGain setting changes;
                              // it remains at unity gain while disabled or when metadata is absent.
                              .setAudioProcessors(arrayOf(replayGainProcessor))
                              .build(),
                      )
                  arrayOf<BaseRenderer>(
                      platformRenderer,
                      FfmpegAudioRenderer(handler, audioListener, replayGainProcessor),
                  )
              }
''',
          )

          test = Path("app/src/test/java/org/oxycblt/auxio/music/ImmediateLaneArchitectureTest.kt")
          replace_once(
              test,
              "import kotlin.test.assertFalse\n",
              "import kotlin.test.assertFalse\nimport kotlin.test.assertTrue\n",
          )
          replace_once(
              test,
              '''    @Test
    fun `fast interaction consumers never materialise the complete graph`() {
''',
              '''    @Test
    fun `playback uses platform decoding before the FFmpeg fallback`() {
        val source =
            root.resolve(
                    "app/src/main/java/org/oxycblt/auxio/playback/service/" +
                        "ExoPlaybackStateHolder.kt"
                )
                .readText()
        val platformRenderer = source.indexOf("MediaCodecAudioRenderer(")
        val ffmpegRenderer = source.indexOf("FfmpegAudioRenderer(")

        assertTrue(platformRenderer >= 0, "platform renderer is missing")
        assertTrue(ffmpegRenderer > platformRenderer, "FFmpeg must remain a fallback renderer")
        assertTrue(source.contains(".setAudioProcessors(arrayOf(replayGainProcessor))"))
        assertTrue(
            source.contains("FfmpegAudioRenderer(handler, audioListener, replayGainProcessor)")
        )
    }

    @Test
    fun `fast interaction consumers never materialise the complete graph`() {
''',
          )

          doc = Path("docs/architecture/INCREMENTAL_LIBRARY_PIPELINE.md")
          replace_once(
              doc,
              "FFmpeg remains a playback compatibility renderer rather than an indexing/enrichment component; this PR does not add a second renderer pipeline or player.",
              "Android's platform MediaCodec renderer is ordered first for normal formats. FFmpeg remains a fallback playback compatibility renderer rather than an indexing/enrichment component; this PR does not add a second renderer pipeline or player.",
          )

          Path(".github/workflows/pr183-source-hardening.yml").unlink()
          PY

      - name: Commit audited patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: prefer platform audio decoding and guard the policy'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/cbkii/Auxio-TS.git"
          git pull --rebase origin cx/incremental-library-pipeline
          git push origin HEAD:cx/incremental-library-pipeline
