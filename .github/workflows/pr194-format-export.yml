name: Temporary PR 194 format export

on:
  push:
    branches:
      - perf/android10-code-health-20260723
    paths:
      - ".github/workflows/pr194-format-export.yml"
      - "app/src/main/java/org/oxycblt/auxio/headunit/root/RootProcessRunner.kt"
      - "app/src/test/java/org/oxycblt/auxio/headunit/root/RootProcessRunnerTest.kt"
      - "musikr/src/androidTest/java/org/oxycblt/musikr/fs/direct/DirectFSInstrumentedTest.kt"

permissions:
  contents: read

concurrency:
  group: pr194-format-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: perf/android10-code-health-20260723
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo "::error::Android SDK is unavailable"; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply repository formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply

      - name: Upload formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr194-formatted-sources
          path: |
            app/src/main/java/org/oxycblt/auxio/headunit/root/RootProcessRunner.kt
            app/src/test/java/org/oxycblt/auxio/headunit/root/RootProcessRunnerTest.kt
            musikr/src/androidTest/java/org/oxycblt/musikr/fs/direct/DirectFSInstrumentedTest.kt
          if-no-files-found: error
          retention-days: 1
