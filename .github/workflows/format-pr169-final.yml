name: Format final PR 169 branch

on:
  pull_request:
    branches:
      - dev
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: format-final-pr169
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.repository == 'cbkii/Auxio-TS' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ts18-runtime-regressions-v605'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/ts18-runtime-regressions-v605
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Write local.properties
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Prepare formatting dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply and verify formatting
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_TIMEOUT: 20m
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh spotlessApply
          bash ./scripts/ci-gradle.sh spotlessCheck
          git diff --check

      - name: Commit formatter changes and remove temporary workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/format-pr169-final.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '::error::Expected at least the temporary workflow removal.'
            exit 1
          fi
          git commit -m 'style: apply final PR 169 formatting'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/ts18-runtime-regressions-v605
