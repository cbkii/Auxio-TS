name: Temporary PR190 release validation

on:
  push:
    branches:
      - feat/generated-playlists-and-grid-layout-12959696348616356066

permissions:
  contents: write

concurrency:
  group: temporary-pr190-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    if: ${{ !contains(github.event.head_commit.message, '[pr190-release-validated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout integrated pull-request merge
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refs/pull/190/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Validate integrated release variants
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
          bash ./scripts/bootstrap-dependencies.sh --profile release
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardRelease
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicRelease
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaRelease

          release_apks=()
          for apk_dir in \
            app/build/outputs/apk/standard/release \
            app/build/outputs/apk/topwayTwMusic/release \
            app/build/outputs/apk/topwayTwMedia/release; do
            mapfile -t variant_apks < <(find "${apk_dir}" -maxdepth 1 -type f -name '*.apk' | sort)
            if (( ${#variant_apks[@]} != 1 )); then
              printf 'Expected exactly one release APK in %s, found %d\n' "${apk_dir}" "${#variant_apks[@]}" >&2
              printf '%s\n' "${variant_apks[@]:-}" >&2
              exit 1
            fi
            release_apks+=("${variant_apks[0]}")
          done
          for apk in "${release_apks[@]}"; do
            printf 'Validating startup contracts: %s\n' "${apk}"
            bash ./scripts/check-startup-performance-contracts.sh "${apk}"
          done
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-headunit-compat-safety.sh

      - name: Remove temporary workflow after successful validation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch='feat/generated-playlists-and-grid-layout-12959696348616356066'
          git fetch origin "${branch}"
          git checkout -B "${branch}" "origin/${branch}"
          rm -f .github/workflows/temporary-pr190-release-validation.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: validate integrated release variants [pr190-release-validated]'
          auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push https://github.com/${GITHUB_REPOSITORY}.git \
            HEAD:"${branch}"
