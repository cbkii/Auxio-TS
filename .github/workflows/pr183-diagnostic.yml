name: PR 183 format and cleanup

on:
  push:
    branches:
      - cx/incremental-library-pipeline

permissions:
  contents: write

concurrency:
  group: pr183-format-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply repository formatting
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh spotlessApply
          bash ./scripts/ci-gradle.sh spotlessCheck

      - name: Remove temporary diagnostics and push cleanup
        shell: bash
        run: |
          rm -f -- \
            .github/workflows/pr183-diagnostic.yml \
            .github/pr183-compile-failure.log \
            .github/pr183-hardening-failure.log \
            .github/pr183_patch.b64.* \
            .github/pr183_patch2.b64.*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'chore: format and clean PR 183 branch'
          git push origin HEAD:cx/incremental-library-pipeline
