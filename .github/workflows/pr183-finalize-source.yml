name: PR 183 final source patch

"on":
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-finalize-source.yml

permissions:
  contents: write

jobs:
  patch-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::Android SDK path is unavailable."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare repository dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply audited patch and formatting
        shell: bash
        run: |
          python3 .github/pr183_finalize_source.py
          bash ./scripts/ci-gradle.sh spotlessApply
          rm -f .github/pr183_finalize_source.py .github/workflows/pr183-finalize-source.yml
          git diff --check

      - name: Commit and push result
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Expected source or formatting changes were not produced."
            exit 1
          fi
          git commit -m 'perf: harden optional playback components and formatting'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/cbkii/Auxio-TS.git"
          git pull --rebase origin cx/incremental-library-pipeline
          git push origin HEAD:cx/incremental-library-pipeline
