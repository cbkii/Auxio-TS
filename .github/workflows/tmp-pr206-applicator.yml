name: PR206 library-loading applicator

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/restore-v607-library-loading'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-v607-library-loading
          fetch-depth: 0

      - name: Apply source-loading restoration
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/pr206-applicator.log
          from pathlib import Path
          from textwrap import dedent
          import re

          def load(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def save(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def sub(path: str, pattern: str, replacement: str, *, flags=re.S) -> None:
              text = load(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: pattern did not match: {pattern[:180]!r}")
              save(path, updated)

          def insert_after(path: str, marker: str, addition: str) -> None:
              text = load(path)
              if marker not in text:
                  raise SystemExit(f"{path}: marker not found: {marker[:180]!r}")
              save(path, text.replace(marker, marker + addition, 1))

          # Fresh installs return to the last known-good SAF source-selection baseline.
          sub(
              "app/src/main/java/org/oxycblt/auxio/music/locations/LocationMode.kt",
              r"        fun defaultForFlavor\(topwayCompat: Boolean\): LocationMode =\s*if \(topwayCompat\) DIRECT_FS else SAF",
              dedent('''
                      fun defaultForFlavor(
                          @Suppress("UNUSED_PARAMETER") topwayCompat: Boolean
                      ): LocationMode = SAF''').lstrip("\n"),
          )

          # Durable, atomic source configuration and a separate generated-playlist preference.
          path = "app/src/main/java/org/oxycblt/auxio/music/MusicSettings.kt"
          insert_after(
              path,
              "    var mediaStoreQuery: MediaStore.Query\n",
              dedent('''

                  /** Monotonic generation for an atomically persisted source configuration. */
                  val sourceConfigurationGeneration: Long
                      get() = 0L

                  /** Optional post-load generated playlists. Disabled by default. */
                  val generatedPlaylistsEnabled: Boolean
                      get() = false

                  /** Persist all source fields together and queue one cache-bypassing initial scan. */
                  fun applySourceConfiguration(
                      mode: LocationMode,
                      safQuery: SAF.Query,
                      mediaStoreQuery: MediaStore.Query,
                  ): Boolean {
                      val changed =
                          locationMode != mode ||
                              this.safQuery != safQuery ||
                              this.mediaStoreQuery != mediaStoreQuery
                      locationMode = mode
                      this.safQuery = safQuery
                      this.mediaStoreQuery = mediaStoreQuery
                      return changed
                  }

                  /** Consume a durable first-scan marker after the indexing worker is attached. */
                  fun consumePendingInitialScan(): Boolean = false
                  ''').rstrip("\n"),
          )
          insert_after(
              path,
              "        fun onObservingChanged() {}\n",
              dedent('''

                  /** Rebuild optional generated playlists without rescanning sources. */
                  fun onGeneratedPlaylistsChanged() {}
                  ''').rstrip("\n"),
          )
          insert_after(
              path,
              "    override val performanceCaptureEnabled: Boolean\n        get() = sharedPreferences.getBoolean(getString(R.string.set_key_performance_capture), false)\n",
              dedent('''

                  override val sourceConfigurationGeneration: Long
                      get() = sharedPreferences.getLong(KEY_SOURCE_CONFIGURATION_GENERATION, 0L)

                  override val generatedPlaylistsEnabled: Boolean
                      get() =
                          sharedPreferences.getBoolean(
                              getString(R.string.set_key_generated_playlists),
                              false,
                          )
                  ''').rstrip("\n"),
          )
          sub(
              path,
              r"    override fun forceLocationUpdate\(\) \{.*?\n    \}\n\n    override fun onSettingChanged",
              dedent('''
                  @Synchronized
                  override fun applySourceConfiguration(
                      mode: LocationMode,
                      safQuery: SAF.Query,
                      mediaStoreQuery: MediaStore.Query,
                  ): Boolean {
                      val changed =
                          locationMode != mode ||
                              this.safQuery != safQuery ||
                              this.mediaStoreQuery != mediaStoreQuery
                      if (!changed) return false

                      val nextGeneration = sourceConfigurationGeneration + 1L
                      sharedPreferences.edit(commit = true) {
                          putInt(getString(R.string.set_key_locations_mode), mode.intCode)
                          putString(getString(R.string.set_key_music_locations), safQuery.source.stringify())
                          putString(
                              getString(R.string.set_key_excluded_locations),
                              safQuery.exclude.stringify(),
                          )
                          putBoolean(getString(R.string.set_key_with_hidden), safQuery.withHidden)
                          putBoolean(
                              getString(R.string.set_key_saf_multithread),
                              safQuery.multithread,
                          )

                          val filterMode =
                              when (mediaStoreQuery.mode) {
                                  MediaStore.FilterMode.INCLUDE -> IntegerTable.FILTER_MODE_INCLUDE
                                  MediaStore.FilterMode.EXCLUDE -> IntegerTable.FILTER_MODE_EXCLUDE
                              }
                          putInt(getString(R.string.set_key_filter_mode), filterMode)
                          putString(
                              getString(R.string.set_key_filtered_locations),
                              mediaStoreQuery.filtered.stringify(),
                          )
                          putBoolean(
                              getString(R.string.set_key_exclude_non_music),
                              mediaStoreQuery.excludeNonMusic,
                          )
                          putBoolean(getString(R.string.set_key_library_last_scan_failed), false)
                          putBoolean(KEY_PENDING_INITIAL_SCAN, true)
                          putLong(KEY_SOURCE_CONFIGURATION_GENERATION, nextGeneration)
                      }
                      L.i("Persisted source configuration generation $nextGeneration [mode=$mode]")
                      return true
                  }

                  @Synchronized
                  override fun consumePendingInitialScan(): Boolean {
                      if (!sharedPreferences.getBoolean(KEY_PENDING_INITIAL_SCAN, false)) return false
                      sharedPreferences.edit(commit = true) { putBoolean(KEY_PENDING_INITIAL_SCAN, false) }
                      return true
                  }

                  override fun forceLocationUpdate() {
                      markInitialScanPending()
                      listeners.forEach { it.onMusicLocationsChanged() }
                  }

                  @Synchronized
                  private fun markInitialScanPending() {
                      val nextGeneration = sourceConfigurationGeneration + 1L
                      sharedPreferences.edit(commit = true) {
                          putBoolean(getString(R.string.set_key_library_last_scan_failed), false)
                          putBoolean(KEY_PENDING_INITIAL_SCAN, true)
                          putLong(KEY_SOURCE_CONFIGURATION_GENERATION, nextGeneration)
                      }
                  }

                  override fun onSettingChanged''').lstrip("\n"),
          )
          sub(
              path,
              r"(            getString\(R\.string\.set_key_performance_capture\) -> \{)",
              dedent('''
                              getString(R.string.set_key_generated_playlists) -> {
                                  L.d("Applying generated-playlist preference without source reindex")
                                  listener.onGeneratedPlaylistsChanged()
                              }
                              getString(R.string.set_key_performance_capture) -> {''').lstrip("\n"),
              flags=0,
          )
          sub(
              path,
              r"    private companion object \{\n        const val KEY_TS18_SYSTEM_SOURCE_FILTER = \"auxio_ts18_system_source_filter\"\n    \}",
              dedent('''
                  private companion object {
                      const val KEY_TS18_SYSTEM_SOURCE_FILTER = "auxio_ts18_system_source_filter"
                      const val KEY_PENDING_INITIAL_SCAN = "auxio_pending_initial_music_scan"
                      const val KEY_SOURCE_CONFIGURATION_GENERATION =
                          "auxio_source_configuration_generation"
                  }''').lstrip("\n"),
          )

          # DirectFS mode uses its direct candidate/manual picker, never DocumentsUI.
          path = "app/src/main/java/org/oxycblt/auxio/music/locations/LocationsDialog.kt"
          sub(
              path,
              r"    private fun onNewLocation\(launcher: ActivityResultLauncher<Uri\?>\?, disableThirdParty: Boolean\) \{.*?\n    \}\n\n    private fun showPickerUnavailableFallback",
              dedent('''
                  private fun onNewLocation(
                      launcher: ActivityResultLauncher<Uri?>?,
                      disableThirdParty: Boolean,
                  ) {
                      L.d("Opening music-source selector [mode=$locationMode]")
                      if (locationMode == LocationMode.DIRECT_FS) {
                          showCandidatePathPicker(disableThirdParty)
                          return
                      }

                      val documentTreeLauncher =
                          requireNotNull(launcher) { "Document tree launcher was not available" }
                      try {
                          documentTreeLauncher.launch(null)
                      } catch (e: ActivityNotFoundException) {
                          L.w(e, "SAF tree picker activity not found; showing fallback sources.")
                          showPickerUnavailableFallback(disableThirdParty)
                      } catch (e: SecurityException) {
                          L.w(e, "SAF tree picker launch denied; showing fallback sources.")
                          showPickerUnavailableFallback(disableThirdParty)
                      } catch (e: IllegalStateException) {
                          L.w(e, "SAF tree picker launcher unavailable; showing fallback sources.")
                          showPickerUnavailableFallback(disableThirdParty)
                      } catch (e: RuntimeException) {
                          L.w(e, "SAF tree picker failed; showing fallback sources.")
                          showPickerUnavailableFallback(disableThirdParty)
                      }
                  }

                  private fun showPickerUnavailableFallback''').lstrip("\n"),
          )
          sub(
              path,
              r"    private fun saveChanges\(\) \{.*?\n    \}\n\n    private fun checkStoragePermission",
              dedent('''
                  private fun saveChanges() {
                      val binding = requireBinding()
                      val currentSafQuery = musicSettings.safQuery
                      val currentMediaStoreQuery = musicSettings.mediaStoreQuery
                      val newSafQuery =
                          if (locationMode == LocationMode.SAF || locationMode == LocationMode.DIRECT_FS) {
                              SAF.Query(
                                  source = includeLocationAdapter.locations,
                                  exclude = excludeLocationAdapter.locations,
                                  withHidden = binding.locationsWithHiddenSwitch.isChecked,
                                  multithread = binding.locationsMultithreadSwitch.isChecked,
                              )
                          } else {
                              currentSafQuery
                          }
                      val newMediaStoreQuery =
                          if (locationMode == LocationMode.MEDIA_STORE) {
                              MediaStore.Query(
                                  mode =
                                      if (isIncludeMode) {
                                          MediaStore.FilterMode.INCLUDE
                                      } else {
                                          MediaStore.FilterMode.EXCLUDE
                                      },
                                  filtered = filterLocationAdapter.locations,
                                  excludeNonMusic = binding.locationsExcludeNonMusicSwitch.isChecked,
                              )
                          } else {
                              currentMediaStoreQuery
                          }

                      val changed =
                          musicSettings.applySourceConfiguration(
                              mode = locationMode,
                              safQuery = newSafQuery,
                              mediaStoreQuery = newMediaStoreQuery,
                          )
                      if (!changed && permissionGrantedInSession) {
                          L.d("Storage permission changed; queuing one source-authoritative scan")
                          musicSettings.forceLocationUpdate()
                      }
                  }

                  private fun checkStoragePermission''').lstrip("\n"),
          )

          # Generated playlists are a post-load projection, not part of base library construction.
          path = "musikr/src/main/java/org/oxycblt/musikr/Library.kt"
          insert_after(
              path,
              "interface MutableLibrary : Library {\n",
              dedent('''
                  /** Add or remove generated playlists without rescanning music sources. */
                  fun withGeneratedPlaylists(enabled: Boolean): MutableLibrary = this

                  ''').lstrip("\n"),
          )

          path = "musikr/src/main/java/org/oxycblt/musikr/model/LibraryFactory.kt"
          sub(path, r"private class LibraryFactoryImpl : LibraryFactory", "internal class LibraryFactoryImpl : LibraryFactory", flags=0)
          sub(
              path,
              r"\n        // Generated playlists are deterministic projections.*?\n        generatedDefinitions\.forEach \{ definition ->.*?\n        \}\n\n        return LibraryImpl\(",
              "\n        return LibraryImpl(",
          )
          sub(path, r"    private companion object \{", "    companion object {", flags=0)
          insert_after(
              path,
              "    companion object {\n",
              dedent('''
                      internal fun generatedPlaylists(songs: Collection<Song>): Set<PlaylistImpl> {
                          val definitions =
                              GeneratedPlaylistCompiler.compile(
                                  songs.map { song ->
                                      GeneratedPlaylistCompiler.Entry(
                                          value = song,
                                          stableKey = song.uid.toString(),
                                          addedMs = song.addedMs,
                                          year = song.album.dates?.min?.year,
                                          albumSort = song.album.name.sortKey(),
                                          disc = song.disc?.number ?: 0,
                                          track = song.track ?: 0,
                                          titleSort = song.name.sort ?: song.name.raw,
                                      )
                                  }
                              )
                          return definitions.mapTo(mutableSetOf()) { definition ->
                              PlaylistImpl(
                                  GeneratedPlaylistCore(
                                      id = definition.id,
                                      displayName = definition.name,
                                      songs = definition.values,
                                  )
                              )
                          }
                      }

                      ''').lstrip("\n"),
          )

          path = "musikr/src/main/java/org/oxycblt/musikr/model/LibraryImpl.kt"
          insert_after(
              path,
              "    override fun empty() = songs.isEmpty()\n",
              dedent('''

                  override fun withGeneratedPlaylists(enabled: Boolean): MutableLibrary {
                      val ordinary =
                          playlists.filterNotTo(mutableSetOf()) {
                              it.origin == Playlist.Origin.GENERATED
                          }
                      val projected =
                          if (enabled) ordinary + LibraryFactoryImpl.generatedPlaylists(songs) else ordinary
                      return if (projected == playlists) this else copy(playlists = projected)
                  }
                  ''').rstrip("\n"),
          )

          # Repository: first source scan bypasses incremental preflight; cancellation terminates;
          # readable partial libraries publish; generated playlists refresh independently.
          path = "app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt"
          insert_after(path, "import kotlinx.coroutines.Job\n", "import kotlinx.coroutines.NonCancellable\n")
          insert_after(path, "import org.oxycblt.musikr.Song\n", "import org.oxycblt.musikr.SourceScanFailureException\n")
          insert_after(
              path,
              "    suspend fun invalidateSource(sourceKey: String? = null) = Unit\n",
              dedent('''

                  /** Rebuild only optional generated playlists from the current base library. */
                  suspend fun refreshGeneratedPlaylists() = Unit
                  ''').rstrip("\n"),
          )
          insert_after(
              path,
              "    @Volatile private var compatibilityHydrationJob: Job? = null\n",
              "    @Volatile private var generatedPlaylistJob: Job? = null\n",
          )
          sub(
              path,
              r"            val prepared =\n                try \{\n                    IncrementalIndexPlanner\.prepare\((.*?)\n                    \)\n                \} catch \(e: CancellationException\) \{\n                    throw e\n                \} catch \(e: Exception\) \{(.*?)\n                \}",
              dedent('''
                          val prepared =
                              if (!withCache) {
                                  L.i("Using simple source-authoritative scan; incremental preflight bypassed")
                                  IncrementalIndexPlanner.Prepared(
                                      fs = rawFs,
                                      cache = WriteOnlyMutableCache(cache),
                                      plan = null,
                                  )
                              } else {
                                  try {
                                      IncrementalIndexPlanner.prepare(
                                          fs = rawFs,
                                          cache = cache,
                                          withCache = true,
                                          profile = resolvedProfile,
                                          configurationRevision = sourceConfigurationRevision(),
                                          legacyWriteOnly = ::WriteOnlyMutableCache,
                                      )
                                  } catch (e: CancellationException) {
                                      withContext(NonCancellable) {
                                          emitIndexingCompletion(
                                              Exception("Music-source preflight cancelled", e)
                                          )
                                      }
                                      throw e
                                  } catch (e: Exception) {
                                      musicSettings.lastScanFailed = true
                                      emitStartupLibraryStatus(StartupLibraryStatus.SourceUnavailable)
                                      L.w(
                                          e,
                                          "Music-source preflight failed; preserving the last readable library",
                                      )
                                      emitIndexingCompletion(e)
                                      return@traceSuspend
                                  }
                              }''').lstrip("\n"),
          )
          sub(
              path,
              r"            if \(plan == null && locations\.any \{ !it\.path\.volume\.isAccessible\(\) \}\) \{",
              "            if (\n                plan == null &&\n                    musicSettings.locationMode == LocationMode.SAF &&\n                    locations.any { !it.path.volume.isAccessible() }\n            ) {",
              flags=0,
          )
          sub(
              path,
              r"                if \(plan == null && result\.library\.songs\.isEmpty\(\)\) \{\n                    if \(locations\.any \{ !it\.path\.volume\.isAccessible\(\) \}\) \{",
              "                if (\n                    plan == null &&\n                        musicSettings.locationMode == LocationMode.SAF &&\n                        result.library.songs.isEmpty()\n                ) {\n                    if (locations.any { !it.path.volume.isAccessible() }) {",
              flags=0,
          )
          sub(
              path,
              r"                val publishedLibrary =\n                    if \(result\.failedSources\.isEmpty\(\)\) \{\n                        result\.library\n                    \} else \{.*?\n                    \}",
              dedent('''
                              val publishedLibrary =
                                  if (result.failedSources.isEmpty() || result.library.songs.isNotEmpty()) {
                                      if (result.failedSources.isNotEmpty()) {
                                          L.w(
                                              "Publishing readable partial library; source warnings: " +
                                                  result.failedSources.keys
                                          )
                                      }
                                      result.library
                                  } else {
                                      throw SourceScanFailureException(result.failedSources)
                                  }''').lstrip("\n"),
          )
          sub(
              path,
              r"                emitLibrary\(publishedLibrary\)\n                result\.cleanup\(\)",
              dedent('''
                              emitLibrary(publishedLibrary)
                              try {
                                  result.cleanup()
                              } catch (cleanupFailure: Exception) {
                                  L.w(cleanupFailure, "Post-publication cover cleanup failed")
                              }''').lstrip("\n"),
              flags=0,
          )
          sub(
              path,
              r"                if \(!isEmpty\) emitStartupReadinessState\(StartupReadinessState\.FullLibraryReady\)",
              dedent('''
                              if (!isEmpty) {
                                  emitStartupReadinessState(StartupReadinessState.FullLibraryReady)
                                  requestGeneratedPlaylistRefresh()
                              }''').lstrip("\n"),
              flags=0,
          )
          sub(
              path,
              r"            \} catch \(e: CancellationException\) \{\n                throw e\n            \} catch \(e: Exception\) \{",
              dedent('''
                          } catch (e: CancellationException) {
                              withContext(NonCancellable) {
                                  emitIndexingCompletion(
                                      Exception("Music indexing cancelled before completion", e)
                                  )
                              }
                              throw e
                          } catch (e: Exception) {''').lstrip("\n"),
              flags=0,
          )
          sub(
              path,
              r"    private fun startCompatibilityBackfill\(\) \{",
              dedent('''
                  override suspend fun refreshGeneratedPlaylists() {
                      val current = synchronized(this) { library } ?: return
                      val startingRevision = musicSettings.revision
                      val startingDeviceGeneration = deviceLibraryGeneration.get()
                      val enabled = musicSettings.generatedPlaylistsEnabled
                      val projected =
                          withContext(Dispatchers.Default) {
                              current.withGeneratedPlaylists(enabled)
                          }
                      val stillCurrent =
                          synchronized(this) {
                              library === current &&
                                  musicSettings.revision == startingRevision &&
                                  deviceLibraryGeneration.get() == startingDeviceGeneration
                          }
                      if (!stillCurrent) {
                          L.d("Skipping generated-playlist projection superseded by a newer library")
                          return
                      }
                      if (projected === current) return
                      emitLibrary(projected, device = false, user = true)
                      L.i("Generated playlists ${if (enabled) "enabled" else "disabled"}")
                  }

                  private fun requestGeneratedPlaylistRefresh() {
                      if (!musicSettings.generatedPlaylistsEnabled) return
                      generatedPlaylistJob?.cancel()
                      generatedPlaylistJob =
                          compatibilityHydrationScope.launch {
                              try {
                                  refreshGeneratedPlaylists()
                              } catch (e: CancellationException) {
                                  throw e
                              } catch (e: Exception) {
                                  L.w(e, "Generated playlists failed; base library remains available")
                              }
                          }
                  }

                  private fun startCompatibilityBackfill() {''').lstrip("\n"),
              flags=0,
          )
          sub(
              path,
              r"                        if \(songCount > 0\) \{\n                            emitStartupReadinessState\(StartupReadinessState\.FullLibraryReady\)\n                        \}",
              dedent('''
                                      if (songCount > 0) {
                                          emitStartupReadinessState(StartupReadinessState.FullLibraryReady)
                                          requestGeneratedPlaylistRefresh()
                                      }''').lstrip("\n"),
              flags=0,
          )
          sub(
              path,
              r"    private suspend fun emitLibrary\(newLibrary: MutableLibrary\) \{",
              dedent('''
                  private suspend fun emitLibrary(
                      newLibrary: MutableLibrary,
                      device: Boolean = true,
                      user: Boolean = true,
                  ) {''').lstrip("\n"),
              flags=0,
          )
          sub(
              path,
              r"withContext\(Dispatchers\.Main\) \{ dispatchLibraryChange\(device = true, user = true\) \}",
              "withContext(Dispatchers.Main) { dispatchLibraryChange(device = device, user = user) }",
              flags=0,
          )

          # Indexing holder consumes the durable marker and deduplicates preference callbacks.
          path = "app/src/main/java/org/oxycblt/auxio/music/service/IndexingHolder.kt"
          insert_after(
              path,
              "    private var pendingStartupOrigin: StartupScanOrigin? = null\n",
              "    private var lastHandledSourceConfigurationGeneration = Long.MIN_VALUE\n",
          )
          sub(
              path,
              r"                        musicRepository\.startup\(this@IndexingHolder\)\n                        if \(BuildConfig\.TOPWAY_COMPAT_FLAVOR && automaticScanAllowed\) \{\n                            requestVisibleRecoveryScan\(sourceAuthority\)\n                        \}",
              dedent('''
                                      musicRepository.startup(this@IndexingHolder)
                                      val pendingInitialScan = musicSettings.consumePendingInitialScan()
                                      if (pendingInitialScan) {
                                          synchronized(this@IndexingHolder) {
                                              lastHandledSourceConfigurationGeneration =
                                                  musicSettings.sourceConfigurationGeneration
                                          }
                                          L.i("Consuming durable source configuration with a simple initial scan")
                                          requestIndex(false)
                                      } else if (BuildConfig.TOPWAY_COMPAT_FLAVOR && automaticScanAllowed) {
                                          requestVisibleRecoveryScan(sourceAuthority)
                                      }''').lstrip("\n"),
              flags=0,
          )
          sub(
              path,
              r"(Trusted visible startup is repairing the library.*?\n            \)\n            requestIndex\()true(\))",
              r"\1false\2",
          )
          sub(
              path,
              r"    override fun onMusicLocationsChanged\(\) \{.*?\n    \}\n\n    override fun onIndexingSettingChanged",
              dedent('''
                  override fun onMusicLocationsChanged() {
                      super.onMusicLocationsChanged()
                      val generation = musicSettings.sourceConfigurationGeneration
                      val shouldHandle =
                          synchronized(this) {
                              if (generation == lastHandledSourceConfigurationGeneration) {
                                  false
                              } else {
                                  lastHandledSourceConfigurationGeneration = generation
                                  true
                              }
                          }
                      if (!shouldHandle) {
                          L.d("Ignoring duplicate source callback [generation=$generation]")
                          return
                      }
                      if (musicSettings.shouldBeObserving) startTracking() else stopTracking()
                      val initialScan = musicSettings.consumePendingInitialScan()
                      indexScope.launch {
                          musicRepository.invalidateSource()
                          musicRepository.requestIndex(withCache = !initialScan)
                      }
                  }

                  override fun onGeneratedPlaylistsChanged() {
                      indexScope.launch { musicRepository.refreshGeneratedPlaylists() }
                  }

                  override fun onIndexingSettingChanged''').lstrip("\n"),
          )

          # DirectFS source-local failures are isolated; one bounded root snapshot may provide names.
          path = "musikr/src/main/java/org/oxycblt/musikr/fs/direct/DirectFS.kt"
          insert_after(path, "import org.oxycblt.musikr.fs.RootGate\n", "import org.oxycblt.musikr.fs.RootTreeSnapshot\n")
          sub(
              path,
              r"    private val rootSnapshotChecked = ConcurrentHashMap\.newKeySet<String>\(\)\n    private val rootSnapshotOnly = ConcurrentHashMap\.newKeySet<String>\(\)",
              dedent('''
                  private val rootSnapshotChecked = ConcurrentHashMap.newKeySet<String>()
                  private val rootSnapshotEntries =
                      ConcurrentHashMap<String, Map<String, List<DirectEntry>>>()''').lstrip("\n"),
              flags=0,
          )
          sub(
              path,
              r"        if \(task\.depth > MAX_DEPTH\) \{\n            recordFailure\(.*?\n            \)\n            return\n        \}",
              dedent('''
                          if (task.depth > MAX_DEPTH) {
                              val detail = "DirectFS maximum depth exceeded at ${task.directory.path}"
                              if (task.configuredRootTask) recordFailure(task.sourceKey, detail)
                              else Log.w(TAG, detail)
                              return
                          }''').lstrip("\n"),
          )
          sub(
              path,
              r"        val entries = listFilesSafe\(task\.directory\)\n        if \(entries == null\) \{.*?\n            return\n        \}",
              dedent('''
                          val entries = listFilesSafe(task.directory)
                          if (entries == null) {
                              val detail = "DirectFS directory is unavailable at ${task.directory.path}"
                              if (task.configuredRootTask) {
                                  recordFailure(task.sourceKey, detail)
                              } else {
                                  Log.w(TAG, "Skipping unreadable child directory ${task.directory.path}")
                              }
                              return
                          }''').lstrip("\n"),
          )
          sub(
              path,
              r"            if \(!isWithinCanonicalRoot\(item, task\.canonicalRoot\)\) \{\n                recordFailure\(.*?\n                \)\n                continue\n            \}",
              dedent('''
                              if (!isWithinCanonicalRoot(item, task.canonicalRoot)) {
                                  Log.w(TAG, "DirectFS skipped an escaped directory at ${item.path}")
                                  continue
                              }''').lstrip("\n"),
          )
          sub(
              path,
              r"            if \(current >= MAX_VISITED_DIRECTORIES\) \{\n                recordFailure\(.*?\n                \)\n                return EnqueueResult\.LimitExceeded\n            \}",
              dedent('''
                              if (current >= MAX_VISITED_DIRECTORIES) {
                                  Log.w(TAG, "DirectFS directory limit reached at ${task.directory.path}")
                                  return EnqueueResult.LimitExceeded
