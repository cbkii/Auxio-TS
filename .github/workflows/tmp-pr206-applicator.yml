name: PR206 library-loading applicator

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/restore-v607-library-loading'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-v607-library-loading
          fetch-depth: 0

      - name: Extract staged applicator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-restore-v607-library-loading.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          step = next(i for i, line in enumerate(lines) if 'Apply focused source-loading restoration' in line)
          run_line = next(i for i in range(step + 1, len(lines)) if lines[i].strip() == 'run: |')
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          script_text = '\n'.join(body) + '\n'
          start = script_text.index('# Fresh installs return to the last known-good SAF default.')
          end = script_text.index('# Make source configuration one durable operation')
          script_text = script_text[:start] + script_text[end:]
          script_text = script_text.replace(
              'raise SystemExit(f"{path}: expected one exact match, found {count}")',
              'raise SystemExit(f"{path}: expected one exact match, found {count}; old={old[:240]!r}")',
          )
          Path('/tmp/pr206-apply.sh').write_text(script_text, encoding='utf-8')
          PY

      - name: Apply, format, and publish or preserve diagnostics
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/org/oxycblt/auxio/music/locations/LocationMode.kt')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'        fun defaultForFlavor\(topwayCompat: Boolean\): LocationMode =\s*\n\s*if \(topwayCompat\) DIRECT_FS else SAF',
              '        fun defaultForFlavor(\n            @Suppress("UNUSED_PARAMETER") topwayCompat: Boolean\n        ): LocationMode = SAF',
              text,
              count=1,
          )
          if count != 1 and '): LocationMode = SAF' not in text:
              raise SystemExit(f'LocationMode default replacement count={count}')
          path.write_text(updated if count else text, encoding='utf-8')
          PY
          bash /tmp/pr206-apply.sh > /tmp/pr206-applicator.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/pr206-applicator.log .github/pr206-applicator-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/pr206-applicator-failure.log
            git commit -m "chore: preserve PR206 applicator failure"
            git push origin HEAD:fix/restore-v607-library-loading
            cat /tmp/pr206-applicator.log
            exit "$status"
          fi

          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          status=$?
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            printf '%s\n' 'spotlessApply failed after the source patch applied' > .github/pr206-applicator-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/pr206-applicator-failure.log
            git commit -m "chore: preserve PR206 formatting failure"
            git push origin HEAD:fix/restore-v607-library-loading
            exit "$status"
          fi

          rm -f .github/workflows/tmp-restore-v607-library-loading.yml
          rm -f .github/pr206-applicator-trigger.txt
          rm -f .github/pr206-applicator-trigger-2.txt
          rm -f .github/pr206-applicator-trigger-3.txt
          rm -f .github/pr206-applicator-trigger-4.txt
          rm -f .github/pr206-applicator-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore reliable music source loading"
          git push origin HEAD:fix/restore-v607-library-loading
