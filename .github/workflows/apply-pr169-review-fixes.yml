name: Apply PR 169 audited fixes

on:
  push:
    branches:
      - fix/ts18-runtime-regressions-v605
    paths:
      - '.github/workflows/apply-pr169-review-fixes.yml'
      - 'scripts/apply-pr169-audit-fixes.py'
      - 'scripts/apply-pr169-floating-contract-fixes.py'
      - 'scripts/apply-pr169-settings-resume-fix.py'

permissions:
  contents: write

concurrency:
  group: apply-pr169-audited-fixes
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout PR branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/ts18-runtime-regressions-v605
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          java-version: '21'
          distribution: temurin

      - name: Write local.properties
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo '::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set.'
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: false

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Apply reviewable audited patches
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/apply-pr169-audit-fixes.py \
            scripts/apply-pr169-floating-contract-fixes.py \
            scripts/apply-pr169-settings-resume-fix.py
          python scripts/apply-pr169-audit-fixes.py
          python scripts/apply-pr169-floating-contract-fixes.py
          python scripts/apply-pr169-settings-resume-fix.py

          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo '::error::Audit patches produced no repository changes.'
            exit 1
          fi

          allowed='^(app/src/main/java/org/oxycblt/auxio/playback/PlaybackPanelFragment.kt|app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/TopwayMusicEntryActivity.kt|app/src/topwayCompat/AndroidManifest.xml|app/src/topwayCompat/res/xml/preferences_car.xml|app/src/main/java/org/oxycblt/auxio/headunit/topway/TopwayEqualizerLauncher.kt|app/src/topwayCompatTest/java/org/oxycblt/auxio/headunit/topway/TopwayEqualizerExactDeviceTest.kt|app/src/main/java/org/oxycblt/auxio/headunit/root/dofun/Ts18DofunIntegrationResolver.kt|scripts/check-dofun-topway-compat.sh|scripts/check-topway-manifest-components.sh|docs/TS18_V605_RUNTIME_REGRESSION_FIXES.md|app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarFloatingControlsService.kt|app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarOverlaySettings.kt|app/src/main/java/org/oxycblt/auxio/headunit/overlay/TopwayOverlayRestoreBridge.kt|app/src/standard/java/org/oxycblt/auxio/headunit/overlay/TopwayOverlayRestoreBridge.kt|app/src/topwayCompat/java/org/oxycblt/auxio/headunit/overlay/TopwayOverlayRestoreBridge.kt|app/src/main/java/org/oxycblt/auxio/BootReceiver.kt|app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarOverlayActivity.kt|app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarOverlayPermissionActivity.kt|app/src/topwayCompat/java/org/oxycblt/auxio/settings/categories/CarPreferenceFragment.kt)$'
          unexpected=0
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            if [[ ! "${path}" =~ ${allowed} ]]; then
              echo "::error::Patch changed an unapproved path: ${path}"
              unexpected=1
            fi
          done < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          if (( unexpected != 0 )); then
            exit 1
          fi

      - name: Prepare dependencies and format
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_TIMEOUT: 25m
        run: |
          set -euo pipefail
          bash ./scripts/bootstrap-dependencies.sh --profile full-build
          bash ./scripts/ci-gradle.sh spotlessApply
          git add -N .
          git diff --check

          allowed='^(app/src/main/java/org/oxycblt/auxio/playback/PlaybackPanelFragment.kt|app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/TopwayMusicEntryActivity.kt|app/src/topwayCompat/AndroidManifest.xml|app/src/topwayCompat/res/xml/preferences_car.xml|app/src/main/java/org/oxycblt/auxio/headunit/topway/TopwayEqualizerLauncher.kt|app/src/topwayCompatTest/java/org/oxycblt/auxio/headunit/topway/TopwayEqualizerExactDeviceTest.kt|app/src/main/java/org/oxycblt/auxio/headunit/root/dofun/Ts18DofunIntegrationResolver.kt|scripts/check-dofun-topway-compat.sh|scripts/check-topway-manifest-components.sh|docs/TS18_V605_RUNTIME_REGRESSION_FIXES.md|app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarFloatingControlsService.kt|app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarOverlaySettings.kt|app/src/main/java/org/oxycblt/auxio/headunit/overlay/TopwayOverlayRestoreBridge.kt|app/src/standard/java/org/oxycblt/auxio/headunit/overlay/TopwayOverlayRestoreBridge.kt|app/src/topwayCompat/java/org/oxycblt/auxio/headunit/overlay/TopwayOverlayRestoreBridge.kt|app/src/main/java/org/oxycblt/auxio/BootReceiver.kt|app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarOverlayActivity.kt|app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarOverlayPermissionActivity.kt|app/src/topwayCompat/java/org/oxycblt/auxio/settings/categories/CarPreferenceFragment.kt)$'
          unexpected=0
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            if [[ ! "${path}" =~ ${allowed} ]]; then
              echo "::error::Formatting changed an unapproved path: ${path}"
              unexpected=1
            fi
          done < <(git diff --name-only | sort -u)
          if (( unexpected != 0 )); then
            exit 1
          fi

      - name: Run TS18 and DoFun guardrails
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-headunit-compat-safety.sh
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-native-keep-rules.sh

      - name: Compile all debug identities and run Android lint
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_TIMEOUT: 30m
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh \
            :app:assembleStandardDebug \
            :app:assembleTopwayTwMusicDebug \
            :app:assembleTopwayTwMediaDebug \
            :app:lintStandardDebug

      - name: Run standard and Topway unit tests
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_TIMEOUT: 30m
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh \
            :app:testStandardDebugUnitTest \
            :app:testTopwayTwMusicDebugUnitTest \
            :app:testTopwayTwMediaDebugUnitTest

      - name: Remove one-shot patch scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-pr169-audit-fixes.py
          rm -f scripts/apply-pr169-floating-contract-fixes.py
          rm -f scripts/apply-pr169-settings-resume-fix.py
          git add -N .
          git diff --check

      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve TS18 feature contracts in PR 169'

      - name: Push final audited commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:fix/ts18-runtime-regressions-v605
