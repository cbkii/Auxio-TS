name: Apply PR 169 audited fixes

on:
  push:
    branches:
      - fix/ts18-runtime-regressions-v605
    paths:
      - '.github/workflows/apply-pr169-review-fixes.yml'

permissions:
  contents: write

concurrency:
  group: apply-pr169-audited-fixes
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/ts18-runtime-regressions-v605
          fetch-depth: 0
          submodules: false
          token: ${{ github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Write local.properties
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo '::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set.'
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Decode and apply audited patch
        shell: bash
        env:
          PATCH_PAYLOAD: >-
            
        run: |
          set -euo pipefail
          patch_script="${RUNNER_TEMP}/apply-pr169-audit-fixes.py"
          printf '%s' "${PATCH_PAYLOAD}" | base64 --decode | gzip --decompress > "${patch_script}"
          python -m py_compile "${patch_script}"
          python "${patch_script}"

      - name: Format and validate source
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_TIMEOUT: 25m
        run: |
          set -euo pipefail
          bash ./scripts/bootstrap-dependencies.sh --profile full-build
          bash ./scripts/ci-gradle.sh spotlessApply
          rm -f .github/workflows/apply-pr169-review-fixes.yml
          git diff --check
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-headunit-compat-safety.sh
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-native-keep-rules.sh

      - name: Run focused unit tests
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_TIMEOUT: 25m
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh \
            :app:testStandardDebugUnitTest \
            :app:testTopwayTwMusicDebugUnitTest \
            :app:testTopwayTwMediaDebugUnitTest

      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo '::error::Patch produced no repository changes.'
            exit 1
          fi
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve TS18 feature contracts in PR 169'
          git push origin HEAD:fix/ts18-runtime-regressions-v605
