name: Diagnose PR 169 final patch

on:
  pull_request:
    branches:
      - dev
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: read

concurrency:
  group: diagnose-pr169-review
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'cbkii/Auxio-TS' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ts18-runtime-regressions-v605'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/ts18-runtime-regressions-v605
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Prepare dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply bounded review patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/finalize_pr169_review.py
          rm app/src/main/java/org/oxycblt/auxio/playback/CoverPagerAdapterNullableCompat.kt

      - name: Capture Spotless output
        id: spotless
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_TIMEOUT: 20m
        run: |
          set +e
          bash ./scripts/ci-gradle.sh spotlessApply > spotless-pr169.log 2>&1
          status=$?
          tail -n 400 spotless-pr169.log
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload Spotless diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr169-spotless-diagnostic
          path: spotless-pr169.log
          if-no-files-found: error
          retention-days: 2

      - name: Fail when Spotless failed
        if: steps.spotless.outputs.status != '0'
        shell: bash
        run: exit 1
