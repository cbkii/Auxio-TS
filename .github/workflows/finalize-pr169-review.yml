name: Finalize PR 169 review

on:
  pull_request:
    branches:
      - dev
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: finalize-pr169-review
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'cbkii/Auxio-TS' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ts18-runtime-regressions-v605'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/ts18-runtime-regressions-v605
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Write local.properties
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Prepare dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply bounded review patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/finalize_pr169_review.py
          python3 .github/scripts/finalize_pr169_review.py
          rm app/src/main/java/org/oxycblt/auxio/playback/CoverPagerAdapterNullableCompat.kt

      - name: Validate exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          allowed="$(mktemp)"
          actual="$(mktemp)"
          cat > "${allowed}" <<'EOF'
          app/src/main/java/org/oxycblt/auxio/headunit/topway/TopwayEqualizerLauncher.kt
          app/src/main/java/org/oxycblt/auxio/playback/CoverPagerAdapterNullableCompat.kt
          app/src/main/java/org/oxycblt/auxio/playback/PlaybackPanelFragment.kt
          app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarFloatingControlsService.kt
          app/src/topwayCompatTest/java/org/oxycblt/auxio/headunit/topway/TopwayEqualizerExactDeviceTest.kt
          EOF
          sort -u -o "${allowed}" "${allowed}"
          git diff --name-only | sort -u > "${actual}"
          diff -u "${allowed}" "${actual}"
          git diff --check

      - name: Apply targeted Kotlin formatting
        shell: bash
        env:
          AUXIO_TS_CI_GRADLE_TIMEOUT: 20m
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh spotlessKotlinApply
          bash ./scripts/ci-gradle.sh spotlessKotlinCheck
          git diff --check

      - name: Commit final review fixes and remove temporary machinery
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/scripts/finalize_pr169_review.py .github/workflows/finalize-pr169-review.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ts18): complete final runtime review fixes'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/ts18-runtime-regressions-v605
