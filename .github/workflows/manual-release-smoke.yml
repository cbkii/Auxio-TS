name: Manual Release Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - "cx/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manual_release_smoke: ${{ steps.release_scope.outputs.manual_release_smoke }}
      changed_count: ${{ steps.scope.outputs.changed_count }}
      comparison: ${{ steps.scope.outputs.comparison }}

    steps:
      - name: Checkout comparison head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          submodules: false
          persist-credentials: false

      - name: Fetch comparison boundary
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          target=""
          case "${EVENT_NAME}" in
            pull_request) target="${PR_BASE_SHA}" ;;
            push) target="${PUSH_BEFORE_SHA}" ;;
          esac
          if [[ -n "${target}" && ! "${target}" =~ ^0+$ ]] && ! git cat-file -e "${target}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${target}" ||
              echo "::warning::Could not fetch comparison boundary ${target}; classifier will fail open to full CI."
          fi

      - name: Classify changed files
        id: scope
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: bash ./scripts/ci-scope.sh

      - name: Classify Manual Release Smoke relevance
        id: release_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ steps.scope.outputs.full }}
          COMPARISON: ${{ steps.scope.outputs.comparison }}
        run: |
          relevant=false
          if [[ "${EVENT_NAME}" == workflow_dispatch || "${FULL_CI}" == true ]]; then
            relevant=true
          elif git diff --name-only "${COMPARISON}" >/dev/null 2>&1; then
            while IFS= read -r path; do
              case "${path}" in
                app/*|musikr/*|media|media/*|startup-benchmark/*|lsposed-bridge/*|libxposed-api100-stubs/*|scripts/*|.github/workflows/*|.gitmodules|build.gradle|settings.gradle|gradle.properties|gradle/*|gradlew|ci/*)
                  relevant=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "${COMPARISON}")
          else
            echo "::warning::Manual Release Smoke relevance could not inspect ${COMPARISON}; failing open."
            relevant=true
          fi
          printf 'manual_release_smoke=%s\n' "${relevant}" >> "${GITHUB_OUTPUT}"

      - name: Write scope summary
        shell: bash
        run: |
          {
            echo "## Manual Release Smoke scope"
            echo
            echo "- Comparison: \`${{ steps.scope.outputs.comparison }}\`"
            echo "- Changed files: \`${{ steps.scope.outputs.changed_count }}\`"
            echo "- Release smoke relevant: \`${{ steps.release_scope.outputs.manual_release_smoke }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  transaction-contracts:
    name: transaction contracts
    needs: scope
    if: needs.scope.outputs.manual_release_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          submodules: false
          persist-credentials: false

      - name: Validate existing Manual Release contracts
        shell: bash
        run: bash ./scripts/check-manual-release-workflow.sh

      - name: Run planner and dispatch matrix
        shell: bash
        run: python3 ./scripts/ci/test_manual_release_matrix.py

      - name: Run network-free publication transaction mocks
        shell: bash
        run: python3 ./scripts/ci/test_manual_release_transactions.py

      - name: Prove ambiguous dev metadata push recovery
        shell: bash
        run: python3 ./scripts/ci/test_manual_release_ambiguous_dev_push.py

      - name: Prove ambiguous asset deletion recovery
        shell: bash
        run: python3 ./scripts/ci/test_manual_release_ambiguous_asset_delete.py

  signed-packaging:
    name: exact signed packaging
    needs: scope
    if: needs.scope.outputs.manual_release_smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Run exact signed release packaging smoke
        shell: bash
        run: |
          set +e
          bash ./scripts/ci/smoke_manual_release_packaging.sh 2>&1 |
            tee "${RUNNER_TEMP}/manual-release-packaging-smoke.log"
          rc=${PIPESTATUS[0]}
          set -e
          exit "${rc}"

      - name: Upload packaging failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manual-release-smoke-failure-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/**
            lsposed-bridge/build/reports/**
            lsposed-bridge/build/test-results/**
            build/reports/problems/**
            ${{ runner.temp }}/manual-release-packaging-smoke.log
            ${{ runner.temp }}/manual-release-packaging-smoke-gradle.log

