name: Manual Release Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "app/**"
      - "musikr/**"
      - "lsposed-bridge/**"
      - "libxposed-api100-stubs/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "ci/**"
  pull_request:
    branches:
      - dev
      - "cx/**"
    paths:
      - "app/**"
      - "musikr/**"
      - "lsposed-bridge/**"
      - "libxposed-api100-stubs/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "ci/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transaction-contracts:
    name: transaction contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          submodules: false
          persist-credentials: false

      - name: Validate existing Manual Release contracts
        shell: bash
        run: bash ./scripts/check-manual-release-workflow.sh

      - name: Run planner and dispatch matrix
        shell: bash
        run: python3 ./scripts/ci/test_manual_release_matrix.py

      - name: Run network-free publication transaction mocks
        shell: bash
        run: python3 ./scripts/ci/test_manual_release_transactions.py

  signed-packaging:
    name: exact signed packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Run exact signed release packaging smoke
        shell: bash
        run: |
          set +e
          bash ./scripts/ci/smoke_manual_release_packaging.sh 2>&1 |
            tee "${RUNNER_TEMP}/manual-release-packaging-smoke.log"
          rc=${PIPESTATUS[0]}
          set -e
          exit "${rc}"

      - name: Upload packaging failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manual-release-smoke-failure-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/**
            lsposed-bridge/build/reports/**
            lsposed-bridge/build/test-results/**
            build/reports/problems/**
            ${{ runner.temp }}/manual-release-packaging-smoke.log
            ${{ runner.temp }}/manual-release-packaging-smoke-gradle.log
