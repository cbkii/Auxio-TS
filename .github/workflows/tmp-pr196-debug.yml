name: Temporary PR196 finalizer diagnostics

on:
  pull_request:
    branches:
      - feat/ts18-dofun-generic-media-compat

permissions:
  contents: read

concurrency:
  group: tmp-pr196-debug
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/first-launch-source-recovery
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce finalizer
        id: reproduce
        shell: bash
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/ts18-dofun-generic-media-compat
          git merge --no-edit origin/feat/ts18-dofun-generic-media-compat > "${RUNNER_TEMP}/merge.log" 2>&1
          merge_status=$?
          if [[ "${merge_status}" -eq 0 ]]; then
            git checkout origin/feat/ts18-dofun-generic-media-compat -- \
              app/src/main/AndroidManifest.xml \
              app/src/main/java/org/oxycblt/auxio/BootReceiver.kt \
              app/src/main/java/org/oxycblt/auxio/IntegerTable.kt \
              app/src/main/java/org/oxycblt/auxio/settings/categories/MusicPreferenceFragment.kt \
              app/src/topwayCompat/res/xml/preferences_music.xml
            git rm -f --ignore-unmatch \
              app/src/main/java/org/oxycblt/auxio/headunit/prestart/EarlyPrestartNotification.kt \
              app/src/main/java/org/oxycblt/auxio/headunit/prestart/EarlyPrestartSettings.kt
            python3 <<'PY' > "${RUNNER_TEMP}/extract.log" 2>&1
          from pathlib import Path
          source = Path('.github/workflows/tmp-pr196-apply-hardening.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          old = "          text = replace_once(text, launcher_anchor, launcher_new, 'SongList app settings launcher')"
          new = """          if launcher_anchor in text:
              text = text.replace(launcher_anchor, launcher_new, 1)
          else:
              launcher_start = text.index('    private val storagePermissionLauncher =')
              launcher_end = text.index('\\n\\n    override fun onCreateBinding', launcher_start)
              text = text[:launcher_end] + launcher_new[len(launcher_anchor):] + text[launcher_end:]"""
          if old not in code:
              raise SystemExit('Could not locate SongList launcher replacement in extracted finalizer')
          code = code.replace(old, new, 1)
          Path('/tmp/pr196-finalize.py').write_text(code, encoding='utf-8')
          PY
            extract_status=$?
            if [[ "${extract_status}" -eq 0 ]]; then
              python3 /tmp/pr196-finalize.py > "${RUNNER_TEMP}/finalizer.log" 2>&1
              finalizer_status=$?
            else
              finalizer_status=${extract_status}
            fi
          else
            extract_status=1
            finalizer_status=1
          fi
          cat "${RUNNER_TEMP}/merge.log"
          cat "${RUNNER_TEMP}/extract.log" 2>/dev/null || true
          cat "${RUNNER_TEMP}/finalizer.log" 2>/dev/null || true
          printf 'merge=%s extract=%s finalizer=%s\n' "${merge_status}" "${extract_status}" "${finalizer_status}" | tee "${RUNNER_TEMP}/status.txt"
          exit "${finalizer_status}"
      - name: Upload full diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr196-finalizer-diagnostics
          path: |
            ${{ runner.temp }}/merge.log
            ${{ runner.temp }}/extract.log
            ${{ runner.temp }}/finalizer.log
            ${{ runner.temp }}/status.txt
          if-no-files-found: warn
          retention-days: 2
