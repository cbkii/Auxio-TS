name: PR 238 format artifact

on:
  pull_request:
    branches:
      - dev
    types:
      - synchronize
    paths:
      - .github/workflows/pr238-format-artifact.yml

permissions:
  contents: read

concurrency:
  group: pr238-format-artifact
  cancel-in-progress: false

jobs:
  format-and-export:
    if: github.event.pull_request.head.ref == 'fix/mediastore-source-authority-stale-rows'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare repository dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile jvm-tests

      - name: Apply and verify canonical Kotlin formatting
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh spotlessKotlinApply
          bash ./scripts/ci-gradle.sh spotlessKotlinCheck
          git diff --check

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh --continue \
            :app:testTopwayTwMediaDebugUnitTest \
            :musikr:testDebugUnitTest

      - name: Export exact formatter output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr238-canonical-kotlin
          path: |
            app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt
            musikr/src/test/java/org/oxycblt/musikr/metadata/MetadataExtractorFailureClassificationTest.kt
            musikr/src/test/java/org/oxycblt/musikr/metadata/TagLibJNIAvailabilityTest.kt
          if-no-files-found: error
          retention-days: 1
