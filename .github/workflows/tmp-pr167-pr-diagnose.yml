name: Temporary PR167 patch diagnostics

on:
  pull_request:
    types: [synchronize]
    branches: [dev]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.number == 167
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix-startup-routing-11126370068088722538
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Run patch and persist exact failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q origin dev
          git merge -q --no-edit origin/dev
          merge_rc=$?
          if (( merge_rc != 0 )); then
            printf 'merge failed with status %s\n' "$merge_rc" > /tmp/pr167-error.txt
            git merge --abort || true
          else
            awk '
              /python3 <<'"'"'PY'"'"'/ { capture=1; next }
              capture && /^[[:space:]]*PY[[:space:]]*$/ { exit }
              capture { sub(/^          /, ""); print }
            ' .github/workflows/tmp-pr167-direct-finaliser.yml > /tmp/pr167-finalise.py
            python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/pr167-finalise.py')
          text = path.read_text(encoding='utf-8')
          error_old = 'raise SystemExit(f"STOP: {path}: expected one literal match, found {count}")'
          error_new = 'raise SystemExit(f"STOP: {path}: expected one literal match, found {count}; old={old[:180]!r}")'
          if error_old in text:
              text = text.replace(error_old, error_new, 1)
          replacements = {
              '\n        binding.queueSheet.coordinatorLayoutBehavior as QueueBottomSheetBehavior?\n':
                  '\n            binding.queueSheet.coordinatorLayoutBehavior as QueueBottomSheetBehavior?\n',
              '\n    queueSheetBehavior?.uiSettings = uiSettings\n':
                  '\n        queueSheetBehavior?.uiSettings = uiSettings\n',
              '\n    playbackSheetBehavior.addBottomSheetCallback(panelRouteSheetCallback)\n':
                  '\n        playbackSheetBehavior.addBottomSheetCallback(panelRouteSheetCallback)\n',
              '\n    queueSheetBehavior?.addBottomSheetCallback(panelRouteSheetCallback)\n':
                  '\n        queueSheetBehavior?.addBottomSheetCallback(panelRouteSheetCallback)\n',
              '\n    elevationNormal =""",':
                  '\n        elevationNormal =""",',
              '\n        if (queueSheetShown()) {':
                  '\n            if (queueSheetShown()) {',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
            python3 /tmp/pr167-finalise.py >/tmp/pr167-out.txt 2>/tmp/pr167-error.txt
            patch_rc=$?
            if (( patch_rc == 0 )); then
              printf 'patch completed successfully\n' > /tmp/pr167-error.txt
            fi
          fi
          saved_head=$(git rev-parse HEAD)
          git reset --hard "$saved_head"
          cp /tmp/pr167-error.txt .github/pr167-finaliser-error.txt
          git add .github/pr167-finaliser-error.txt
          if git diff --cached --quiet; then
            printf '\nrun=%s\n' "${GITHUB_RUN_ID}" >> .github/pr167-finaliser-error.txt
            git add .github/pr167-finaliser-error.txt
          fi
          git commit -m 'ci: capture PR167 finaliser diagnostic'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:fix-startup-routing-11126370068088722538
