name: Temporary PR167 patch diagnostics

on:
  pull_request:
    types: [synchronize]
    branches: [dev]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.number == 167
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix-startup-routing-11126370068088722538
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Run patch and persist exact failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git fetch -q origin dev
          git merge -q --no-edit origin/dev
          merge_rc=$?
          if (( merge_rc != 0 )); then
            printf 'merge failed with status %s\n' "$merge_rc" > /tmp/pr167-error.txt
            git merge --abort || true
          else
            awk '
              /python3 <<'"'"'PY'"'"'/ { capture=1; next }
              capture && /^[[:space:]]*PY[[:space:]]*$/ { exit }
              capture { sub(/^          /, ""); print }
            ' .github/workflows/tmp-pr167-direct-finaliser.yml > /tmp/pr167-finalise.py
            python3 /tmp/pr167-finalise.py >/tmp/pr167-out.txt 2>/tmp/pr167-error.txt
            patch_rc=$?
            if (( patch_rc == 0 )); then
              printf 'patch completed successfully\n' > /tmp/pr167-error.txt
            fi
          fi
          cp /tmp/pr167-error.txt .github/pr167-finaliser-error.txt
          git reset --hard HEAD
          cp /tmp/pr167-error.txt .github/pr167-finaliser-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/pr167-finaliser-error.txt
          git commit -m 'ci: capture PR167 finaliser diagnostic'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:fix-startup-routing-11126370068088722538
