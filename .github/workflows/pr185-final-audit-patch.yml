name: PR 185 Final Audit Patch

on:
  push:
    branches:
      - fix/ts18-topway-command-service

permissions:
  contents: write

concurrency:
  group: pr185-final-audit-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'cbkii/Auxio-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/ts18-topway-command-service
          fetch-depth: 0

      - name: Apply verified fail-closed Binder hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client_path = Path("app/src/main/java/org/oxycblt/auxio/headunit/topway/TopwayCommandServiceClient.kt")
          client = client_path.read_text(encoding="utf-8")
          marker = "/** Local Binder implementing the observed `IMusicCallBack` transaction table. */"
          prefix, separator, _ = client.partition(marker)
          if not separator:
              raise SystemExit("STOP: expected callback Binder marker was not found")

          replacement = r'''/** Local Binder implementing the observed `IMusicCallBack` transaction table. */
          internal class TopwayMusicCallbackBinder(
              private val onControl: (TopwayMusicControl) -> Unit,
              private val onMode: (Int) -> Unit,
              private val onExtended: (Bundle?) -> Unit,
          ) : Binder() {
              override fun onTransact(code: Int, data: Parcel, reply: Parcel?, flags: Int): Boolean {
                  if (code == IBinder.INTERFACE_TRANSACTION) {
                      reply?.writeString(TopwayCommandServiceContract.MUSIC_CALLBACK_DESCRIPTOR)
                      return true
                  }
                  val control = TopwayMusicControl.fromTransaction(code)
                  if (
                      control == null &&
                          code != TopwayCommandServiceContract.MusicCallbackTransaction.MODE &&
                          code !=
                              TopwayCommandServiceContract.MusicCallbackTransaction.EXTENDED_INTERFACE
                  ) {
                      return super.onTransact(code, data, reply, flags)
                  }
                  return handleVendorCallbackTransaction(
                      descriptor = TopwayCommandServiceContract.MUSIC_CALLBACK_DESCRIPTOR,
                      code = code,
                      data = data,
                      reply = reply,
                  ) {
                      when {
                          control != null -> onControl(control)
                          code == TopwayCommandServiceContract.MusicCallbackTransaction.MODE ->
                              onMode(readRequiredInt())
                          else -> onExtended(readNullableBundle())
                      }
                  }
              }
          }

          /** Local Binder implementing the observed `ITWCommandCallbackAidl` transaction table. */
          internal class TopwayCommandCallbackBinder(
              private val onStatus: (String, String) -> Unit,
              private val onExtended: (Bundle?) -> Unit,
          ) : Binder() {
              override fun onTransact(code: Int, data: Parcel, reply: Parcel?, flags: Int): Boolean {
                  if (code == IBinder.INTERFACE_TRANSACTION) {
                      reply?.writeString(TopwayCommandServiceContract.COMMAND_CALLBACK_DESCRIPTOR)
                      return true
                  }
                  if (
                      code !in
                          TopwayCommandServiceContract.CommandCallbackTransaction
                              .SYSTEM_VOLUME..TopwayCommandServiceContract.CommandCallbackTransaction
                                  .EXTENDED_INTERFACE
                  ) {
                      return super.onTransact(code, data, reply, flags)
                  }
                  return handleVendorCallbackTransaction(
                      descriptor = TopwayCommandServiceContract.COMMAND_CALLBACK_DESCRIPTOR,
                      code = code,
                      data = data,
                      reply = reply,
                  ) {
                      when (code) {
                          TopwayCommandServiceContract.CommandCallbackTransaction.SYSTEM_VOLUME ->
                              onStatus("System volume", readRequiredInt().toString())
                          TopwayCommandServiceContract.CommandCallbackTransaction.VOLUME_STATUS ->
                              onStatus("Volume status", readRequiredInt().toString())
                          TopwayCommandServiceContract.CommandCallbackTransaction.BT_PHONE_STATUS ->
                              onStatus("Bluetooth phone status", readRequiredInt().toString())
                          TopwayCommandServiceContract.CommandCallbackTransaction.BT_CALL_STATUS -> {
                              val status = readRequiredInt()
                              readRequiredString()
                              readRequiredString()
                              onStatus("Bluetooth call status", status.toString())
                          }
                          TopwayCommandServiceContract.CommandCallbackTransaction
                              .BT_CONNECTED_STATUS ->
                              onStatus("Bluetooth connected status", readRequiredInt().toString())
                          TopwayCommandServiceContract.CommandCallbackTransaction.REVERSE_STATUS ->
                              onStatus("Reverse status", readRequiredInt().toString())
                          TopwayCommandServiceContract.CommandCallbackTransaction.SLEEP_STATUS ->
                              onStatus("Sleep status", readRequiredInt().toString())
                          TopwayCommandServiceContract.CommandCallbackTransaction
                              .EXTENDED_INTERFACE -> onExtended(readNullableBundle())
                      }
                  }
              }
          }

          private inline fun handleVendorCallbackTransaction(
              descriptor: String,
              code: Int,
              data: Parcel,
              reply: Parcel?,
              operation: Parcel.() -> Unit,
          ): Boolean =
              try {
                  data.enforceInterface(descriptor)
                  data.operation()
                  reply?.writeNoException()
                  true
              } catch (e: RuntimeException) {
                  // The peer is outside Auxio's trust boundary. Reject malformed descriptors,
                  // truncated fields, wrong value encodings and unparcelable vendor payloads without
                  // allowing them to escape through Auxio's Binder thread.
                  L.w(e, "Rejecting malformed Topway callback transaction descriptor=$descriptor code=$code")
                  false
              }

          private fun Parcel.readRequiredInt(): Int {
              require(dataAvail() >= PARCEL_MIN_FIELD_BYTES) { "Missing integer field" }
              return readInt()
          }

          private fun Parcel.readRequiredString(): String? {
              require(dataAvail() >= PARCEL_MIN_FIELD_BYTES) { "Missing string field" }
              return readString()
          }

          private fun Parcel.readNullableBundle(): Bundle? {
              if (readRequiredInt() == 0) return null
              require(dataAvail() > 0) { "Missing Bundle payload" }
              return Bundle.CREATOR.createFromParcel(this)
          }

          private const val PARCEL_MIN_FIELD_BYTES = 4
          '''
          client_path.write_text(prefix + replacement, encoding="utf-8", newline="\n")

          contract_path = Path("app/src/main/java/org/oxycblt/auxio/headunit/topway/TopwayCommandServiceContract.kt")
          contract = contract_path.read_text(encoding="utf-8")
          old_parse = '''    fun parseSource(bundle: Bundle?): TopwaySourceState? =
                  try {
                      if (bundle?.getString(EXTRA_ACTION) != ACTION_SOURCE_RECEIVE) null
                      else if (!bundle.containsKey(EXTRA_SOURCE_VALUE)) null
                      else TopwaySourceState(bundle.getInt(EXTRA_SOURCE_VALUE))
                  } catch (_: RuntimeException) {
                      // External Bundles are lazily unmarshalled and may contain unavailable Parcelables.
                      null
                  }
          '''
          new_parse = '''    fun parseSource(bundle: Bundle?): TopwaySourceState? =
                  try {
                      val action = bundle?.get(EXTRA_ACTION)
                      val value = bundle?.get(EXTRA_SOURCE_VALUE)
                      if (action != ACTION_SOURCE_RECEIVE || value !is Int) null
                      else TopwaySourceState(value)
                  } catch (_: RuntimeException) {
                      // External Bundles are lazily unmarshalled and may contain unavailable Parcelables.
                      null
                  }
          '''
          if old_parse not in contract:
              raise SystemExit("STOP: expected source parser block was not found")
          contract_path.write_text(contract.replace(old_parse, new_parse, 1), encoding="utf-8", newline="\n")

          test_path = Path("app/src/test/java/org/oxycblt/auxio/headunit/topway/TopwayCallbackBinderTest.kt")
          test_path.write_text(r'''/*
           * Copyright (c) 2026 Auxio Project
           * TopwayCallbackBinderTest.kt is part of Auxio.
           *
           * This program is free software: you can redistribute it and/or modify
           * it under the terms of the GNU General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           *
           * This program is distributed in the hope that it will be useful,
           * but WITHOUT ANY WARRANTY; without even the implied warranty of
           * MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
           * GNU General Public License for more details.
           *
           * You should have received a copy of the GNU General Public License
           * along with this program.  If not, see <https://www.gnu.org/licenses/>.
           */

          package org.oxycblt.auxio.headunit.topway

          import android.os.Bundle
          import android.os.IBinder
          import android.os.Parcel
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.annotation.Config

          @RunWith(RobolectricTestRunner::class)
          @Config(sdk = [29])
          class TopwayCallbackBinderTest {
              @Test
              fun `music callback binder dispatches all four playback controls`() {
                  val controls = mutableListOf<TopwayMusicControl>()
                  val binder =
                      TopwayMusicCallbackBinder(onControl = controls::add, onMode = {}, onExtended = {})

                  for (code in 1..4) {
                      transact(
                          binder = binder,
                          descriptor = TopwayCommandServiceContract.MUSIC_CALLBACK_DESCRIPTOR,
                          code = code,
                      )
                  }

                  assertEquals(
                      listOf(
                          TopwayMusicControl.NEXT,
                          TopwayMusicControl.PREVIOUS,
                          TopwayMusicControl.PLAY,
                          TopwayMusicControl.PAUSE,
                      ),
                      controls,
                  )
              }

              @Test
              fun `music callback binder unmarshals mode and extended bundle`() {
                  var mode: Int? = null
                  var extended: Bundle? = null
                  val binder =
                      TopwayMusicCallbackBinder(
                          onControl = {},
                          onMode = { mode = it },
                          onExtended = { extended = it },
                      )

                  transact(
                      binder = binder,
                      descriptor = TopwayCommandServiceContract.MUSIC_CALLBACK_DESCRIPTOR,
                      code = TopwayCommandServiceContract.MusicCallbackTransaction.MODE,
                  ) {
                      writeInt(7)
                  }
                  transact(
                      binder = binder,
                      descriptor = TopwayCommandServiceContract.MUSIC_CALLBACK_DESCRIPTOR,
                      code = TopwayCommandServiceContract.MusicCallbackTransaction.EXTENDED_INTERFACE,
                  ) {
                      writeInt(1)
                      Bundle().apply { putString("probe", "value") }.writeToParcel(this, 0)
                  }

                  assertEquals(7, mode)
                  assertEquals("value", extended?.getString("probe"))
              }

              @Test
              fun `music callback binder rejects malformed and unknown transactions`() {
                  val controls = mutableListOf<TopwayMusicControl>()
                  var mode: Int? = null
                  var extended: Bundle? = null
                  val binder =
                      TopwayMusicCallbackBinder(
                          onControl = controls::add,
                          onMode = { mode = it },
                          onExtended = { extended = it },
                      )

                  assertFalse(
                      transactResult(
                          binder,
                          "wrong.descriptor",
                          TopwayCommandServiceContract.MusicCallbackTransaction.NEXT,
                      )
                  )
                  assertFalse(
                      transactResult(
                          binder,
                          TopwayCommandServiceContract.MUSIC_CALLBACK_DESCRIPTOR,
                          TopwayCommandServiceContract.MusicCallbackTransaction.MODE,
                      )
                  )
                  assertFalse(
                      transactResult(
                          binder,
                          TopwayCommandServiceContract.MUSIC_CALLBACK_DESCRIPTOR,
                          TopwayCommandServiceContract.MusicCallbackTransaction.EXTENDED_INTERFACE,
                      ) {
                          writeInt(1)
                      }
                  )
                  assertFalse(
                      transactResult(
                          binder,
                          TopwayCommandServiceContract.MUSIC_CALLBACK_DESCRIPTOR,
                          UNKNOWN_TRANSACTION,
                      )
                  )

                  assertTrue(controls.isEmpty())
                  assertNull(mode)
                  assertNull(extended)
              }

              @Test
              fun `command callback binder unmarshals source response`() {
                  var extended: Bundle? = null
                  val binder =
                      TopwayCommandCallbackBinder(onStatus = { _, _ -> }, onExtended = { extended = it })
                  val sourceBundle =
                      Bundle().apply {
                          putString(
                              TopwayCommandServiceContract.EXTRA_ACTION,
                              TopwayCommandServiceContract.ACTION_SOURCE_RECEIVE,
                          )
                          putInt(
                              TopwayCommandServiceContract.EXTRA_SOURCE_VALUE,
                              TopwaySourceState.SOURCE_LOCAL_MUSIC,
                          )
                      }

                  transact(
                      binder = binder,
                      descriptor = TopwayCommandServiceContract.COMMAND_CALLBACK_DESCRIPTOR,
                      code = TopwayCommandServiceContract.CommandCallbackTransaction.EXTENDED_INTERFACE,
                  ) {
                      writeInt(1)
                      sourceBundle.writeToParcel(this, 0)
                  }

                  val source = TopwayCommandServiceContract.parseSource(extended)
                  assertEquals(TopwaySourceState.SOURCE_LOCAL_MUSIC, source?.value)
                  assertEquals(TopwaySourceState.Kind.LOCAL_MUSIC, source?.kind)
              }

              @Test
              fun `command callback binder rejects truncated fields and bundles`() {
                  val statuses = mutableListOf<Pair<String, String>>()
                  var extended: Bundle? = null
                  val binder =
                      TopwayCommandCallbackBinder(
                          onStatus = { event, value -> statuses += event to value },
                          onExtended = { extended = it },
                      )

                  assertFalse(
                      transactResult(
                          binder,
                          TopwayCommandServiceContract.COMMAND_CALLBACK_DESCRIPTOR,
                          TopwayCommandServiceContract.CommandCallbackTransaction.BT_CALL_STATUS,
                      ) {
                          writeInt(1)
                      }
                  )
                  assertFalse(
                      transactResult(
                          binder,
                          TopwayCommandServiceContract.COMMAND_CALLBACK_DESCRIPTOR,
                          TopwayCommandServiceContract.CommandCallbackTransaction.EXTENDED_INTERFACE,
                      ) {
                          writeInt(1)
                      }
                  )

                  assertTrue(statuses.isEmpty())
                  assertNull(extended)
              }

              private fun transact(
                  binder: IBinder,
                  descriptor: String,
                  code: Int,
                  writeArguments: Parcel.() -> Unit = {},
              ) {
                  val data = Parcel.obtain()
                  val reply = Parcel.obtain()
                  try {
                      data.writeInterfaceToken(descriptor)
                      data.writeArguments()
                      assertTrue(binder.transact(code, data, reply, 0))
                      reply.readException()
                  } finally {
                      reply.recycle()
                      data.recycle()
                  }
              }

              private fun transactResult(
                  binder: IBinder,
                  descriptor: String,
                  code: Int,
                  writeArguments: Parcel.() -> Unit = {},
              ): Boolean {
                  val data = Parcel.obtain()
                  val reply = Parcel.obtain()
                  return try {
                      data.writeInterfaceToken(descriptor)
                      data.writeArguments()
                      binder.transact(code, data, reply, 0)
                  } finally {
                      reply.recycle()
                      data.recycle()
                  }
              }

              private companion object {
                  const val UNKNOWN_TRANSACTION = 99
              }
          }
          ''', encoding="utf-8", newline="\n")

          contract_test_path = Path("app/src/test/java/org/oxycblt/auxio/headunit/topway/TopwayCommandServiceContractTest.kt")
          contract_test = contract_test_path.read_text(encoding="utf-8")
          anchor = '''        assertEquals(TopwaySourceState.Kind.OTHER, source(42)?.kind)
                  assertNull(TopwayCommandServiceContract.parseSource(Bundle()))
          '''
          replacement = '''        assertEquals(TopwaySourceState.Kind.OTHER, source(42)?.kind)
                  assertNull(TopwayCommandServiceContract.parseSource(Bundle()))
                  assertNull(
                      TopwayCommandServiceContract.parseSource(
                          Bundle().apply {
                              putString(
                                  TopwayCommandServiceContract.EXTRA_ACTION,
                                  TopwayCommandServiceContract.ACTION_SOURCE_RECEIVE,
                              )
                              putString(TopwayCommandServiceContract.EXTRA_SOURCE_VALUE, "3")
                          }
                      )
                  )
          '''
          if anchor not in contract_test:
              raise SystemExit("STOP: expected contract-test anchor was not found")
          contract_test_path.write_text(
              contract_test.replace(anchor, replacement, 1), encoding="utf-8", newline="\n"
          )

          docs_path = Path("docs/ts18/launcher-integration/TOPWAY_COMMAND_SERVICE_BRIDGE.md")
          docs_path.write_text(r'''# TS18 Topway command-service playback bridge

          ## Scope and acceptance boundary

          This document records the repository design and production-eligibility evidence for the
          narrow Binder adapter introduced by PR #185. It does not claim that the physical TS18 has
          accepted a normal-app callback, assigned Auxio the local-music source, or delivered DoFun
          fixed-widget commands.

          The adapter is limited at runtime to the dedicated `topwayTwMusic` and `topwayTwMedia`
          compatibility variants. `standard` returns before creating a worker thread or requesting a
          vendor-service bind.

          ## Exact APK evidence

          The retained reference analysed for this contract is:

          ```text
          file: com.tw.service.xt uid_1000(1).apk
          SHA-256: 341af03ccbaeb6a7debe1929153eaadf9ced421d64a4933016010e0e7aa77267
          package: com.tw.service.xt
          versionName/versionCode: 2022.02.17 / 2
          compile/min/target SDK: 29 / 29 / 22
          shared UID: android.uid.system
          ```

          **Observed:** its manifest declares persistent exported service
          `com.tw.service.xt.CommandService`, process `:remote`, action
          `com.tw.service.xt.CommandService.Bind`, and no service binding permission. This is static
          manifest evidence only; firmware policy, SELinux and Binder-side caller checks still require
          exact-device validation.

          ## Verified Binder subset

          ### Command interface

          Descriptor: `com.tw.service.xt.aidl.ITWCommandAidl`

          | Transaction | Code | Request parcel after interface token |
          |---|---:|---|
          | register command callback | 1 | one strong Binder |
          | unregister command callback | 2 | one strong Binder |
          | register music callback | 5 | one strong Binder |
          | unregister music callback | 6 | one strong Binder |
          | extended interface | 67 | presence `int`, then `Bundle` when present |

          The exact generated proxy uses synchronous transactions, a reply parcel and
          `readException()`. Auxio mirrors that order. Unknown descriptors or rejected/malformed
          replies fail closed.

          ### Music callback

          Descriptor: `com.tw.service.xt.aidl.IMusicCallBack`

          | Code | Callback | Request fields after interface token |
          |---:|---|---|
          | 1 | `musicNext()` | none |
          | 2 | `musicPre()` | none |
          | 3 | `musicPlay()` | none |
          | 4 | `musicPause()` | none |
          | 5 | `musicMode(int)` | one `int` |
          | 6 | `extendedInterface(Bundle)` | presence `int`, then `Bundle` when present |

          ### General command callback

          Descriptor: `com.tw.service.xt.aidl.ITWCommandCallbackAidl`

          Codes `1..8` are respectively system volume, volume status, Bluetooth phone status,
          Bluetooth call status (`int`, `String`, `String`), Bluetooth connection status, reverse
          status, sleep status, and extended `Bundle`.

          Auxio registers this callback only to observe the source reply. It does not use volume,
          Bluetooth, reverse or sleep values as authority.

          ## Source observation

          The verified request is:

          ```text
          project = system
          action = source_request
          ```

          The service responds through the general callback with:

          ```text
          action = Source_recieve
          SourceValue = <int>
          ```

          The misspelling `Source_recieve` is exact. Static routing values observed in
          `CommandService.sendSystemFunction` are radio `1`, local music `3`, Bluetooth `8`, video
          `9`, and Android media-key fallback for other values.

          **Important:** requesting or observing the source does not make Auxio source `3`. Callback
          registration does not prove DoFun command delivery. Auxio does not force source state or
          write TWUtil/MCU commands.

          ## Runtime design

          1. `standard` returns from `attach()` before worker creation or binding.
          2. A compatibility build creates one bounded worker while the concrete Auxio service lives.
          3. Action resolution is attempted first, with the exact component as fallback.
          4. The runtime Binder descriptor must match before registration.
          5. Music callback registration is required; the general callback/source query is optional.
          6. Binder transactions run off the main thread.
          7. Playback callbacks post Android media-button intents to the concrete existing Auxio
             service component. `PlaybackServiceFragment` then passes them to the one canonical
             `MediaSessionCompat`; no second player, queue, service, session or notification is added.
          8. Known callback parcels require the exact descriptor and minimum verified fields.
             Truncated fields, wrong descriptors, wrong source value types and unparcelable Bundles
             are rejected without escaping the Binder callback.
          9. Reconnection is bounded to 500 ms, 1.5 s and 3 s. There is no infinite polling.
          10. Release defers rapid reattachment until callback cleanup and old unbind complete, then
              either starts the pending session or shuts down the worker.

          ## Safety boundaries

          The implementation does **not**:

          - import or copy vendor Java classes, AIDL source, smali or native libraries;
          - require platform signing, UID 1000, shared UID, signature permissions, root or SELinux
            changes;
          - call `TWUtil`, force source state, or write MCU/CAN/radio commands;
          - implement fake Cardoor services;
          - replace the existing playback service, player, queue, MediaSession or notification stack;
          - modify the separate systemless Magisk-only exact-`com.tw.music` replacement contract.

          `topwayTwMedia` and `topwayTwMusic` remain distinct. The latter is not an ordinary
          side-by-side replacement for the platform-signed stock package.

          Missing, rejected or descriptor-mismatched vendor services leave Auxio's existing Android
          MediaSession, media-button and Topway broadcast paths intact. That is not a claim that the
          DoFun fixed widget will successfully fall back to those paths.

          ## Repository validation

          PR #185 repository evidence includes:

          - Android Quality #1049: successful;
          - Android Build #1053: successful configured PR job;
          - maintained debug builds and TS18 APK-reference/DoFun checks: successful;
          - release-build step in #1053: skipped, not claimed as passing;
          - all current inline review threads: resolved before the final audit patch.

          The final audit patch must obtain fresh canonical checks on its own final head before the PR
          is marked ready for code review.

          ## Exact-device acceptance still required

          Install the `topwayTwMedia` build first and validate:

          1. normal-app bind and music callback registration;
          2. observed source value and whether the ordinary launcher/playback flow reaches source `3`;
          3. one previous/play/pause/next callback and exactly one Auxio playback change per press;
          4. no simultaneous stock-music action or duplicate callback reaction;
          5. fixed-widget launch target, metadata and progress separately from command delivery;
          6. Android notification, hardware-key, Bluetooth and MediaSession controls remain intact;
          7. Auxio process death/recreation;
          8. controlled `com.tw.service.xt` death/restart and bounded reconnect;
          9. reboot and real ACC sleep/wake;
          10. diagnostics-only, media-session-only and disabled-mode gating;
          11. missing, rejected and descriptor-mismatched service behaviour.

          If registration succeeds but source `3` or DoFun delivery is not achieved, the remaining
          blocker is a Topway source/routing authority boundary. Do not invent source-forcing calls or
          claim complete DoFun integration.

          ## Rollback

          Use one of:

          - select `AndroidMediaSessionOnly` or `Disabled` in TS18 launcher-integration settings;
          - install the previous Auxio-TS APK;
          - install `standard`, which never activates the adapter.

          No system partition, Topway package, launcher database, MCU/CAN configuration or persistent
          root state is modified by this PR.
          ''', encoding="utf-8", newline="\n")
          PY

      - name: Validate patch structure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n scripts/check-headunit-compat-safety.sh
          bash scripts/check-headunit-compat-safety.sh

      - name: Remove temporary workflow and push final audit commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/org/oxycblt/auxio/headunit/topway/TopwayCommandServiceClient.kt \
            app/src/main/java/org/oxycblt/auxio/headunit/topway/TopwayCommandServiceContract.kt \
            app/src/test/java/org/oxycblt/auxio/headunit/topway/TopwayCallbackBinderTest.kt \
            app/src/test/java/org/oxycblt/auxio/headunit/topway/TopwayCommandServiceContractTest.kt \
            docs/ts18/launcher-integration/TOPWAY_COMMAND_SERVICE_BRIDGE.md
          git rm .github/workflows/pr185-final-audit-patch.yml
          git diff --cached --check
          git commit -m "fix(ts18): reject malformed vendor callback parcels"
          git push origin HEAD:fix/ts18-topway-command-service
