name: Apply PR 184 deferred-open fix

on:
  push:
    branches:
      - cx/startup-profiles-benchmarks
    paths:
      - ".github/workflows/apply-pr184-deferred-open-fix.yml"
      - ".github/pr184-deferred-open-fix.py"

permissions:
  contents: write

concurrency:
  group: apply-pr184-deferred-open-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/startup-profiles-benchmarks
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply focused repair
        shell: bash
        run: python3 .github/pr184-deferred-open-fix.py

      - name: Format changed Kotlin
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply

      - name: Run focused regression test
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh \
            :app:testStandardDebugUnitTest \
            --tests org.oxycblt.auxio.playback.service.DeferredOpenIdentityTest

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          bash ./scripts/check-startup-performance-contracts.sh
          git status --short
          git diff -- \
            app/src/main/java/org/oxycblt/auxio/playback/service/ExoPlaybackStateHolder.kt \
            app/src/test/java/org/oxycblt/auxio/playback/service/DeferredOpenIdentityTest.kt

      - name: Commit and push repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/org/oxycblt/auxio/playback/service/ExoPlaybackStateHolder.kt \
            app/src/test/java/org/oxycblt/auxio/playback/service/DeferredOpenIdentityTest.kt
          if git diff --cached --quiet; then
            echo "::error::Focused repair produced no staged changes."
            exit 1
          fi
          git commit -m "fix: resolve hydrated deferred file opens"
          git push origin HEAD:cx/startup-profiles-benchmarks
