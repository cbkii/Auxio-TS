name: Temporary PR190 formatter

on:
  push:
    branches:
      - feat/generated-playlists-and-grid-layout-12959696348616356066

permissions:
  contents: write

concurrency:
  group: temporary-pr190-formatter
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[pr190-formatted]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/generated-playlists-and-grid-layout-12959696348616356066
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Apply formatting and remove workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
          bash ./scripts/bootstrap-dependencies.sh --profile full-build
          bash ./scripts/ci-gradle.sh spotlessApply
          rm -f .github/workflows/temporary-pr190-format.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format final PR190 changes [pr190-formatted]'
          auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push https://github.com/${GITHUB_REPOSITORY}.git \
            HEAD:feat/generated-playlists-and-grid-layout-12959696348616356066
