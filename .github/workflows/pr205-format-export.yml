name: PR 205 formatting export

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: pr205-format-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply Kotlin formatting and export patch
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh spotlessKotlinApply
          git diff -- . ':(exclude).github/workflows/pr205-format-export.yml' > "${RUNNER_TEMP}/pr205-format.patch"
          if [[ ! -s "${RUNNER_TEMP}/pr205-format.patch" ]]; then
            echo "::error::No Kotlin formatting patch was produced."
            exit 1
          fi
          cat "${RUNNER_TEMP}/pr205-format.patch"

      - name: Upload formatting patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr205-format-patch
          path: ${{ runner.temp }}/pr205-format.patch
          if-no-files-found: error
          retention-days: 1
