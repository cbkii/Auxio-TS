                  package org.oxycblt.auxio.music.service

                  import org.oxycblt.musikr.library.MetadataProfile

                  internal data class IndexRequest(
                      val withCache: Boolean,
                      val metadataProfile: MetadataProfile?,
                  )

                  /** Collapses bursts into the single strongest pending indexing request. */
                  internal object IndexRequestCoalescer {
                      fun merge(current: IndexRequest?, incoming: IndexRequest): IndexRequest {
                          if (current == null) return incoming
                          return IndexRequest(
                              // A cache-bypassing request is stronger, so false wins.
                              withCache = current.withCache && incoming.withCache,
                              // Full enrichment is stronger than Lean; explicit beats automatic policy.
                              metadataProfile =
                                  when {
                                      current.metadataProfile == MetadataProfile.FULL ||
                                          incoming.metadataProfile == MetadataProfile.FULL ->
                                          MetadataProfile.FULL
                                      current.metadataProfile == MetadataProfile.LEAN ||
                                          incoming.metadataProfile == MetadataProfile.LEAN ->
                                          MetadataProfile.LEAN
                                      else -> null
                                  },
                          )
                      }
                  }
              '''),
