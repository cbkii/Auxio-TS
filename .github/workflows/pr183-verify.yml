name: PR 183 final hardening

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-verify.yml

permissions:
  contents: write

concurrency:
  group: pr183-final-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0
          submodules: false

      - name: Apply guarded incremental-pipeline fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"STOP: expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "musikr/src/main/java/org/oxycblt/musikr/cache/db/DBCache.kt",
              dedent('''\
                      if (dbSong.modifiedMs != file.modifiedMs || !incrementalStore.cachedProfileAccepts(file)) {
                          incrementalStore.markSeen(file, cachedFile)
                          return CacheResult.Stale(file, dbSong.addedMs)
                      }
              '''),
              dedent('''\
                      if (dbSong.modifiedMs != file.modifiedMs || !incrementalStore.cachedProfileAccepts(file)) {
                          // Changed files are published only after extraction succeeds. Recording the old
                          // metadata here would let a now-invalid file survive reconciliation.
                          return CacheResult.Stale(file, dbSong.addedMs)
                      }
              '''),
          )

          store = "musikr/src/main/java/org/oxycblt/musikr/cache/db/IncrementalScanStore.kt"
          replace_once(
              store,
              dedent('''\
                      val now = System.currentTimeMillis()

                      db.withTransaction {
                          for (snapshot in snapshots.distinctBy { it.sourceKey }) {
              '''),
              dedent('''\
                      val now = System.currentTimeMillis()
                      val distinctSnapshots = snapshots.distinctBy { it.sourceKey }
                      val currentSourceKeys = distinctSnapshots.mapTo(linkedSetOf()) { it.sourceKey }

                      db.withTransaction {
                          // A source omitted from the complete configured snapshot set is no longer active.
                          // Retain its last-known-good rows for rollback/re-add, but hide them immediately.
                          for (ledger in dao.sourceLedgers()) {
                              if (ledger.sourceKey !in currentSourceKeys && ledger.available) {
                                  dao.upsertSourceLedger(
                                      ledger.copy(available = false, lastSeenMs = now)
                                  )
                                  unavailable += ledger.sourceKey
                              }
                          }
                          for (snapshot in distinctSnapshots) {
              '''),
