''',
              '''import org.oxycblt.musikr.covers.MutableCovers
import org.oxycblt.musikr.fs.SourceIdentity
''',
          )
          replace_once(
              extract,
              '''                            MetadataResult.ProviderFailed -> Finalized(InvalidSong)
''',
