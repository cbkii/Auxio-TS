                              }
                          }
              '''),
          )
          replace_once(
              saf,
              '''    data class Query(
''',
              dedent('''\
                      private fun combineRootFingerprints(fingerprints: List<String>): String {
                          val digest = MessageDigest.getInstance("SHA-256")
                          fingerprints.sorted().forEach { fingerprint ->
                              digest.update(fingerprint.toByteArray(Charsets.UTF_8))
                              digest.update(0)
                          }
                          return digest.digest().joinToString("") { "%02x".format(it) }
                      }

                      data class Query(
              '''),
          )

          gate = "app/src/main/java/org/oxycblt/auxio/home/CategorySubscriptionGate.kt"
          replace_once(
              gate,
              dedent('''\
                      @Synchronized
                      fun invalidate(type: MusicType): Boolean {
                          dirty += type
                          return if (type == active) {
                              dirty.remove(type)
                              true
                          } else {
                              false
                          }
                      }
              '''),
              dedent('''\
                      @Synchronized
