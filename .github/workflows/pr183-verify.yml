name: PR 183 final hardening

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-verify.yml

permissions:
  contents: write

concurrency:
  group: pr183-final-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure native build tools are present
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply, format and verify guarded patch
        shell: bash
        run: |
          set +e
          log_file="${RUNNER_TEMP}/pr183-hardening.log"
          {
            set -o pipefail
            cat .github/pr183_patch2.b64.* | base64 --decode > "${RUNNER_TEMP}/pr183_patch.py"
            python3 -m py_compile "${RUNNER_TEMP}/pr183_patch.py"
            python3 "${RUNNER_TEMP}/pr183_patch.py"
            bash ./scripts/ci-gradle.sh spotlessApply
            bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest :musikr:testDebugUnitTest
            bash ./scripts/ci-gradle.sh :app:lintStandardDebug
            bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardDebug
            bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicDebug
            bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaDebug
            bash ./scripts/check-ts18-apk-reference-contracts.sh
            bash ./scripts/check-dofun-topway-compat.sh
          } 2>&1 | tee "${log_file}"
          rc=${PIPESTATUS[0]}

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ((rc != 0)); then
            git reset --hard HEAD
            git clean -fd
            mkdir -p .github
            cp "${log_file}" .github/pr183-hardening-failure.log
            git add .github/pr183-hardening-failure.log
            git commit -m 'ci: record PR 183 hardening failure'
            git push origin HEAD:cx/incremental-library-pipeline
            exit "${rc}"
          fi

          rm -f -- .github/pr183-hardening-failure.log
          rm -- .github/workflows/pr183-verify.yml .github/pr183_patch.b64.* .github/pr183_patch2.b64.*
          git add -A
          git commit -m 'fix: finalise incremental pipeline correctness'
          git push origin HEAD:cx/incremental-library-pipeline
