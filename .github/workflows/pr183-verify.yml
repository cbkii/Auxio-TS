                          MutableDBCache.from(db).write(cachedFile("legacy.mp3", modifiedMs = 1L))
                          val plan =
                              store.planScan(
                                  listOf(snapshot("v1")),
                                  false,
                                  MetadataProfile.FULL,
                                  1L,
