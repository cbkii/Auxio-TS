name: PR206 final fixes

on:
  pull_request:
    types: [synchronize]
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: pr206-final-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/restore-v607-library-loading'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/restore-v607-library-loading
          fetch-depth: 0

      - name: Apply focused fixes
        shell: bash
        run: python3 .github/scripts/tmp_pr206_final_fixes.py

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare test environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile jvm-tests

      - name: Format and validate focused changes
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh spotlessKotlinApply \
            :app:testStandardDebugUnitTest \
            :musikr:testDebugUnitTest
          bash ./scripts/check-ts18-root-storage-fastpath.sh
          git diff --check

      - name: Commit implementation and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- \
            .github/scripts/tmp_pr206_final_fixes.py \
            .github/workflows/tmp-pr206-final-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::No final changes were produced."
            exit 1
          fi
          git commit -m "fix: finalise reliable library loading"
          git push origin HEAD:fix/restore-v607-library-loading
