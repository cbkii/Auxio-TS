name: PR200 Final Review Closure

on:
  workflow_dispatch:
  push:
    branches:
      - cx/pr200-headunit-diag

permissions:
  contents: write

concurrency:
  group: pr200-final-review-closure
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out closure tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/pr200-headunit-diag
          path: closure-tooling
          persist-credentials: false

      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/ts18-root-storage-fastpath
          path: repo
          fetch-depth: 0
          submodules: false

      - name: Apply scoped review fixes
        shell: bash
        run: |
          if grep -Fq 'val initiatingMode = locationMode' \
            repo/app/src/main/java/org/oxycblt/auxio/music/locations/LocationsDialog.kt; then
            echo 'Primary closure already applied.'
          else
            python3 closure-tooling/scripts/tmp-pr200-final-closure.py repo
          fi
          python3 closure-tooling/scripts/tmp-pr200-headunit-guard-closure.py repo

      - name: Validate and format closure
        working-directory: repo
        shell: bash
        run: |
          git diff --check
          bash scripts/check-ts18-root-storage-fastpath.sh
          bash scripts/check-headunit-compat-safety.sh
          bash scripts/bootstrap-dependencies.sh --profile full-build
          bash scripts/ci-gradle.sh spotlessKotlinApply
          git diff --check
          bash scripts/check-ts18-root-storage-fastpath.sh
          bash scripts/check-headunit-compat-safety.sh

      - name: Run focused unit tests
        working-directory: repo
        shell: bash
        run: bash scripts/ci-gradle.sh :app:testStandardDebugUnitTest :musikr:testDebugUnitTest

      - name: Commit and push closure
        working-directory: repo
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/org/oxycblt/auxio/music/locations/LocationsDialog.kt \
            app/src/main/java/org/oxycblt/auxio/headunit/root/storage/PreparedVolumeIndexStore.kt \
            app/src/test/java/org/oxycblt/auxio/headunit/topway/TopwaySourcePolicyDiscoveryTest.kt \
            app/src/test/java/org/oxycblt/auxio/headunit/root/storage/RootStorageAccelerationPolicyTest.kt \
            scripts/check-ts18-root-storage-fastpath.sh \
            scripts/check-headunit-compat-safety.sh \
            docs/ts18/ROOT_STORAGE_FASTPATH.md
          git diff --cached --check
          git commit -m 'fix(ts18): close final root storage review findings'
          git push origin HEAD:agent/ts18-root-storage-fastpath
