name: PR200 Head-unit Safety Diagnostic

on:
  push:
    branches:
      - cx/pr200-headunit-diag
  pull_request:
    branches:
      - agent/ts18-root-storage-fastpath
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact current PR #200 merge commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 3afefece5931babf46162dac7e68d66a26a20c04
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Run complete canonical head-unit safety sequence
        id: safety
        continue-on-error: true
        shell: bash
        env:
          GITHUB_BASE_REF: dev
        run: |
          set +e
          log=/tmp/pr200-headunit-safety.log
          : > "$log"
          status=0
          for script in \
            scripts/check-ts18-apk-reference-contracts.sh \
            scripts/check-headunit-compat-safety.sh \
            scripts/check-dofun-topway-compat.sh \
            scripts/check-native-keep-rules.sh; do
            printf '\n===== BEGIN %s =====\n' "$script" | tee -a "$log"
            bash "$script" >> "$log" 2>&1
            script_status=$?
            printf '===== END %s status=%s =====\n' "$script" "$script_status" | tee -a "$log"
            if [ "$script_status" -ne 0 ]; then
              status=$script_status
              break
            fi
          done
          cat "$log"
          exit "$status"

      - name: Upload complete diagnostic output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr200-headunit-safety-full-lane-log
          path: /tmp/pr200-headunit-safety.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve diagnostic failure status
        if: steps.safety.outcome == 'failure'
        shell: bash
        run: exit 1
