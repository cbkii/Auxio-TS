name: Apply PR 220 finalization

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: apply-pr220-finalization
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/manual-release-protected-ref-auth
          fetch-depth: 0

      - name: Apply and validate finalization patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/.apply-pr220-finalization.py')
          text = path.read_text(encoding='utf-8')
          old = 'The workflow downloads complete branch/tag ruleset details with the owner PAT\n'
          new = 'The File::FNM_PATHNAME contract is preserved for GitHub ref patterns.\n\nThe workflow downloads complete branch/tag ruleset details with the owner PAT\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one finalization docstring anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/.apply-pr220-finalization.py
          rm -f scripts/.apply-pr220-finalization.py
          rm -f .github/workflows/apply-pr220-finalization.yml
          git diff --check
          git status --short

      - name: Commit finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && {
            echo '::error::Finalization produced no commit.'
            exit 1
          }
          git commit -m 'ci: finalise protected release authority checks'
          git push origin HEAD:refs/heads/fix/manual-release-protected-ref-auth
