name: Apply PR 220 finalization

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: apply-pr220-finalization
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/manual-release-protected-ref-auth
          fetch-depth: 0

      - name: Apply and validate finalization patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/.apply-pr220-finalization.py')
          text = path.read_text(encoding='utf-8')
          old = 'The workflow downloads complete branch/tag ruleset details with the owner PAT\n'
          new = 'The File::FNM_PATHNAME contract is preserved for GitHub ref patterns.\n\n        The workflow downloads complete branch/tag ruleset details with the owner PAT\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one finalization docstring anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/.apply-pr220-finalization.py
          git diff --check
          mkdir -p finalized/docs finalized/scripts
          cp .github/workflows/manual-release.yml finalized/manual-release.yml
          cp docs/RELEASE_WORKFLOW.md finalized/docs/RELEASE_WORKFLOW.md
          cp scripts/check-manual-release-workflow.sh finalized/scripts/check-manual-release-workflow.sh
          cp scripts/check-release-ruleset-authority.py finalized/scripts/check-release-ruleset-authority.py
          sha256sum \
            finalized/manual-release.yml \
            finalized/docs/RELEASE_WORKFLOW.md \
            finalized/scripts/check-manual-release-workflow.sh \
            finalized/scripts/check-release-ruleset-authority.py \
            > finalized/SHA256SUMS

      - name: Upload finalization files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr220-finalized-files
          path: finalized
          if-no-files-found: error
          retention-days: 3

      - name: Commit non-workflow finalization files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/RELEASE_WORKFLOW.md \
            scripts/check-manual-release-workflow.sh \
            scripts/check-release-ruleset-authority.py
          git diff --cached --quiet && {
            echo '::error::Finalization produced no non-workflow changes.'
            exit 1
          }
          git commit -m 'ci: harden protected release authority checks'
          git push origin HEAD:refs/heads/fix/manual-release-protected-ref-auth
