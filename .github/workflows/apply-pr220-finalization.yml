name: Apply PR 220 finalization

on:
  push:
    branches:
      - fix/manual-release-protected-ref-auth
    paths:
      - .github/workflows/apply-pr220-finalization.yml
      - scripts/.apply-pr220-finalization.py

permissions:
  contents: write

concurrency:
  group: apply-pr220-finalization
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/manual-release-protected-ref-auth
          fetch-depth: 0

      - name: Apply and validate finalization patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/.apply-pr220-finalization.py
          rm -f scripts/.apply-pr220-finalization.py
          rm -f .github/workflows/apply-pr220-finalization.yml
          git diff --check
          git status --short

      - name: Commit finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && {
            echo '::error::Finalization produced no commit.'
            exit 1
          }
          git commit -m 'ci: finalise protected release authority checks'
          git push origin HEAD:refs/heads/fix/manual-release-protected-ref-auth
