          docs = r'''# Launch to Currently Playing panel

          **Evidence confidence:** Inferred from source, policy tests, and repository CI.  
          **Porting decision:** Requires exact TS18 runtime validation.

          Auxio-TS separates playback restoration, autoplay intent, and panel destination. A cold
          launch creates one tracked restore request and, when enabled, one durable panel route.
          The fragment renders that already-decided route only after the route's own restore request
          reaches a compatible outcome and the selected layout reaches its stable sheet state.

          ## Product contract

          | Situation | Destination |
          |---|---|
          | Existing paused session restored | Now Playing, still paused |
          | Existing playing session restored | Now Playing, preserving requested play state |
          | Valid TS18 raw fast resume | Keep route pending until a normal Musikr `Song` reconciles |
          | No saved session with fallback | Open after the fallback queue has produced a normal song |
          | No saved session without fallback | Home; cancel the generic route |
          | First setup / no source | Setup/home |
          | Known empty library | Empty-library UI |
          | Cache unavailable/recovery | Recovery UI unless a valid current/raw session exists |
          | Explicit Now Playing | Explicit Now Playing route supersedes generic startup |
          | Explicit Queue | Playback-plus-queue semantic route supersedes generic startup |
          | Warm return / restored task | Preserve current UI |
          | Configuration recreation | Activity-scoped route and restore IDs survive; no duplicate request |
          | Manual collapse, navigation, or playback | Cancel/supersede the generic startup route |

          `Launch to Now Playing` is independent of `Autoplay`. Standard builds default the launch
          setting off. Topway-compatible builds default it on. Either flavor may change the setting.

          ## Root cause and corrected event order

          The former implementation had two policy owners and a transient `OpenPanel` event. An
          Activity could emit the event while the fragment had hidden the playback sheet; the
          fragment consumed it, then a later restored song only unhid the sheet to collapsed.

          The corrected order is:

          1. Activity assigns a request ID to `RestoreState`.
          2. `PlaybackStateManager` reports reason-coded progress for that exact request.
          3. Activity records one prioritized `PanelRouteRequest`, including the restore ID where
             the route depends on restoration.
          4. Fragment evaluates the route against library readiness, raw metadata, normal song, and
             matching restore progress.
          5. Sheet commands remain pending while `HIDDEN`, `DRAGGING`, or `SETTLING`.
          6. Bottom-sheet stable-state callbacks retry without polling or arbitrary delay.
          7. The route is acknowledged only at its final semantic destination.
          8. A stale token, no-session/failure outcome, manual panel gesture, explicit navigation,
             or manual playback cancels/supersedes the generic route.

          This makes the first manual playback after a no-session launch ineligible to fulfil the
          old startup request.

          ## Restore outcomes

          `NOT_REQUESTED`, `WAITING_FOR_PLAYER`, and `WAITING_FOR_LIBRARY` are pending.
          `RAW_FAST_RESUME_ACTIVE` remains pending until normal-song reconciliation.
          `RESTORED_EXISTING_SESSION` and `FALLBACK_QUEUE_CREATED` render only with a normal song.
          `NO_SAVED_SESSION`, `FAILED`, and `CANCELLED` terminate the generic route. Outcome updates
          are request-ID checked, so an older asynchronous restore cannot affect a newer launch.

          ## Layout semantics

          `PLAYBACK` means Now Playing. `PLAYBACK_QUEUE` is a semantic queue-capable destination.
          In stacked layouts, playback reaches stable expanded state before the queue expands. In
          wide dual-pane layouts the queue is static beside playback, so expanding playback fulfils
          the combined destination. Physical 1280×720 alone does not prove which qualifier Android
          selected; runtime bounds and resources remain part of exact-device validation.

          ## Boot/autostart matrix

          `BootReceiver` retains the existing Android 10/API 29-safe policy:

          - autoplay on: best-effort Activity plus playback-service restore;
          - autoplay off: best-effort Activity, no idle media foreground service;
          - floating-controls-only: no full Activity; overlay restore only, with playback service
            started only when autoplay also requires it;
          - blocked background Activity: service playback may still proceed only on the autoplay
            path.

          Boot restore and Activity panel routing remain separate; a service-only boot cannot claim
          that a panel was displayed.

          ## Diagnostics

          Bounded logs include route ID/origin/priority/reason, restore request ID/outcome,
          stale-completion rejection, pending reason changes, cancellation/supersession, and final
          acknowledgement. There is no per-frame route logging.

          ## Exact-device checklist

          All items are **Requires device validation** on
          `s9863a1h10_Natv` / `TS18.2.2_20241210.165912_WINDOW-THEME1`:

          - saved paused and playing cold launches;
          - no saved state and fallback creation;
          - autoplay and launch-to-panel independently on/off;
          - slow cached-library restore and corrupt/missing cache;
          - valid, invalid, and unmatched raw fast resume;
          - first setup, known empty library, and recovery;
          - manual collapse/navigation/playback while restore is pending;
          - configuration recreation and process death;
          - warm return and `onNewIntent()` Now Playing/Queue routes;
          - DoFun launcher restart, boot autostart, and real ACC sleep/wake;
          - wide TS18 layout and a stacked/narrow layout.

          Repository CI is static/JVM evidence only; it does not prove physical DoFun, ACC, panel
          timing, platform signing, UID 1000, or private-vendor behavior.
          '''
          write("docs/LAUNCH_TO_CURRENTLY_PLAYING.md", docs)

          # The temporary workflow is not part of the product change.
          Path(".github/workflows/pr165-review-completion.yml").unlink()
          PY

