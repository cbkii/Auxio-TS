name: PR 165 review completion
# Trigger after workflow registration.

on:
  push:
    branches:
      - cx/investigate-and-implement-launch-to-currently-playing-panel
    paths:
      - .github/workflows/pr165-review-completion.yml

permissions:
  contents: write

jobs:
  apply-review-completion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: cx/investigate-and-implement-launch-to-currently-playing-panel
          fetch-depth: 0

      - name: Apply verified startup-routing fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text)

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern[:120]!r}")
              write(path, updated)

          policy = r'''/*
           * Copyright (c) 2026 Auxio Project
           * StartupPlaybackPolicy.kt is part of Auxio.
           *
           * This program is free software: you can redistribute it and/or modify
           * it under the terms of the GNU General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           *
           * This program is distributed in the hope that it will be useful,
           * but WITHOUT ANY WARRANTY; without even the implied warranty of
           * MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
           * GNU General Public License for more details.
           *
           * You should have received a copy of the GNU General Public License
           * along with this program.  If not, see <https://www.gnu.org/licenses/>.
           */

          package org.oxycblt.auxio.playback

          import org.oxycblt.auxio.playback.state.DeferredPlayback
          import org.oxycblt.auxio.playback.state.RestoreOutcome
          import org.oxycblt.auxio.playback.state.RestoreProgress
          import org.oxycblt.musikr.Library

          /**
           * Pure policy functions for determining startup playback and panel behavior.
           *
           * @author Auxio-TS contributors
           */
          object StartupPlaybackPolicy {

              /**
               * Determine the [DeferredPlayback] action for a generic app launch (no explicit intent
               * action).
               *
               * @param autoplayOnLaunch Whether the autoplay-on-launch setting is enabled.
               * @return The appropriate [DeferredPlayback.RestoreState] action.
               */
              fun restoreActionForLaunch(autoplayOnLaunch: Boolean): DeferredPlayback.RestoreState =
                  DeferredPlayback.RestoreState(
                      play = autoplayOnLaunch,
                      fallback = DeferredPlayback.ShuffleAll(play = autoplayOnLaunch),
                  )

              /**
               * Determine the [DeferredPlayback] action for a boot-triggered service start (when
               * Activity launch was blocked by background-start restrictions).
               *
               * @param autoplayOnLaunch Whether the autoplay-on-launch setting is enabled.
               * @return The appropriate [DeferredPlayback.RestoreState] action.
               */
              fun restoreActionForBoot(autoplayOnLaunch: Boolean): DeferredPlayback.RestoreState =
                  DeferredPlayback.RestoreState(
                      play = autoplayOnLaunch,
                      fallback = DeferredPlayback.ShuffleAll(play = autoplayOnLaunch),
                  )

              /**
               * Determine whether the Now Playing panel should be opened on cold launch.
               *
               * A missing or intentionally empty library must remain on setup/home rather than showing
               * an empty playback surface.
               */
              fun shouldOpenPanelOnLaunch(library: Library?): Boolean {
                  return library != null && !library.empty()
              }

              /**
               * Select the durable panel request for a new Activity launch.
               *
               * Branch ordering is explicit destination, non-cold/restored/cancelled task, independent
               * launch-to-panel preference, already-renderable normal song, terminal library gates,
               * raw fast-resume, then a restore-bound request. [PanelRouteRequest.waitForSong] means the
               * current panel cannot safely render until a normal Musikr song exists; [StartupPanelDecision.RequestRoute.restoreBound]
               * means the route must also match a terminal restore outcome so a later manual song cannot
               * be mistaken for startup restoration.
               *
               * @param input Typed launch, library, playback, flavor, and preference state.
               * @return A route request or a reason-coded decision to preserve the current destination.
               */
              fun startupRoute(input: StartupPanelInput): StartupPanelDecision =
                  when {
                      input.explicitDestination != null ->
                          StartupPanelDecision.RequestRoute(
                              destination = input.explicitDestination,
                              origin = PanelRouteOrigin.EXPLICIT_INTENT,
                              priority = PanelRoutePriority.EXPLICIT,
                              waitForSong = input.explicitDestination != OpenPanel.MAIN,
                              restoreBound = false,
                              reason = "explicit-destination",
                          )
                      !input.coldLaunch || input.restoredTask || input.userCancelled ->
                          StartupPanelDecision.KeepCurrent("not-new-cold-launch")
                      !input.launchToPanel ->
                          StartupPanelDecision.KeepCurrent("launch-to-panel-disabled")
                      input.hasNormalSong ->
                          StartupPanelDecision.RequestRoute(
                              destination = OpenPanel.PLAYBACK,
                              origin = PanelRouteOrigin.STARTUP_RESTORE,
                              priority = PanelRoutePriority.STARTUP,
                              waitForSong = false,
                              restoreBound = false,
                              reason = "existing-normal-session",
                          )
                      input.libraryState == StartupLibraryRouteState.NEEDS_SOURCE ->
                          StartupPanelDecision.KeepCurrent("needs-source")
                      input.libraryState == StartupLibraryRouteState.EMPTY ->
                          StartupPanelDecision.KeepCurrent("empty-library")
                      input.libraryState == StartupLibraryRouteState.RECOVERY ->
                          StartupPanelDecision.KeepCurrent("library-recovery")
                      input.rawFastResumeActive ->
                          StartupPanelDecision.RequestRoute(
                              destination = OpenPanel.PLAYBACK,
                              origin = PanelRouteOrigin.STARTUP_RESTORE,
                              priority = PanelRoutePriority.STARTUP,
                              waitForSong = true,
                              restoreBound = true,
                              reason = "raw-fast-resume-awaiting-reconciliation",
                          )
                      else ->
                          StartupPanelDecision.RequestRoute(
                              destination = OpenPanel.PLAYBACK,
                              origin = PanelRouteOrigin.STARTUP_RESTORE,
                              priority = PanelRoutePriority.STARTUP,
                              waitForSong = true,
                              restoreBound = true,
                              reason =
                                  if (input.topwayCompatFlavor && input.headUnitLandscapeMode) {
                                      "topway-cold-launch-awaiting-restore"
                                  } else {
                                      "launch-to-panel-awaiting-restore"
                                  },
                          )
                  }

              /**
               * Decide whether a durable request should render, remain pending, or be cancelled.
               *
               * Restore-bound requests are keyed to [RestoreProgress.requestId]. Terminal no-session,
               * failure, cancellation, stale-token, and unusable-library outcomes cancel the route.
               * This is what prevents the first later manual playback from being treated as a startup
               * restore. Explicit routes are not restore-bound but still wait for a normal song when
               * their destination requires one.
               */
              fun pendingRouteDecision(input: PendingPanelRouteInput): PendingPanelRouteDecision {
                  val route = input.route
                  if (route.origin != PanelRouteOrigin.STARTUP_RESTORE) {
                      if (!route.waitForSong || input.hasNormalSong) {
                          return PendingPanelRouteDecision.Apply("explicit-route-renderable")
                      }
                      if (input.rawFastResumeActive) {
                          return PendingPanelRouteDecision.Wait("explicit-route-waiting-for-song")
                      }
                      return if (input.libraryState.isTerminalWithoutLibrary()) {
                          PendingPanelRouteDecision.Cancel("explicit-route-no-renderable-song")
                      } else {
                          PendingPanelRouteDecision.Wait("explicit-route-waiting-for-song")
                      }
                  }

                  val restoreRequestId = route.restoreRequestId
                  if (restoreRequestId == null) {
                      return if (input.hasNormalSong) {
                          PendingPanelRouteDecision.Apply("existing-session-renderable")
                      } else {
                          PendingPanelRouteDecision.Cancel("startup-route-missing-restore-token")
                      }
                  }

                  val progress =
                      input.restoreProgress
                          ?: return PendingPanelRouteDecision.Wait("restore-outcome-not-reported")
                  if (progress.requestId != restoreRequestId) {
                      return PendingPanelRouteDecision.Cancel("restore-request-superseded")
                  }

                  if (
                      !input.hasNormalSong &&
                          !input.rawFastResumeActive &&
                          input.libraryState.isTerminalWithoutLibrary()
                  ) {
                      return PendingPanelRouteDecision.Cancel(
                          "library-terminal-${input.libraryState.name.lowercase()}"
                      )
                  }

                  return when (progress.outcome) {
                      RestoreOutcome.NOT_REQUESTED,
                      RestoreOutcome.WAITING_FOR_PLAYER,
                      RestoreOutcome.WAITING_FOR_LIBRARY ->
                          PendingPanelRouteDecision.Wait(
                              "restore-${progress.outcome.name.lowercase()}"
                          )
                      RestoreOutcome.RAW_FAST_RESUME_ACTIVE ->
                          if (input.hasNormalSong) {
                              PendingPanelRouteDecision.Apply("raw-resume-reconciled-song")
                          } else {
                              PendingPanelRouteDecision.Wait(
                                  "raw-fast-resume-awaiting-reconciliation"
                              )
                          }
                      RestoreOutcome.RESTORED_EXISTING_SESSION,
                      RestoreOutcome.FALLBACK_QUEUE_CREATED ->
                          if (input.hasNormalSong) {
                              PendingPanelRouteDecision.Apply(
                                  "restore-${progress.outcome.name.lowercase()}"
                              )
                          } else {
                              PendingPanelRouteDecision.Cancel(
                                  "restore-terminal-without-normal-song"
                              )
                          }
                      RestoreOutcome.NO_SAVED_SESSION ->
                          PendingPanelRouteDecision.Cancel("no-saved-session")
                      RestoreOutcome.FAILED -> PendingPanelRouteDecision.Cancel("restore-failed")
                      RestoreOutcome.CANCELLED ->
                          PendingPanelRouteDecision.Cancel("restore-cancelled")
                  }
              }

              private fun StartupLibraryRouteState.isTerminalWithoutLibrary() =
                  this == StartupLibraryRouteState.NEEDS_SOURCE ||
                      this == StartupLibraryRouteState.EMPTY ||
                      this == StartupLibraryRouteState.RECOVERY
          }

          /** Typed input for selecting the initial panel route. */
          data class StartupPanelInput(
              val coldLaunch: Boolean,
              val restoredTask: Boolean,
              val launchToPanel: Boolean,
              val topwayCompatFlavor: Boolean,
              val headUnitLandscapeMode: Boolean,
              val libraryState: StartupLibraryRouteState,
              val hasNormalSong: Boolean,
              val rawFastResumeActive: Boolean,
              val explicitDestination: OpenPanel? = null,
              val userCancelled: Boolean = false,
          )

          /** Library readiness categories relevant to startup panel routing. */
          enum class StartupLibraryRouteState {
              CHECKING,
              READY_OR_UNKNOWN,
              NEEDS_SOURCE,
              EMPTY,
              RECOVERY,
          }

          /** Source of a durable panel request. */
          enum class PanelRouteOrigin {
              EXPLICIT_INTENT,
              USER_ACTION,
              LAUNCHER,
              STARTUP_RESTORE,
          }

          /** Higher-valued requests supersede lower-valued requests. */
          enum class PanelRoutePriority(val value: Int) {
              STARTUP(10),
              LAUNCHER(20),
              EXPLICIT(30),
          }

          /** Durable request retained until the fragment renders or explicitly cancels it. */
          data class PanelRouteRequest(
              val id: Long,
              val destination: OpenPanel,
              val origin: PanelRouteOrigin,
              val priority: PanelRoutePriority,
              val waitForSong: Boolean,
              val reason: String,
              val restoreRequestId: Long? = null,
          )

          /** Result of selecting a route for a new launch. */
          sealed interface StartupPanelDecision {
              /** Keep setup/home/current UI for the supplied reason. */
              data class KeepCurrent(val reason: String) : StartupPanelDecision

              /** Record a durable route with the supplied priority and render preconditions. */
              data class RequestRoute(
                  val destination: OpenPanel,
                  val origin: PanelRouteOrigin,
                  val priority: PanelRoutePriority,
                  val waitForSong: Boolean,
                  val restoreBound: Boolean,
                  val reason: String,
              ) : StartupPanelDecision
          }

          /** Current inputs used to evaluate an already-recorded durable route. */
          data class PendingPanelRouteInput(
              val route: PanelRouteRequest,
              val libraryState: StartupLibraryRouteState,
              val hasNormalSong: Boolean,
              val rawFastResumeActive: Boolean,
              val restoreProgress: RestoreProgress?,
          )

          /** Rendering decision for a pending route. */
          sealed interface PendingPanelRouteDecision {
              val reason: String

              /** Apply the route to the current layout. */
              data class Apply(override val reason: String) : PendingPanelRouteDecision

              /** Retain the route until another bounded state transition occurs. */
              data class Wait(override val reason: String) : PendingPanelRouteDecision

              /** Remove the route because it is terminal, stale, or superseded. */
              data class Cancel(override val reason: String) : PendingPanelRouteDecision
          }
          '''
          write(
              "app/src/main/java/org/oxycblt/auxio/playback/StartupPlaybackPolicy.kt",
              policy,
          )

          restore_outcome = r'''/*
           * Copyright (c) 2026 Auxio Project
           * RestoreOutcome.kt is part of Auxio.
           *
           * This program is free software: you can redistribute it and/or modify
           * it under the terms of the GNU General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           *
           * This program is distributed in the hope that it will be useful,
           * but WITHOUT ANY WARRANTY; without even the implied warranty of
           * MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
           * GNU General Public License for more details.
           *
           * You should have received a copy of the GNU General Public License
           * along with this program.  If not, see <https://www.gnu.org/licenses/>.
           */

          package org.oxycblt.auxio.playback.state

          /** Terminal and non-terminal states of a tracked [DeferredPlayback.RestoreState]. */
          enum class RestoreOutcome {
              NOT_REQUESTED,
              WAITING_FOR_PLAYER,
              WAITING_FOR_LIBRARY,
              RAW_FAST_RESUME_ACTIVE,
              RESTORED_EXISTING_SESSION,
              FALLBACK_QUEUE_CREATED,
              NO_SAVED_SESSION,
              FAILED,
              CANCELLED,
          }

          /**
           * Current outcome for one Activity-scoped startup restore request.
           *
           * The request ID prevents an older asynchronous restore or raw-reconciliation completion
           * from fulfilling a newer launch route.
           */
          data class RestoreProgress(val requestId: Long, val outcome: RestoreOutcome)
          '''
          write(
              "app/src/main/java/org/oxycblt/auxio/playback/state/RestoreOutcome.kt",
              restore_outcome,
          )

          replace_once(
              "app/src/main/java/org/oxycblt/auxio/playback/state/PlaybackStateHolder.kt",
              '''    data class RestoreState(val play: Boolean, val fallback: DeferredPlayback? = null) :
                  DeferredPlayback''',
              '''    data class RestoreState(
                  val play: Boolean,
                  val fallback: DeferredPlayback? = null,
                  val requestId: Long? = null,
              ) : DeferredPlayback''',
          )

          manager = "app/src/main/java/org/oxycblt/auxio/playback/state/PlaybackStateManager.kt"
          replace_once(
              manager,
              '''    /** Raw pre-library playback metadata, non-null only during TS18 raw fast resume. */
              val rawPlaybackMetadata: RawPlaybackMetadata?

              /** The current queue of [Song]s. */''',
              '''    /** Raw pre-library playback metadata, non-null only during TS18 raw fast resume. */
              val rawPlaybackMetadata: RawPlaybackMetadata?

              /** Latest progress for the currently tracked startup restore request. */
              val restoreProgress: RestoreProgress?

              /** The current queue of [Song]s. */''',
          )
          replace_once(
              manager,
              '''    fun playDeferred(action: DeferredPlayback)

              /**
               * Request that the pending [DeferredPlayback] (if any) be passed to the given''',
              '''    fun playDeferred(action: DeferredPlayback)

              /**
               * Publish a restore outcome for [requestId]. Stale asynchronous completions are ignored.
               */
              fun notifyRestoreOutcome(requestId: Long?, outcome: RestoreOutcome)

              /**
               * Request that the pending [DeferredPlayback] (if any) be passed to the given''',
          )
          replace_once(
              manager,
              '''        /** Called when raw pre-library playback metadata changes. */
                  fun onRawPlaybackMetadataChanged(metadata: RawPlaybackMetadata?) {}

                  /**
                   * Called when the [RepeatMode] changes.''',
              '''        /** Called when raw pre-library playback metadata changes. */
                  fun onRawPlaybackMetadataChanged(metadata: RawPlaybackMetadata?) {}

                  /** Called when the tracked startup restore outcome changes. */
                  fun onRestoreProgressChanged(progress: RestoreProgress) {}

                  /**
                   * Called when the [RepeatMode] changes.''',
          )
          replace_once(
              manager,
              '''    @Volatile private var stateHolder: PlaybackStateHolder? = null
              @Volatile private var pendingDeferredPlayback: DeferredPlayback? = null
              @Volatile private var isInitialized = false''',
              '''    @Volatile private var stateHolder: PlaybackStateHolder? = null
              @Volatile private var pendingDeferredPlayback: DeferredPlayback? = null
              @Volatile private var currentRestoreProgress: RestoreProgress? = null
              @Volatile private var isInitialized = false''',
          )
          replace_once(
              manager,
              '''    override val rawPlaybackMetadata
                  get() = stateMirror.rawPlaybackMetadata

              override val queue''',
              '''    override val rawPlaybackMetadata
                  get() = stateMirror.rawPlaybackMetadata

              override val restoreProgress
                  get() = currentRestoreProgress

              override val queue''',
          )
          replace_once(
              manager,
              '''    @Synchronized
              override fun playDeferred(action: DeferredPlayback) {
                  val stateHolder = stateHolder
                  if (stateHolder == null || !stateHolder.handleDeferred(action)) {
                      L.d("Internal player not present or did not consume action, waiting")
                      pendingDeferredPlayback = action
                  }
              }

              @Synchronized
              override fun requestAction(stateHolder: PlaybackStateHolder) {''',
              '''    @Synchronized
              override fun playDeferred(action: DeferredPlayback) {
                  if (action is DeferredPlayback.RestoreState && action.requestId != null) {
                      val previous = currentRestoreProgress
                      if (
                          previous != null &&
                              previous.requestId != action.requestId &&
                              previous.outcome !in TERMINAL_RESTORE_OUTCOMES
                      ) {
                          L.i(
                              "Superseding restore request ${previous.requestId} with ${action.requestId}"
                          )
                      }
                      updateRestoreProgress(
                          RestoreProgress(action.requestId, RestoreOutcome.WAITING_FOR_PLAYER)
                      )
                  } else if (action is DeferredPlayback.RestoreState) {
                      val active = currentRestoreProgress
                      if (active != null && active.outcome !in TERMINAL_RESTORE_OUTCOMES) {
                          L.i(
                              "Untracked restore superseded tracked request ${active.requestId}"
                          )
                          updateRestoreProgress(
                              RestoreProgress(active.requestId, RestoreOutcome.CANCELLED)
                          )
                      }
                  }

                  val stateHolder = stateHolder
                  if (stateHolder == null || !stateHolder.handleDeferred(action)) {
                      L.d("Internal player not present or did not consume action, waiting")
                      pendingDeferredPlayback = action
                  }
              }

              @Synchronized
              override fun notifyRestoreOutcome(requestId: Long?, outcome: RestoreOutcome) {
                  if (requestId == null) return
                  val current = currentRestoreProgress
                  if (current != null && current.requestId != requestId) {
                      L.i(
                          "Ignoring stale restore outcome request=$requestId outcome=$outcome " +
                              "active=${current.requestId}/${current.outcome}"
                      )
                      return
                  }
                  updateRestoreProgress(RestoreProgress(requestId, outcome))
              }

              private fun updateRestoreProgress(progress: RestoreProgress) {
                  if (currentRestoreProgress == progress) return
                  currentRestoreProgress = progress
                  L.i("Restore progress request=${progress.requestId} outcome=${progress.outcome}")
                  listeners.forEach { it.onRestoreProgressChanged(progress) }
              }

              @Synchronized
              override fun requestAction(stateHolder: PlaybackStateHolder) {''',
          )
          replace_once(
              manager,
              '''    private fun defaultShuffleScope(isShuffled: Boolean) =''',
              '''    private companion object {
                  val TERMINAL_RESTORE_OUTCOMES =
                      setOf(
                          RestoreOutcome.RESTORED_EXISTING_SESSION,
                          RestoreOutcome.FALLBACK_QUEUE_CREATED,
                          RestoreOutcome.NO_SAVED_SESSION,
                          RestoreOutcome.FAILED,
                          RestoreOutcome.CANCELLED,
                      )
              }

              private fun defaultShuffleScope(isShuffled: Boolean) =''',
          )

          exo = "app/src/main/java/org/oxycblt/auxio/playback/service/ExoPlaybackStateHolder.kt"
          replace_once(
              exo,
              '''import kotlinx.coroutines.CoroutineScope
              import kotlinx.coroutines.Dispatchers''',
              '''import kotlinx.coroutines.CancellationException
              import kotlinx.coroutines.CoroutineScope
              import kotlinx.coroutines.Dispatchers''',
          )
          replace_once(
              exo,
              '''import org.oxycblt.auxio.playback.state.RepeatMode
              import org.oxycblt.auxio.playback.state.ShuffleMode''',
              '''import org.oxycblt.auxio.playback.state.RepeatMode
              import org.oxycblt.auxio.playback.state.RestoreOutcome
              import org.oxycblt.auxio.playback.state.ShuffleMode''',
          )
          replace_once(
              exo,
              '''    private var rawFastResumeItem: RawFastResumeItem? = null
              private var pendingLibraryRestoreAfterRawFailure: DeferredPlayback.RestoreState? = null''',
              '''    private var rawFastResumeItem: RawFastResumeItem? = null
              private var rawFastResumeRestoreRequestId: Long? = null
              private var pendingLibraryRestoreAfterRawFailure: DeferredPlayback.RestoreState? = null
              private var currentRestoreJob: Job? = null''',
          )
          replace_regex(
              exo,
              r'''    override fun handleDeferred\(action: DeferredPlayback\): Boolean \{.*?
              \}

              private suspend fun findDeferredOpenSong''',
              r'''    override fun handleDeferred(action: DeferredPlayback): Boolean {
                  if (action is DeferredPlayback.RestoreState) {
                      currentRestoreJob?.cancel()
                      val requestId = action.requestId
                      Ts18FirstAudioLatency.mark("restore_request_received")
                      val library = musicRepository.library?.takeIf { !it.empty() }
                      if (library == null) {
                          L.d("Cached library not ready; attempting TS18 raw fast-resume snapshot")
                          playbackManager.notifyRestoreOutcome(
                              requestId,
                              RestoreOutcome.WAITING_FOR_LIBRARY,
                          )
                          return tryStartRawFastResume(action)
                      }
                      rawFastResumeItem?.let {
                          L.d("Library available after raw fast resume; attempting reconciliation")
                          reconcileRawFastResume(library)
                          return true
                      }
                      L.d("Restoring playback state from cached/loaded library")
                      currentRestoreJob = restoreScope.launch {
                          try {
                              val state = persistenceRepository.readState()
                              withContext(Dispatchers.Main) {
                                  if (state != null) {
                                      playbackManager.applySavedState(state, false)
                                      val shouldPlay = shouldPlayImmediately(action.play)
                                      if (shouldPlay) {
                                          playbackManager.playing(true)
                                      }
                                      playbackManager.notifyRestoreOutcome(
                                          requestId,
                                          RestoreOutcome.RESTORED_EXISTING_SESSION,
                                      )
                                  } else if (action.fallback != null) {
                                      playbackManager.playDeferred(action.fallback)
                                      playbackManager.notifyRestoreOutcome(
                                          requestId,
                                          RestoreOutcome.FALLBACK_QUEUE_CREATED,
                                      )
                                  } else {
                                      playbackManager.notifyRestoreOutcome(
                                          requestId,
                                          RestoreOutcome.NO_SAVED_SESSION,
                                      )
                                  }
                              }
                          } catch (e: CancellationException) {
                              throw e
                          } catch (e: Exception) {
                              L.e(e, "Unable to restore persisted playback state")
                              withContext(Dispatchers.Main) {
                                  playbackManager.notifyRestoreOutcome(
                                      requestId,
                                      RestoreOutcome.FAILED,
                                  )
                              }
                          }
                      }
                      return true
                  }

                  val library =
                      musicRepository.library?.takeIf { !it.empty() }
                          // No library, cannot do anything.
                          ?: return false

                  when (action) {
                      is DeferredPlayback.RestoreState -> return false
                      is DeferredPlayback.ShuffleAll -> {
                          L.d("Shuffling all tracks")
                          playbackManager.play(
                              requireNotNull(commandFactory.all(ShuffleMode.ON)) {
                                  "Invalid playback parameters"
                              },
                              shouldPlayImmediately(action.play),
                          )
                      }
                      is DeferredPlayback.Open -> {
                          L.d("Opening specified file")
                          restoreScope.launch {
                              val song = findDeferredOpenSong(action, library)
                              if (song == null) {
                                  L.w("Unable to resolve opened file ${action.uri}")
                                  return@launch
                              }
                              val command =
                                  requireNotNull(
                                      commandFactory.songFromAll(song, ShuffleMode.IMPLICIT)
                                  ) {
                                      "Invalid playback command"
                                  }
                              withContext(Dispatchers.Main) { playbackManager.play(command) }
                          }
                      }
                  }

                  return true
              }

              private suspend fun findDeferredOpenSong''',
          )
          replace_once(
              exo,
              '''    override fun newPlayback(command: PlaybackCommand, play: Boolean) {
                  rawFastResumeItem = null
