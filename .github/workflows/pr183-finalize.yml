name: PR 183 one-shot finalizer

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-finalize.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0
          persist-credentials: false

      - name: Apply incremental-pipeline hardening
        shell: bash
        run: python3 .github/pr183-finalize.py

      - name: Commit finalizer output
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete incremental pipeline hardening'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/cbkii/Auxio-TS.git"
          git pull --rebase origin cx/incremental-library-pipeline
          git push origin HEAD:cx/incremental-library-pipeline
