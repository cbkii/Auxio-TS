name: Execute PR 182 finalizer

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/pr182-run-finalizer.yml"

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/create-fast-interaction-startup-pr
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: false

      - name: Prepare dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Extract and run implementation patch
        id: implementation
        shell: bash
        run: |
          set +e
          {
            python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr182-finalizer.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('STOP: unable to locate finalizer Python block')

          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          extracted = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              extracted.append(line)

          repaired = []
          in_triple = False
          for line in extracted:
              delimiter_count = line.count("'''")
              if in_triple and delimiter_count == 0:
                  leading = len(line) - len(line.lstrip(' '))
                  if leading % 4 == 2:
                      line = (' ' * 10) + line
              repaired.append(line)
              if delimiter_count % 2 == 1:
                  in_triple = not in_triple

          script = '\n'.join(repaired) + '\n'
          script = script.replace(
              'import androidx.fragment.app.lifecycleScope',
              'import androidx.lifecycle.lifecycleScope',
          )
          script = script.replace(
              '            show(parentFragmentManager, entry.path)',
              '            FastStartFolderDialogFragment.show(parentFragmentManager, entry.path)',
          )
          script = script.replace(
              'favourites = favouritesPlaylist?.songs?.isNotEmpty() == true,\\n                tabType = homeModel.currentTabType.value,',
              'favourites = metadataState.favourites,\\n                tabType = homeModel.currentTabType.value,',
          )
          script = script.replace(
              'favourites = favouritesPlaylist?.songs?.isNotEmpty() == true,\\n                startupSongs = startupSongs,',
              'favourites = metadataState.favourites,\\n                startupSongs = startupSongs,',
          )
          script += r'''

# Final compile alignment discovered by the complete diagnostic pass.
replace_once(
    "app/src/main/java/org/oxycblt/auxio/MainFragment.kt",
    '        startupPanelCoordinator.updateState(\n            song,\n            playbackModel.restoreOutcome.value,\n            musicModel.startupReadinessState.value,\n        )\n',
    '        updateStartupPanelState()\n',
)
replace_once(
    "app/src/main/java/org/oxycblt/auxio/music/StartupReadinessController.kt",
    '        var latest = StartupReadinessState.ProcessVisible\n',
    '        var latest: StartupReadinessState = StartupReadinessState.ProcessVisible\n',
)
'''
          Path('/tmp/pr182-finalize.py').write_text(script, encoding='utf-8')
          PY
            extract_rc=$?
            if ((extract_rc != 0)); then
              exit "${extract_rc}"
            fi
            python3 -m py_compile /tmp/pr182-finalize.py
            python3 /tmp/pr182-finalize.py
          } 2>&1 | tee pr182-finalizer.log
          rc=${PIPESTATUS[0]}
          printf '\nFINALIZER_EXIT_CODE=%s\n' "${rc}" | tee -a pr182-finalizer.log
          exit "${rc}"

      - name: Upload finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr182-finalizer-diagnostics
          path: |
            pr182-finalizer.log
            /tmp/pr182-finalize.py
          if-no-files-found: warn
          retention-days: 3

      - name: Format modified sources
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply

      - name: Verify final implementation
        id: verification
        shell: bash
        run: |
          set +e
          {
            bash ./scripts/ci-gradle.sh \
              :musikr:compileDebugKotlin \
              :app:compileStandardDebugKotlin \
              :app:testStandardDebugUnitTest \
              :musikr:testDebugUnitTest \
              :app:lintStandardDebug \
              :app:assembleStandardDebug \
              --stacktrace
            gradle_rc=$?
            if ((gradle_rc != 0)); then
              exit "${gradle_rc}"
            fi
            bash ./scripts/check-headunit-compat-safety.sh || exit $?
            bash ./scripts/check-ts18-apk-reference-contracts.sh || exit $?
            bash ./scripts/check-dofun-topway-compat.sh || exit $?
            git diff --check || exit $?
          } 2>&1 | tee pr182-verification.log
          rc=${PIPESTATUS[0]}
          printf '\nVERIFICATION_EXIT_CODE=%s\n' "${rc}" | tee -a pr182-verification.log
          exit "${rc}"

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr182-verification-log
          path: pr182-verification.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove temporary workflows and commit
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          rm -f \
            .github/workflows/pr182-diagnostic.yml \
            .github/workflows/pr182-finalizer.yml \
            .github/workflows/pr182-dispatch-finalizer.yml \
            .github/workflows/pr182-run-finalizer.yml
          git add -A
          git commit -m "feat: complete PR1 fast interaction paths"
          git push origin HEAD:cx/create-fast-interaction-startup-pr
