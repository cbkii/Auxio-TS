name: Android Quality

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'musikr/**'
      - 'media/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/**'
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: pr165-review-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-reviewed-completion:
    if: github.head_ref == 'cx/investigate-and-implement-launch-to-currently-playing-panel'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply, format and verify reviewed patch
        id: apply
        continue-on-error: true
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessCheck

      - name: Commit reviewed completion and remove temporary hooks
        if: always()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          grep -q 'restoreRequestId' app/src/main/java/org/oxycblt/auxio/playback/StartupPlaybackPolicy.kt
          grep -q 'RestoreOutcome.NO_SAVED_SESSION' app/src/main/java/org/oxycblt/auxio/playback/StartupPlaybackPolicy.kt
          grep -q 'Warm return; preserving current playback and panel state' app/src/main/java/org/oxycblt/auxio/MainActivity.kt
          grep -q 'queueSheetBehavior.state == BackportBottomSheetBehavior.STATE_EXPANDED' app/src/main/java/org/oxycblt/auxio/MainFragment.kt
          test ! -e scripts/pr165-finalize-1.py
          test ! -e scripts/pr165-finalize-2a.py
          test ! -e scripts/pr165-finalize-2b.py

          git fetch origin "${BASE_BRANCH}"
          git checkout "origin/${BASE_BRANCH}" -- .github/workflows/lint.yml scripts/ci-gradle.sh
          rm -f .github/workflows/pr165-review-completion.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete durable startup routing contract'
          git push origin "HEAD:${HEAD_BRANCH}"
