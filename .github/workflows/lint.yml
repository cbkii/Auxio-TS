name: Android Quality

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches:
      - dev
      - "cx/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Workflow, product and safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
          submodules: false
          persist-credentials: false
      - name: Validate workflow YAML
        shell: bash
        run: ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml
      - name: Validate shell and Python syntax
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' f; do bash -n "$f" || status=1; done < <(find scripts -type f -name '*.sh' -print0)
          while IFS= read -r -d '' f; do python3 -m py_compile "$f" || status=1; done < <(find scripts -type f -name '*.py' -print0)
          exit "$status"
      - name: Self-test CI scope classifier
        run: bash ./scripts/ci-scope.sh --self-test
      - name: Check three-variant product contract
        run: bash ./scripts/check-product-contracts.sh
      - name: Check variant manifest isolation
        run: bash ./scripts/check-topway-manifest-components.sh
      - name: Check documentation authority and links
        run: python3 ./scripts/check-documentation-policy.py
      - name: Check Manual Release contracts
        run: bash ./scripts/check-manual-release-workflow.sh
      - name: Check head-unit compatibility safety
        run: bash ./scripts/check-headunit-compat-safety.sh
      - name: Check DoFun/Topway compatibility
        run: bash ./scripts/check-dofun-topway-compat.sh
      - name: Check native keep rules
        run: bash ./scripts/check-native-keep-rules.sh
      - name: Check version catalogue sync
        run: bash ./scripts/check-version-catalog-sync.sh

  gradle-quality:
    name: Formatting, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk_dir" ]] || { echo '::error::Android SDK unavailable'; exit 1; }
          printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Ensure native build tools
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Prepare CI environment
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build
      - name: Kotlin/C++ formatting and all variant unit/lint gates
        env:
          AUXIO_TS_CI_GRADLE_LOG: ${{ runner.temp }}/android-quality-gradle.log
        run: |
          bash ./scripts/ci-gradle.sh --continue \
            spotlessKotlinCheck \
            :app:testStandardDebugUnitTest \
            :app:testTopwayTwMediaDebugUnitTest \
            :app:testTopwayTwMusicDebugUnitTest \
            :musikr:testDebugUnitTest \
            :app:lintStandardDebug \
            :app:lintTopwayTwMediaDebug \
            :app:lintTopwayTwMusicDebug
          bash ./scripts/ci-gradle.sh spotlessCppCheck
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-quality-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            musikr/build/reports/**
            musikr/build/test-results/**
            build/reports/problems/**
            ${{ runner.temp }}/android-quality-gradle.log
          if-no-files-found: ignore
          retention-days: 7

  required-summary:
    name: Required quality gates
    if: always()
    needs: [static-contracts, gradle-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality gates
        env:
          STATIC: ${{ needs.static-contracts.result }}
          GRADLE: ${{ needs.gradle-quality.result }}
        run: |
          [[ "$STATIC" == success ]] || { echo "::error::Static contracts: $STATIC"; exit 1; }
          [[ "$GRADLE" == success ]] || { echo "::error::Gradle quality: $GRADLE"; exit 1; }
