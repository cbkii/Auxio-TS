name: Android Quality

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "app/**"
      - "musikr/**"
      - "startup-benchmark/**"
      - "media"
      - "media/**"
      - "build.gradle"
      - "settings.gradle"
      - ".gitmodules"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "NOTICE"
      - "eclipse-cdt.xml"
      - "scripts/**"
      - "ci/dependencies/**"
  pull_request:
    branches:
      - dev
      - "cx/**"
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "app/**"
      - "musikr/**"
      - "startup-benchmark/**"
      - "media"
      - "media/**"
      - "build.gradle"
      - "settings.gradle"
      - ".gitmodules"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "NOTICE"
      - "eclipse-cdt.xml"
      - "scripts/**"
      - "ci/dependencies/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-syntax:
    name: Workflow/script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml

      - name: Validate shell script syntax
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' script; do
            printf 'Checking %s\n' "${script}"
            if ! bash -n "${script}"; then
              status=1
            fi
          done < <(find scripts -type f -name '*.sh' -print0)
          exit "${status}"

      - name: Check manual release workflow
        shell: bash
        run: bash ./scripts/check-manual-release-workflow.sh

      - name: Validate Dependabot YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/dependabot.yml

      - name: Check version catalogue sync
        shell: bash
        run: bash ./scripts/check-version-catalog-sync.sh

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Detect format-relevant changes
        id: format_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run_spotless=true" >> "${GITHUB_OUTPUT}"
            echo "Manual dispatch: running the complete formatting check."
            exit 0
          fi

          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PR_BASE_SHA}"
              target_sha="${PR_HEAD_SHA}"
              comparison="${base_sha}...${target_sha}"
              ;;
            push)
              base_sha="${PUSH_BEFORE_SHA}"
              target_sha="${GITHUB_SHA}"
              comparison="${base_sha}..${target_sha}"
              ;;
            *)
              base_sha=""
              target_sha=""
              comparison=""
              ;;
          esac

          if [[ -z "${base_sha}" || -z "${target_sha}" || "${base_sha}" =~ ^0+$ ]] ||
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${target_sha}^{commit}" 2>/dev/null; then
            echo "run_spotless=true" >> "${GITHUB_OUTPUT}"
            echo "No trustworthy comparison range is available; running the complete formatting check."
            exit 0
          fi

          changed_files="$(git diff --name-only "${comparison}")"
          printf 'Formatting comparison: %s\n' "${comparison}"
          printf '%s\n' "${changed_files}"

          run_spotless=false
          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            case "${path}" in
              build.gradle|*/build.gradle|NOTICE|eclipse-cdt.xml)
                run_spotless=true
                break
                ;;
            esac
            if [[ "${path}" =~ ^[^/]+/src/.*\.(kt|cpp|h|hpp)$ ]]; then
              run_spotless=true
              break
            fi
          done <<< "${changed_files}"

          echo "run_spotless=${run_spotless}" >> "${GITHUB_OUTPUT}"
          if [[ "${run_spotless}" == "true" ]]; then
            echo "Kotlin/C++ sources or Spotless configuration changed."
          else
            echo "No files covered by the repository Spotless configuration changed."
          fi

      - name: Set up JDK 21
        if: steps.format_scope.outputs.run_spotless == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        if: steps.format_scope.outputs.run_spotless == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        if: steps.format_scope.outputs.run_spotless == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure native build tools are present
        if: steps.format_scope.outputs.run_spotless == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        if: steps.format_scope.outputs.run_spotless == 'true'
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Check formatting
        if: steps.format_scope.outputs.run_spotless == 'true'
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessCheck

      - name: Formatting not required
        if: steps.format_scope.outputs.run_spotless != 'true'
        shell: bash
        run: echo "Formatting check skipped because this change does not touch files covered by Spotless."

      - name: Upload formatting reports
        if: failure() && steps.format_scope.outputs.run_spotless == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-quality-format-reports
          path: build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile jvm-tests

      - name: Run unit tests
        shell: bash
        run: bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest :musikr:testDebugUnitTest

      - name: Upload unit-test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-quality-unit-test-reports
          path: |
            app/build/reports/tests/**
            musikr/build/reports/tests/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Run Android lint
        shell: bash
        run: bash ./scripts/ci-gradle.sh :app:lintStandardDebug

      - name: Upload Android lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-quality-lint-reports
          path: |
            app/build/reports/lint-results-*
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  headunit-safety:
    name: Head-unit safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run head-unit compatibility safety checks
        shell: bash
        run: |
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-headunit-compat-safety.sh
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-native-keep-rules.sh
