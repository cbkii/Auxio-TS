name: Android Quality

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "app/**"
      - "musikr/**"
      - "media"
      - "media/**"
      - "build.gradle"
      - "settings.gradle"
      - ".gitmodules"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "NOTICE"
      - "eclipse-cdt.xml"
      - "scripts/**"
      - "ci/dependencies/**"
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "app/**"
      - "musikr/**"
      - "media"
      - "media/**"
      - "build.gradle"
      - "settings.gradle"
      - ".gitmodules"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "NOTICE"
      - "eclipse-cdt.xml"
      - "scripts/**"
      - "ci/dependencies/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-syntax:
    name: Workflow/script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml

      - name: Validate shell script syntax
        shell: bash
        run: find scripts -type f -name '*.sh' -print -exec bash -n {} \;

      - name: Check manual release workflow
        shell: bash
        run: bash ./scripts/check-manual-release-workflow.sh

      - name: Validate Dependabot YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/dependabot.yml

      - name: Check version catalogue sync
        shell: bash
        run: bash ./scripts/check-version-catalog-sync.sh

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Check formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessCheck

      - name: Upload formatting reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-quality-format-reports
          path: build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile jvm-tests

      - name: Run unit tests
        shell: bash
        run: bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest :musikr:testDebugUnitTest

      - name: Upload unit-test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-quality-unit-test-reports
          path: |
            app/build/reports/tests/**
            musikr/build/reports/tests/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Run Android lint
        shell: bash
        run: bash ./scripts/ci-gradle.sh :app:lintStandardDebug

      - name: Upload Android lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-quality-lint-reports
          path: |
            app/build/reports/lint-results-*
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  headunit-safety:
    name: Head-unit safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run head-unit compatibility safety checks
        shell: bash
        run: |
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-headunit-compat-safety.sh
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-native-keep-rules.sh
