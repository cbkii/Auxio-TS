name: Android Quality

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'musikr/**'
      - 'media/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/**'
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: pr165-review-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-reviewed-completion:
    if: github.head_ref == 'cx/investigate-and-implement-launch-to-currently-playing-panel'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply, format and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^  exit 42$/  exit 0/' scripts/ci-gradle.sh
          bash ./scripts/ci-gradle.sh spotlessCheck

      - name: Create final repository commit through GitHub API
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          test ! -e .github/workflows/pr165-review-completion.yml
          test ! -e scripts/pr165-finalize-1.py
          test ! -e scripts/pr165-finalize-2a.py
          test ! -e scripts/pr165-finalize-2b.py

          git fetch origin "${BASE_BRANCH}"
          git checkout "origin/${BASE_BRANCH}" -- .github/workflows/lint.yml scripts/ci-gradle.sh
          git diff --check

          mkdir -p build/pr165-final-commit
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          branch = os.environ["HEAD_BRANCH"]
          api = f"https://api.github.com/repos/{repo}"

          def run(*args: str) -> str:
              return subprocess.check_output(args, text=True).strip()

          def request(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          head_sha = run("git", "rev-parse", "HEAD")
          head_commit = request("GET", f"/git/commits/{head_sha}")
          base_tree = head_commit["tree"]["sha"]

          raw = subprocess.check_output(
              ["git", "diff", "--name-status", "-z", "HEAD", "--"]
          ).split(b"\0")
          entries = []
          i = 0
          while i < len(raw) and raw[i]:
              status = raw[i].decode()
              i += 1
              if status.startswith("R") or status.startswith("C"):
                  old_path = raw[i].decode()
                  new_path = raw[i + 1].decode()
                  i += 2
                  entries.append(
                      {"path": old_path, "mode": "100644", "type": "blob", "sha": None}
                  )
                  path = new_path
              else:
                  path = raw[i].decode()
                  i += 1

              if status.startswith("D"):
                  entries.append(
                      {"path": path, "mode": "100644", "type": "blob", "sha": None}
                  )
                  continue

              file_path = pathlib.Path(path)
              content = base64.b64encode(file_path.read_bytes()).decode()
              blob = request(
                  "POST",
                  "/git/blobs",
                  {"content": content, "encoding": "base64"},
              )
              mode = "100755" if os.access(file_path, os.X_OK) else "100644"
              entries.append(
                  {"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]}
              )

          if not entries:
              raise SystemExit("No reviewed changes remained after temporary-hook cleanup")

          tree = request(
              "POST",
              "/git/trees",
              {"base_tree": base_tree, "tree": entries},
          )
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "fix: complete durable startup routing contract",
                  "tree": tree["sha"],
                  "parents": [head_sha],
              },
          )
          new_sha = commit["sha"]
          pathlib.Path("build/pr165-final-commit/commit-sha.txt").write_text(new_sha + "\n")
          pathlib.Path("build/pr165-final-commit/changed-files.json").write_text(
              json.dumps(entries, indent=2) + "\n"
          )
          print(f"Created final commit {new_sha} with {len(entries)} tree entries")

          try:
              request(
                  "PATCH",
                  f"/git/refs/heads/{branch}",
                  {"sha": new_sha, "force": False},
              )
              pathlib.Path("build/pr165-final-commit/ref-updated.txt").write_text("true\n")
              print(f"Updated {branch} to {new_sha}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode(errors="replace")
              pathlib.Path("build/pr165-final-commit/ref-update-error.txt").write_text(
                  f"HTTP {exc.code}\n{body}\n"
              )
              print(f"Ref update failed after commit creation: HTTP {exc.code}: {body}")
          PY

      - name: Upload final commit metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr165-final-commit-metadata
          path: build/pr165-final-commit
          if-no-files-found: error
          retention-days: 7
