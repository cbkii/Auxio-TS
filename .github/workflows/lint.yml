name: Android Quality

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr232-final-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-authority:
    name: PR 232 final authority
    if: github.event.pull_request.number == 232 && github.event.pull_request.head.ref == 'copilot/reintroduce-incremental-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: copilot/reintroduce-incremental-performance
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Prepare dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply reviewed Prompt 4 authority payload
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temporary-pr232-commit-guard.yml').read_text()
          marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(marker) + len(marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/pr232-final-authority.py').write_text(payload + '\n')
          PY
          python3 /tmp/pr232-final-authority.py

      - name: Correct exact-root regression expectations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          identity = Path('musikr/src/test/java/org/oxycblt/musikr/fs/SourceIdentityTest.kt')
          text = identity.read_text()
          text = text.replace(
              'import org.junit.Test\n\nclass SourceIdentityTest {',
              'import org.junit.Test\nimport org.junit.runner.RunWith\nimport org.robolectric.RobolectricTestRunner\nimport org.robolectric.annotation.Config\n\n@RunWith(RobolectricTestRunner::class)\n@Config(sdk = [29])\nclass SourceIdentityTest {',
          )
          identity.write_text(text)

          direct = Path('musikr/src/test/java/org/oxycblt/musikr/fs/direct/DirectFsTraversalTest.kt')
          text = direct.read_text()
          old = '''            val sourceKey = SourceIdentity.forLocation(location)

            val snapshot = directFs.sourceSnapshots().single()
'''
          new = '''            val sourceKey = SourceIdentity.forConfiguredRoot("DIRECT_FS", location)

            val snapshot = directFs.sourceSnapshots().single()
'''
          if text.count(old) != 1:
              raise SystemExit(f'STOP rejected-root identity anchor: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        val snapshot = directFs.sourceSnapshots().single()

        assertFalse(snapshot.available)
        assertEquals(null, snapshot.fingerprint)
        assertEquals(SourceFingerprintStrength.NONE, snapshot.fingerprintStrength)
        assertTrue(directFs.drainSourceFailures().containsKey(snapshot.sourceKey))
'''
          new = '''        val acceptedKey = SourceIdentity.forConfiguredRoot("DIRECT_FS", acceptedLocation)
        val rejectedKey = SourceIdentity.forConfiguredRoot("DIRECT_FS", rejectedLocation)
        val snapshots = directFs.sourceSnapshots().associateBy { it.sourceKey }

        assertEquals(2, snapshots.size)
        val acceptedSnapshot = requireNotNull(snapshots[acceptedKey])
        assertTrue(acceptedSnapshot.available)
        assertTrue(acceptedSnapshot.fingerprint != null)
        assertEquals(SourceFingerprintStrength.ADVISORY, acceptedSnapshot.fingerprintStrength)
        val rejectedSnapshot = requireNotNull(snapshots[rejectedKey])
        assertFalse(rejectedSnapshot.available)
        assertEquals(null, rejectedSnapshot.fingerprint)
        assertEquals(SourceFingerprintStrength.NONE, rejectedSnapshot.fingerprintStrength)
        val failures = directFs.drainSourceFailures()
        assertFalse(failures.containsKey(acceptedKey))
        assertTrue(failures.containsKey(rejectedKey))
'''
          if text.count(old) != 1:
              raise SystemExit(f'STOP independent-root expectation anchor: {text.count(old)}')
          direct.write_text(text.replace(old, new, 1))
          PY

      - name: Format Kotlin
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessKotlinApply

      - name: Run focused app and Musikr suites
        id: focused
        shell: bash
        run: |
          set +e
          bash ./scripts/ci-gradle.sh :app:testTopwayTwMediaDebugUnitTest :musikr:testDebugUnitTest 2>&1 | tee "${RUNNER_TEMP}/pr232-focused.log"
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Upload focused failure evidence
        if: failure() && steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr232-final-authority-failure
          path: |
            ${{ runner.temp }}/pr232-focused.log
            app/build/reports/**
            app/build/test-results/**
            musikr/build/reports/**
            musikr/build/test-results/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 7

      - name: Verify diff and remove orchestration
        if: success()
        shell: bash
        run: |
          git diff --check
          git fetch --no-tags --depth=1 origin dev
          git show FETCH_HEAD:.github/workflows/lint.yml > .github/workflows/lint.yml
          git rm -f .github/workflows/temporary-pr232-commit-guard.yml
          git rm -f .github/workflows/temporary-pr232-run-final-authority.yml
          test ! -e .github/workflows/temporary-pr232-commit-guard.yml
          test ! -e .github/workflows/temporary-pr232-run-final-authority.yml

      - name: Commit clean authority model
        if: success()
        shell: bash
        env:
          BRANCH: copilot/reintroduce-incremental-performance
        run: |
          git config user.name 'cbkii'
          git config user.email '150587541+cbkii@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete exact-root source authority'
          git push origin "HEAD:${BRANCH}"
