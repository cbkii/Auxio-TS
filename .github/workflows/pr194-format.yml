name: Temporary PR 194 formatting

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/pr194-format.yml"

permissions:
  contents: write

concurrency:
  group: pr194-format
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: perf/android10-code-health-20260723
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo "::error::Android SDK is unavailable"; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply repository formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply

      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/pr194-format.yml
          git add -- app musikr
          git diff --cached --check
          git commit -m "style: apply PR 194 repository formatting"
          git push origin HEAD:perf/android10-code-health-20260723
