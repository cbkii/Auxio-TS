name: PR 184 One-Shot Formatting

on:
  push:
    branches:
      - cx/startup-profiles-benchmarks
    paths:
      - .github/workflows/pr184-format-fix.yml

permissions:
  contents: write

concurrency:
  group: pr184-one-shot-formatting
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/startup-profiles-benchmarks
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: false

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply and verify repository formatting
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh spotlessApply
          bash ./scripts/ci-gradle.sh spotlessCheck
          git diff --check
          changed="$(git diff --name-only)"
          printf 'Formatter changed:\n%s\n' "${changed}"
          if grep -Eq '^\.github/workflows/' <<< "${changed}"; then
            echo "::error::Formatter unexpectedly modified a workflow file."
            exit 1
          fi

      - name: Commit and push formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- ':!.github/workflows/**'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No non-workflow formatting changes were required."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "style: apply final startup formatting"
          git push origin HEAD:cx/startup-profiles-benchmarks
