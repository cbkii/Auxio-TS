name: PR 258 identity ambiguity fix

on:
  push:
    branches:
      - fix/fast-resume-promotion-visualizer
    paths:
      - .github/workflows/pr258-identity-ambiguity-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/fast-resume-promotion-visualizer
          fetch-depth: 0
          submodules: recursive

      - name: Apply scoped source edit
        run: python3 .github/pr258-identity-fix.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Format Kotlin
        run: ./gradlew --no-daemon spotlessKotlinApply

      - name: Commit product fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/org/oxycblt/auxio/playback/service/ExoPlaybackStateHolder.kt \
            app/src/main/java/org/oxycblt/auxio/playback/service/PrimitiveQueuePromotionIdentityIndex.kt \
            app/src/test/java/org/oxycblt/auxio/playback/service/PrimitiveQueuePromotionIdentityIndexTest.kt
          git diff --cached --check
          git commit -m 'fix: reject ambiguous Fast Resume fallback identities'
          git push origin HEAD:fix/fast-resume-promotion-visualizer
