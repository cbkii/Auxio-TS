name: Apply genre playback fallback fix

on:
  push:
    branches:
      - fix/genre-playback-fallback

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded source and regression-test patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("app/src/main/java/org/oxycblt/auxio/playback/PlaybackViewModel.kt")
          source = source_path.read_text()

          old_doc = """     * @param genre The [Genre] to play from. Must be linked to the [Song]. If null, the user will\n     *   be prompted on what artist to play. Defaults to null.\n"""
          new_doc = """     * @param genre The [Genre] to play from. Must be linked to the [Song]. If null, the user will\n     *   be prompted on what genre to play. Defaults to null.\n"""
          if source.count(old_doc) != 1:
              raise SystemExit(f"expected exactly one genre KDoc target, found {source.count(old_doc)}")
          source = source.replace(old_doc, new_doc, 1)

          old_logic = """        L.d(\n            \"Cannot use given genre parameter for $song [$genre from ${song.genres}], showing choice dialog\"\n        )\n        startPlaybackDecision(PlaybackDecision.PlayFromArtist(song))\n"""
          new_logic = """        L.d(\n            \"Cannot use given genre parameter for $song [$genre from ${song.genres}], showing choice dialog\"\n        )\n        startPlaybackDecision(PlaybackDecision.PlayFromGenre(song))\n"""
          if source.count(old_logic) != 1:
              raise SystemExit(f"expected exactly one genre fallback target, found {source.count(old_logic)}")
          source_path.write_text(source.replace(old_logic, new_logic, 1))

          test_path = Path("app/src/test/java/org/oxycblt/auxio/playback/PlaybackViewModelFastResumeTest.kt")
          test = test_path.read_text()
          import_anchor = "import org.oxycblt.musikr.Album\n"
          if test.count(import_anchor) != 1:
              raise SystemExit("unexpected Song import anchor")
          test = test.replace(import_anchor, import_anchor + "import org.oxycblt.musikr.Song\n", 1)

          test_anchor = """    private fun assertPositionAdvances(model: PlaybackViewModel) {\n"""
          regression = """    @Test\n    fun unresolvedGenrePlaybackRequestsGenreDecision() {\n        val manager = FakePlaybackManager()\n        val model = newModel(manager.proxy)\n        val song: Song =\n            interfaceProxy { method, _ ->\n                when (method.name) {\n                    \"getGenres\", \"getArtists\" -> emptyList<Any>()\n                    else -> defaultValue(method)\n                }\n            }\n\n        model.playFromGenre(song)\n\n        val decision = model.playbackDecision.consume()\n        assertTrue(decision is PlaybackDecision.PlayFromGenre)\n        assertFalse(decision is PlaybackDecision.PlayFromArtist)\n        assertTrue((decision as PlaybackDecision.PlayFromGenre).song === song)\n    }\n\n"""
          if test.count(test_anchor) != 1:
              raise SystemExit("unexpected regression-test insertion anchor")
          if "unresolvedGenrePlaybackRequestsGenreDecision" in test:
              raise SystemExit("regression test already present")
          test_path.write_text(test.replace(test_anchor, regression + test_anchor, 1))
          PY

      - name: Bootstrap pinned build dependencies
        shell: bash
        run: bash scripts/bootstrap-dependencies.sh --profile full-build

      - name: Run focused playback regression test
        shell: bash
        run: >-
          bash scripts/ci-gradle.sh
          :app:testDebugUnitTest
          --tests org.oxycblt.auxio.playback.PlaybackViewModelFastResumeTest

      - name: Commit bounded fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-genre-playback-fallback.yml
          git status --short
          git add app/src/main/java/org/oxycblt/auxio/playback/PlaybackViewModel.kt \
                  app/src/test/java/org/oxycblt/auxio/playback/PlaybackViewModelFastResumeTest.kt \
                  .github/workflows/apply-genre-playback-fallback.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(playback): request genre decision for ambiguous genre"
          git push origin HEAD:fix/genre-playback-fallback
