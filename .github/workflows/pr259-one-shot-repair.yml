name: PR 259 one-shot handoff repair

on:
  push:
    branches:
      - fix/fast-resume-seamless-canonical-handoff

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/fast-resume-seamless-canonical-handoff
          fetch-depth: 0

      - name: Repair post-mutation handoff authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/org/oxycblt/auxio/playback/service/ExoPlaybackStateHolder.kt")
          lines = path.read_text().splitlines(keepends=True)
          marker = '"Canonical handoff did not preserve the current source " +'
          marker_indexes = [i for i, line in enumerate(lines) if marker in line]
          if len(marker_indexes) != 1:
              raise SystemExit(f"expected exactly one handoff validation marker, found {len(marker_indexes)}")

          marker_index = marker_indexes[0]
          return_indexes = [
              i
              for i in range(marker_index, min(marker_index + 12, len(lines)))
              if lines[i].strip() == "return false"
          ]
          if len(return_indexes) != 1:
              raise SystemExit(f"expected exactly one post-mutation return, found {len(return_indexes)}")

          return_index = return_indexes[0]
          indent = lines[return_index][:-len(lines[return_index].lstrip())]
          lines[return_index:return_index + 1] = [
              f"{indent}// Playlist edits have already committed. Returning to primitive authority here would\n",
              f"{indent}// desynchronise logical queue state from ExoPlayer; do not reset or re-seek live audio.\n",
              f"{indent}if (player.currentMediaItem?.song != null) {{\n",
              f"{indent}    canonicalCurrentSourceLease = null\n",
              f"{indent}}}\n",
          ]
          path.write_text("".join(lines))
          PY
          git diff --check

      - name: Commit repair and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr259-one-shot-repair.yml
          git add app/src/main/java/org/oxycblt/auxio/playback/service/ExoPlaybackStateHolder.kt
          git diff --cached --check
          git commit -m "fix(playback): keep handoff authority consistent"
          git push origin HEAD:fix/fast-resume-seamless-canonical-handoff
