name: PR 258 formatter temporary

on:
  push:
    branches:
      - fix/fast-resume-promotion-visualizer
    paths:
      - .github/workflows/pr258-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/fast-resume-promotion-visualizer
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Apply repository Spotless formatter
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.kt'
          git diff --cached --check
          git commit -m 'style: apply Spotless to PR 258'
          git push origin HEAD:fix/fast-resume-promotion-visualizer
