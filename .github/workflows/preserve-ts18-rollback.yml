name: Preserve TS18 rollback
on:
  push:
    branches: ["diagnostics/ts18-rollback-20261117"]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download existing signed assets and verify exact hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request, urllib.error
          assets = [{"id":745728870,"name":"Auxio-TS-TESTING-PR287-3c471f3.apk","size":7391534,"sha256":"59c7aa0cf55b662283a582dd2bce3bc72f53653a9dd99017809c7646c4cc520e"},{"id":752190254,"name":"Auxio-TS-TESTING-SHA-6b00bc1.apk","size":7424302,"sha256":"fb6f58216f561565d4b51f757855691545d5bb4682775cc885a16aa5642f18c0"},{"id":745729080,"name":"BUILD_INFO-PR287-3c471f3.txt","size":1734,"sha256":"1001956ff08e1cf595a30fcdb0684d84105b904418d2cf616e3b534b20670561"},{"id":752190566,"name":"BUILD_INFO-SHA-6b00bc1.txt","size":1341,"sha256":"aa9ee0b2eba5f7490b029fbe385616320e4feb7d1cbd679fa7d60ecea6f4578c"},{"id":745729054,"name":"SHA256SUMS-PR287-3c471f3.txt","size":386,"sha256":"5ca0ec1aa980368d83111c1ce6bd3ffb41fdf91e193824d3cd2ea33c4ee4bfaa"},{"id":752190489,"name":"SHA256SUMS-SHA-6b00bc1.txt","size":378,"sha256":"e42321c918a80fe91efe0626cc542b95de743aac1903c6961a44c605ae4c5a29"},{"id":745729012,"name":"SIGNER-PR287-3c471f3.txt","size":973,"sha256":"7c8d1cbac074d5163550fdcf7f56cb436b2ecf045211d7d8658c3868b091ef1c"},{"id":752190422,"name":"SIGNER-SHA-6b00bc1.txt","size":973,"sha256":"7c8d1cbac074d5163550fdcf7f56cb436b2ecf045211d7d8658c3868b091ef1c"}]
          out = pathlib.Path("rollback")
          out.mkdir()
          for a in assets:
              request = urllib.request.Request("https://api.github.com/repos/cbkii/Auxio-TS/releases/assets/" + str(a["id"]), headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/octet-stream", "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read(a["size"] + 1)
              except urllib.error.HTTPError as error:
                  raise SystemExit("Read-only archive blocked: " + str(error.code) + " " + error.read(1500).decode("utf-8", "replace"))
              assert len(data) == a["size"] and hashlib.sha256(data).hexdigest() == a["sha256"], a["name"]
              (out / a["name"]).write_bytes(data)
          (out / "SOURCE-ASSETS.json").write_text(json.dumps({"repository": "cbkii/Auxio-TS", "assets": assets}, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ts18-signed-rollback-before-remediation
          path: rollback/
          if-no-files-found: error
          retention-days: 30
