name: PR 184 Direct Task Discovery Run Identifier

on:
  push:
    branches:
      - automation/pr184-task-discovery2
    paths:
      - .github/workflows/pr184-task2-run-id.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: pr184-direct-task-run-id
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/pr184-task-discovery2
          fetch-depth: 0
          persist-credentials: true

      - name: Record workflow run identifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --branch automation/pr184-task-discovery2 \
            --workflow "PR 184 Direct Managed Device Task Discovery" \
            --limit 5 \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url \
            > .github/pr184-task2-runs.json
          cat .github/pr184-task2-runs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr184-task2-runs.json
          git commit -m "ci: record direct task-discovery run identifier"
          git fetch origin automation/pr184-task-discovery2
          git rebase origin/automation/pr184-task-discovery2
          git push origin HEAD:automation/pr184-task-discovery2
