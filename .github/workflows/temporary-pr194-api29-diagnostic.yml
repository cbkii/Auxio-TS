name: Temporary PR 194 API29 diagnostic

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/temporary-pr194-api29-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: temporary-pr194-api29-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AVD_NAME: auxio-api29-diagnostic
      ANDROID_API: "29"
      SYSTEM_IMAGE: system-images;android-29;google_apis;x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure isolated Android state
        shell: bash
        run: |
          printf 'ANDROID_USER_HOME=%s\n' "${RUNNER_TEMP}/android-user-home" >> "${GITHUB_ENV}"
          printf 'ANDROID_AVD_HOME=%s\n' "${RUNNER_TEMP}/android-avd-home" >> "${GITHUB_ENV}"

      - name: Configure Android SDK and emulator
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${sdk_root}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_root}" > local.properties
          sdkmanager_bin="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          avdmanager_bin="${sdk_root}/cmdline-tools/latest/bin/avdmanager"
          [[ -x "${sdkmanager_bin}" ]] || sdkmanager_bin="$(command -v sdkmanager || true)"
          [[ -x "${avdmanager_bin}" ]] || avdmanager_bin="$(command -v avdmanager || true)"
          if [[ ! -x "${sdkmanager_bin}" || ! -x "${avdmanager_bin}" ]]; then
            echo "::error::Android command-line tools are unavailable."
            exit 1
          fi
          yes | "${sdkmanager_bin}" --licenses >/dev/null 2>&1 || true
          "${sdkmanager_bin}" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-${ANDROID_API}" \
            "${SYSTEM_IMAGE}"
          emulator_bin="${sdk_root}/emulator/emulator"
          if [[ ! -x "${emulator_bin}" ]]; then
            echo "::error::Android emulator binary is unavailable."
            exit 1
          fi
          printf '%s\n' "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          printf 'AVDMANAGER_BIN=%s\n' "${avdmanager_bin}" >> "${GITHUB_ENV}"
          printf 'EMULATOR_BIN=%s\n' "${emulator_bin}" >> "${GITHUB_ENV}"

      - name: Create and start API 29 emulator
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          mkdir -p "${ANDROID_USER_HOME}" "${ANDROID_AVD_HOME}"
          touch "${ANDROID_USER_HOME}/repositories.cfg"
          printf 'no\n' | "${AVDMANAGER_BIN}" create avd \
            --force \
            -n "${AVD_NAME}" \
            -k "${SYSTEM_IMAGE}"
          nohup "${EMULATOR_BIN}" \
            -avd "${AVD_NAME}" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-save \
            -memory 2048 \
            -partition-size 2048 \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            >"${RUNNER_TEMP}/api29-emulator.log" 2>&1 &
          printf '%s\n' "$!" > "${RUNNER_TEMP}/api29-emulator.pid"
          adb start-server
          ready=0
          for attempt in $(seq 1 120); do
            if adb get-state 2>/dev/null | grep -Fxq device; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "${ready}" -ne 1 ]]; then
            tail -n 200 "${RUNNER_TEMP}/api29-emulator.log" || true
            exit 1
          fi
          booted=0
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [[ "${booted}" -ne 1 ]]; then
            tail -n 200 "${RUNNER_TEMP}/api29-emulator.log" || true
            exit 1
          fi
          sdk_value="$(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r')"
          [[ "${sdk_value}" == "${ANDROID_API}" ]] || {
            echo "::error::Expected API ${ANDROID_API}; got ${sdk_value:-<empty>}."
            exit 1
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Run connected tests and preserve output
        id: connected_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/ci-gradle.sh \
            :app:connectedStandardDebugAndroidTest \
            :musikr:connectedDebugAndroidTest \
            2>&1 | tee "${RUNNER_TEMP}/api29-gradle.log"

      - name: Upload diagnostic output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr194-api29-diagnostic
          path: |
            ${{ runner.temp }}/api29-gradle.log
            ${{ runner.temp }}/api29-emulator.log
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            musikr/build/reports/androidTests/**
            musikr/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when connected tests failed
        if: steps.connected_tests.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [[ -f "${RUNNER_TEMP}/api29-emulator.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/api29-emulator.pid")" >/dev/null 2>&1 || true
          fi
