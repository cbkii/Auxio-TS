name: Temporary Android 10 schema generation

on:
  push:
    branches:
      - perf/android10-code-health-20260723

permissions:
  contents: write

concurrency:
  group: temporary-android10-schema-generation
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[schema-bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write Android SDK locations
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: false

      - name: Ensure native build tools are present
        shell: bash
        run: |
          missing=()
          command -v ninja >/dev/null 2>&1 || missing+=(ninja-build)
          command -v unzip >/dev/null 2>&1 || missing+=(unzip)
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Apply exact code-health patches
        shell: bash
        run: python3 scripts/temporary_android10_schema_patch.py

      - name: Prepare current dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Generate current v72 Room schema
        shell: bash
        run: |
          rm -rf musikr/schemas
          bash ./scripts/ci-gradle.sh :musikr:kspDebugKotlin
          test -f musikr/schemas/org.oxycblt.musikr.cache.db.CacheDatabase/72.json

      - name: Generate historical v70 and v71 Room schemas
        shell: bash
        env:
          V70_COMMIT: 5c5e7c48222a37c40598c4206c1a10836b5bdd5f
          V71_COMMIT: 65a99f2e30efc77107c9eaa007a7edb953a63b34
        run: |
          generate_schema() {
            local version="$1"
            local commit="$2"
            local worktree="${RUNNER_TEMP}/auxio-schema-v${version}"
            git worktree add --detach "${worktree}" "${commit}"
            cp local.properties "${worktree}/local.properties"
            python3 - "${worktree}" "${version}" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          version = sys.argv[2]
          database = root / "musikr/src/main/java/org/oxycblt/musikr/cache/db/CacheDatabase.kt"
          text = database.read_text(encoding="utf-8")
          updated, replacements = re.subn(r"exportSchema\s*=\s*false", "exportSchema = true", text)
          if replacements != 1:
              raise SystemExit(f"Unexpected v{version} exportSchema declaration: {replacements}")
          if not re.search(rf"version\s*=\s*{re.escape(version)}(?:\D|$)", updated):
              raise SystemExit(f"Historical schema version mismatch for v{version}")
          database.write_text(updated, encoding="utf-8")

          build = root / "musikr/build.gradle"
          build_text = build.read_text(encoding="utf-8")
          marker = "\ndependencies {\n"
          if build_text.count(marker) != 1:
              raise SystemExit(f"Unexpected v{version} musikr build layout")
          schema_block = '''

          ksp {
              arg("room.schemaLocation", file("$projectDir/schemas").path)
          }
          '''
          build.write_text(build_text.replace(marker, schema_block + marker), encoding="utf-8")
          PY
            (
              cd "${worktree}"
              bash ./scripts/bootstrap-dependencies.sh --profile full-build
              bash ./scripts/ci-gradle.sh :musikr:kspDebugKotlin
              test -f "musikr/schemas/org.oxycblt.musikr.cache.db.CacheDatabase/${version}.json"
            )
            cp \
              "${worktree}/musikr/schemas/org.oxycblt.musikr.cache.db.CacheDatabase/${version}.json" \
              "musikr/schemas/org.oxycblt.musikr.cache.db.CacheDatabase/${version}.json"
            git worktree remove --force "${worktree}"
          }

          generate_schema 70 "${V70_COMMIT}"
          generate_schema 71 "${V71_COMMIT}"

      - name: Format and verify generated changes
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh spotlessApply
          for version in 70 71 72; do
            python3 -m json.tool \
              "musikr/schemas/org.oxycblt.musikr.cache.db.CacheDatabase/${version}.json" \
              >/dev/null
          done
          git diff --check

      - name: Commit generated schemas and patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/org/oxycblt/auxio/Auxio.kt \
            app/src/main/java/org/oxycblt/auxio/playback/ui/visualizer/VisualizerCoordinator.kt \
            musikr/src/main/java/org/oxycblt/musikr/cache/db/CacheDatabase.kt \
            musikr/schemas
          if git diff --cached --quiet; then
            echo "::error::Schema generation produced no tracked changes."
            exit 1
          fi
          git commit -m "build(room): export and verify migration schemas [schema-bot]"
          git push origin HEAD:perf/android10-code-health-20260723
