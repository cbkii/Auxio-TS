name: PR200 Comment Closure

on:
  push:
    branches:
      - agent/ts18-root-storage-fastpath
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr200-comment-closure
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'agent/ts18-root-storage-fastpath')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/ts18-root-storage-fastpath
          fetch-depth: 0
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_dir" || exit 2
          printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare repository dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply scoped closure patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          script = Path('scripts/tmp-pr200-comment-closure.py')
          text = script.read_text(encoding='utf-8')
          start = text.index('# Tests for command normalization and picker timeout budget.')
          test_path = text.index('path = "app/src/test/java/org/oxycblt/auxio/headunit/root/RootStorageCommandPolicyTest.kt"', start)
          next_path = text.index('path = "app/src/test/java/org/oxycblt/auxio/headunit/topway/TopwaySourcePolicyDiscoveryTest.kt"', test_path)
          text = text[:test_path] + text[next_path:]
          script.write_text(text, encoding='utf-8')
          PY
          python3 scripts/tmp-pr200-comment-closure.py > /tmp/pr200-closure-patch.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 - <<'PY' >> /tmp/pr200-closure-patch.log 2>&1
          from pathlib import Path
          path = Path('app/src/test/java/org/oxycblt/auxio/headunit/root/RootStorageCommandPolicyTest.kt')
          text = path.read_text(encoding='utf-8')
          old_path = '                "/mnt/media_rw/usbdisk0/Music\'s",\n'
          new_path = '                "\\\\mnt\\\\media_rw\\\\usbdisk0\\\\Music\'s",\n'
          old_assert = '        assertTrue(command.contains("Music\'\\"\'\\"\'s"))\n'
          new_assert = '        assertTrue(command.contains("/mnt/media_rw/usbdisk0/Music\'\\"\'\\"\'s"))\n'
          if text.count(old_path) != 1 or text.count(old_assert) != 1:
              raise SystemExit('RootStorageCommandPolicyTest normalization fixture did not match')
          path.write_text(text.replace(old_path, new_path).replace(old_assert, new_assert), encoding='utf-8')
          PY
            status=$?
          fi
          cat /tmp/pr200-closure-patch.log
          exit "$status"

      - name: Upload patch diagnostics
        if: steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr200-comment-closure-patch-log
          path: /tmp/pr200-closure-patch.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Remove temporary closure files
        shell: bash
        run: rm -f scripts/tmp-pr200-comment-closure.py .github/workflows/tmp-pr200-comment-closure.yml

      - name: Apply repository formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash ./scripts/ci-gradle.sh spotlessApply > /tmp/pr200-closure-format.log 2>&1
          status=$?
          cat /tmp/pr200-closure-format.log
          exit "$status"

      - name: Upload formatter diagnostics
        if: steps.format.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr200-comment-closure-format-log
          path: /tmp/pr200-closure-format.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after formatter failure
        if: steps.format.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Run focused validation
        shell: bash
        run: |
          git diff --check
          bash scripts/check-ts18-root-storage-fastpath.sh
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          (
            cd "$tmp_dir" || exit 2
            bash "$GITHUB_WORKSPACE/scripts/package-ts18-root-storage-helper.sh" relative-helper.zip
            test -f "$tmp_dir/relative-helper.zip"
            unzip -Z1 "$tmp_dir/relative-helper.zip" | sort > "$tmp_dir/entries.txt"
            diff -u <(printf '%s\n' customize.sh module.prop service.sh | sort) "$tmp_dir/entries.txt"
          )
          test ! -e scripts/tmp-pr200-comment-closure.py
          test ! -e .github/workflows/tmp-pr200-comment-closure.yml

      - name: Commit closure changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No closure delta produced' >&2; exit 1; }
          git commit -m 'fix(ts18): close PR200 review findings'
          git push origin HEAD:agent/ts18-root-storage-fastpath
