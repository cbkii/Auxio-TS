name: Temporary PR 194 API29 log fix

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/pr194-api29-log-fix.yml"

permissions:
  contents: write

concurrency:
  group: pr194-api29-log-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: perf/android10-code-health-20260723
          fetch-depth: 1

      - name: Persist API 29 Gradle failure output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          step = '      - name: Run API 29 compatibility and Room migration tests'
          step_indexes = [index for index, line in enumerate(lines) if line == step]
          if len(step_indexes) != 1:
              raise SystemExit(f'STOP: expected one API29 Gradle step, found {len(step_indexes)}')
          step_index = step_indexes[0]
          if lines[step_index + 1] != '        shell: bash':
              raise SystemExit('STOP: API29 Gradle step structure changed')
          if lines[step_index + 2].strip() == 'env:':
              raise SystemExit('STOP: API29 Gradle log environment is already present')
          lines[step_index + 2:step_index + 2] = [
              '        env:',
              '          AUXIO_TS_CI_GRADLE_LOG: ${{ runner.temp }}/api29-gradle.log',
          ]

          artifact = '            ${{ runner.temp }}/api29-emulator.log'
          artifact_indexes = [index for index, line in enumerate(lines) if line == artifact]
          if len(artifact_indexes) != 1:
              raise SystemExit(
                  f'STOP: expected one API29 emulator artifact line, found {len(artifact_indexes)}'
              )
          artifact_index = artifact_indexes[0]
          lines.insert(artifact_index + 1, '            ${{ runner.temp }}/api29-gradle.log')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Commit scoped CI diagnostic fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/pr194-api29-log-fix.yml
          git add -- .github/workflows/android.yml
          git diff --cached --check
          git commit -m "ci: preserve API 29 Gradle failure logs"
          git push origin HEAD:perf/android10-code-health-20260723
