name: PR 182 one-shot finalizer

on:
  push:
    branches:
      - cx/create-fast-interaction-startup-pr

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/create-fast-interaction-startup-pr
          fetch-depth: 0
          persist-credentials: true

      - name: Guard compatibility hydration against fresher scans
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt')
          text = path.read_text()
          old = '''    private fun startCompatibilityHydration() {
                  compatibilityHydrationJob?.cancel()
                  compatibilityHydrationJob =
                      compatibilityHydrationScope.launch {
                          try {
                              val cached = loadCachedLibrary()
                              synchronized(this@MusicRepositoryImpl) { library = cached }
                              withContext(Dispatchers.Main) {
                                  dispatchLibraryChange(device = true, user = true)
                                  if (cached.songs.isEmpty()) {
                                      emitStartupLibraryStatus(StartupLibraryStatus.Empty)
                                  } else {
                                      emitStartupLibraryStatus(StartupLibraryStatus.Usable)
                                      emitStartupReadinessState(StartupReadinessState.FullLibraryReady)
                                  }
                              }
                          } catch (e: CancellationException) {
                              throw e
                          } catch (e: Exception) {
                              L.w(e, "Compatibility cached-library hydration failed")
                              emitStartupLibraryStatus(StartupLibraryStatus.CacheUnavailable)
                          }
                      }
              }
          '''
          new = '''    private fun startCompatibilityHydration() {
                  compatibilityHydrationJob?.cancel()
                  val startingDeviceGeneration = deviceLibraryGeneration.get()
                  val startingRevision = musicSettings.revision
                  compatibilityHydrationJob =
                      compatibilityHydrationScope.launch {
                          try {
                              val cached = loadCachedLibrary()
                              withContext(Dispatchers.Main) {
                                  val accepted =
                                      synchronized(this@MusicRepositoryImpl) {
                                          val superseded =
                                              deviceLibraryGeneration.get() != startingDeviceGeneration ||
                                                  musicSettings.revision != startingRevision
                                          if (superseded) {
                                              false
                                          } else {
                                              library = cached
                                              true
                                          }
                                      }
                                  if (!accepted) {
                                      L.d("Skipping compatibility hydration superseded by a newer scan")
                                      return@withContext
                                  }
                                  dispatchLibraryChange(device = true, user = true)
                                  if (cached.songs.isEmpty()) {
                                      emitStartupLibraryStatus(StartupLibraryStatus.Empty)
                                  } else {
                                      emitStartupLibraryStatus(StartupLibraryStatus.Usable)
                                      emitStartupReadinessState(StartupReadinessState.FullLibraryReady)
                                  }
                              }
                          } catch (e: CancellationException) {
                              throw e
                          } catch (e: Exception) {
                              L.w(e, "Compatibility cached-library hydration failed")
                              emitStartupLibraryStatus(StartupLibraryStatus.CacheUnavailable)
                          }
                      }
              }
          '''
          if old not in text:
              raise SystemExit('Expected compatibility hydration block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Write local.properties
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare formatter dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply repository formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessApply

      - name: Remove one-shot workflow and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr182-finalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt \
                  app/src/main/java/org/oxycblt/auxio \
                  musikr/src/main/java/org/oxycblt/musikr \
                  app/src/test \
                  musikr/src/test \
                  .github/workflows/pr182-finalize-once.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Harden fast startup compatibility hydration'
          git push origin HEAD:cx/create-fast-interaction-startup-pr
