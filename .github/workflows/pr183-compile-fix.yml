name: PR 183 one-shot compile fix

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-compile-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0

      - name: Fix incremental cache schema
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          db = Path('musikr/src/main/java/org/oxycblt/musikr/cache/db/IncrementalDatabase.kt')
          text = db.read_text()
          replacement = '''internal data class PendingCachedFileData(
    val scanId: String,
    val sourceKey: String,
    val uri: String,
    val modifiedMs: Long,
    val addedMs: Long,
    val mimeType: String?,
    val durationMs: Long?,
    val bitrateKbps: Int?,
    val sampleRateHz: Int?,
    val musicBrainzId: String?,
    val name: String?,
    val sortName: String?,
    val track: Int?,
    val disc: Int?,
    val subtitle: String?,
    val date: org.oxycblt.musikr.tag.Date?,
    val albumMusicBrainzId: String?,
    val albumName: String?,
    val albumSortName: String?,
    val releaseTypes: List<String>?,
    val artistMusicBrainzIds: List<String>?,
    val artistNames: List<String>?,
    val artistSortNames: List<String>?,
    val albumArtistMusicBrainzIds: List<String>?,
    val albumArtistNames: List<String>?,
    val albumArtistSortNames: List<String>?,
    val genreNames: List<String>?,
    val replayGainTrackAdjustment: Float?,
    val replayGainAlbumAdjustment: Float?,
    val coverId: String?,
)'''
          text, count = re.subn(
              r'internal data class PendingCachedFileData\(.*?\n\)',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'pending entity replacements: {count}')
          db.write_text(text)

          store = Path('musikr/src/main/java/org/oxycblt/musikr/cache/db/IncrementalScanStore.kt')
          text = store.read_text()
          marker = '    private fun CommittedCachedRow.toCachedFile(): CachedFile {'
          conversion = '''    private fun PendingCachedFileData.toCachedFileData() =
        CachedFileData(
            uri = Uri.parse(uri),
            modifiedMs = modifiedMs,
            addedMs = addedMs,
            mimeType = mimeType,
            durationMs = durationMs,
            bitrateKbps = bitrateKbps,
            sampleRateHz = sampleRateHz,
            musicBrainzId = musicBrainzId,
            name = name,
            sortName = sortName,
            track = track,
            disc = disc,
            subtitle = subtitle,
            date = date,
            albumMusicBrainzId = albumMusicBrainzId,
            albumName = albumName,
            albumSortName = albumSortName,
            releaseTypes = releaseTypes,
            artistMusicBrainzIds = artistMusicBrainzIds,
            artistNames = artistNames,
            artistSortNames = artistSortNames,
            albumArtistMusicBrainzIds = albumArtistMusicBrainzIds,
            albumArtistNames = albumArtistNames,
            albumArtistSortNames = albumArtistSortNames,
            genreNames = genreNames,
            replayGainTrackAdjustment = replayGainTrackAdjustment,
            replayGainAlbumAdjustment = replayGainAlbumAdjustment,
            coverId = coverId,
        )

'''
          if marker not in text:
              raise SystemExit('conversion marker missing')
          if 'private fun PendingCachedFileData.toCachedFileData()' not in text:
              text = text.replace(marker, conversion + marker, 1)
          store.write_text(text)
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align pending incremental cache schema'
          git push origin HEAD:cx/incremental-library-pipeline
