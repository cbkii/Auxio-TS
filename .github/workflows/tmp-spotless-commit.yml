name: Temporary Spotless Commit

on:
  push:
    branches:
      - fix/fast-resume-seamless-canonical-handoff

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply and commit Kotlin formatting
        shell: bash
        run: |
          ./gradlew --no-daemon spotlessKotlinApply
          paths=(
            app/src/main/java/org/oxycblt/auxio/playback/service/ExoPlaybackStateHolder.kt
            app/src/main/java/org/oxycblt/auxio/playback/service/PrimitiveQueuePromotionPolicy.kt
          )
          git diff --check -- "${paths[@]}"
          if git diff --quiet -- "${paths[@]}"; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "style: apply Spotless formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
