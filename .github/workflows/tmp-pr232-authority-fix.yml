name: Temporary PR 232 authority repair

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: tmp-pr232-authority-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify isolated repair commits
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = "55ba44f21f657e08725e66394a7c565a152209d1"
          git merge-base --is-ancestor d1ab9d352f7bc7b50d23cf4917a3d0b05b0a86a3 HEAD
          actual="$(git diff --name-only d1ab9d352f7bc7b50d23cf4917a3d0b05b0a86a3 HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/scripts/tmp-pr232-authority-fix.py .github/workflows/tmp-pr232-authority-fix.yml | LC_ALL=C sort)"
          test "${actual}" = "${expected}"
          python3 -m py_compile .github/scripts/tmp-pr232-authority-fix.py

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Prepare pinned dependencies
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply focused authority patch
        shell: bash
        run: python3 .github/scripts/tmp-pr232-authority-fix.py

      - name: Align preserved unavailable-source regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("musikr/src/test/java/org/oxycblt/musikr/cache/db/IncrementalScanStoreTest.kt")
          text = path.read_text(encoding="utf-8")
          old = '''        assertEquals(setOf(usb1.sourceKey), next.reuseSourceKeys)
                  assertEquals(2, db.readDao().selectAllSongs().size)
          '''
          new = '''        assertEquals(setOf(usb0.sourceKey, usb1.sourceKey), next.reuseSourceKeys)
                  assertTrue(db.incrementalDao().sourceLedger(usb0.sourceKey)?.available == true)
                  assertEquals(2, store.compatibilityCachedFiles().toList().size)
                  assertEquals(2, db.readDao().selectAllSongs().size)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one unavailable-source assertion block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format Kotlin
        shell: bash
        run: bash ./scripts/ci-gradle.sh spotlessKotlinApply

      - name: Run focused Musikr tests
        shell: bash
        run: |
          set +e
          bash ./scripts/ci-gradle.sh :musikr:testDebugUnitTest \
            --tests org.oxycblt.musikr.cache.db.IncrementalScanStoreTest
          rc=$?
          if [[ ${rc} -ne 0 ]]; then
            echo '--- generated test context ---'
            nl -ba musikr/src/test/java/org/oxycblt/musikr/cache/db/IncrementalScanStoreTest.kt | sed -n '200,460p'
            echo '--- test XML ---'
            find musikr/build/test-results -type f -name '*.xml' -print -exec cat {} \; || true
          fi
          exit ${rc}

      - name: Run focused app tests
        shell: bash
        run: >-
          bash ./scripts/ci-gradle.sh :app:testTopwayTwMediaDebugUnitTest
          --tests org.oxycblt.auxio.music.IncrementalIndexPlannerTest
          --tests org.oxycblt.auxio.music.CoverCleanupPolicyTest

      - name: Remove temporary machinery and verify diff
        shell: bash
        run: |
          set -eu
          rm .github/scripts/tmp-pr232-authority-fix.py
          rm .github/workflows/tmp-pr232-authority-fix.yml
          git diff --check
          test -z "$(git status --short | grep -E '\.(apk|aab|zip|tar|gz|log)$' || true)"

      - name: Commit and push focused repair
        shell: bash
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete source-authoritative incremental lanes"
          git push origin HEAD:copilot/reintroduce-incremental-performance
