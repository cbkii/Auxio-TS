name: Harden visualizer PR once

on:
  push:
    branches:
    - fix-visualizer-10840476153597340699

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: fix-visualizer-10840476153597340699
        fetch-depth: 0
        token: ${{ github.token }}
    - name: Apply bounded lifecycle fixes
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path

        path = Path('app/src/main/java/org/oxycblt/auxio/playback/PlaybackPanelFragment.kt')
        text = path.read_text()

        old = 'viewLifecycleOwner.repeatOnLifecycle(androidx.lifecycle.Lifecycle.State.STARTED)'
        new = 'viewLifecycleOwner.repeatOnLifecycle(androidx.lifecycle.Lifecycle.State.RESUMED)'
        if text.count(old) != 1:
            raise SystemExit(f'expected one STARTED visualizer collector, found {text.count(old)}')
        text = text.replace(old, new, 1)

        old = '''                if (isGranted) {
                    updateVisualizerState()
                    if (coverPagerAdapter.itemCount > 0) {
                        coverPagerAdapter.notifyItemRangeChanged(0, coverPagerAdapter.itemCount)
                    }
                }
'''
        new = '''                if (isGranted) {
                    updateVisualizerState()
                    if (coverPagerAdapter.itemCount > 0) {
                        coverPagerAdapter.notifyItemRangeChanged(0, coverPagerAdapter.itemCount)
                    }
                } else {
                    releaseVisualizer()
                    playbackModel.updateVisualizerState(
                        VisualizerState.Failed("Permission denied")
                    )
                }
'''
        if text.count(old) != 1:
            raise SystemExit(f'expected one permission callback, found {text.count(old)}')
        text = text.replace(old, new, 1)

        old = '''        if (!hasPermission) {
            L.w("Visualizer not started: RECORD_AUDIO permission denied or not yet granted")
            playbackModel.updateVisualizerState(VisualizerState.Failed("Permission denied"))
            return // Will be requested in onResume if needed
        }
'''
        new = '''        if (!hasPermission) {
            L.w("Visualizer not started: RECORD_AUDIO permission denied or not yet granted")
            releaseVisualizer()
            playbackModel.updateVisualizerState(VisualizerState.Failed("Permission denied"))
            return // Will be requested in onResume if needed
        }
'''
        if text.count(old) != 1:
            raise SystemExit(f'expected one permission gate, found {text.count(old)}')
        path.write_text(text.replace(old, new, 1))
        PY
    - name: Prepare CI environment
      run: bash ./scripts/prepare-ci-environment.sh
    - uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"
    - name: Write local.properties for Android SDK
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        test -n "${sdk_dir}"
        printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
    - uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: true
    - name: Format, remove workflow, and push
      shell: bash
      env:
        AUXIO_TS_CI_GRADLE_TIMEOUT: 20m
      run: |
        set -euo pipefail
        bash ./scripts/ci-gradle.sh spotlessApply
        git rm .github/workflows/harden-visualizer-pr-once.yml
        git diff --check
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Harden visualizer lifecycle gating"
        git push origin HEAD:fix-visualizer-10840476153597340699
