        # Insert bounded watchdog constants in the existing class companion object.
        marker = '''    companion object {
'''
        if panel.count(marker) != 1:
            raise SystemExit(f'companion object: expected exactly one match, found {panel.count(marker)}')
        panel = panel.replace(
            marker,
            '''    companion object {
        private const val VISUALIZER_WATCHDOG_INTERVAL_MS = 250L
        private const val VISUALIZER_INITIAL_CALLBACK_TIMEOUT_MS = 1_500L
        private const val VISUALIZER_CALLBACK_STALL_TIMEOUT_MS = 1_500L
        private const val VISUALIZER_USABLE_FRAME_TIMEOUT_MS = 1_500L

''',
            1,
        )
        panel_path.write_text(panel)

        adapter_path = Path('app/src/main/java/org/oxycblt/auxio/playback/ui/swiper/CoverPagerAdapter.kt')
        adapter = adapter_path.read_text()
        for line in (
            'import android.os.SystemClock\n',
            'import kotlinx.coroutines.delay\n',
            'import kotlinx.coroutines.isActive\n',
        ):
            adapter = adapter.replace(line, '')

        old_block = '''            lifecycleOwner.repeatOnLifecycle(Lifecycle.State.STARTED) {
                launch {
                    playbackModel.visualizerState.collect { state ->
                        latestVisualizerState = state
                        updateActivePositionAndDispatch()
                    }
                }
                launch {
                    while (isActive) {
                        delay(FRESHNESS_CHECK_INTERVAL_MS)
                        val state = latestVisualizerState
                        if (
                            state is VisualizerState.Live &&
                                SystemClock.uptimeMillis() - state.receivedAtUptimeMs >
                                    LIVE_FRAME_FRESHNESS_MS
                        ) {
                            latestVisualizerState =
                                VisualizerState.Failed("Visualizer frame freshness expired")
                            updateActivePositionAndDispatch()
                        }
                    }
                }
            }
'''
        new_block = '''            lifecycleOwner.repeatOnLifecycle(Lifecycle.State.STARTED) {
                playbackModel.visualizerState.collect { state ->
                    latestVisualizerState = state
                    updateActivePositionAndDispatch()
                }
            }
'''
        adapter = replace_once(adapter, old_block, new_block, 'single adapter collector')
        adapter = replace_once(
            adapter,
            '''
    companion object {
        private const val LIVE_FRAME_FRESHNESS_MS = 1_500L
        private const val FRESHNESS_CHECK_INTERVAL_MS = 500L
    }
}
''',
            '''
}
''',
            'remove duplicate adapter freshness owner',
        )
        adapter_path.write_text(adapter)
        PY
    - name: Prepare CI environment
      run: bash ./scripts/prepare-ci-environment.sh
    - uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"
    - name: Write local.properties for Android SDK
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        test -n "${sdk_dir}"
        printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties
    - uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: true
    - name: Format, remove workflow, and push
      shell: bash
      env:
        AUXIO_TS_CI_GRADLE_TIMEOUT: 20m
      run: |
        set -euo pipefail
        bash ./scripts/ci-gradle.sh spotlessApply
        git rm .github/workflows/harden-visualizer-pr-once.yml
        git diff --check
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Harden visualizer capture lifecycle"
        git push origin HEAD:fix-visualizer-10840476153597340699
