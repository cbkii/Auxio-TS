name: Harden visualizer PR once

on:
  push:
    branches:
    - fix-visualizer-10840476153597340699

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: fix-visualizer-10840476153597340699
        fetch-depth: 0
        token: ${{ github.token }}
    - name: Apply bounded visualizer lifecycle hardening
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path

        panel_path = Path('app/src/main/java/org/oxycblt/auxio/playback/PlaybackPanelFragment.kt')
        panel = panel_path.read_text()

        def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'{label}: expected exactly one match, found {count}')
            return text.replace(old, new, 1)

        panel = replace_once(
            panel,
            '    private var visualizerPermissionLauncher: ActivityResultLauncher<String>? = null\n',
            '''    private var visualizerPermissionLauncher: ActivityResultLauncher<String>? = null
    private var visualizerGeneration = 0L
    private var visualizerWatchdogJob: kotlinx.coroutines.Job? = null
    private var visualizerCaptureStartedAtMs = 0L
    private var visualizerLastCallbackAtMs = 0L
    private var visualizerLastUsableFrameAtMs = 0L
''',
            'visualizer fields',
        )

        panel = replace_once(
            panel,
            '''                if (isGranted) {
                    updateVisualizerState()
                    if (coverPagerAdapter.itemCount > 0) {
                        coverPagerAdapter.notifyItemRangeChanged(0, coverPagerAdapter.itemCount)
                    }
                }
''',
            '''                if (isGranted) {
                    updateVisualizerState()
                    if (coverPagerAdapter.itemCount > 0) {
                        coverPagerAdapter.notifyItemRangeChanged(0, coverPagerAdapter.itemCount)
                    }
                } else {
                    releaseVisualizer()
                    playbackModel.updateVisualizerState(
                        VisualizerState.Failed("Permission denied")
                    )
                }
''',
            'permission callback',
        )

        panel = replace_once(
            panel,
            'viewLifecycleOwner.repeatOnLifecycle(androidx.lifecycle.Lifecycle.State.STARTED)',
            'viewLifecycleOwner.repeatOnLifecycle(androidx.lifecycle.Lifecycle.State.RESUMED)',
            'resumed session collector',
        )

        panel = replace_once(
            panel,
            '''    private fun releaseVisualizer() {
        val activeVisualizer = visualizer
''',
            '''    private fun releaseVisualizer() {
        visualizerGeneration++
        visualizerWatchdogJob?.cancel()
        visualizerWatchdogJob = null
        visualizerCaptureStartedAtMs = 0L
        visualizerLastCallbackAtMs = 0L
        visualizerLastUsableFrameAtMs = 0L
        val activeVisualizer = visualizer
''',
            'release generation cleanup',
        )

        panel = replace_once(
            panel,
            '''        if (!hasPermission) {
            L.w("Visualizer not started: RECORD_AUDIO permission denied or not yet granted")
            playbackModel.updateVisualizerState(VisualizerState.Failed("Permission denied"))
            return // Will be requested in onResume if needed
        }
''',
            '''        if (!hasPermission) {
            L.w("Visualizer not started: RECORD_AUDIO permission denied or not yet granted")
            releaseVisualizer()
            playbackModel.updateVisualizerState(VisualizerState.Failed("Permission denied"))
            return // Will be requested in onResume if needed
        }
''',
            'permission loss release',
        )

        panel = replace_once(
            panel,
            '''        if (visualizer == null) {
            playbackModel.updateVisualizerState(VisualizerState.WaitingForFrames)
            try {
                val candidate = Visualizer(sessionId)
''',
            '''        if (visualizer == null) {
            playbackModel.updateVisualizerState(VisualizerState.WaitingForFrames)
            var pendingCandidate: Visualizer? = null
            val generation = ++visualizerGeneration
            visualizerCaptureStartedAtMs = android.os.SystemClock.uptimeMillis()
            visualizerLastCallbackAtMs = 0L
            visualizerLastUsableFrameAtMs = 0L
            try {
                val candidate = Visualizer(sessionId)
                pendingCandidate = candidate
''',
            'transactional candidate start',
        )

        panel = replace_once(
            panel,
            '''                            ) {
                                if (++frameCount == 1) {
''',
            '''                            ) {
                                if (generation != visualizerGeneration) return
                                val receivedAtMs = android.os.SystemClock.uptimeMillis()
                                visualizerLastCallbackAtMs = receivedAtMs
                                if (++frameCount == 1) {
''',
            'callback generation guard',
        )

        panel = replace_once(
            panel,
            '''                                if (hasUsableData) {
                                    playbackModel.updateVisualizerState(
                                        VisualizerState.Live(
                                            fft.copyOf(),
                                            samplingRate,
                                            android.os.SystemClock.uptimeMillis(),
                                        )
                                    )
                                }
''',
            '''                                if (hasUsableData) {
                                    visualizerLastUsableFrameAtMs = receivedAtMs
                                    playbackModel.updateVisualizerState(
                                        VisualizerState.Live(
                                            fft.copyOf(),
                                            samplingRate,
                                            receivedAtMs,
                                        )
                                    )
                                }
''',
            'usable frame timestamp',
        )

        panel = replace_once(
            panel,
            '''                    try {
                        candidate.release()
                    } catch (e: RuntimeException) {
                        L.d(e, "Visualizer native release failed during partial initialization")
                    }
                    return
''',
            '''                    releaseVisualizerCandidate(candidate, "listener registration failure")
                    pendingCandidate = null
                    return
''',
            'listener failure cleanup',
        )

        panel = replace_once(
            panel,
            '''                visualizer = candidate
                visualizerSessionId = sessionId
                L.d(
''',
            '''                visualizer = candidate
                visualizerSessionId = sessionId
                pendingCandidate = null
                startVisualizerWatchdog(generation, sessionId)
                L.d(
''',
            'publish and watchdog',
        )

        panel = replace_once(
            panel,
            '''            } catch (e: RuntimeException) {
                val message =
''',
            '''            } catch (e: RuntimeException) {
                pendingCandidate?.let {
                    releaseVisualizerCandidate(it, "partial initialization failure")
                }
                val message =
''',
            'outer failure cleanup',
        )

        panel = replace_once(
            panel,
            '''    private fun updatePlaying(isPlaying: Boolean) {
''',
            '''    private fun releaseVisualizerCandidate(candidate: Visualizer, reason: String) {
        try {
            if (candidate.enabled) candidate.enabled = false
        } catch (e: RuntimeException) {
            L.d(e, "Visualizer disable failed during $reason")
        }
        try {
            candidate.setDataCaptureListener(null, 0, false, false)
        } catch (e: RuntimeException) {
            L.d(e, "Visualizer listener cleanup failed during $reason")
        }
        try {
            candidate.release()
        } catch (e: RuntimeException) {
            L.d(e, "Visualizer native release failed during $reason")
        }
    }

    private fun startVisualizerWatchdog(generation: Long, sessionId: Int) {
        visualizerWatchdogJob?.cancel()
        visualizerWatchdogJob =
            viewLifecycleOwner.lifecycleScope.launch {
                while (true) {
                    kotlinx.coroutines.delay(VISUALIZER_WATCHDOG_INTERVAL_MS)
                    if (
                        generation != visualizerGeneration || visualizerSessionId != sessionId
                    ) {
                        return@launch
                    }

                    val now = android.os.SystemClock.uptimeMillis()
                    val failureReason =
                        when {
                            visualizerLastCallbackAtMs == 0L &&
                                now - visualizerCaptureStartedAtMs >
                                    VISUALIZER_INITIAL_CALLBACK_TIMEOUT_MS ->
                                "Visualizer produced no callbacks"
                            visualizerLastCallbackAtMs > 0L &&
                                now - visualizerLastCallbackAtMs >
                                    VISUALIZER_CALLBACK_STALL_TIMEOUT_MS ->
                                "Visualizer callbacks stalled"
                            visualizerLastUsableFrameAtMs == 0L &&
                                now - visualizerCaptureStartedAtMs >
                                    VISUALIZER_USABLE_FRAME_TIMEOUT_MS ->
                                "Visualizer produced no usable frames"
                            visualizerLastUsableFrameAtMs > 0L &&
                                now - visualizerLastUsableFrameAtMs >
                                    VISUALIZER_USABLE_FRAME_TIMEOUT_MS ->
                                "Visualizer usable frames became stale"
                            else -> null
                        }

                    if (failureReason != null) {
                        L.w("$failureReason for session $sessionId generation $generation")
                        releaseVisualizer()
                        playbackModel.updateVisualizerState(VisualizerState.Failed(failureReason))
                        return@launch
                    }
                }
            }
    }

    private fun updatePlaying(isPlaying: Boolean) {
''',
            'cleanup and watchdog helpers',
        )

        panel = replace_once(
            panel,
            '''    private fun updatePager(queue: PagerQueue) {
''',
