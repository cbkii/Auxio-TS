name: Temporary WP4 and WP6 finalizer

on:
  push:
    branches:
      - feat/generated-playlists-and-grid-layout-12959696348616356066

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[wp46-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/generated-playlists-and-grid-layout-12959696348616356066
          fetch-depth: 0
          persist-credentials: false
      - name: Apply bounded final source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: replacements={count}')
              return updated

          cache = Path('musikr/src/main/java/org/oxycblt/musikr/cache/db/CacheDatabase.kt')
          text = cache.read_text(encoding='utf-8')
          if 'LibraryGeneratedPlaylistData::class' not in text:
              raise SystemExit('generated entity list anchor missing')
          text = text.replace('            LibraryGeneratedPlaylistData::class,\n', '', 1)
          text = text.replace('    version = 73,\n', '    version = 72,\n', 1)
          text = replace_once(
              text,
              r'\n        val MIGRATION_72_73 =.*?(?=\n        val MIGRATION_71_72 =)',
              '',
              'generated migration block',
              re.S,
          )
          text = text.replace(
              '.addMigrations(MIGRATION_70_71, MIGRATION_71_72, MIGRATION_72_73)',
              '.addMigrations(MIGRATION_70_71, MIGRATION_71_72)',
              1,
          )
          text = replace_once(
              text,
              r'\n@Entity\ninternal data class LibraryGeneratedPlaylistData\(.*?\n\)\n(?=\n@Entity)',
              '',
              'generated entity block',
              re.S,
          )
          if 'LibraryGeneratedPlaylistData' in text or 'MIGRATION_72_73' in text:
              raise SystemExit('generated Room authority remains')
          cache.write_text(text, encoding='utf-8')

          migration_test = Path(
              'musikr/src/test/java/org/oxycblt/musikr/cache/db/CacheMigrationAndBackfillTest.kt'
          )
          text = migration_test.read_text(encoding='utf-8')
          text = replace_once(
              text,
              r'\.addMigrations\(\s*CacheDatabase\.MIGRATION_70_71,\s*CacheDatabase\.MIGRATION_71_72,\s*CacheDatabase\.MIGRATION_72_73,?\s*\)',
              '.addMigrations(CacheDatabase.MIGRATION_70_71, CacheDatabase.MIGRATION_71_72)',
              'migration test list',
              re.S,
          )
          migration_test.write_text(text, encoding='utf-8')

          tab_keys = {
              'SongListFragment.kt': 'songSpanCount',
              'AlbumListFragment.kt': 'albumSpanCount',
              'ArtistListFragment.kt': 'artistSpanCount',
              'GenreListFragment.kt': 'genreSpanCount',
              'PlaylistListFragment.kt': 'playlistSpanCount',
          }
          base = Path('app/src/main/java/org/oxycblt/auxio/home/list')
          for filename, key in tab_keys.items():
              path = base / filename
              text = path.read_text(encoding='utf-8')
              text = text.replace('import androidx.recyclerview.widget.GridLayoutManager\n', '')
              text = replace_once(
                  text,
                  r'        fun updateSpanCount\(\) \{.*?\n        \}\n        listSettingsListener =',
                  f'''        fun updateSpanCount() {{
                          val finalSpanCount =
                              LibraryGridPolicy.effective(
                                  defaultValue = homeSettings.defaultSpanCount,
                                  overrideValue = listSettings.{key},
                              )
                          binding.homeRecycler.applyLibraryGridSpanCount(finalSpanCount)
                      }}
                      listSettingsListener =''',
                  f'{filename} span block',
                  re.S,
              )
              if filename == 'PlaylistListFragment.kt':
                  if 'import dagger.hilt.android.AndroidEntryPoint\n' not in text:
                      text = text.replace(
                          'import androidx.fragment.app.activityViewModels\n',
                          'import androidx.fragment.app.activityViewModels\nimport dagger.hilt.android.AndroidEntryPoint\n',
                          1,
                      )
                  if '@AndroidEntryPoint\nclass PlaylistListFragment :' not in text:
                      text = text.replace(
                          'class PlaylistListFragment :',
                          '@AndroidEntryPoint\nclass PlaylistListFragment :',
                          1,
                      )
              path.write_text(text, encoding='utf-8')

          detail = Path('app/src/main/java/org/oxycblt/auxio/detail/DetailViewModel.kt')
          text = detail.read_text(encoding='utf-8')
          text = replace_once(
              text,
              r'playlist\?\.let \{ it as\? org\.oxycblt\.musikr\.Playlist \}\?\.origin\s*==\s*org\.oxycblt\.musikr\.Playlist\.Origin\.GENERATED',
              'playlist?.parent?.origin == org.oxycblt.musikr.Playlist.Origin.GENERATED',
              'generated detail header',
              re.S,
          )
          detail.write_text(text, encoding='utf-8')

          menu = Path('app/src/main/java/org/oxycblt/auxio/list/menu/MenuDialogFragmentImpl.kt')
          text = menu.read_text(encoding='utf-8')
          text = replace_once(
              text,
              r'disabled\.addAll\(setOf\(R\.id\.action_rename, R\.id\.action_delete, R\.id\.action_import\)\)',
              '''disabled.addAll(
                          setOf(
                              R.id.action_rename,
                              R.id.action_delete,
                              R.id.action_import,
                              R.id.action_export,
                              R.id.action_share,
                          )
                      )''',
              'generated menu guard',
          )
          menu.write_text(text, encoding='utf-8')

          home = Path('app/src/main/java/org/oxycblt/auxio/home/HomeFragment.kt')
          text = home.read_text(encoding='utf-8')
          text = replace_once(
              text,
              r'    private fun playRecentlyAdded\(deferIfEmpty: Boolean = false\): Boolean \{.*?(?=\n    private fun playFavourites\(\): Boolean)',
              '''    private fun playRecentlyAdded(deferIfEmpty: Boolean = false): Boolean {
                  val playlist =
                      homeModel.playlistList.value.firstOrNull {
                          it.origin == Playlist.Origin.GENERATED &&
                              it.name.raw == "Recently added"
                      }
                  if (playlist?.songs?.isNotEmpty() != true) {
                      L.d("Ignoring Recently Added generated playlist with no committed songs")
                      if (deferIfEmpty) {
                          pendingEntryDestination = HeadUnitEntryPoints.EntryDestination.RECENTLY_ADDED
                      } else {
                          requireContext().showToast(R.string.msg_empty_recently_added)
                      }
                      return false
                  }
                  playbackModel.play(playlist)
                  openTab(MusicType.PLAYLISTS)
                  return true
              }
          ''',
              'Recently Added route',
              re.S,
          )
          home.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-wp46-finalize.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalizer changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalise generated playlists and grid layouts [wp46-finalized]'
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push https://github.com/${GITHUB_REPOSITORY}.git \
            HEAD:feat/generated-playlists-and-grid-layout-12959696348616356066
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
