name: Temporary WP4 and WP6 finalizer

on:
  push:
    branches:
      - feat/generated-playlists-and-grid-layout-12959696348616356066

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[wp46-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/generated-playlists-and-grid-layout-12959696348616356066
          fetch-depth: 0
          persist-credentials: false
      - name: Apply bounded final source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Generated playlists are derived from the one committed rich library. Remove the
          # incomplete metadata-only Room table so it cannot become a second authority.
          cache = Path('musikr/src/main/java/org/oxycblt/musikr/cache/db/CacheDatabase.kt')
          text = cache.read_text(encoding='utf-8')
          text = text.replace('            LibraryGeneratedPlaylistData::class,\n', '', 1)
          text = text.replace('    version = 73,\n', '    version = 72,\n', 1)
          text, migration_count = re.subn(
              r'''\n        val MIGRATION_72_73 =\n            Migration\(72, 73\) \{ database ->\n                database\.execSQL\(\n                    "CREATE TABLE IF NOT EXISTS LibraryGeneratedPlaylistData \(id INTEGER PRIMARY KEY AUTOINCREMENT NOT NULL, stableUid TEXT NOT NULL, name TEXT NOT NULL, nameSort TEXT NOT NULL, available INTEGER NOT NULL\)"\n                \)\n            \}\n''',
              '\n',
              text,
              count=1,
          )
          if migration_count != 1:
              raise SystemExit(f'generated migration removals={migration_count}')
          text = text.replace(
              '.addMigrations(MIGRATION_70_71, MIGRATION_71_72, MIGRATION_72_73)',
              '.addMigrations(MIGRATION_70_71, MIGRATION_71_72)',
              1,
          )
          text, entity_count = re.subn(
              r'''\n@Entity\ninternal data class LibraryGeneratedPlaylistData\(\n    @PrimaryKey\(autoGenerate = true\) val id: Long = 0,\n    val stableUid: String,\n    val name: String,\n    val nameSort: String,\n    val available: Boolean,\n\)\n''',
              '\n',
              text,
              count=1,
          )
          if entity_count != 1:
              raise SystemExit(f'generated entity removals={entity_count}')
          cache.write_text(text, encoding='utf-8')

          migration_test = Path(
              'musikr/src/test/java/org/oxycblt/musikr/cache/db/CacheMigrationAndBackfillTest.kt'
          )
          text = migration_test.read_text(encoding='utf-8')
          text = text.replace(
              '''                .addMigrations(
                          CacheDatabase.MIGRATION_70_71,
                          CacheDatabase.MIGRATION_71_72,
                          CacheDatabase.MIGRATION_72_73,
                      )''',
              '''                .addMigrations(CacheDatabase.MIGRATION_70_71, CacheDatabase.MIGRATION_71_72)''',
              1,
          )
          if 'MIGRATION_72_73' in text:
              raise SystemExit('stale MIGRATION_72_73 remains in migration test')
          migration_test.write_text(text, encoding='utf-8')

          # Preserve the first visible item and offset while changing only presentation span count.
          tab_keys = {
              'SongListFragment.kt': 'songSpanCount',
              'AlbumListFragment.kt': 'albumSpanCount',
              'ArtistListFragment.kt': 'artistSpanCount',
              'GenreListFragment.kt': 'genreSpanCount',
              'PlaylistListFragment.kt': 'playlistSpanCount',
          }
          base = Path('app/src/main/java/org/oxycblt/auxio/home/list')
          for filename, key in tab_keys.items():
              path = base / filename
              text = path.read_text(encoding='utf-8')
              text = text.replace('import androidx.recyclerview.widget.GridLayoutManager\n', '')
              pattern = re.compile(
                  r'''        fun updateSpanCount\(\) \{\n'''
                  rf'''            val spanCount = listSettings\.{key}\n'''
                  r'''            val finalSpanCount = if \(spanCount == 0\) homeSettings\.defaultSpanCount else spanCount\n'''
                  r'''            val layoutManager = binding\.homeRecycler\.layoutManager as\? GridLayoutManager\n'''
                  r'''            if \(layoutManager != null && layoutManager\.spanCount != finalSpanCount\) \{\n'''
                  r'''                layoutManager\.spanCount = finalSpanCount\n'''
                  r'''            \}\n'''
                  r'''        \}'''
              )
              replacement = f'''        fun updateSpanCount() {{
                          val finalSpanCount =
                              LibraryGridPolicy.effective(
                                  defaultValue = homeSettings.defaultSpanCount,
                                  overrideValue = listSettings.{key},
                              )
                          binding.homeRecycler.applyLibraryGridSpanCount(finalSpanCount)
                      }}'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{filename} span replacements={count}')
              if filename == 'PlaylistListFragment.kt':
                  if 'import dagger.hilt.android.AndroidEntryPoint\n' not in text:
                      text = text.replace(
                          'import androidx.fragment.app.activityViewModels\n',
                          'import androidx.fragment.app.activityViewModels\nimport dagger.hilt.android.AndroidEntryPoint\n',
                          1,
                      )
                  text = text.replace(
                      'class PlaylistListFragment :',
                      '@AndroidEntryPoint\nclass PlaylistListFragment :',
                      1,
                  )
              path.write_text(text, encoding='utf-8')

          detail = Path('app/src/main/java/org/oxycblt/auxio/detail/DetailViewModel.kt')
          text = detail.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''playlist\?\.let \{ it as\? org\.oxycblt\.musikr\.Playlist \}\?\.origin ==\n'''
              r'''\s+org\.oxycblt\.musikr\.Playlist\.Origin\.GENERATED'''
          )
          text, count = pattern.subn(
              '''playlist?.parent?.origin ==
                                  org.oxycblt.musikr.Playlist.Origin.GENERATED''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Detail generated header replacements={count}')
          detail.write_text(text, encoding='utf-8')

          menu = Path('app/src/main/java/org/oxycblt/auxio/list/menu/MenuDialogFragmentImpl.kt')
          text = menu.read_text(encoding='utf-8')
          old = 'disabled.addAll(setOf(R.id.action_rename, R.id.action_delete, R.id.action_import))'
          new = '''disabled.addAll(
                          setOf(
                              R.id.action_rename,
                              R.id.action_delete,
                              R.id.action_import,
                              R.id.action_export,
                              R.id.action_share,
                          )
                      )'''
          if old not in text:
              raise SystemExit('generated menu guard anchor missing')
          menu.write_text(text.replace(old, new, 1), encoding='utf-8')

          home = Path('app/src/main/java/org/oxycblt/auxio/home/HomeFragment.kt')
          text = home.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''    private fun playRecentlyAdded\(deferIfEmpty: Boolean = false\): Boolean \{\n'''
              r'''        val songs = homeModel\.songList\.value // Use actual generated playlist instead in the future\n'''
              r'''        if \(songs\.isEmpty\(\)\) \{\n'''
              r'''(?:.|\n)*?'''
              r'''        openTab\(MusicType\.SONGS\)\n'''
              r'''        return true\n'''
              r'''    \}'''
          )
          replacement = '''    private fun playRecentlyAdded(deferIfEmpty: Boolean = false): Boolean {
                  val playlist =
                      homeModel.playlistList.value.firstOrNull {
                          it.origin == Playlist.Origin.GENERATED &&
                              it.name.raw == "Recently added"
                      }
                  if (playlist?.songs?.isNotEmpty() != true) {
                      L.d("Ignoring Recently Added generated playlist with no committed songs")
                      if (deferIfEmpty) {
                          pendingEntryDestination = HeadUnitEntryPoints.EntryDestination.RECENTLY_ADDED
                      } else {
                          requireContext().showToast(R.string.msg_empty_recently_added)
                      }
                      return false
                  }
                  playbackModel.play(playlist)
                  openTab(MusicType.PLAYLISTS)
                  return true
              }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Home Recently Added replacements={count}')
          home.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-wp46-finalize.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalizer changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalise generated playlists and grid layouts [wp46-finalized]'
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push https://github.com/${GITHUB_REPOSITORY}.git \
            HEAD:feat/generated-playlists-and-grid-layout-12959696348616356066
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
