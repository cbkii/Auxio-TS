name: PR 184 completion apply

on:
  pull_request:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr184-completion-apply.yml

permissions:
  contents: write

concurrency:
  group: pr184-completion-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/startup-profiles-benchmarks
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Apply and validate audited completion payload
        shell: bash
        run: |
          encoded="${RUNNER_TEMP}/pr184-completion.b64"
          archive="${RUNNER_TEMP}/pr184-completion.tar.gz"
          cat .pr184-payload/part* > "${encoded}"
          test "$(wc -c < "${encoded}")" -eq 41940
          echo '890acf7f4f5a880f28557952e2fa84a758ff614cebbcebc5e5d12666d9b12d91  '"${encoded}" | sha256sum --check
          base64 --decode "${encoded}" > "${archive}"
          echo '4a5b7bd9f4ea03f62ad78aa5534e9d29591fa61d6435bab51aa96b88c50b4f31  '"${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${GITHUB_WORKSPACE}"
          chmod +x scripts/check-startup-performance-contracts.sh scripts/summarize-startup-benchmarks.py
          rm -rf .pr184-payload .github/workflows/pr184-completion-apply.yml
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml
          bash -n scripts/check-startup-performance-contracts.sh
          python3 -m py_compile scripts/summarize-startup-benchmarks.py
          bash scripts/check-startup-performance-contracts.sh
          git diff --check

      - name: Create completion commit
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: complete startup profile and benchmark hardening"
          sha="$(git rev-parse HEAD)"
          printf '%s\n' "${sha}" > "${RUNNER_TEMP}/completion-commit.txt"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Push completion commit
        id: push
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git push origin HEAD:cx/startup-profiles-benchmarks >"${RUNNER_TEMP}/push.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/push.log"
          printf '%s\n' "${status}" > "${RUNNER_TEMP}/push-status.txt"
          exit "${status}"

      - name: Upload handoff evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr184-completion-handoff
          path: |
            ${{ runner.temp }}/completion-commit.txt
            ${{ runner.temp }}/push-status.txt
            ${{ runner.temp }}/push.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail if push failed
        if: steps.push.outcome != 'success'
        shell: bash
        run: exit 1
