name: PR 238 focused review fix

on:
  push:
    branches:
      - fix/mediastore-source-authority-stale-rows
    paths:
      - .github/workflows/pr238-review-fix.yml

permissions:
  contents: write

concurrency:
  group: pr238-focused-review-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/mediastore-source-authority-stale-rows
          fetch-depth: 0

      - name: Apply verified no-work checkpoint fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/org/oxycblt/auxio/music/MusicRepository.kt')
          text = path.read_text()
          old = '.orEmpty() - (request.sourceKeys ?: emptySet())'
          new = '.orEmpty() - attemptedSourceKeys'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'STOP: expected exactly one no-work unresolved-key anchor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -- .github/workflows/pr238-review-fix.yml
          git diff --check
          test ! -e .github/workflows/pr238-review-fix.yml

      - name: Commit focused review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'STOP: no staged review fix' >&2; exit 1; }
          git commit -m "fix: clear observed MediaStore retry sources"
          git push origin HEAD:fix/mediastore-source-authority-stale-rows
