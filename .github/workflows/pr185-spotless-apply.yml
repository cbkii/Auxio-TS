name: PR 185 Spotless Apply

on:
  push:
    branches:
      - fix/ts18-topway-command-service

permissions:
  contents: write

concurrency:
  group: pr185-spotless-apply
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'cbkii/Auxio-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/ts18-topway-command-service
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Ensure native build tools are present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply and verify repository formatting
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci-gradle.sh spotlessApply
          bash ./scripts/ci-gradle.sh spotlessCheck
          git diff --check

      - name: Commit formatted sources and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git rm .github/workflows/pr185-spotless-apply.yml
          git diff --cached --check
          git commit -m "style(ts18): apply final Binder bridge formatting"
          git push origin HEAD:fix/ts18-topway-command-service
