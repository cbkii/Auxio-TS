# Temporary bounded evidence run for PR #184. Remove after all matrix jobs and artefacts are inspected.
name: Startup Evidence

on:
  push:
    branches:
      - cx/startup-profiles-benchmarks
    paths:
      - ".github/workflows/startup-evidence.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: startup-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  managed-device-evidence:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: profile-api35-500
            suite: baseline-profile
            device_token: pixel6Api35
            device_label: Pixel 6 API 35 AOSP managed emulator
            test_class: org.oxycblt.auxio.startupbenchmark.BaselineProfileGenerator
            fixture_song_count: "500"
          - label: macro-api29-500
            suite: macrobenchmark
            device_token: pixel2Api29
            device_label: Pixel 2 API 29 AOSP managed emulator
            test_class: org.oxycblt.auxio.startupbenchmark.StartupMacrobenchmark
            fixture_song_count: "500"
          - label: macro-api29-5000
            suite: macrobenchmark
            device_token: pixel2Api29
            device_label: Pixel 2 API 29 AOSP managed emulator
            test_class: org.oxycblt.auxio.startupbenchmark.StartupMacrobenchmark
            fixture_song_count: "5000"
          - label: macro-api29-20000
            suite: macrobenchmark
            device_token: pixel2Api29
            device_label: Pixel 2 API 29 AOSP managed emulator
            test_class: org.oxycblt.auxio.startupbenchmark.StartupMacrobenchmark
            fixture_song_count: "20000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Publish pending evidence status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ matrix.label }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"Managed-device startup evidence is running\",\"context\":\"startup-evidence/${LABEL}\"}"

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "${sdk_dir}" ]] || { echo "Android SDK path is unavailable" >&2; exit 1; }
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Validate startup contracts
        shell: bash
        run: bash ./scripts/check-startup-performance-contracts.sh

      - name: Resolve managed-device task
        id: task
        shell: bash
        env:
          DEVICE_TOKEN: ${{ matrix.device_token }}
        run: |
          tasks_file="${RUNNER_TEMP}/startup-evidence-tasks.txt"
          bash ./scripts/ci-gradle.sh :startup-benchmark:tasks --all --console=plain > "${tasks_file}"
          pattern="${DEVICE_TOKEN}.*Standard.*AndroidTest"
          task_name="$(awk '{print $1}' "${tasks_file}" | grep -Ei "^${pattern}$" | head -n 1 || true)"
          if [[ -z "${task_name}" ]]; then
            echo "No managed-device task matched ${pattern}" >&2
            grep -Ei 'pixel2Api29|pixel6Api35|AndroidTest' "${tasks_file}" >&2 || true
            exit 1
          fi
          echo "name=${task_name}" >> "${GITHUB_OUTPUT}"
          echo "Resolved :startup-benchmark:${task_name}"

      - name: Run managed-device suite
        shell: bash
        env:
          TASK_NAME: ${{ steps.task.outputs.name }}
          TEST_CLASS: ${{ matrix.test_class }}
          FIXTURE_SONG_COUNT: ${{ matrix.fixture_song_count }}
          SUITE: ${{ matrix.suite }}
          DEVICE_LABEL: ${{ matrix.device_label }}
        run: |
          mkdir -p startup-benchmark/build/reports/startup-performance
          set -o pipefail
          bash ./scripts/ci-gradle.sh \
            ":startup-benchmark:${TASK_NAME}" \
            -Pandroid.testInstrumentationRunnerArguments.class="${TEST_CLASS}" \
            -Pandroid.testInstrumentationRunnerArguments.auxio.fixtureSongCount="${FIXTURE_SONG_COUNT}" \
            -Pandroid.testInstrumentationRunnerArguments.auxio.iterations=3 2>&1 |
            tee startup-benchmark/build/reports/startup-performance/managed-device.log
          {
            echo "commit=${GITHUB_SHA}"
            echo "variant=standardBenchmark"
            echo "suite=${SUITE}"
            echo "testClass=${TEST_CLASS}"
            echo "fixtureSongCount=${FIXTURE_SONG_COUNT}"
            echo "sourceCount=2"
            echo "fixtureSchema=2"
            echo "fixtureSeed=18022026"
            echo "iterations=3"
            echo "warmups=AndroidX framework-managed"
            echo "retries=0"
            echo "exclusions=none"
            echo "device=${DEVICE_LABEL}"
            echo "compilationModes=None,Partial(BaselineProfile Require)"
            echo "evidence=Observed on managed emulator only"
            echo "exactTs18=Requires device validation"
          } > startup-benchmark/build/benchmark-context.txt

      - name: Validate generated profiles
        if: matrix.suite == 'baseline-profile'
        shell: bash
        run: |
          mapfile -t profiles < <(
            find startup-benchmark/build/outputs -type f \
              \( -name '*baseline-prof.txt' -o -name '*startup-prof.txt' \) | sort
          )
          if ((${#profiles[@]} < 2)); then
            echo "Expected generated Baseline and Startup Profiles" >&2
            find startup-benchmark/build/outputs -type f -print >&2 || true
            exit 1
          fi
          bash ./scripts/check-startup-performance-contracts.sh "${profiles[@]}"
          printf '%s\n' "${profiles[@]}" > startup-benchmark/build/reports/startup-performance/generated-profiles.txt

      - name: Summarise macrobenchmark metrics
        if: matrix.suite == 'macrobenchmark'
        shell: bash
        run: |
          python3 scripts/summarize-startup-benchmarks.py \
            --input-root startup-benchmark/build/outputs \
            --context startup-benchmark/build/benchmark-context.txt \
            --output startup-benchmark/build/reports/startup-performance/summary.md \
            --require-results
          cat startup-benchmark/build/reports/startup-performance/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startup-evidence-${{ matrix.label }}-${{ github.run_number }}
          path: |
            startup-benchmark/build/outputs/**
            startup-benchmark/build/reports/**
            startup-benchmark/build/benchmark-context.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Write evidence summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LABEL: ${{ matrix.label }}
          DEVICE_LABEL: ${{ matrix.device_label }}
          FIXTURE_SONG_COUNT: ${{ matrix.fixture_song_count }}
          SUITE: ${{ matrix.suite }}
        run: |
          {
            echo "## ${LABEL}"
            echo
            echo "- Result: \`${JOB_STATUS}\`"
            echo "- Suite: \`${SUITE}\`"
            echo "- Fixture songs: \`${FIXTURE_SONG_COUNT}\` across two sources"
            echo "- Iterations: \`3\`"
            echo "- Environment: ${DEVICE_LABEL}"
            echo "- Exact TS18 runtime behaviour: Requires device validation"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish final evidence status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ matrix.label }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description="Managed-device startup evidence failed"
          if [[ "${JOB_STATUS}" == "success" ]]; then
            state=success
            description="Managed-device startup evidence passed"
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"${description}\",\"context\":\"startup-evidence/${LABEL}\"}"
