  if result="$(python3 - "$manifest_file" <<'PY'
import sys
import xml.etree.ElementTree as ET

ANDROID = "{http://schemas.android.com/apk/res/android}"
root = ET.parse(sys.argv[1]).getroot()
application = root.find("application")
if application is None:
    raise SystemExit("missing application element")

def attr(element, name):
    return element.attrib.get(ANDROID + name)

aliases = [
    alias
    for alias in application.findall("activity-alias")
    if attr(alias, "name") == "com.tw.music.MusicActivity"
]
if len(aliases) != 1:
    raise SystemExit(f"expected one com.tw.music.MusicActivity alias, found {len(aliases)}")
alias = aliases[0]
expected_target = "org.oxycblt.auxio.car.overlay.TopwayMusicEntryActivity"
if attr(alias, "targetActivity") != expected_target:
    raise SystemExit(
        f"alias target expected {expected_target}, got {attr(alias, 'targetActivity')!r}"
    )

actions = set()
categories = set()
for intent_filter in alias.findall("intent-filter"):
    actions.update(attr(item, "name") for item in intent_filter.findall("action"))
    categories.update(attr(item, "name") for item in intent_filter.findall("category"))
required_actions = {
    "android.intent.action.MAIN",
    "android.intent.action.MUSIC_PLAYER",
    "android.intent.action.VIEW",
}
required_categories = {
    "android.intent.category.DEFAULT",
    "android.intent.category.LAUNCHER",
    "android.intent.category.APP_MUSIC",
    "android.intent.category.BROWSABLE",
}
missing_actions = required_actions - actions
missing_categories = required_categories - categories
if missing_actions:
    raise SystemExit(f"alias missing actions: {sorted(missing_actions)}")
if missing_categories:
    raise SystemExit(f"alias missing categories: {sorted(missing_categories)}")

main_activities = [
    activity
    for activity in application.findall("activity")
    if attr(activity, "name") == "org.oxycblt.auxio.MainActivity"
]
if len(main_activities) != 1:
    raise SystemExit(f"expected one MainActivity declaration, found {len(main_activities)}")
if attr(main_activities[0], "exported") != "false":
    raise SystemExit("MainActivity must be exported=false in Topway manifests")

print("alias/router/full-player mapping is valid")
PY
)"; then
    pass "${label} ${result}"
  else
    fail "${label} mapping invalid: ${result}"
  fi
}

