                                error,
                                "EQ/DSP candidate not found after resolution: ${candidate.label}",
                            )
                        is SecurityException ->
                            L.w(error, "EQ/DSP candidate denied: ${candidate.label}")
                        else ->
                            L.w(error, "EQ/DSP candidate failed at launch: ${candidate.label}")
                    }
                }
