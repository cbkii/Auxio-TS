    - name: Validate patch path scope before repository code
      shell: bash
      run: |
        set -euo pipefail
        allowed="$(mktemp)"
        actual="$(mktemp)"
        cat > "${allowed}" <<'EOF'
        app/src/main/java/org/oxycblt/auxio/headunit/root/dofun/Ts18DofunIntegrationResolver.kt
        app/src/main/java/org/oxycblt/auxio/headunit/topway/TopwayEqualizerLauncher.kt
        app/src/main/java/org/oxycblt/auxio/playback/PlaybackPanelFragment.kt
        app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/CarFloatingControlsService.kt
        app/src/topwayCompat/java/org/oxycblt/auxio/car/overlay/TopwayMusicEntryActivity.kt
        app/src/topwayCompatTest/java/org/oxycblt/auxio/car/overlay/TopwayMusicEntryPolicyTest.kt
        app/src/topwayCompatTest/java/org/oxycblt/auxio/headunit/topway/TopwayEqualizerExactDeviceTest.kt
        docs/TS18_V605_RUNTIME_REGRESSION_FIXES.md
        scripts/check-dofun-topway-compat.sh
        EOF
        git diff --name-only | sort -u > "${actual}"
        sort -u -o "${allowed}" "${allowed}"
        if ! diff -u "${allowed}" "${actual}"; then
          echo '::error::Patch changed files outside the audited allow-list or missed an expected file.'
          exit 1
        fi
        git diff --check

