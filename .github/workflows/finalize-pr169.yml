name: Finalize PR 169 review fixes

on:
  push:
    branches:
      - fix/ts18-runtime-regressions-v605
    paths:
      - '.github/workflows/finalize-pr169.yml'

permissions:
  contents: write

concurrency:
  group: finalize-pr169
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'cbkii/Auxio-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout PR branch without persisted credentials
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: fix/ts18-runtime-regressions-v605
        fetch-depth: 0
        submodules: false
        persist-credentials: false

    - name: Set up JDK 21
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
      with:
        java-version: '21'
        distribution: temurin

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      with:
        cache-read-only: true

    - name: Write local.properties
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [[ -z "${sdk_dir}" ]]; then
          echo '::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set.'
          exit 1
        fi
        printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

    - name: Prepare full build dependencies
      shell: bash
      run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

    - name: Apply audited exact-match fixes
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path

        def replace_exact(path: str, old: str, new: str) -> None:
            file = Path(path)
            text = file.read_text(encoding="utf-8")
            count = text.count(old)
            if count != 1:
                raise SystemExit(f"{path}: expected exactly one match, found {count}")
            file.write_text(text.replace(old, new, 1), encoding="utf-8")

        replace_exact(
