name: Temporary PR191 pull-request kick

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: temporary-pr191-pull-request-kick
  cancel-in-progress: true

jobs:
  apply-hardening:
    if: ${{ github.head_ref == 'fix/pr191-review-hardening-20260722' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/pr191-review-hardening-20260722
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Extract and run reviewed patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          source_workflow='.github/workflows/temporary-pr191-review-hardening.yml'
          patch_script="${RUNNER_TEMP}/pr191-review-hardening.py"
          patch_log="${RUNNER_TEMP}/pr191-review-hardening.log"
          awk '
            /^[[:space:]]*python3 <<'\''PY'\''$/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' "${source_workflow}" > "${patch_script}"
          python3 - "${patch_script}" <<'PATCH_FIX'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          replacements = {
              "                candidates.addAll(discoveredRoots.filter { it in savedPaths })":
                  "            candidates.addAll(discoveredRoots.filter { it in savedPaths })",
              "                // persisted file:/// root retains the same authority as its raw path.":
                  "            // persisted file:/// root retains the same authority as its raw path.",
              "                candidates.addAll(discoveredRoots.filter { it.trimEnd('/') in savedRoots })":
                  "            candidates.addAll(discoveredRoots.filter { it.trimEnd('/') in savedRoots })",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Embedded patch normalisation target missing: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PATCH_FIX

          patch_rc=0
          {
            test -s "${patch_script}"
            python3 -m py_compile "${patch_script}"
            python3 "${patch_script}"
          } >"${patch_log}" 2>&1 || patch_rc=$?

          if ((patch_rc != 0)); then
            git reset --hard HEAD
            cp "${patch_log}" .github/pr191-hardening-error.txt
            git add .github/pr191-hardening-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ci: record PR191 hardening failure'
            auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              push https://github.com/${GITHUB_REPOSITORY}.git \
              HEAD:fix/pr191-review-hardening-20260722
            cat "${patch_log}"
            exit "${patch_rc}"
          fi

          rm -f \
            .github/pr191-hardening-error.txt \
            .github/workflows/temporary-pr191-review-hardening.yml \
            .github/workflows/temporary-pr191-pr-kick.yml
          git diff --check

      - name: Commit and push final hardening
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch='fix/pr191-review-hardening-20260722'
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden playback and configured-source integration [pr191-hardening-finished]'
          auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push https://github.com/${GITHUB_REPOSITORY}.git HEAD:"${branch}"
