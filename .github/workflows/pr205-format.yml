name: PR 205 formatting

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pr205-format.yml'
      - 'app/src/**/*.kt'
      - 'musikr/src/**/*.kt'

permissions:
  contents: write

concurrency:
  group: pr205-format-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - name: Write Android SDK location
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Prepare pinned dependencies
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply Spotless formatting
        id: spotless
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --console=plain spotlessApply > spotless-apply.log 2>&1
          rc=$?
          cat spotless-apply.log
          printf 'rc=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload Spotless diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr205-spotless-apply
          path: spotless-apply.log
          if-no-files-found: error
          retention-days: 2

      - name: Remove temporary workflow and push formatting
        if: steps.spotless.outcome == 'success'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -- .github/workflows/pr205-format.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'STOP: expected temporary workflow deletion was not staged' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply PR 205 repository formatting'
          git push origin "HEAD:${BRANCH}"

      - name: Fail after preserving diagnostics
        if: steps.spotless.outcome == 'failure'
        run: |
          echo "Spotless failed with status ${{ steps.spotless.outputs.rc }}" >&2
          exit 1
