name: PR 205 formatting

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pr205-format.yml'
      - 'app/src/**/*.kt'
      - 'musikr/src/**/*.kt'

permissions:
  contents: write

concurrency:
  group: pr205-format-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - name: Write Android SDK location
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Prepare pinned dependencies
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Isolate canonical formatting targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/lint.yml')
          text = path.read_text(encoding='utf-8')
          old = "        run: bash ./scripts/ci-gradle.sh spotlessCheck\n"
          new = """        env:
                    EVENT_NAME: ${{ github.event_name }}
                    PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                    PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                    PUSH_BEFORE_SHA: ${{ github.event.before }}
                  run: |
                    set -euo pipefail
                    tasks=(spotlessKotlinCheck)

                    case "${EVENT_NAME}" in
                      workflow_dispatch)
                        tasks+=(spotlessCppCheck)
                        ;;
                      pull_request)
                        comparison="${PR_BASE_SHA}...${PR_HEAD_SHA}"
                        ;;
                      push)
                        comparison="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
                        ;;
                      *)
                        comparison=""
                        ;;
                    esac

                    if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
                      if [[ -z "${comparison:-}" ]] ||
                         ! git cat-file -e "${comparison%%.*}^{commit}" 2>/dev/null; then
                        tasks+=(spotlessCppCheck)
                      elif git diff --name-only "${comparison}" | grep -Eq '(^|/)(build.gradle|NOTICE|eclipse-cdt.xml)$|\\.(cpp|h|hpp)$'; then
                        tasks+=(spotlessCppCheck)
                      fi
                    fi

                    bash ./scripts/ci-gradle.sh "${tasks[@]}"
          """
          if text.count(old) != 1:
              raise SystemExit('STOP: canonical formatting command did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

      - name: Apply Kotlin formatting
        run: ./gradlew --no-daemon --console=plain spotlessKotlinApply

      - name: Export formatting patch
        run: git diff --binary > pr205-format.patch

      - name: Upload formatting patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr205-format-patch
          path: pr205-format.patch
          if-no-files-found: error
          retention-days: 2

      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr205-formatted-files
          path: |
            .github/workflows/lint.yml
            musikr/src/main/java/org/oxycblt/musikr/fs/path/DocumentPathFactory.kt
            musikr/src/test/java/org/oxycblt/musikr/fs/path/FileUriStoragePolicyTest.kt
          if-no-files-found: error
          retention-days: 2

      - name: Remove temporary workflow and push formatting
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -- .github/workflows/pr205-format.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'STOP: expected temporary workflow deletion was not staged' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply PR 205 formatting and scope checks'
          git push origin "HEAD:${BRANCH}"
