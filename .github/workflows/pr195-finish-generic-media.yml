name: PR195 Finish Generic Media Compatibility

# Temporary branch-local completion workflow. Removed after the verified commit lands.
on:
  push:
    branches:
      - feat/ts18-dofun-generic-media-compat
    paths:
      - .github/workflows/pr195-finish-generic-media.yml
      - scripts/pr195_finish_generic_media.py
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/pr195-finish-generic-media.yml
      - scripts/pr195_finish_generic_media.py

permissions:
  contents: write

concurrency:
  group: pr195-finish-generic-media
  cancel-in-progress: true

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out PR branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/ts18-dofun-generic-media-compat
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true

      - name: Ensure native build tools are present
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Apply final scoped wiring
        shell: bash
        run: python3 scripts/pr195_finish_generic_media.py

      - name: Apply Kotlin formatting
        shell: bash
        run: bash ./scripts/ci-gradle.sh --warning-mode all spotlessKotlinApply

      - name: Run focused unit tests
        shell: bash
        run: bash ./scripts/ci-gradle.sh --warning-mode all :app:testStandardDebugUnitTest

      - name: Build all debug identities
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardDebug
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicDebug
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaDebug

      - name: Build all release identities
        shell: bash
        run: |
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardRelease
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMusicRelease
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleTopwayTwMediaRelease

      - name: Run compatibility and source guards
        shell: bash
        run: |
          bash ./scripts/check-ts18-apk-reference-contracts.sh
          bash ./scripts/check-dofun-topway-compat.sh
          bash ./scripts/check-headunit-compat-safety.sh
          git diff --check

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr195-final-wiring-failure-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit verified implementation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          if git diff --cached --quiet; then
            echo 'No implementation changes were generated.' >&2
            exit 1
          fi
          git commit -m 'fix(ts18): finalise canonical generic media controls'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/ts18-dofun-generic-media-compat
