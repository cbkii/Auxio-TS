name: Temporary PR178 unit diagnostic

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/temporary-pr178-unit-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Write local.properties for Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${sdk_dir}"
          printf 'sdk.dir=%s\n' "${sdk_dir}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile jvm-tests

      - name: Capture targeted unit-test output
        id: test
        shell: bash
        run: |
          set +e
          bash ./scripts/ci-gradle.sh \
            :musikr:testDebugUnitTest \
            --tests org.oxycblt.musikr.cache.db.LibrarySearchTest \
            >"${RUNNER_TEMP}/pr178-unit.log" 2>&1
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          tail -n 250 "${RUNNER_TEMP}/pr178-unit.log"
          exit 0

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr178-unit-diagnostic
          path: ${{ runner.temp }}/pr178-unit.log
          if-no-files-found: error
          retention-days: 1

      - name: Report targeted test failure
        if: steps.test.outputs.status != '0'
        shell: bash
        run: exit 1
