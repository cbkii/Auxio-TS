name: PR 183 CI diagnostic

on:
  push:
    branches:
      - cx/incremental-library-pipeline
    paths:
      - .github/workflows/pr183-ci-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: cx/incremental-library-pipeline
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare CI environment
        shell: bash
        run: bash ./scripts/bootstrap-dependencies.sh --profile full-build

      - name: Capture failing tasks
        shell: bash
        run: |
          set +e
          log=.github/pr183-ci-failure.log
          : >"${log}"
          bash ./scripts/ci-gradle.sh --warning-mode all :app:assembleStandardDebug >>"${log}" 2>&1
          build_rc=$?
          if ((build_rc == 0)); then
            bash ./scripts/ci-gradle.sh :app:testStandardDebugUnitTest :musikr:testDebugUnitTest >>"${log}" 2>&1
            test_rc=$?
          else
            test_rc=125
          fi
          printf '\nBUILD_EXIT=%s\nTEST_EXIT=%s\n' "${build_rc}" "${test_rc}" >>"${log}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${log}"
          git commit -m 'ci: record current PR 183 failure'
          git push origin HEAD:cx/incremental-library-pipeline
          exit 0
