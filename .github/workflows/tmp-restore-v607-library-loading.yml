name: Apply v6.0.7 library-loading restoration

on:
  push:
    branches:
      - fix/restore-v607-library-loading

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-v607-library-loading
          fetch-depth: 0

      - name: Apply focused source-loading restoration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              write(path, text.replace(old, new, 1))

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}")
              write(path, updated)

          # Fresh installs return to the last known-good SAF default. DirectFS remains available,
          # but its folder action is handled by the direct candidate/manual picker below.
          replace_once(
              "app/src/main/java/org/oxycblt/auxio/music/locations/LocationMode.kt",
              """        fun defaultForFlavor(topwayCompat: Boolean): LocationMode =
            if (topwayCompat) DIRECT_FS else SAF
