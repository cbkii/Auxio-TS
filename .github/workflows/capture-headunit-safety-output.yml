name: Capture head-unit safety output

on:
  push:
    branches:
      - fix/ts18-runtime-regressions-v605
    paths:
      - '.github/workflows/capture-headunit-safety-output.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run checks independently
        shell: bash
        run: |
          set +e
          mkdir -p ci-debug
          : > ci-debug/headunit-safety.txt
          for script in \
            scripts/check-ts18-apk-reference-contracts.sh \
            scripts/check-headunit-compat-safety.sh \
            scripts/check-dofun-topway-compat.sh \
            scripts/check-native-keep-rules.sh; do
            echo "===== $script =====" >> ci-debug/headunit-safety.txt
            bash "$script" >> ci-debug/headunit-safety.txt 2>&1
            status=$?
            echo "STATUS=$status" >> ci-debug/headunit-safety.txt
            echo >> ci-debug/headunit-safety.txt
          done
          exit 0
      - name: Commit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-debug/headunit-safety.txt
          git commit -m 'ci: capture head-unit safety output'
          git push origin HEAD:fix/ts18-runtime-regressions-v605
